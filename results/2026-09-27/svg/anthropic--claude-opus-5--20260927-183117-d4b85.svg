<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="headG" cx="45%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9ccf5f"/>
      <stop offset="100%" stop-color="#5f9a34"/>
    </radialGradient>
    <radialGradient id="jawG" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#8fc456"/>
      <stop offset="100%" stop-color="#4e8429"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ea63c"/>
      <stop offset="100%" stop-color="#43701f"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="375" rx="150" ry="16" fill="#000" opacity="0.15"/>

  <!-- body -->
  <ellipse cx="200" cy="300" rx="145" ry="72" fill="url(#bodyG)" stroke="#2f5415" stroke-width="4"/>

  <!-- front feet -->
  <g fill="#6ea63c" stroke="#2f5415" stroke-width="4">
    <ellipse cx="62" cy="352" rx="42" ry="16"/>
    <ellipse cx="338" cy="352" rx="42" ry="16"/>
    <path d="M24 352 l-14 -10 M24 356 l-16 2 M24 360 l-12 12" stroke-linecap="round"/>
    <path d="M376 352 l14 -10 M376 356 l16 2 M376 360 l12 12" stroke-linecap="round"/>
  </g>

  <!-- head -->
  <ellipse cx="200" cy="175" rx="118" ry="86" fill="url(#headG)" stroke="#2f5415" stroke-width="4"/>

  <!-- eye bulges -->
  <circle cx="141" cy="102" r="45" fill="url(#headG)" stroke="#2f5415" stroke-width="4"/>
  <circle cx="259" cy="102" r="45" fill="url(#headG)" stroke="#2f5415" stroke-width="4"/>

  <!-- THE JAW (Habsburg-grade prognathism) -->
  <path d="M92 178
           C 80 268, 120 348, 200 350
           C 280 348, 320 268, 308 178
           C 300 214, 258 232, 200 232
           C 142 232, 100 214, 92 178 Z"
        fill="url(#jawG)" stroke="#2f5415" stroke-width="4"/>

  <!-- lower lip / underbite shelf -->
  <path d="M92 178 C 100 216, 142 234, 200 234 C 258 234, 300 216, 308 178"
        fill="none" stroke="#3a6a1c" stroke-width="7" stroke-linecap="round"/>
  <path d="M104 186 C 116 214, 150 228, 200 228 C 250 228, 284 214, 296 186"
        fill="none" stroke="#a8d873" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- mouth line tucked behind the jutting jaw -->
  <path d="M100 172 C 130 200, 170 212, 200 212 C 230 212, 270 200, 300 172"
        fill="none" stroke="#28470f" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

  <!-- little protruding lower teeth -->
  <g fill="#fdfdf5" stroke="#2f5415" stroke-width="2.5">
    <rect x="176" y="196" width="18" height="16" rx="4"/>
    <rect x="206" y="196" width="18" height="16" rx="4"/>
  </g>

  <!-- chin creases -->
  <path d="M158 320 C 180 336, 220 336, 242 320" fill="none" stroke="#3a6a1c" stroke-width="4" stroke-linecap="round"/>
  <path d="M172 296 C 188 306, 212 306, 228 296" fill="none" stroke="#3a6a1c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- nostrils -->
  <ellipse cx="180" cy="150" rx="5" ry="7" fill="#2f5415"/>
  <ellipse cx="220" cy="150" rx="5" ry="7" fill="#2f5415"/>

  <!-- eyes -->
  <g>
    <circle cx="141" cy="98" r="30" fill="#fffdf0" stroke="#2f5415" stroke-width="3"/>
    <circle cx="259" cy="98" r="30" fill="#fffdf0" stroke="#2f5415" stroke-width="3"/>
    <circle cx="147" cy="102" r="14" fill="#1b1b1b"/>
    <circle cx="253" cy="102" r="14" fill="#1b1b1b"/>
    <circle cx="142" cy="95" r="5" fill="#fff"/>
    <circle cx="248" cy="95" r="5" fill="#fff"/>
    <path d="M114 74 C 126 62, 156 62, 168 74" fill="none" stroke="#2f5415" stroke-width="4" stroke-linecap="round"/>
    <path d="M232 74 C 244 62, 274 62, 286 74" fill="none" stroke="#2f5415" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- back highlight -->
  <ellipse cx="150" cy="258" rx="40" ry="10" fill="#a8d873" opacity="0.25"/>
</svg>