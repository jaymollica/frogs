<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2c3a28"/>
      <stop offset="60%" stop-color="#141c12"/>
      <stop offset="100%" stop-color="#080b07"/>
    </radialGradient>

    <!-- Frog Skin Gradients -->
    <linearGradient id="frogSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bb354"/>
      <stop offset="45%" stop-color="#5d8232"/>
      <stop offset="85%" stop-color="#3b571e"/>
      <stop offset="100%" stop-color="#233610"/>
    </linearGradient>

    <linearGradient id="frogBelly" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e3e8a5"/>
      <stop offset="50%" stop-color="#b8c474"/>
      <stop offset="100%" stop-color="#738a38"/>
    </linearGradient>

    <linearGradient id="jawShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18260b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#18260b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8c869"/>
      <stop offset="50%" stop-color="#eaf5b8"/>
      <stop offset="100%" stop-color="#75963a"/>
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eyeBall" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffdd6b"/>
      <stop offset="40%" stop-color="#d49b28"/>
      <stop offset="85%" stop-color="#694109"/>
      <stop offset="100%" stop-color="#2b1702"/>
    </radialGradient>

    <!-- Velvet Fabric Gradient -->
    <linearGradient id="velvet" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1a090d"/>
      <stop offset="30%" stop-color="#420d18"/>
      <stop offset="70%" stop-color="#24050c"/>
      <stop offset="100%" stop-color="#0d0205"/>
    </linearGradient>

    <!-- Gold Trim Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c"/>
      <stop offset="35%" stop-color="#c99e32"/>
      <stop offset="70%" stop-color="#efd27b"/>
      <stop offset="100%" stop-color="#805e13"/>
    </linearGradient>

    <!-- Ruff Collar Gradients -->
    <linearGradient id="ruffLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dedede"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="ruffShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="50%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#545454"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite operator="out" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>

  <!-- Baroque Oval Vignette / Frame border subtle -->
  <ellipse cx="300" cy="375" rx="275" ry="345" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.2"/>
  <ellipse cx="300" cy="375" rx="282" ry="352" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Back of Ruff Collar (Behind Body & Head) -->
  <g id="ruff-back">
    <path d="M 180 340 C 160 270, 420 250, 440 340 Z" fill="#7a7a7a" filter="url(#dropShadow)"/>
    <!-- Radiating ruff pleats (rear) -->
    <path d="M 200 320 L 170 280 L 215 315 L 195 265 L 235 305 L 230 250 L 260 300 L 270 245 L 290 300 L 310 245 L 325 300 L 350 250 L 355 305 L 390 265 L 380 315 L 415 285 L 395 330" 
          stroke="#404040" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 200 320 L 170 280 L 215 315 L 195 265 L 235 305 L 230 250 L 260 300 L 270 245 L 290 300 L 310 245 L 325 300 L 350 250 L 355 305 L 390 265 L 380 315 L 415 285 L 395 330" 
          stroke="#e8e8e8" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Royal Attire / Torso -->
  <g id="torso" filter="url(#dropShadow)">
    <!-- Shoulders and Court Robe -->
    <path d="M 140 450 C 110 520, 80 670, 70 750 L 530 750 C 520 670, 490 520, 460 450 C 400 480, 200 480, 140 450 Z" fill="url(#velvet)"/>
    
    <!-- Slashed Doublet Silk Inserts (Spanish court style) -->
    <g fill="#d4af37" opacity="0.85">
      <!-- Left shoulder slashes -->
      <path d="M 130 540 Q 145 570 135 600 Q 120 570 130 540 Z"/>
      <path d="M 160 520 Q 180 555 170 590 Q 150 555 160 520 Z"/>
      <path d="M 195 515 Q 215 550 205 585 Q 185 550 195 515 Z"/>
      <!-- Right shoulder slashes -->
      <path d="M 470 540 Q 455 570 465 600 Q 480 570 470 540 Z"/>
      <path d="M 440 520 Q 420 555 430 590 Q 450 555 440 520 Z"/>
      <path d="M 405 515 Q 385 550 395 585 Q 415 550 405 515 Z"/>
      <!-- Chest details -->
      <path d="M 270 530 Q 285 570 275 610 Q 260 570 270 530 Z"/>
      <path d="M 330 530 Q 315 570 325 610 Q 340 570 330 530 Z"/>
    </g>

    <!-- Gold Embroidery & Gown Trim -->
    <path d="M 230 470 L 250 750 M 370 470 L 350 750" stroke="url(#gold)" stroke-width="7" stroke-dasharray="12,4,4,4"/>
    <path d="M 300 475 L 300 750" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8,6"/>
    
    <!-- Golden Order of the Toison d'Or (Golden Fleece) Collar -->
    <path d="M 200 460 C 230 560, 370 560, 400 460" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 200 460 C 230 560, 370 560, 400 460" fill="none" stroke="#523c04" stroke-width="2" stroke-dasharray="6,6"/>
    
    <!-- The Golden Fleece (Little hanging golden sheep/frog pendant) -->
    <g transform="translate(288, 545)" filter="url(#dropShadow)">
      <circle cx="12" cy="5" r="5" fill="url(#gold)"/>
      <!-- Sheep Body with curled horns -->
      <path d="M 5 15 C 2 10, 22 10, 19 15 C 24 20, 20 30, 15 28 C 14 34, 10 34, 9 28 C 4 30, 0 20, 5 15 Z" fill="url(#gold)"/>
      <circle cx="7" cy="14" r="1.5" fill="#4d3507"/>
      <!-- Center ring holding sheep around waist -->
      <path d="M 8 18 Q 12 15 16 18" stroke="#7a5806" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Frog Head and Giant Habsburg Jaw -->
  <g id="frog-head" filter="url(#dropShadow)">
    
    <!-- Eyeballs Backdrop & Cranium Structure (Receding Forehead) -->
    <path d="M 190 200 C 180 130, 270 120, 285 190 C 310 185, 340 185, 360 195 C 380 140, 465 155, 450 225 C 470 270, 430 330, 400 335 C 330 340, 210 330, 190 250 Z" 
          fill="url(#frogSkin)"/>

    <!-- Left Eye (Viewer's Left - Bulbous, regal, melancholic) -->
    <g id="left-eye">
      <ellipse cx="235" cy="180" rx="42" ry="40" fill="#1c2b0e"/>
      <ellipse cx="237" cy="179" rx="38" ry="37" fill="url(#eyeBall)"/>
      <!-- Drooping sleepy Habsburg lid (upper) -->
      <path d="M 197 170 Q 235 130 275 160 Q 280 180 272 190 Q 235 150 197 170 Z" fill="#4c6e26"/>
      <!-- Heavy under-eye bag -->
      <path d="M 200 195 C 215 220, 260 220, 275 190" fill="none" stroke="#2c4214" stroke-width="4"/>
      <!-- Horizontal aristocratic frog pupil -->
      <ellipse cx="240" cy="180" rx="22" ry="6.5" transform="rotate(-5, 240, 180)" fill="#0d0800"/>
      <!-- Iris details -->
      <path d="M 222 178 Q 240 173 258 177" stroke="#ffe891" stroke-width="1.5" fill="none"/>
      <!-- Specular gloss -->
      <circle cx="228" cy="173" r="4" fill="#ffffff" opacity="0.8"/>
      <circle cx="250" cy="183" r="2" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Right Eye (Viewer's Right) -->
    <g id="right-eye">
      <ellipse cx="410" cy="205" rx="38" ry="36" fill="#1c2b0e"/>
      <ellipse cx="408" cy="205" rx="34" ry="33" fill="url(#eyeBall)"/>
      <!-- Drooping heavy lid -->
      <path d="M 374 195 Q 410 160 444 195 Q 448 215 440 220 Q 410 185 374 195 Z" fill="#4c6e26"/>
      <!-- Bag under right eye -->
      <path d="M 378 222 C 395 240, 430 235, 442 215" fill="none" stroke="#2c4214" stroke-width="3.5"/>
      <!-- Pupil -->
      <ellipse cx="408" cy="206" rx="19" ry="6" transform="rotate(8, 408, 206)" fill="#0d0800"/>
      <!-- Gloss -->
      <circle cx="398" cy="200" r="3.5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Snout & Receding Upper Jaw -->
    <!-- The Habsburg trait: upper jaw is underdeveloped/sunken relative to massive lower jaw -->
    <path d="M 230 205 C 270 215, 360 225, 400 235 C 415 275, 385 300, 370 305 C 320 295, 250 280, 220 270 C 205 250, 215 220, 230 205 Z" fill="url(#frogSkin)"/>
    
    <!-- Nostrils (regal, slightly turned up/disdainful) -->
    <ellipse cx="285" cy="235" rx="3.5" ry="6" transform="rotate(-15, 285, 235)" fill="#1c2b0e"/>
    <ellipse cx="320" cy="239" rx="3.5" ry="6" transform="rotate(10, 320, 239)" fill="#1c2b0e"/>
    <path d="M 280 230 C 290 227, 315 228, 325 233" fill="none" stroke="#688f35" stroke-width="2"/>

    <!-- Narrow, tucked-in Upper Lip Line -->
    <path d="M 210 275 C 260 285, 335 300, 385 315" fill="none" stroke="#1d2e0a" stroke-width="4"/>

    <!-- ======================================================== -->
    <!-- THE HABSBURG JAW (MANDIBULAR PROGNATHISM & THICK LOWER LIP)-->
    <!-- Massive, protruding forward and downward beyond upper face -->
    <!-- ======================================================== -->

    <!-- Base / Muscle structure of the giant jaw -->
    <path d="M 185 270 
             C 170 300, 140 370, 150 420 
             C 160 460, 200 515, 290 525 
             C 370 530, 420 480, 435 425 
             C 445 385, 420 330, 385 315
             C 340 330, 310 335, 270 325
             C 225 315, 195 285, 185 270 Z" 
          fill="url(#frogSkin)"/>

    <!-- Flaccid, protruding Habsburg chin & pale underbelly throat -->
    <path d="M 165 390 
             C 150 440, 200 500, 290 515 
             C 365 525, 405 475, 415 425 
             C 390 455, 345 475, 285 470 
             C 215 465, 180 425, 165 390 Z" 
          fill="url(#frogBelly)"/>

    <!-- Prominent, Heavy Jutting Chin Fat Pad / Mandible Tip -->
    <!-- Drops down with characteristic long rounded Habsburg angle -->
    <path d="M 210 445 C 235 500, 335 505, 365 450 C 385 485, 330 520, 285 520 C 235 520, 195 480, 210 445 Z" 
          fill="#314717" opacity="0.6"/>
    
    <!-- Bulbous, Everted Habsburg Lower Lip (Protrudes outwards significantly) -->
    <path d="M 180 280 
             C 160 305, 155 330, 165 365 
             C 180 405, 230 425, 295 425 
             C 355 425, 390 395, 405 355 
             C 415 330, 400 315, 385 315 
             C 365 350, 335 370, 285 370 
             C 230 370, 195 335, 180 280 Z" 
          fill="url(#lipHighlight)"/>

    <!-- Open Underhung Mouth Cavity Gap (Showing Severe Class III Malocclusion / Underbite) -->
    <!-- Dark recessed gap where upper teeth/jaw fail to meet lower jaw -->
    <path d="M 205 280 
             C 240 300, 330 320, 385 318 
             C 370 338, 335 352, 285 352 
             C 240 352, 212 330, 205 280 Z" 
          fill="#1c070a"/>
    
    <!-- Tiny aristocratic tongue / interior fleshy pink tone peeking out -->
    <path d="M 255 330 C 275 320, 305 322, 320 335 C 300 345, 270 345, 255 330 Z" fill="#8a3747"/>

    <!-- Lower Lip Rim Highlight (Wet, pendulous, droopy royal pout) -->
    <path d="M 172 355 C 190 395, 235 418, 290 418 C 345 418, 385 390, 398 355" 
          fill="none" stroke="#f4ffc4" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M 220 398 C 255 412, 315 412, 350 395" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Deep characteristic Habsburg Lip-Chin Crevice / Indentation -->
    <path d="M 180 380 C 210 420, 260 435, 315 430 C 360 425, 390 395, 405 375" 
          fill="none" stroke="#233810" stroke-width="4.5" opacity="0.8"/>
    
    <!-- Heavy Dewlap / Chin Sag Creases -->
    <path d="M 215 460 C 250 480, 320 480, 355 455" fill="none" stroke="#233810" stroke-width="3" opacity="0.6"/>
    <path d="M 245 488 C 270 500, 305 500, 330 485" fill="none" stroke="#233810" stroke-width="2" opacity="0.5"/>

    <!-- Warts & Bumpy Royal Skin Texture -->
    <g fill="#43611d" opacity="0.7">
      <circle cx="210" cy="360" r="4.5"/>
      <circle cx="202" cy="370" r="2.5"/>
      <circle cx="365" cy="385" r="5"/>
      <circle cx="380" cy="375" r="3"/>
      <circle cx="270" cy="455" r="4"/>
      <circle cx="330" cy="460" r="5.5"/>
      <circle cx="340" cy="470" r="3"/>
      <circle cx="240" cy="245" r="3.5"/>
      <circle cx="360" cy="265" r="4"/>
    </g>
    <!-- Wart Highlights -->
    <g fill="#b5db69" opacity="0.6">
      <circle cx="209" cy="359" r="1.5"/>
      <circle cx="364" cy="383" r="1.8"/>
      <circle cx="329" cy="458" r="1.8"/>
    </g>

    <!-- Disdainful / Melancholy Nasolabial Droop Folds -->
    <path d="M 245 250 C 235 280, 205 315, 185 330" fill="none" stroke="#22360e" stroke-width="3"/>
    <path d="M 360 255 C 375 285, 395 320, 410 340" fill="none" stroke="#22360e" stroke-width="2.5"/>
  </g>

  <!-- Front of Imperial Ruff Collar (Extending around & hugging the giant chin) -->
  <g id="ruff-front" filter="url(#dropShadow)">
    <!-- Ruff Folds: Fan-shaped Figure-8 / Cartwheel Linen Pleats layered below the protruding jaw -->
    <!-- The collar is visibly forced open/flattened by the sheer size of the chin -->
    
    <!-- Base shadow under chin onto ruff -->
    <path d="M 180 460 C 230 525, 340 525, 390 460 C 420 530, 150 530, 180 460 Z" fill="#333333" opacity="0.6"/>

    <!-- Left side pleats -->
    <path d="M 115 440 C 130 400, 175 425, 160 465 C 150 495, 100 480, 115 440 Z" fill="url(#ruffLight)"/>
    <path d="M 120 445 C 135 410, 165 430, 150 465" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <path d="M 135 465 C 155 420, 200 445, 180 495 C 160 525, 120 500, 135 465 Z" fill="url(#ruffLight)"/>
    <path d="M 145 470 C 165 435, 190 455, 175 495" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <path d="M 165 495 C 190 450, 235 475, 215 525 C 195 555, 150 530, 165 495 Z" fill="url(#ruffLight)"/>
    <path d="M 175 500 C 200 465, 225 485, 210 525" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <!-- Center pleats (depressed down by heavy chin) -->
    <path d="M 210 520 C 240 485, 280 500, 260 550 C 240 575, 195 550, 210 520 Z" fill="url(#ruffLight)"/>
    <path d="M 220 525 C 245 495, 275 510, 255 550" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <path d="M 260 525 C 290 490, 330 500, 310 550 C 290 575, 245 555, 260 525 Z" fill="url(#ruffLight)"/>
    <path d="M 270 525 C 295 500, 320 510, 305 550" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <path d="M 310 515 C 335 475, 380 485, 360 535 C 340 565, 290 555, 310 515 Z" fill="url(#ruffLight)"/>
    <path d="M 320 515 C 345 485, 370 495, 355 535" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <!-- Right side pleats -->
    <path d="M 355 480 C 375 435, 420 450, 405 500 C 390 535, 340 515, 355 480 Z" fill="url(#ruffLight)"/>
    <path d="M 365 480 C 385 445, 410 460, 395 500" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <path d="M 395 450 C 415 410, 460 430, 445 475 C 430 510, 385 490, 395 450 Z" fill="url(#ruffLight)"/>
    <path d="M 405 450 C 425 420, 450 435, 435 475" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <path d="M 425 420 C 445 380, 480 405, 470 450 C 460 480, 415 460, 425 420 Z" fill="url(#ruffLight)"/>
    <path d="M 435 420 C 455 390, 475 410, 465 445" fill="none" stroke="url(#ruffShadow)" stroke-width="3"/>

    <!-- Outer convolution frills (lace edging effect) -->
    <path d="M 105 460 Q 120 480 130 505 Q 155 535 180 550 Q 230 580 285 580 Q 345 580 395 545 Q 430 520 455 485 Q 475 455 480 430" 
          fill="none" stroke="#f5f5f5" stroke-width="2.5" stroke-dasharray="4,2"/>
  </g>

  <!-- Excessive Regal Crown (Precariously perched between bulbous eyes) -->
  <g id="crown" filter="url(#dropShadow)" transform="rotate(-6, 320, 110)">
    <!-- Crimson Cap of Maintenance inside Crown -->
    <path d="M 275 140 C 265 95, 375 95, 365 140 Z" fill="#690a18"/>
    <circle cx="320" cy="90" r="5" fill="url(#gold)"/>
    <path d="M 320 80 L 320 86 M 317 83 L 323 83" stroke="url(#gold)" stroke-width="2"/>

    <!-- Gold Crown Circlet & Arches -->
    <!-- Base Rim -->
    <rect x="265" y="133" width="110" height="15" rx="3" fill="url(#gold)"/>
    <!-- Jewels on Rim -->
    <circle cx="278" cy="140" r="3" fill="#0d522c"/>
    <circle cx="298" cy="140" r="3.5" fill="#800a19"/>
    <circle cx="320" cy="140" r="3" fill="#143063"/>
    <circle cx="342" cy="140" r="3.5" fill="#800a19"/>
    <circle cx="362" cy="140" r="3" fill="#0d522c"/>

    <!-- Spikes / Fleurons -->
    <path d="M 265 133 L 273 115 L 285 133 L 302 110 L 320 133 L 338 110 L 355 133 L 367 115 L 375 133 Z" fill="url(#gold)"/>
    
    <!-- Pearls atop points -->
    <circle cx="273" cy="114" r="3" fill="#fffff0"/>
    <circle cx="302" cy="109" r="3.5" fill="#fffff0"/>
    <circle cx="338" cy="109" r="3.5" fill="#fffff0"/>
    <circle cx="367" cy="114" r="3" fill="#fffff0"/>

    <!-- Imperial Arches -->
    <path d="M 275 125 Q 320 100 320 90 Q 320 100 365 125" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Baroque Frame Inner Shadow Overlay (Vignette) -->
  <rect width="600" height="750" fill="none" stroke="#050704" stroke-width="35" opacity="0.4"/>
</svg>