<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121e0d" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#121e0d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#121e0d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bodyGrad" x1="20%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#6fa332"/>
      <stop offset="45%" stop-color="#467822"/>
      <stop offset="85%" stop-color="#244513"/>
      <stop offset="100%" stop-color="#172b0c"/>
    </linearGradient>

    <linearGradient id="backThighGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e6b1d"/>
      <stop offset="70%" stop-color="#213f10"/>
      <stop offset="100%" stop-color="#142609"/>
    </linearGradient>

    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#f5e8b0"/>
      <stop offset="40%" stop-color="#d6c67a"/>
      <stop offset="80%" stop-color="#8a873e"/>
      <stop offset="100%" stop-color="#46541f"/>
    </linearGradient>

    <linearGradient id="jawMainGrad" x1="10%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#93c942"/>
      <stop offset="25%" stop-color="#639c29"/>
      <stop offset="60%" stop-color="#3d6c1b"/>
      <stop offset="100%" stop-color="#23420f"/>
    </linearGradient>

    <linearGradient id="jawUnderbelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf2cb"/>
      <stop offset="35%" stop-color="#ded08e"/>
      <stop offset="75%" stop-color="#999149"/>
      <stop offset="100%" stop-color="#3b421a"/>
    </linearGradient>

    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e8f8a6"/>
      <stop offset="50%" stop-color="#b0df57"/>
      <stop offset="100%" stop-color="#558d22"/>
    </linearGradient>

    <radialGradient id="eyeBall" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="50%" stop-color="#e08616"/>
      <stop offset="85%" stop-color="#803300"/>
      <stop offset="100%" stop-color="#361100"/>
    </radialGradient>

    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ebe5cb"/>
      <stop offset="100%" stop-color="#baa67b"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop Shadow -->
  <ellipse cx="460" cy="625" rx="340" ry="45" fill="url(#shadowGlow)"/>
  <ellipse cx="400" cy="630" rx="260" ry="32" fill="#0d1708" opacity="0.6"/>

  <!-- Far Hind Leg -->
  <g class="far-leg">
    <path d="M 580 430 C 650 420 720 470 730 530 C 740 590 690 625 640 625 C 600 625 585 605 575 580" 
          fill="url(#backThighGrad)"/>
    <!-- Far Foot Webbing & Toes -->
    <path d="M 640 620 C 665 620 710 622 735 615 C 720 608 710 605 700 598 C 725 600 750 598 765 590 C 740 580 715 580 685 580" 
          fill="#1b330c"/>
  </g>

  <!-- Far Foreleg -->
  <g class="far-arm">
    <path d="M 330 450 L 290 560 C 285 575 280 590 265 600 C 255 605 240 605 230 605" 
          stroke="#264714" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 245 602 L 210 605 M 250 608 L 225 618 M 260 610 L 250 625" 
          stroke="#264714" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Main Body / Back -->
  <path d="M 360 210 C 470 190 560 230 630 310 C 710 400 730 500 670 570 C 620 620 540 625 450 620 C 370 615 340 580 340 540 C 340 450 330 380 340 310 Z" 
        fill="url(#bodyGrad)"/>

  <!-- Body Spots / Warts -->
  <g opacity="0.35" fill="#152608">
    <ellipse cx="580" cy="330" rx="28" ry="18" transform="rotate(-15, 580, 330)"/>
    <ellipse cx="640" cy="400" rx="35" ry="22" transform="rotate(25, 640, 400)"/>
    <ellipse cx="530" cy="280" rx="18" ry="12"/>
    <ellipse cx="665" cy="480" rx="22" ry="35" transform="rotate(10, 665, 480)"/>
    <ellipse cx="490" cy="330" rx="30" ry="16" transform="rotate(-30, 490, 330)"/>
    <ellipse cx="570" cy="440" rx="45" ry="25" transform="rotate(15, 570, 440)"/>
    <circle cx="440" cy="275" r="14"/>
    <circle cx="610" cy="470" r="15"/>
    <circle cx="530" cy="370" r="20"/>
  </g>

  <!-- Soft Dorsal Ridge / Highlight -->
  <path d="M 400 235 C 490 220 570 270 635 365" 
        stroke="#8ec444" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Folded Near Hind Leg (Bulky Thigh & Flank) -->
  <path d="M 520 530 C 530 450 590 410 650 420 C 710 430 750 480 730 550 C 710 610 630 615 570 610 C 535 605 515 570 520 530 Z" 
        fill="url(#bodyGrad)"/>
  <path d="M 600 440 C 660 440 705 480 690 545 C 675 600 620 605 575 600" 
        stroke="#1a330e" stroke-width="4" fill="none" opacity="0.6"/>
  <ellipse cx="640" cy="490" rx="24" ry="14" transform="rotate(-20, 640, 490)" fill="#152608" opacity="0.3"/>
  <ellipse cx="580" cy="530" rx="18" ry="10" transform="rotate(10, 580, 530)" fill="#152608" opacity="0.3"/>

  <!-- Near Foot Resting Forward -->
  <g class="near-foot">
    <path d="M 570 605 C 560 615 530 620 480 620 C 440 620 410 618 395 612" 
          stroke="#3d6c1b" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M 440 620 L 400 630 M 450 622 L 415 638 M 470 622 L 445 640" 
          stroke="#2d5213" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Big Bulging Belly / Chest -->
  <path d="M 330 380 C 340 470 360 550 425 585 C 480 615 550 605 580 580 C 510 590 440 560 410 500 C 380 440 370 370 330 380 Z" 
        fill="url(#bellyGrad)" opacity="0.85"/>

  <!-- Sagging Throat Pouches (Behind Protruding Mandible) -->
  <path d="M 280 390 C 260 440 280 500 330 535 C 370 560 410 560 435 540 C 380 535 340 480 330 420 Z" 
        fill="url(#jawUnderbelly)"/>
  <path d="M 285 465 C 275 510 320 545 375 550" 
        stroke="#786f37" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 270 435 C 260 475 285 520 340 538" 
        stroke="#524d23" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Retracted Cranium & Receded Upper Snout -->
  <!-- The upper jaw drastically pulls short around x=290, while lower reaches x=140! -->
  <path d="M 430 200 C 400 195 365 210 340 235 C 315 260 295 285 270 300 C 255 310 240 315 250 330 C 260 345 285 345 315 340 C 350 335 385 330 420 345 C 445 355 470 350 490 335 C 505 300 500 230 430 200 Z" 
        fill="url(#bodyGrad)"/>

  <!-- Upper Lip Seam & Nostril (Short & Underhung) -->
  <ellipse cx="280" cy="295" rx="5" ry="3" transform="rotate(-15, 280, 295)" fill="#152608"/>
  <path d="M 255 325 C 275 325 295 330 325 328 C 360 325 395 328 430 350" 
        stroke="#1a330a" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Cranial Brow Warts -->
  <circle cx="345" cy="235" r="7" fill="#588725"/>
  <circle cx="335" cy="250" r="5" fill="#3c6314"/>
  <circle cx="320" cy="265" r="6" fill="#4d7a1e"/>

  <!-- Eye Right (Far side peeking) -->
  <path d="M 445 190 C 455 170 480 165 495 180 C 510 195 505 215 490 225 Z" fill="#294d13"/>
  <ellipse cx="480" cy="188" rx="14" ry="12" fill="url(#eyeBall)"/>
  <ellipse cx="482" cy="187" rx="10" ry="4" transform="rotate(15, 482, 187)" fill="#0d0500"/>

  <!-- Eye Left (Dominant, Bulbous, Expressive) -->
  <g class="near-eye">
    <!-- Eyelid Socket / Brow -->
    <path d="M 360 215 C 360 150 445 140 470 195 C 485 230 460 270 410 265 C 375 260 360 240 360 215 Z" 
          fill="#3b6619"/>
    <!-- Glowing Iris -->
    <circle cx="418" cy="206" r="38" fill="url(#eyeBall)"/>
    
    <!-- Iris Inner Ring Pattern -->
    <circle cx="418" cy="206" r="32" stroke="#ffcc00" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 390 206 Q 418 190 446 206 Q 418 222 390 206 Z" fill="#1a0800"/>
    
    <!-- Horizontal Slit Pupil -->
    <ellipse cx="418" cy="206" rx="28" ry="7" transform="rotate(-3, 418, 206)" fill="#000000"/>
    
    <!-- Glossy Highlights -->
    <circle cx="405" cy="190" r="7" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="430" cy="185" rx="4" ry="2.5" transform="rotate(20, 430, 185)" fill="#ffffff" opacity="0.7"/>
    <path d="M 395 225 C 405 235 430 235 440 225" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Heavy Upper Eyelid Fold (Lizard/Toad-like Brow) -->
    <path d="M 362 195 C 380 155 445 150 472 180 C 450 170 395 170 362 195 Z" fill="#588e27"/>
    <path d="M 362 195 C 390 165 445 165 474 185" stroke="#223d0d" stroke-width="4" fill="none"/>
  </g>

  <!-- Tympanum (Ear Drum) -->
  <ellipse cx="475" cy="285" rx="22" ry="26" fill="#44611a" stroke="#273d0c" stroke-width="4"/>
  <ellipse cx="475" cy="285" rx="15" ry="18" fill="#2c4010" opacity="0.7"/>
  <circle cx="475" cy="285" r="5" fill="#192608"/>

  <!-- ================================================================= -->
  <!-- THE MASSIVE, HEAVILY PROTRUDING LOWER JAW (UNDERBITE UNDERHUNG) -->
  <!-- ================================================================= -->
  <!-- Dark Interior Cavity of the Exposed Lower Shelf -->
  <path d="M 255 330 C 220 330 180 320 160 305 C 175 325 210 345 260 350 C 310 355 380 355 430 355 C 445 355 380 338 315 332 C 285 330 265 330 255 330 Z" 
        fill="#260b0e"/>

  <!-- Mandible Main Muscle Bulk (Juts Out Tremendously to X=135!) -->
  <!-- Top lip of jaw starts way forward at x=140, y=285 while upper snout ended back at x=250 -->
  <g id="protruding-mandible">
    <!-- Back Jaw Flange & Masseter Base -->
    <path d="M 470 325 C 495 345 470 410 425 435 C 360 470 290 475 230 455 C 180 438 145 390 135 340 C 130 310 138 292 148 288 C 158 284 175 295 195 308 C 230 330 280 345 350 350 C 415 355 450 340 470 325 Z" 
          fill="url(#jawMainGrad)"/>

    <!-- Underside Bulbous Pouch / Chin Swell -->
    <path d="M 142 325 C 135 365 155 420 200 450 C 255 485 335 480 395 455 C 335 465 245 460 190 425 C 150 395 140 350 142 325 Z" 
          fill="url(#jawUnderbelly)"/>

    <!-- Giant Heavy Jaw Shelf (Top rim creating the massive underbite) -->
    <path d="M 145 288 C 170 282 205 305 250 324 C 300 345 375 355 445 348 C 465 345 472 332 472 332 C 472 332 445 362 385 362 C 315 362 245 348 200 328 C 165 312 140 298 145 288 Z" 
          fill="url(#lipHighlight)"/>

    <!-- Anterior Symphysis (Tough Rounded Chin Boss) -->
    <path d="M 135 320 C 130 298 140 286 154 286 C 170 286 175 305 170 328 C 165 350 142 355 135 320 Z" 
          fill="#a4d84b" opacity="0.7" filter="url(#softGlow)"/>

    <!-- Pseudo-Teeth / Bony Odontoid Tusks (Common in Bullfrogs with prominent lower jaws) -->
    <!-- Tusk 1 (Forward Most) -->
    <path d="M 160 295 L 168 270 L 178 298 Z" fill="url(#toothGrad)"/>
    <path d="M 168 270 L 178 298 L 163 298 Z" fill="#9e8a56" opacity="0.4"/>
    <!-- Tusk 2 (Mid-Jaw Canine-like projection) -->
    <path d="M 195 308 L 206 280 L 216 313 Z" fill="url(#toothGrad)"/>
    <path d="M 206 280 L 216 313 L 200 313 Z" fill="#9e8a56" opacity="0.4"/>
    <!-- Minor Tooth 3 (Receded) -->
    <path d="M 240 322 L 247 305 L 254 326 Z" fill="url(#toothGrad)"/>

    <!-- Bumpy Warts & Texture on Extended Mandible -->
    <ellipse cx="165" cy="335" rx="9" ry="6" transform="rotate(-10, 165, 335)" fill="#2e5414" opacity="0.5"/>
    <ellipse cx="195" cy="365" rx="14" ry="8" transform="rotate(15, 195, 365)" fill="#2e5414" opacity="0.4"/>
    <ellipse cx="230" cy="390" rx="16" ry="10" transform="rotate(-5, 230, 390)" fill="#2e5414" opacity="0.4"/>
    <circle cx="150" cy="360" r="6" fill="#203d0c" opacity="0.5"/>
    <circle cx="180" cy="395" r="8" fill="#5b8f22" opacity="0.5"/>
    <circle cx="275" cy="425" r="12" fill="#2e5414" opacity="0.3"/>
    <circle cx="340" cy="430" r="15" fill="#203d0c" opacity="0.3"/>

    <!-- Slime Droplet/Moisture Glint (Exaggerating Jaw Weight & Wetness) -->
    <path d="M 152 350 C 150 375 145 385 148 395 C 151 405 160 405 158 395 C 156 385 155 375 156 350 Z" 
          fill="#ffffff" opacity="0.5"/>
    <circle cx="153" cy="398" r="3.5" fill="#ffffff" opacity="0.7"/>

    <!-- Highlights along the lower rim edge of the mandible -->
    <path d="M 148 300 C 138 335 150 380 185 418 C 225 450 290 468 360 460" 
          stroke="#9edb44" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Strong Deep Crevice Shadow delineating jaw from neck -->
    <path d="M 175 420 C 230 455 305 460 385 440 C 425 425 460 385 470 345" 
          stroke="#111f08" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Near Foreleg (Stout, Muscular, Planted Wide) -->
  <g class="near-arm">
    <!-- Shoulder Bulge -->
    <path d="M 390 400 C 420 400 450 435 440 475 C 435 500 415 520 390 515 C 370 510 365 480 370 445 C 375 415 380 400 390 400 Z" 
          fill="url(#bodyGrad)"/>
    <!-- Forearm -->
    <path d="M 405 480 L 380 580 C 378 595 370 605 350 610" 
          stroke="#41731d" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M 405 480 L 380 580 C 378 595 370 605 350 610" 
          stroke="#264714" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.3"/>
    <!-- Highlight on Arm Bone -->
    <path d="M 410 475 L 390 565" 
          stroke="#8ac43f" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
    
    <!-- Big Splayed Toes Resting on Ground -->
    <g class="fingers" stroke="#2d5216" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Inner Toe -->
      <path d="M 345 610 L 310 615"/>
      <!-- Middle Toe -->
      <path d="M 350 615 L 325 628"/>
      <!-- Outer Long Toe -->
      <path d="M 360 615 L 350 635"/>
      <!-- Webbing Knobs -->
      <circle cx="310" cy="615" r="4" fill="#3c6b1e" stroke="none"/>
      <circle cx="325" cy="628" r="4" fill="#3c6b1e" stroke="none"/>
      <circle cx="350" cy="635" r="4" fill="#3c6b1e" stroke="none"/>
    </g>
  </g>

  <!-- Final Characteristic Skin Texture: Throat folds & Warts -->
  <g opacity="0.4" fill="#d0df7e">
    <circle cx="215" cy="435" r="4"/>
    <circle cx="235" cy="442" r="3"/>
    <circle cx="200" cy="420" r="3"/>
    <circle cx="260" cy="455" r="5"/>
    <circle cx="300" cy="465" r="4"/>
    <circle cx="390" cy="370" r="3.5"/>
    <circle cx="375" cy="360" r="2.5"/>
  </g>
</svg>