  <path d="M141 445C157 430 178 439 201 468" fill="none" stroke="#3f9150" stroke-width="6" stroke-linecap="round"/>
  <path d="M188 493C159 490 128 502 109 515C100 522 108 531 119 529L154 524C131 538 143 546 156 540L189 527C171 544 187 548 199 537L225 513" fill="#83c86c" stroke="#254e3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M296 383C272 415 274 465 299 484C324 504 378 491 395 457L376 391Z" fill="#bedb83"/>
  <path d="M368 416L384 495C386 508 406 516 431 517L467 523C479 525 484 514 473 508L445 496L475 500C488 501 492 489 478 485L437 479L424 407" fill="#72bd65" stroke="#254e3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

