  <path d="M252 311C236 282 246 254 265 235C249 199 269 167 303 163C336 159 355 181 357 202C375 196 392 197 407 203C405 167 429 149 456 156C486 164 493 191 484 221C513 241 533 271 521 300C514 324 475 340 428 347L312 347Z" fill="url(#body)" stroke="#254e3a" stroke-width="7" stroke-linejoin="round"/>

  <ellipse cx="303" cy="213" rx="32" ry="39" fill="url(#eye)" stroke="#254e3a" stroke-width="6"/>
  <ellipse cx="449" cy="203" rx="31" ry="38" fill="url(#eye)" stroke="#254e3a" stroke-width="6"/>
  <ellipse cx="313" cy="215" rx="12" ry="25" fill="#192e26"/>
