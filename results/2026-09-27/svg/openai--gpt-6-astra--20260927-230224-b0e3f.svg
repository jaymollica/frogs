<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Frog with a greatly protruding lower jaw</title>
  <desc id="desc">A cheerful green frog sitting on a lily pad, with bulging golden eyes and an enormous pale green lower jaw jutting far beyond its upper lip.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#95d867"/>
      <stop offset="1" stop-color="#399562"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0.3" y2="1">
      <stop stop-color="#d4eb91"/>
      <stop offset="1" stop-color="#8dc568"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe991"/>
      <stop offset="1" stop-color="#e9b640"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" rx="36" fill="#f5f4df"/>
  <circle cx="325" cy="298" r="233" fill="#e4edd0"/>
  <ellipse cx="326" cy="544" rx="260" ry="35" fill="#c6dfce"/>
