    <ellipse cx="238" cy="234" rx="8" ry="12" transform="rotate(25 238 234)"/>
    <ellipse cx="221" cy="261" rx="6" ry="8"/>
    <ellipse cx="180" cy="281" rx="9" ry="6" transform="rotate(-37 180 281)"/>
