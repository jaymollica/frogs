<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d4a43"/>
      <stop offset="100%" stop-color="#0a1915"/>
    </radialGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80c242"/>
      <stop offset="50%" stop-color="#559625"/>
      <stop offset="100%" stop-color="#2c5411"/>
    </linearGradient>

    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#a2d959"/>
      <stop offset="40%" stop-color="#6ba82d"/>
      <stop offset="100%" stop-color="#386117"/>
    </linearGradient>

    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edf7b2"/>
      <stop offset="100%" stop-color="#b5cc6a"/>
    </linearGradient>

    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="45%" stop-color="#f7b025"/>
      <stop offset="80%" stop-color="#d65106"/>
      <stop offset="100%" stop-color="#691900"/>
    </radialGradient>

    <radialGradient id="mouthInside" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#801b38"/>
      <stop offset="100%" stop-color="#3b0514"/>
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="-3" dy="-5"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="black" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Water Vignette / Atmosphere -->
  <ellipse cx="400" cy="530" rx="380" ry="90" fill="#132e27" opacity="0.6"/>
  
  <!-- Pad / Surface -->
  <g filter="url(#dropShadow)">
    <path d="M 120,480 C 180,450 600,450 680,490 C 720,510 650,560 520,570 C 350,583 180,560 110,520 C 80,500 80,495 120,480 Z" fill="#1b5e3f"/>
    <path d="M 140,485 C 200,460 580,460 650,495 C 600,480 220,475 140,485 Z" fill="#388e3c" opacity="0.5"/>
  </g>

  <!-- MAIN FROG GROUP -->
  <g filter="url(#dropShadow)">
    
    <!-- Left Back Leg -->
    <path d="M 180,400 C 130,350 120,440 160,480 C 200,520 250,510 230,470 C 210,430 210,420 180,400 Z" fill="#386117"/>
    <path d="M 135,465 C 100,480 80,510 120,525 C 160,540 210,520 180,500 Z" fill="#2c5411"/>

    <!-- Right Back Leg -->
    <path d="M 450,430 C 520,400 560,450 510,490 C 470,520 410,510 430,470 Z" fill="#284c0e"/>
    <path d="M 500,475 C 550,485 580,510 540,525 C 490,540 440,520 470,495 Z" fill="#1e3b0a"/>

    <!-- Body / Torso -->
    <path d="M 200,380 C 180,300 250,240 320,250 C 350,250 380,280 400,320 C 430,380 420,460 350,480 C 260,500 210,440 200,380 Z" fill="url(#bodyGrad)"/>

    <!-- Left Front Arm -->
    <path d="M 240,410 C 220,440 210,480 220,510 C 225,525 240,525 245,510 C 250,480 260,450 270,420 Z" fill="url(#bodyGrad)"/>
    <!-- Left Hand / Toes -->
    <path d="M 200,515 C 215,510 220,525 220,525 C 225,510 235,510 235,525 C 240,510 255,515 250,528 C 235,535 210,535 200,515 Z" fill="#559625"/>

    <!-- Belly/Chest Highlight (Soft) -->
    <path d="M 260,360 C 280,330 330,330 350,370 C 370,410 360,460 310,470 C 260,480 240,420 260,360 Z" fill="url(#bellyGrad)" opacity="0.8"/>

    <!-- Neck / Under-jaw shadow area -->
    <path d="M 270,320 C 330,320 380,330 420,360 C 390,410 330,420 270,380 Z" fill="#1a3607"/>

    <!-- SNOT / UPPER HEAD (Intentionally smaller, set further back) -->
    <path d="M 250,230 C 240,170 310,150 350,180 C 380,150 440,170 430,220 C 440,235 430,255 400,265 C 360,275 280,270 250,230 Z" fill="url(#bodyGrad)"/>

    <!-- UPPER JAW & NOSTRILS (Short upper beak/snout) -->
    <path d="M 310,230 C 340,215 390,220 415,245 C 380,255 340,255 305,245 Z" fill="#42781b"/>
    <!-- Nostrils -->
    <ellipse cx="365" cy="232" rx="3" ry="5" fill="#152b05" transform="rotate(-10 365 232)"/>
    <ellipse cx="385" cy="235" rx="2.5" ry="4.5" fill="#152b05" transform="rotate(5 385 235)"/>

    <!-- EYE RIGHT (Background Eye) -->
    <g>
      <circle cx="410" cy="175" r="28" fill="#42781b"/>
      <circle cx="412" cy="173" r="22" fill="url(#eyeGrad)"/>
      <!-- Pupil Right -->
      <ellipse cx="410" cy="173" rx="14" ry="4" fill="#0f0400" transform="rotate(-15 410 173)"/>
      <ellipse cx="410" cy="173" rx="12" ry="2" fill="#2d0d02" transform="rotate(-15 410 173)"/>
      <!-- Eye Highlight -->
      <circle cx="402" cy="163" r="4" fill="#ffffff" opacity="0.8"/>
      <circle cx="398" cy="170" r="2" fill="#ffffff" opacity="0.6"/>
      <!-- Eyelid Shadow -->
      <path d="M 390,160 C 410,150 430,160 434,170 C 420,162 400,160 390,160 Z" fill="#284c0e" opacity="0.6"/>
    </g>

    <!-- EYE LEFT (Foreground Eye) -->
    <g>
      <circle cx="295" cy="195" r="36" fill="#559625"/>
      <circle cx="295" cy="195" r="28" fill="url(#eyeGrad)"/>
      <!-- Pupil Left -->
      <ellipse cx="293" cy="195" rx="18" ry="5" fill="#0f0400" transform="rotate(-10 293 195)"/>
      <ellipse cx="293" cy="195" rx="15" ry="2.5" fill="#2d0d02" transform="rotate(-10 293 195)"/>
      <!-- Eye Highlight -->
      <circle cx="282" cy="182" r="6" fill="#ffffff" opacity="0.8"/>
      <circle cx="275" cy="190" r="2.5" fill="#ffffff" opacity="0.6"/>
      <!-- Eye Brow/Lid Fold -->
      <path d="M 260,185 C 280,160 320,170 328,190 C 310,175 280,173 260,185 Z" fill="#72b332"/>
      <path d="M 262,188 C 280,168 315,175 325,192" stroke="#284c0e" stroke-width="2" fill="none"/>
    </g>

    <!-- INSIDE OF MOUTH (Exposed due to massive underbite) -->
    <path d="M 300,250 C 350,255 400,258 420,265 C 460,280 500,285 540,290 C 480,315 410,325 330,300 C 305,290 295,270 300,250 Z" fill="url(#mouthInside)"/>
    
    <!-- Tongue sitting in the back of lower jaw -->
    <path d="M 350,285 C 390,280 430,285 450,295 C 410,310 370,305 350,285 Z" fill="#a83254" opacity="0.8"/>

    <!-- ========================================================= -->
    <!-- HUGE, HEAVILY PROTRUDING LOWER JAW (THE HERO FEATURE) -->
    <!-- ========================================================= -->
    <g filter="url(#innerShadow)">
      <!-- Main Jaw Structure extending FAR to the right -->
      <path d="M 260,265 
               C 290,260 330,280 410,280 
               C 470,280 560,270 620,285 
               C 650,292 660,310 640,325 
               C 600,355 520,380 440,380 
               C 360,380 300,370 270,320 
               C 255,295 250,275 260,265 Z" 
            fill="url(#jawGrad)"/>

      <!-- Lower Lip/Jaw Shelf (Showing depth of the underbite) -->
      <path d="M 400,280 
               C 470,280 560,270 620,285 
               C 645,292 650,305 635,312 
               C 575,300 480,305 400,298 Z" 
            fill="#80c242"/>

      <!-- Lower Jaw Texture & Under-Belly Blend -->
      <!-- Massive Chin Highlight -->
      <path d="M 450,310 C 530,305 610,295 630,310 C 590,340 500,360 430,355 C 435,335 440,320 450,310 Z" fill="#b5e366" opacity="0.4"/>
      
      <!-- Wrinkles/Details on the Protruding Chin to emphasize size -->
      <path d="M 580,305 C 600,315 610,325 590,338" stroke="#386117" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 540,320 C 560,330 570,342 545,355" stroke="#386117" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M 490,330 C 510,342 520,355 495,365" stroke="#386117" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>

      <!-- Bulky Jaw Corner / Muffle Fold -->
      <path d="M 275,275 C 260,290 265,310 285,325 C 300,335 310,320 300,300 C 290,280 280,270 275,275 Z" fill="#559625"/>
    </g>

    <!-- Jaw Drool / Gloss Details for character -->
    <path d="M 615,295 C 618,310 610,320 612,330 C 614,335 620,335 620,328 C 618,320 624,308 622,295 Z" fill="#ffffff" opacity="0.6"/>
    <circle cx="612" cy="336" r="2.5" fill="#ffffff" opacity="0.7"/>
    
    <!-- Lip Highlight Line -->
    <path d="M 420,283 C 490,282 570,278 615,288" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

    <!-- Right Front Arm (Positioned slightly behind huge jaw curve) -->
    <path d="M 410,375 C 420,410 440,460 460,490 C 465,498 475,495 475,485 C 465,455 450,410 435,370 Z" fill="#42781b"/>
    <!-- Right Hand / Toes -->
    <path d="M 440,490 C 450,485 465,485 470,495 C 475,485 485,485 488,498 C 492,488 502,490 500,502 C 490,512 455,510 440,490 Z" fill="#386117"/>

    <!-- Skin Warts / Spots for texture -->
    <g fill="#2c5411" opacity="0.4">
      <!-- Head spots -->
      <circle cx="280" cy="220" r="4"/>
      <circle cx="270" cy="232" r="2.5"/>
      <circle cx="330" cy="170" r="5"/>
      <circle cx="345" cy="165" r="3"/>
      <!-- Back spots -->
      <circle cx="210" cy="340" r="8"/>
      <circle cx="230" cy="320" r="5"/>
      <circle cx="190" cy="370" r="6"/>
      <circle cx="220" cy="380" r="10"/>
      <circle cx="200" cy="420" r="7"/>
      <!-- Massive Jaw Spots -->
      <circle cx="480" cy="330" r="6"/>
      <circle cx="510" cy="320" r="4"/>
      <circle cx="530" cy="340" r="7"/>
      <circle cx="570" cy="315" r="5"/>
      <circle cx="440" cy="350" r="8"/>
    </g>

    <!-- Highlight spots on warts -->
    <g fill="#a2d959" opacity="0.3">
      <circle cx="208" cy="338" r="3"/>
      <circle cx="218" cy="378" r="4"/>
      <circle cx="528" cy="338" r="3"/>
      <circle cx="438" cy="348" r="3"/>
    </g>

  </g>
</svg>