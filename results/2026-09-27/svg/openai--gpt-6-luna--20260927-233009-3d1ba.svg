<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A green frog with a heavily protruding lower jaw">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#a9d86b"/>
      <stop offset=".55" stop-color="#6fae43"/>
      <stop offset="1" stop-color="#447c39"/>
    </linearGradient>
    <linearGradient id="jaw" x1=".2" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#b4df72"/>
      <stop offset=".65" stop-color="#83bd4c"/>
      <stop offset="1" stop-color="#5a963d"/>
    </linearGradient>
    <radialGradient id="iris" cx=".35" cy=".3">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset=".7" stop-color="#edb83e"/>
      <stop offset="1" stop-color="#b66b26"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f4efdf"/>
  <ellipse cx="411" cy="485" rx="286" ry="25" fill="#556448" opacity=".18" filter="url(#shadow)"/>
  <ellipse cx="411" cy="485" rx="258" ry="15" fill="#8d9a68" opacity=".22"/>

  <!-- Haunch and folded back leg -->
  <path d="M179 377C133 378 104 407 113 443c8 33 49 48 88 39l90-24 47-67-63-43z"
        fill="url(#skin)" stroke="#345d35" stroke-width="8" stroke-linejoin="round"/>
  <path d="M142 433c-14 20-7 43 15 52 22 9 53 4 72-7 15-9 22-21 18-32-5-13-23-17-39-9-19 10-30 17-42 13-10-3-12-13-5-23"
        fill="#92c654" stroke="#345d35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M177 468c-8 11-10 23-7 32m31-34c-3 12-1 23 5 31m19-40c3 11 9 19 18 24"
        fill="none" stroke="#345d35" stroke-width="5" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M189 354c30-51 91-74 151-61 54 12 91 54 86 105-5 48-48 81-112 79-58-2-116-34-139-76-9-16-5-32 14-47z"
        fill="url(#skin)" stroke="#345d35" stroke-width="9" stroke-linejoin="round"/>
  <path d="M218 389c33-31 89-39 133-18 35 17 49 48 34 73-15 25-56 34-96 25-39-9-71-34-77-58-2-8 0-15 6-22z"
        fill="#c1d978" opacity=".9"/>
  <g fill="#4f8b3d" opacity=".7">
    <circle cx="247" cy="335" r="8"/><circle cx="278" cy="319" r="6"/>
    <circle cx="305" cy="341" r="7"/><circle cx="219" cy="365" r="6"/>
    <circle cx="347" cy="328" r="5"/>
  </g>

  <!-- Foreleg -->
  <path d="M365 384c-2 31 16 59 45 74l52 26c14 7 29 4 35-7 7-12-1-24-14-31l-34-20c-15-9-20-19-17-35l8-38z"
        fill="url(#skin)" stroke="#345d35" stroke-width="8" stroke-linejoin="round"/>
  <path d="M455 479c-14 4-24 14-21 25 3 10 17 14 32 10l28-8c12-3 18-12 14-20-4-8-14-10-25-6l-12 4c-5 2-8 0-9-3-1-3 2-6 6-8"
        fill="#88bd4d" stroke="#345d35" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M466 498l-5 13m21-18-1 16m17-22 4 12" fill="none" stroke="#345d35" stroke-width="4" stroke-linecap="round"/>

  <!-- Head and upper muzzle -->
  <path d="M170 355c-13-42-7-91 15-126 28-44 80-69 139-66 29 1 53 10 75 25 20-38 58-54 94-43 35 11 54 41 56 76 38 7 70 28 83 54 6 12 8 23 7 33-76 8-158 18-239 36-40 9-72 23-98 48-28 26-73 28-103 10-14-8-23-22-29-47z"
        fill="url(#skin)" stroke="#345d35" stroke-width="9" stroke-linejoin="round"/>

  <!-- Eye mound -->
  <path d="M405 190c2-43 29-73 66-74 39-1 66 30 64 70-1 19-8 35-20 47l-95 14c-12-16-17-35-15-57z"
        fill="#8fc653" stroke="#345d35" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="468" cy="166" r="34" fill="#f4d75a" stroke="#345d35" stroke-width="7"/>
  <circle cx="476" cy="166" r="22" fill="url(#iris)"/>
  <ellipse cx="484" cy="165" rx="9" ry="16" fill="#263c2b"/>
  <circle cx="488" cy="157" r="5" fill="#fff9db"/>
  <circle cx="475" cy="176" r="2.5" fill="#fff9db"/>

  <!-- Mouth opening -->
  <path d="M369 310c76-12 175-31 263-39 22 7 39 17 52 31-81 0-178 14-264 28-24 4-42 0-51-8-6-5-6-9 0-12z"
        fill="#442932" stroke="#345d35" stroke-width="6" stroke-linejoin="round"/>
  <path d="M406 310c75-10 165-25 241-29" fill="none" stroke="#e2765d" stroke-width="5" stroke-linecap="round" opacity=".85"/>

  <!-- Enormous protruding lower jaw -->
  <path d="M373 316c82-13 178-31 259-39 39 8 72 31 81 62 12 40-14 76-54 89-38 12-76 0-116-13-49-16-96-36-140-52-24-9-39-19-41-31-1-7 3-13 11-16z"
        fill="url(#jaw)" stroke="#345d35" stroke-width="9" stroke-linejoin="round"/>
  <path d="M392 339c56 20 114 44 168 59 30 9 54 12 77 7"
        fill="none" stroke="#d2e88a" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M461 363c-3 9 1 17 8 19m34-7c-2 9 2 17 10 20m34-7c-1 8 4 15 12 18"
        fill="none" stroke="#568d3f" stroke-width="4" stroke-linecap="round" opacity=".8"/>

  <!-- Facial details -->
  <ellipse cx="605" cy="267" rx="5" ry="3.5" fill="#294633"/>
  <path d="M569 239c21 5 40 15 52 29" fill="none" stroke="#c6e47d" stroke-width="5" stroke-linecap="round"/>
  <path d="M201 271c17-25 39-40 66-48" fill="none" stroke="#c6e47d" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <circle cx="246" cy="246" r="5" fill="#d4e987"/>
  <circle cx="277" cy="224" r="4" fill="#d4e987"/>
</svg>