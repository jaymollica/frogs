<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="70%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F8E9"/>
      <stop offset="100%" stop-color="#DCEDC8"/>
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="470" rx="140" ry="25" fill="#000000" opacity="0.2" />

  <!-- BACK LEGS -->
  <!-- Left Back Thigh -->
  <ellipse cx="140" cy="370" rx="55" ry="75" transform="rotate(-30 140 370)" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />
  <!-- Left Back Foot / Toes -->
  <path d="M 100 410 Q 70 440 70 460" fill="none" stroke="#4CAF50" stroke-width="14" stroke-linecap="round" />
  <path d="M 105 415 Q 85 445 90 465" fill="none" stroke="#4CAF50" stroke-width="14" stroke-linecap="round" />
  <path d="M 110 410 Q 100 440 105 465" fill="none" stroke="#4CAF50" stroke-width="14" stroke-linecap="round" />
  
  <!-- Right Back Thigh -->
  <ellipse cx="360" cy="370" rx="55" ry="75" transform="rotate(30 360 370)" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />
  <!-- Right Back Foot / Toes -->
  <path d="M 400 410 Q 430 440 430 460" fill="none" stroke="#4CAF50" stroke-width="14" stroke-linecap="round" />
  <path d="M 395 415 Q 415 445 410 465" fill="none" stroke="#4CAF50" stroke-width="14" stroke-linecap="round" />
  <path d="M 390 410 Q 400 440 395 465" fill="none" stroke="#4CAF50" stroke-width="14" stroke-linecap="round" />

  <!-- BODY -->
  <ellipse cx="250" cy="360" rx="130" ry="100" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />

  <!-- HEAD BASE -->
  <ellipse cx="250" cy="240" rx="110" ry="85" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />

  <!-- EYE BACKGROUND (Sockets) -->
  <ellipse cx="160" cy="180" rx="45" ry="55" fill="#1B5E20" />
  <ellipse cx="340" cy="180" rx="45" ry="55" fill="#1B5E20" />

  <!-- FRONT LEGS -->
  <!-- Left Arm Outline/Shadow -->
  <path d="M 170 320 Q 120 390 140 440" fill="none" stroke="#1B5E20" stroke-width="26" stroke-linecap="round" />
  <!-- Left Arm -->
  <path d="M 170 320 Q 120 390 140 440" fill="none" stroke="url(#bodyGrad)" stroke-width="22" stroke-linecap="round" />
  <circle cx="140" cy="440" r="15" fill="#1B5E20" />

  <!-- Right Arm Outline/Shadow -->
  <path d="M 330 320 Q 380 390 360 440" fill="none" stroke="#1B5E20" stroke-width="26" stroke-linecap="round" />
  <!-- Right Arm -->
  <path d="M 330 320 Q 380 390 360 440" fill="none" stroke="url(#bodyGrad)" stroke-width="22" stroke-linecap="round" />
  <circle cx="360" cy="440" r="15" fill="#1B5E20" />

  <!-- EYES (Foreground) -->
  <!-- Left Eyeball -->
  <ellipse cx="160" cy="180" rx="40" ry="50" fill="#FFFFFF" />
  <!-- Left Pupil -->
  <ellipse cx="160" cy="180" rx="18" ry="40" fill="#000000" />
  <!-- Left Glare -->
  <circle cx="150" cy="160" r="8" fill="#FFFFFF" />
  
  <!-- Right Eyeball -->
  <ellipse cx="340" cy="180" rx="40" ry="50" fill="#FFFFFF" />
  <!-- Right Pupil -->
  <ellipse cx="340" cy="180" rx="18" ry="40" fill="#000000" />
  <!-- Right Glare -->
  <circle cx="330" cy="160" r="8" fill="#FFFFFF" />

  <!-- EYELIDS / BROWS (Grumpy Expression) -->
  <path d="M 110 170 Q 160 130 210 180" fill="none" stroke="#1B5E20" stroke-width="14" stroke-linecap="round" />
  <path d="M 390 170 Q 340 130 290 180" fill="none" stroke="#1B5E20" stroke-width="14" stroke-linecap="round" />
  
  <!-- NOSE WRINKLES -->
  <path d="M 235 190 L 235 215 M 250 185 L 250 220 M 265 190 L 265 215" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" />
  <!-- Nostrils -->
  <ellipse cx="220" cy="215" rx="5" ry="8" fill="#1B5E20" />
  <ellipse cx="280" cy="215" rx="5" ry="8" fill="#1B5E20" />

  <!-- MOUTH DIVIDER -->
  <path d="M 150 280 Q 250 330 350 280" fill="none" stroke="url(#mouthGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- MASSIVE PROTRUDING LOWER JAW -->
  <!-- Main Jaw Bulge -->
  <path d="M 150 280 C 130 420, 180 480, 250 490 C 320 480, 370 420, 350 280 Z" fill="url(#jawGrad)" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Underbite Lip Highlight -->
  <path d="M 150 280 Q 250 330 350 280 L 335 300 Q 250 345 165 300 Z" fill="#FFFFFF" opacity="0.4" />
  
  <!-- Chin Folds (Emphasizing the massive size) -->
  <path d="M 180 380 Q 250 410 320 380" fill="none" stroke="#9CCC65" stroke-width="7" stroke-linecap="round" />
  <path d="M 190 420 Q 250 450 310 420" fill="none" stroke="#9CCC65" stroke-width="7" stroke-linecap="round" />
  <path d="M 200 450 Q 250 475 300 450" fill="none" stroke="#9CCC65" stroke-width="6" stroke-linecap="round" />
  
  <!-- Jaw Stretch Lines -->
  <path d="M 250 490 L 250 465" fill="none" stroke="#AED581" stroke-width="5" stroke-linecap="round" />
  <path d="M 225 480 L 225 455" fill="none" stroke="#AED581" stroke-width="4" stroke-linecap="round" />
  <path d="M 275 480 L 275 455" fill="none" stroke="#AED581" stroke-width="4" stroke-linecap="round" />

  <!-- Cheek Dimples / Smile Lines -->
  <path d="M 145 280 Q 130 290 140 300" fill="none" stroke="#1B5E20" stroke-width="5" stroke-linecap="round" />
  <path d="M 355 280 Q 370 290 360 300" fill="none" stroke="#1B5E20" stroke-width="5" stroke-linecap="round" />

  <!-- FROG DETAILS (Spots & Textures) -->
  <circle cx="200" cy="180" r="10" fill="#2E7D32" opacity="0.6" />
  <circle cx="300" cy="190" r="12" fill="#2E7D32" opacity="0.6" />
  <circle cx="250" cy="170" r="14" fill="#2E7D32" opacity="0.5" />
  <ellipse cx="170" cy="210" rx="8" ry="12" fill="#2E7D32" opacity="0.7" />
  <ellipse cx="330" cy="210" rx="8" ry="12" fill="#2E7D32" opacity="0.7" />
  
  <ellipse cx="200" cy="340" rx="15" ry="10" fill="#2E7D32" opacity="0.5" />
  <ellipse cx="300" cy="350" rx="18" ry="12" fill="#2E7D32" opacity="0.6" />
  <ellipse cx="240" cy="420" rx="20" ry="15" fill="#2E7D32" opacity="0.4" />
  <circle cx="170" cy="380" r="12" fill="#2E7D32" opacity="0.5" />
  <circle cx="330" cy="390" r="14" fill="#2E7D32" opacity="0.5" />
</svg>