<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a443b"/>
      <stop offset="60%" stop-color="#13241d"/>
      <stop offset="100%" stop-color="#08100c"/>
    </radialGradient>

    <!-- Frog Skin Gradients -->
    <radialGradient id="bodyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8ac652"/>
      <stop offset="50%" stop-color="#559131"/>
      <stop offset="85%" stop-color="#2c5a1a"/>
      <stop offset="100%" stop-color="#19380e"/>
    </radialGradient>

    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4db64"/>
      <stop offset="45%" stop-color="#6ca83a"/>
      <stop offset="80%" stop-color="#3b6920"/>
      <stop offset="100%" stop-color="#1a380c"/>
    </linearGradient>

    <linearGradient id="underBelly" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f5f0b3"/>
      <stop offset="50%" stop-color="#dfd27e"/>
      <stop offset="85%" stop-color="#8f9942"/>
      <stop offset="100%" stop-color="#41591f"/>
    </linearGradient>

    <radialGradient id="throatSac" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#faf5c8"/>
      <stop offset="60%" stop-color="#c9be67"/>
      <stop offset="100%" stop-color="#616b27"/>
    </radialGradient>

    <!-- Eye Gradients -->
    <radialGradient id="eyeBall" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffea78"/>
      <stop offset="40%" stop-color="#e09d1b"/>
      <stop offset="80%" stop-color="#964000"/>
      <stop offset="100%" stop-color="#3d1300"/>
    </radialGradient>

    <linearGradient id="eyeLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#609c37"/>
      <stop offset="100%" stop-color="#325e1c"/>
    </linearGradient>

    <!-- Mouth Cavity Gradient -->
    <radialGradient id="mouthInside" cx="60%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#9e3b4d"/>
      <stop offset="50%" stop-color="#611824"/>
      <stop offset="100%" stop-color="#24050a"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="710" rx="310" ry="55" fill="#030805" opacity="0.8" />
  <ellipse cx="370" cy="715" rx="230" ry="35" fill="#000000" opacity="0.9" />

  <g filter="url(#shadow)">
    <!-- BACK LEFT LEG (Viewer's Right) -->
    <g class="back-leg-right">
      <path d="M530 460 C620 450 690 520 670 620 C660 670 600 690 560 670 C530 655 530 630 530 610 C530 550 510 500 530 460 Z" fill="#2c5a1a" />
      <!-- Foot -->
      <path d="M600 660 C640 660 680 665 710 680 C700 690 680 695 650 690 C620 685 580 680 570 670 Z" fill="#244a15" />
    </g>

    <!-- MAIN BODY / TORSO -->
    <path d="M 280 430 C 280 340 400 330 490 350 C 580 370 630 460 610 570 C 590 670 480 680 370 670 C 290 660 270 540 280 430 Z" fill="url(#bodyGrad)" />

    <!-- WARTS & SPOTS ON BACK -->
    <ellipse cx="490" cy="410" rx="24" ry="14" fill="#204212" opacity="0.7" transform="rotate(-15 490 410)" />
    <ellipse cx="560" cy="460" rx="18" ry="10" fill="#204212" opacity="0.7" transform="rotate(25 560 460)" />
    <ellipse cx="535" cy="515" rx="30" ry="16" fill="#1b380f" opacity="0.6" transform="rotate(5 535 515)" />
    <ellipse cx="430" cy="380" rx="14" ry="8" fill="#204212" opacity="0.7" transform="rotate(-30 430 380)" />
    <!-- Tubercles / 3D bumps -->
    <circle cx="530" cy="510" r="5" fill="#78ab3e" opacity="0.6" />
    <circle cx="485" cy="405" r="4" fill="#8ac652" opacity="0.7" />

    <!-- BACK RIGHT LEG (Viewer's Left) -->
    <g class="back-leg-left">
      <path d="M 310 530 C 260 520 220 580 230 640 C 235 670 260 685 285 680 C 310 675 325 640 320 600 Z" fill="#3b6920" />
      <path d="M 240 660 C 205 668 175 680 150 705 C 175 708 210 700 240 690 C 260 685 275 675 255 665 Z" fill="#2f5519" />
    </g>

    <!-- POUCH / THROAT SAC (EXPANDED BASE) -->
    <path d="M 230 450 C 180 500 210 630 330 655 C 410 670 470 650 490 600 C 420 630 310 630 260 560 C 240 530 230 480 230 450 Z" fill="url(#throatSac)" />

    <!-- FRONT RIGHT FORELEG (Viewer's Right) -->
    <g class="foreleg-right">
      <path d="M 450 510 C 465 570 485 620 510 675 C 490 680 465 680 450 675 C 430 630 420 580 415 525 Z" fill="#467c27" />
      <!-- Toes -->
      <path d="M 510 670 C 535 680 555 695 565 710 C 545 710 525 700 505 690 C 490 700 470 710 455 710 C 465 695 475 685 480 675 Z" fill="#325e1c" />
    </g>

    <!-- EYE RIGHT (Viewer's Far Right) -->
    <g class="eye-right">
      <ellipse cx="440" cy="250" rx="42" ry="40" fill="#325e1c" />
      <ellipse cx="440" cy="250" rx="32" ry="32" fill="url(#eyeBall)" />
      <ellipse cx="440" cy="250" rx="28" ry="9" fill="#150800" transform="rotate(-10 440 250)" />
      <circle cx="430" cy="240" r="5" fill="#ffffff" opacity="0.8" />
      <!-- Eyelid drooping -->
      <path d="M 405 235 C 420 210 465 215 475 240 C 460 230 425 225 405 235 Z" fill="#467c27" />
    </g>

    <!-- UPPER HEAD & BLUNT SNOUT (SHORT & RECEDED) -->
    <!-- Cranium ridge -->
    <path d="M 285 300 C 310 230 410 230 450 300 C 470 340 430 380 380 380 C 330 380 290 350 285 300 Z" fill="url(#bodyGrad)" />

    <!-- Short Snout / Drooping Upper Lip - Severely Under-projecting -->
    <!-- Note how the snout terminates around X=190, while the jaw below shoots out to X=90! -->
    <path d="M 330 270 C 270 275 220 310 195 345 C 185 360 195 375 225 375 C 265 375 310 365 350 360 C 355 350 350 330 350 310 Z" fill="#4c852b" />

    <!-- Nostril (slanted, unimpressed) -->
    <ellipse cx="225" cy="340" rx="4" ry="7" fill="#1b330e" transform="rotate(35 225 340)" />

    <!-- EYE LEFT (Viewer's Near Eye, Dominant & Grumpy) -->
    <g class="eye-left">
      <!-- Socket/Backing -->
      <path d="M 270 280 C 260 215 340 185 375 240 C 390 265 380 305 350 315 C 310 325 280 315 270 280 Z" fill="#2f5c18" />
      <ellipse cx="325" cy="255" rx="45" ry="44" fill="#204212" />
      <!-- Eyeball -->
      <circle cx="325" cy="255" r="38" fill="url(#eyeBall)" />
      <!-- Iris pattern/veins -->
      <circle cx="325" cy="255" r="37" stroke="#b06307" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Pupil (horizontal frog slit with a slight grumpy tilt) -->
      <ellipse cx="322" cy="257" rx="34" ry="9" fill="#080300" transform="rotate(-8 322 257)" />
      <!-- Sclera details / Ring -->
      <path d="M 290 258 Q 322 263 354 254" stroke="#ffde59" stroke-width="1.5" fill="none" opacity="0.7"/>
      <!-- Eye Highlights -->
      <circle cx="310" cy="240" r="7" fill="#ffffff" opacity="0.9" />
      <circle cx="304" cy="248" r="3" fill="#ffffff" opacity="0.7" />
      <ellipse cx="338" cy="268" rx="8" ry="3" fill="#ffffff" opacity="0.3" transform="rotate(-8 338 268)"/>

      <!-- Heavy Brow / Hooded Eyelid (creates the pout/scowl) -->
      <path d="M 273 245 C 290 200 365 205 375 245 C 355 235 330 230 295 238 C 283 241 278 243 273 245 Z" fill="#589632" />
      <path d="M 285 225 C 315 208 355 213 375 235" stroke="#7eb844" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Brow Wrinkles -->
      <path d="M 330 215 C 345 210 370 215 385 225" stroke="#1f3d10" stroke-width="2.5" fill="none" />
      <path d="M 345 205 C 360 203 380 208 395 218" stroke="#1f3d10" stroke-width="2" fill="none" />
    </g>

    <!-- UPPER LIP EDGE SHADOW -->
    <path d="M 195 352 C 220 375 260 380 325 370 C 345 367 360 362 370 360" stroke="#19330a" stroke-width="5" fill="none" />

    <!-- INTERIOR OF MOUTH (VISIBLE RECESS DUE TO JAW EXTENSION) -->
    <!-- The cavity revealed because the lower jaw is so far forward -->
    <path d="M 195 355 C 160 365 140 380 130 405 C 150 415 190 415 240 400 C 280 390 330 385 365 365 C 320 372 245 375 195 355 Z" fill="url(#mouthInside)" />

    <!-- Lower Vomerine / Jaw Teeth Nubs poking out of massive jaw -->
    <path d="M 148 385 L 154 372 L 162 386 Z" fill="#e8ebc8" opacity="0.9" />
    <path d="M 175 378 L 182 368 L 189 380 Z" fill="#e8ebc8" opacity="0.9" />

    <!-- ========================================================== -->
    <!-- THE MASSIVE PROTRUDING LOWER JAW (CHIN / MANDIBLE) -->
    <!-- Shoots far forward from X=380 all the way to X=90! -->
    <!-- ========================================================== -->
    <g class="huge-lower-jaw">
      <!-- Under-jaw Shadow & Base Depth -->
      <path d="M 115 425 C 80 400 90 365 130 365 C 190 365 240 380 320 380 C 375 380 410 400 420 440 C 360 495 290 535 190 500 C 130 480 100 445 115 425 Z" fill="#1b380f" />

      <!-- Main Lower Jaw Muscle & Bone Structure -->
      <path d="M 95 390 
               C 80 415 95 450 135 480 
               C 185 515 255 540 335 525 
               C 395 515 440 470 435 425 
               C 430 400 400 390 350 385 
               C 270 380 230 395 185 390 
               C 150 385 125 370 105 372 
               C 95 375 90 380 95 390 Z" 
            fill="url(#jawGrad)" />

      <!-- Jutting Chin Shelf (Extending beyond anything else) -->
      <path d="M 92 385 
               C 85 400 90 420 115 440 
               C 150 470 210 490 270 485 
               C 210 465 150 440 120 405 
               C 105 390 98 380 92 385 Z" 
            fill="#80be41" />

      <!-- Lip Rim (Bulldog-like heavy thick fleshy lip rim curving upwards) -->
      <path d="M 95 385 
               C 115 370 145 375 180 380 
               C 230 388 280 375 365 375 
               C 395 375 420 390 425 410 
               C 415 395 380 385 345 385 
               C 270 385 220 398 175 390 
               C 135 385 110 388 95 385 Z" 
            fill="#a6e366" />

      <!-- Specular Highlight on the protruding lip tip -->
      <path d="M 102 382 C 120 376 145 378 170 382" stroke="#d5f79e" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 108 395 C 98 408 105 425 120 435" stroke="#9ee053" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

      <!-- Big Grumpy Mandibular Warts/Bumps on Jutting Chin -->
      <circle cx="130" cy="455" r="9" fill="#4d8226" />
      <circle cx="128" cy="453" r="7" fill="#6ba836" />
      <circle cx="126" cy="451" r="3" fill="#a4db64" />

      <circle cx="165" cy="480" r="13" fill="#437521" />
      <circle cx="163" cy="478" r="10" fill="#5c992e" />
      <circle cx="160" cy="475" r="4" fill="#8ac652" />

      <circle cx="215" cy="505" r="11" fill="#437521" />
      <circle cx="213" cy="503" r="8" fill="#5c992e" />

      <!-- Deep Jaw Crease / Corner of Mouth (accentuating extreme underbite) -->
      <path d="M 355 380 C 390 385 425 400 420 435 C 415 465 370 495 330 505" stroke="#13260b" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M 370 395 C 400 405 405 425 395 445" stroke="#254a16" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- THROAT SAGGING SKIN & FOLDS -->
    <!-- Heavy throat texture hanging directly from the protruding jaw -->
    <g class="throat-folds" opacity="0.85">
      <path d="M 170 490 C 190 535 240 590 330 605 C 380 615 430 595 450 565" stroke="#5d6e27" stroke-width="5" fill="none" />
      <path d="M 210 520 C 235 565 275 625 355 630 C 405 635 440 605 460 580" stroke="#48571d" stroke-width="4.5" fill="none" />
      <path d="M 240 555 C 270 610 320 650 380 650 C 420 650 450 630 470 605" stroke="#374514" stroke-width="3" fill="none" />
      <!-- Skin stretch highlights -->
      <path d="M 175 493 C 195 538 245 593 330 608" stroke="#fcf6b6" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M 215 523 C 240 568 280 628 355 633" stroke="#fcf6b6" stroke-width="1.5" fill="none" opacity="0.5" />
    </g>

    <!-- FRONT LEFT FORELEG (Viewer's Left, firmly planted) -->
    <g class="foreleg-left">
      <!-- Upper arm / shoulder -->
      <path d="M 310 470 C 290 490 270 540 275 600 C 280 645 290 670 300 685 L 255 685 C 240 670 235 630 235 580 C 235 520 275 465 310 470 Z" fill="#3d6e21" />
      <!-- Forearm highlight -->
      <path d="M 278 540 C 278 590 285 640 295 675" stroke="#6ca83a" stroke-width="4" stroke-linecap="round" fill="none" />
      <!-- Splayed Webbed Foot / Heavy Toes -->
      <path d="M 300 680 
               C 320 685 345 690 365 695 C 350 702 330 702 315 700 
               C 310 710 300 720 285 725 C 280 715 280 705 285 695 
               C 270 705 250 715 230 720 C 235 708 245 698 260 690 
               C 240 692 215 695 195 695 C 205 685 225 680 250 678 Z" 
            fill="#2c5417" />
      <!-- Toe pads (suction discs/tubercles) -->
      <circle cx="365" cy="696" r="5" fill="#4c852b" />
      <circle cx="286" cy="723" r="5" fill="#4c852b" />
      <circle cx="228" cy="718" r="5" fill="#4c852b" />
      <circle cx="196" cy="693" r="4.5" fill="#4c852b" />
    </g>

    <!-- BELLY TEXTURE AND SPOTS -->
    <!-- Soft yellowish mottling on underbelly -->
    <ellipse cx="360" cy="565" rx="35" ry="20" fill="#ded47a" opacity="0.4" transform="rotate(15 360 565)" />
    <ellipse cx="430" cy="545" rx="25" ry="15" fill="#ded47a" opacity="0.3" transform="rotate(-10 430 545)" />

    <!-- SLIME / MOISTURE HIGHLIGHTS (GLOSS FINISH) -->
    <g class="highlights" opacity="0.7">
      <!-- Skull/Nose shine -->
      <ellipse cx="230" cy="320" rx="15" ry="6" fill="#ffffff" opacity="0.4" transform="rotate(-20 230 320)" />
      <!-- Heavy Jaw rim gloss string -->
      <path d="M 125 415 C 150 440 200 460 250 455" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />
      <!-- Eyebrow rim shine -->
      <path d="M 300 220 C 325 210 355 215 370 225" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
      <!-- Back shine -->
      <path d="M 460 360 C 500 370 540 400 560 440" stroke="#a4db64" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3" />
    </g>
  </g>
</svg>