<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bodyG" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8dc153"/>
      <stop offset="100%" stop-color="#5b8f39"/>
    </radialGradient>
    <radialGradient id="headG" cx="40%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#9ccf5e"/>
      <stop offset="100%" stop-color="#628f37"/>
    </radialGradient>
    <linearGradient id="jawG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb848"/>
      <stop offset="60%" stop-color="#a9d86c"/>
      <stop offset="100%" stop-color="#cbe793"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="378" rx="150" ry="16" fill="#000" opacity="0.12"/>

  <!-- back legs -->
  <path d="M70 250 q-45 30 -32 70 q10 32 48 26 q28 -6 26 -36 z" fill="#5b8f39"/>
  <path d="M330 250 q45 30 32 70 q-10 32 -48 26 q-28 -6 -26 -36 z" fill="#5b8f39"/>

  <!-- body -->
  <ellipse cx="200" cy="288" rx="108" ry="88" fill="url(#bodyG)"/>
  <ellipse cx="200" cy="312" rx="66" ry="56" fill="#d3e9a0" opacity="0.85"/>

  <!-- front feet -->
  <g fill="#4a7a33">
    <path d="M96 340 q-40 8 -54 30 q-4 12 10 14 q14 2 22 -6 q14 12 26 4 q12 12 24 0 q6 -20 -4 -32 z"/>
    <path d="M304 340 q40 8 54 30 q4 12 -10 14 q-14 2 -22 -6 q-14 12 -26 4 q-12 12 -24 0 q-6 -20 4 -32 z"/>
  </g>

  <!-- head -->
  <path d="M200 62 q112 0 118 82 q4 58 -48 74 l-140 0 q-52 -16 -48 -74 q6 -82 118 -82 z" fill="url(#headG)"/>

  <!-- eye bulges -->
  <g>
    <circle cx="136" cy="86" r="42" fill="#8dc153"/>
    <circle cx="264" cy="86" r="42" fill="#8dc153"/>
    <circle cx="136" cy="84" r="32" fill="#fdf6d8"/>
    <circle cx="264" cy="84" r="32" fill="#fdf6d8"/>
    <ellipse cx="139" cy="88" rx="15" ry="20" fill="#1b1b1b"/>
    <ellipse cx="261" cy="88" rx="15" ry="20" fill="#1b1b1b"/>
    <circle cx="132" cy="76" r="6" fill="#fff" opacity="0.9"/>
    <circle cx="254" cy="76" r="6" fill="#fff" opacity="0.9"/>
  </g>

  <!-- nostrils -->
  <ellipse cx="180" cy="150" rx="5" ry="4" fill="#3f6b2a"/>
  <ellipse cx="220" cy="150" rx="5" ry="4" fill="#3f6b2a"/>

  <!-- upper lip shadow -->
  <path d="M96 168 q104 26 208 0 q-6 22 -22 26 l-164 0 q-16 -4 -22 -26 z" fill="#4e7c2f" opacity="0.75"/>

  <!-- HEAVILY PROTRUDING LOWER JAW -->
  <path d="M200 148
           q-92 0 -128 12
           q-24 8 -20 34
           q8 58 68 76
           q80 20 160 0
           q60 -18 68 -76
           q4 -26 -20 -34
           q-36 -12 -128 -12 z"
        fill="url(#jawG)" stroke="#4a7a33" stroke-width="5" stroke-linejoin="round"/>

  <!-- mouth line on top of jaw -->
  <path d="M62 178 q138 34 276 0" fill="none" stroke="#3f6b2a" stroke-width="7" stroke-linecap="round"/>

  <!-- jutting teeth from lower jaw -->
  <g fill="#fffdf0" stroke="#d9d3b4" stroke-width="2">
    <path d="M104 182 l12 -2 l-2 -26 z"/>
    <path d="M146 192 l14 -1 l-4 -28 z"/>
    <path d="M240 191 l14 1 l4 -28 z"/>
    <path d="M282 180 l12 2 l2 -26 z"/>
  </g>

  <!-- chin crease + highlight -->
  <path d="M140 238 q60 26 120 0" fill="none" stroke="#8ab84f" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="128" cy="196" rx="26" ry="12" fill="#ffffff" opacity="0.22" transform="rotate(-12 128 196)"/>

  <!-- cheek spots -->
  <circle cx="300" cy="212" r="9" fill="#4a7a33" opacity="0.35"/>
  <circle cx="100" cy="212" r="9" fill="#4a7a33" opacity="0.35"/>
  <circle cx="150" cy="300" r="11" fill="#7fae4a" opacity="0.5"/>
  <circle cx="252" cy="296" r="9" fill="#7fae4a" opacity="0.5"/>
</svg>