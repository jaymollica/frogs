<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="skin" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#9ccc65"/>
      <stop offset="60%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </radialGradient>
    <radialGradient id="jawg" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="70%" stop-color="#689f38"/>
      <stop offset="100%" stop-color="#436b20"/>
    </radialGradient>
    <radialGradient id="eyeball" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0c98a"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="372" rx="150" ry="18" fill="#000" opacity="0.15"/>

  <!-- body / shoulders -->
  <path d="M60 330 C60 250 120 210 200 210 C280 210 340 250 340 330 Z" fill="#5f9c37"/>
  <!-- front feet -->
  <g fill="#6aa83c" stroke="#3f6a1f" stroke-width="3" stroke-linejoin="round">
    <path d="M70 350 q-22 -6 -34 6 q10 12 26 10 q-16 6 -8 16 q14 4 24 -8 q-6 14 6 18 q12 -4 14 -20 z"/>
    <path d="M330 350 q22 -6 34 6 q-10 12 -26 10 q16 6 8 16 q-14 4 -24 -8 q6 14 -6 18 q-12 -4 -14 -20 z"/>
  </g>

  <!-- HEAD (upper skull) -->
  <ellipse cx="200" cy="150" rx="128" ry="92" fill="url(#skin)"/>

  <!-- HUGE HABSBURG MANDIBLE -->
  <path d="M84 168
           C64 250 96 322 160 344
           C185 353 215 353 242 344
           C308 321 338 248 316 168 Z"
        fill="url(#jawg)"/>
  <!-- chin crease -->
  <path d="M168 318 Q200 334 232 318" fill="none" stroke="#3f6a1f" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M200 296 L200 322" fill="none" stroke="#3f6a1f" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- lower lip ridge (protruding over upper lip) -->
  <path d="M84 168 C130 140 270 140 316 168 C300 196 240 206 200 206 C160 206 100 196 84 168 Z"
        fill="#86bb4c"/>
  <path d="M84 168 C130 140 270 140 316 168" fill="none" stroke="#3f6a1f" stroke-width="4"/>

  <!-- exposed lower teeth (underbite) -->
  <g fill="#fffdf0" stroke="#cbbf9a" stroke-width="2">
    <rect x="132" y="141" width="22" height="20" rx="6" transform="rotate(-9 143 151)"/>
    <rect x="163" y="134" width="24" height="21" rx="6" transform="rotate(-4 175 144)"/>
    <rect x="196" y="132" width="24" height="21" rx="6"/>
    <rect x="229" y="134" width="24" height="21" rx="6" transform="rotate(4 241 144)"/>
    <rect x="262" y="141" width="22" height="20" rx="6" transform="rotate(9 273 151)"/>
  </g>

  <!-- mouth shadow line (upper jaw tucked behind) -->
  <path d="M110 150 Q200 168 290 150" fill="none" stroke="#2f4f16" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- nostrils -->
  <ellipse cx="176" cy="110" rx="6" ry="5" fill="#3f6a1f"/>
  <ellipse cx="224" cy="110" rx="6" ry="5" fill="#3f6a1f"/>

  <!-- EYE BULGES -->
  <g>
    <circle cx="132" cy="76" r="48" fill="url(#skin)" stroke="#4c7a2a" stroke-width="3"/>
    <circle cx="268" cy="76" r="48" fill="url(#skin)" stroke="#4c7a2a" stroke-width="3"/>
    <circle cx="132" cy="72" r="33" fill="url(#eyeball)"/>
    <circle cx="268" cy="72" r="33" fill="url(#eyeball)"/>
    <ellipse cx="132" cy="72" rx="12" ry="26" fill="#1b1b1b"/>
    <ellipse cx="268" cy="72" rx="12" ry="26" fill="#1b1b1b"/>
    <circle cx="125" cy="56" r="7" fill="#fff" opacity="0.9"/>
    <circle cx="261" cy="56" r="7" fill="#fff" opacity="0.9"/>
    <!-- eyelids -->
    <path d="M92 52 Q132 26 172 52" fill="none" stroke="#4c7a2a" stroke-width="7" stroke-linecap="round"/>
    <path d="M228 52 Q268 26 308 52" fill="none" stroke="#4c7a2a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- cheek spots -->
  <g fill="#4c7a2a" opacity="0.35">
    <ellipse cx="104" cy="228" rx="16" ry="11"/>
    <ellipse cx="296" cy="228" rx="16" ry="11"/>
    <ellipse cx="128" cy="276" rx="12" ry="9"/>
    <ellipse cx="272" cy="276" rx="12" ry="9"/>
  </g>
</svg>