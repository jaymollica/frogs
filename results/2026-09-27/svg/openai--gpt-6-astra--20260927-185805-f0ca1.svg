  <g fill="#427e4d" opacity=".65">
    <ellipse cx="216" cy="257" rx="9" ry="6" transform="rotate(-25 216 257)"/>
    <ellipse cx="231" cy="236" rx="5" ry="4"/>
    <ellipse cx="246" cy="258" rx="6" ry="4"/>
    <ellipse cx="214" cy="284" rx="5" ry="7"/>
    <ellipse cx="313" cy="222" rx="7" ry="4"/>
    <ellipse cx="181" cy="415" rx="7" ry="5"/>
    <ellipse cx="166" cy="431" rx="5" ry="4"/>
