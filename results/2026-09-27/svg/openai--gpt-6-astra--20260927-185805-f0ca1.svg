  <path d="M244 296C293 316 354 311 407 300Q444 295 459 286C463 309 473 319 492 323L486 362L321 379L259 343Z" fill="#344333" stroke="#284b38" stroke-width="5" stroke-linejoin="round"/>
  <path d="M260 301Q333 325 411 303Q439 297 456 289" fill="none" stroke="#284b38" stroke-width="7" stroke-linecap="round"/>
  <path d="M337 347Q392 325 444 342L447 365L346 371Z" fill="#b77f70"/>

  <!-- Long projecting lower jaw: prominent underbite and chin -->
  <path d="M242 308C264 343 322 351 382 342C426 336 463 326 490 314C507 307 520 318 518 335C517 374 492 405 451 418C402 435 343 420 306 397C271 376 247 344 242 308Z" fill="url(#jaw)" stroke="#284b38" stroke-width="6" stroke-linejoin="round"/>
  <path d="M263 335C322 374 431 358 502 326" fill="none" stroke="#284b38" stroke-width="6" stroke-linecap="round"/>
  <path d="M340 387Q410 419 471 386" fill="none" stroke="#5d9452" stroke-width="4" stroke-linecap="round"/>
  <path d="M378 375Q433 378 471 359" fill="none" stroke="#d4e69a" stroke-width="7" stroke-linecap="round"/>

  <!-- Small lower teeth emphasize the forward bite -->
  <path d="M444 347L445 330Q451 326 457 330L459 342M465 340L468 323Q474 319 479 324L480 334" fill="#fff6d5" stroke="#284b38" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M436 351Q469 342 491 332" fill="none" stroke="#284b38" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny pond flower -->
  <path d="M115 497Q106 473 117 454" fill="none" stroke="#527e54" stroke-width="4"/>
  <path d="M116 460C91 457 85 441 93 435Q109 433 117 449C111 429 120 416 128 422Q137 435 122 451C139 438 152 444 148 452Q140 466 116 460Z" fill="#e5aeaa" stroke="#a26f77" stroke-width="3"/>
  <circle cx="119" cy="452" r="5" fill="#f4d782"/>
