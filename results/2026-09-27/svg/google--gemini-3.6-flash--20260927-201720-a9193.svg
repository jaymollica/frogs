<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a443b"/>
      <stop offset="100%" stop-color="#0f1a15"/>
    </radialGradient>

    <!-- Frog Skin Primary Gradient -->
    <linearGradient id="skinPrimary" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="50%" stop-color="#588d27"/>
      <stop offset="100%" stop-color="#2e4c11"/>
    </linearGradient>

    <!-- Frog Skin Highlight -->
    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="100%" stop-color="#689f38"/>
    </linearGradient>

    <!-- Belly/Underbite Cream Gradient -->
    <linearGradient id="bellyGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f0f4c3"/>
      <stop offset="60%" stop-color="#dce775"/>
      <stop offset="100%" stop-color="#9e9d24"/>
    </linearGradient>

    <!-- Prognathic Mandible Highlight Gradient -->
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dce775"/>
      <stop offset="50%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>

    <!-- Eye Iris Radial Gradient -->
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffee58"/>
      <stop offset="40%" stop-color="#f57f17"/>
      <stop offset="85%" stop-color="#bf360c"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>

    <!-- Mouth Cavity Dark Gradient -->
    <linearGradient id="mouthDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a0007"/>
      <stop offset="100%" stop-color="#210002"/>
    </linearGradient>

    <!-- Lip Shadow -->
    <linearGradient id="lipShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3008" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1b3008" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Environment Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Ambient Water/Ground Surface -->
  <ellipse cx="400" cy="520" rx="360" ry="60" fill="#0a120e" opacity="0.8"/>
  <ellipse cx="400" cy="520" rx="300" ry="40" fill="#14261c" opacity="0.5"/>

  <!-- Lily Pad / Perch -->
  <g id="lilyPad">
    <path d="M 120 510 C 120 460, 650 460, 700 510 C 730 535, 600 560, 400 560 C 200 560, 90 535, 120 510 Z" fill="#1b4d2e" stroke="#2e7d32" stroke-width="3"/>
    <path d="M 400 530 L 700 510 M 400 530 L 120 510 M 400 530 L 300 555 M 400 530 L 520 553 M 400 530 L 410 470" stroke="#12331f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN FROG GROUP WITH SHADOW -->
  <g filter="url(#dropShadow)">

    <!-- Back Left Leg -->
    <g id="backLeftLeg">
      <path d="M 230 380 C 160 350, 130 440, 180 480 C 210 500, 250 490, 270 460 Z" fill="#385e17"/>
      <path d="M 160 460 C 120 470, 90 500, 110 520 C 130 525, 160 510, 180 480 Z" fill="#2e4c11"/>
    </g>

    <!-- Back Right Leg -->
    <g id="backRightLeg">
      <path d="M 470 390 C 560 360, 600 430, 560 480 C 530 510, 480 500, 450 460 Z" fill="#2e4c11"/>
      <path d="M 540 460 C 590 480, 620 500, 610 525 C 590 530, 550 510, 520 480 Z" fill="#1e330a"/>
    </g>

    <!-- Frog Body / Torso -->
    <path id="body" d="M 220 360 C 200 280, 280 230, 350 230 C 430 230, 500 280, 480 380 C 460 440, 420 470, 350 470 C 270 470, 230 420, 220 360 Z" fill="url(#skinPrimary)"/>

    <!-- Soft Belly Area -->
    <path id="belly" d="M 250 370 C 250 300, 300 270, 360 270 C 410 270, 450 310, 440 380 C 430 440, 390 465, 350 465 C 290 465, 250 430, 250 370 Z" fill="url(#bellyGrad)" opacity="0.9"/>

    <!-- Left Front Leg & Foot -->
    <g id="frontLeftLeg">
      <path d="M 250 400 C 230 430, 220 470, 230 510 C 235 520, 245 520, 250 510 C 255 480, 265 440, 280 410 Z" fill="url(#skinHighlight)"/>
      <!-- Webbed Foot -->
      <path d="M 230 510 Q 200 525 180 520 Q 210 505 220 495 Q 225 520 230 510 Q 240 525 250 530 Q 250 510 230 510 Z" fill="#588d27"/>
    </g>

    <!-- Right Front Leg & Foot -->
    <g id="frontRightLeg">
      <path d="M 430 400 C 445 430, 450 470, 435 510 C 430 520, 420 520, 415 510 C 410 480, 400 440, 390 410 Z" fill="url(#skinPrimary)"/>
      <!-- Webbed Foot -->
      <path d="M 435 510 Q 455 525 480 520 Q 450 505 440 495 Q 435 520 435 510 Q 420 525 405 530 Q 415 510 435 510 Z" fill="#385e17"/>
    </g>

    <!-- HEAD STRUCTURE (Positioned for 3/4 View, angled right) -->
    <!-- Cranium / Upper Head Back -->
    <path d="M 240 280 C 230 220, 290 160, 370 160 C 430 160, 470 200, 470 240 C 470 260, 450 280, 430 290 Z" fill="url(#skinPrimary)"/>

    <!-- Eyes Structure -->
    <!-- Left Eye (Background) -->
    <g id="leftEye">
      <circle cx="310" cy="170" r="35" fill="url(#skinPrimary)"/>
      <circle cx="310" cy="170" r="25" fill="url(#irisGrad)"/>
      <!-- Pupil (Horizontal frog slit) -->
      <ellipse cx="310" cy="170" rx="16" ry="6" fill="#0d0400" transform="rotate(-5, 310, 170)"/>
      <!-- Eye Highlight -->
      <circle cx="300" cy="160" r="5" fill="#ffffff" opacity="0.8"/>
      <circle cx="295" cy="167" r="2" fill="#ffffff" opacity="0.6"/>
      <!-- Eyebrow/Lid Shadow -->
      <path d="M 275 160 C 290 135, 330 135, 345 160 C 330 145, 290 145, 275 160 Z" fill="#2e4c11"/>
    </g>

    <!-- Right Eye (Foreground) -->
    <g id="rightEye">
      <circle cx="410" cy="180" r="42" fill="url(#skinHighlight)"/>
      <circle cx="415" cy="180" r="30" fill="url(#irisGrad)"/>
      <!-- Pupil -->
      <ellipse cx="415" cy="180" rx="20" ry="7" fill="#0d0400" transform="rotate(-8, 415, 180)"/>
      <!-- Eye Highlights -->
      <circle cx="400" cy="168" r="7" fill="#ffffff" opacity="0.9"/>
      <circle cx="392" cy="178" r="3" fill="#ffffff" opacity="0.7"/>
      <!-- Eyelid Overlay -->
      <path d="M 370 170 C 390 140, 440 140, 455 175 C 435 150, 390 150, 370 170 Z" fill="#588d27"/>
    </g>

    <!-- Upper Snout (STUNTED / RECEDED for Prognathism effect) -->
    <!-- Noticeably short upper maxilla ending around X=460 -->
    <g id="upperJaw">
      <path d="M 320 240 Q 420 220, 460 250 C 475 260, 470 275, 440 280 C 390 290, 310 285, 280 270 Z" fill="url(#skinPrimary)"/>
      <!-- Receded Upper Lip Line -->
      <path d="M 350 270 Q 430 265, 465 270 C 470 272, 450 280, 430 282" stroke="#1b3008" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Nostril -->
      <ellipse cx="445" cy="245" rx="3" ry="5" fill="#1b3008" transform="rotate(20, 445, 245)"/>
    </g>

    <!-- MOUTH CAVITY (Exposed due to extreme underbite) -->
    <path id="mouthInterior" d="M 340 280 Q 440 275, 470 278 Q 500 288, 520 310 Q 460 350, 350 330 Z" fill="url(#mouthDark)"/>

    <!-- Deep Mouth Details: Tongue resting in back -->
    <path d="M 360 305 Q 410 295, 440 315 C 420 330, 380 330, 360 305 Z" fill="#880e4f" opacity="0.8"/>

    <!-- PROMINENT MANDIBULAR PROGNATHISM (EXTREME JUTTING LOWER JAW) -->
    <!-- The lower jaw extends WAY past the upper jaw (out to X=540) and hooks upward -->
    <g id="prognathicMandible" filter="url(#glow)">
      
      <!-- Main Jaw Bone / Flesh Mass -->
      <path d="M 270 300 
               C 320 320, 360 350, 430 360 
               C 490 370, 540 360, 560 325 
               C 575 295, 555 270, 525 270 
               C 490 270, 470 295, 420 295 
               C 360 295, 310 285, 270 300 Z" 
            fill="url(#skinPrimary)"/>

      <!-- Lower Jaw Front / Underbelly Accent (Massive Chin Structure) -->
      <path d="M 350 340 
               C 420 355, 480 365, 530 335 
               C 555 320, 565 295, 545 280 
               C 530 270, 505 275, 485 290 
               C 440 315, 390 325, 350 340 Z" 
            fill="url(#bellyGrad)"/>

      <!-- Lower Lip Rim / Ridge (Jutting Out & Overlapping) -->
      <path d="M 300 292 
               C 360 290, 430 288, 480 275 
               C 510 267, 545 260, 558 280 
               C 570 300, 545 325, 515 330 
               C 450 340, 370 325, 300 292 Z" 
            fill="url(#skinHighlight)" opacity="0.6"/>

      <!-- Jaw Contour / Shadow Lines emphasizing forward protrusion -->
      <path d="M 440 358 C 510 360, 550 335, 562 310" stroke="#1b3008" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 340 290 C 420 298, 480 288, 540 275" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      
      <!-- Pronounced Mental Protuberance (Strong Chin Highlight) -->
      <ellipse cx="525" cy="315" rx="25" ry="15" fill="#f0f4c3" opacity="0.3" transform="rotate(-20, 525, 315)"/>

      <!-- EXPOSED LOWER TEETH / DENTICLES (Highlighting Mandibular Prognathism) -->
      <!-- Teeth sitting on the jutting lower jaw pointing UP outside the upper mouth -->
      <g id="lowerTeeth" fill="#ffffff" stroke="#b0bec5" stroke-width="0.5" opacity="0.9">
        <!-- Tooth 1 (Front/Center Jut) -->
        <polygon points="520,270 525,260 529,271"/>
        <!-- Tooth 2 -->
        <polygon points="505,272 510,263 514,273"/>
        <!-- Tooth 3 -->
        <polygon points="490,276 494,268 499,277"/>
        <!-- Tooth 4 (Canine-like prominent tooth) -->
        <polygon points="533,269 539,257 544,271"/>
        <!-- Tooth 5 (Far side) -->
        <polygon points="546,274 550,265 554,277"/>
      </g>

    </g> <!-- End Prognathic Mandible -->

    <!-- Skin Texture / Spots / Warts -->
    <g id="skinDetails" fill="#1e330a" opacity="0.4">
      <!-- Head spots -->
      <circle cx="350" cy="210" r="6"/>
      <circle cx="335" cy="225" r="4"/>
      <circle cx="370" cy="220" r="8"/>
      <circle cx="390" cy="235" r="5"/>

      <!-- Back spots -->
      <circle cx="270" cy="310" r="12"/>
      <circle cx="295" cy="340" r="9"/>
      <circle cx="260" cy="350" r="7"/>
      <circle cx="310" cy="380" r="14"/>
      <circle cx="340" cy="410" r="10"/>

      <!-- Jaw / Chin spots -->
      <circle cx="460" cy="335" r="5"/>
      <circle cx="490" cy="325" r="7"/>
      <circle cx="430" cy="345" r="6"/>
    </g>

    <!-- Specular Highlights on Wet Skin -->
    <g id="highlights" fill="#ffffff" opacity="0.4">
      <ellipse cx="365" cy="185" rx="12" ry="4" transform="rotate(-15, 365, 185)"/>
      <ellipse cx="450" cy="255" rx="8" ry="2" transform="rotate(10, 450, 255)"/>
      <path d="M 495 280 C 515 273, 535 270, 545 276 C 530 280, 510 282, 495 280 Z"/>
      <circle cx="280" cy="330" r="3"/>
      <circle cx="330" cy="250" r="2"/>
    </g>

  </g> <!-- END FROG GROUP -->

  <!-- Foreground Atmospheric Details / Water Specular -->
  <ellipse cx="500" cy="535" rx="80" ry="4" fill="#ffffff" opacity="0.1"/>
  <ellipse cx="280" cy="545" rx="120" ry="6" fill="#ffffff" opacity="0.08"/>
</svg>