<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    
    <!-- Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    
    <!-- Underbite (Lower Jaw) Gradient -->
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9FBE7"/>
      <stop offset="100%" stop-color="#AED581"/>
    </linearGradient>
    
    <!-- Drop Shadows for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="chinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#1B5E20" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Lily Pads -->
  <ellipse cx="150" cy="450" rx="90" ry="35" fill="#2E7D32" opacity="0.7" transform="rotate(-15 150 450)"/>
  <ellipse cx="650" cy="520" rx="110" ry="45" fill="#2E7D32" opacity="0.7" transform="rotate(10 650 520)"/>
  <ellipse cx="400" cy="580" rx="130" ry="55" fill="#388E3C" opacity="0.9"/>

  <!-- BACK LEGS -->
  <g id="back-legs">
    <!-- Left Back Leg -->
    <path d="M 300 350 C 200 350, 100 450, 120 500 C 150 520, 200 520, 230 480 Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>
    <path d="M 120 500 L 80 550 L 130 550 L 150 530 L 180 560 L 210 510 Z" fill="#81C784"/>
    
    <!-- Right Back Leg -->
    <path d="M 500 350 C 600 350, 700 450, 680 500 C 650 520, 600 520, 570 480 Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>
    <path d="M 680 500 L 720 550 L 670 550 L 650 530 L 620 560 L 590 510 Z" fill="#81C784"/>
  </g>

  <!-- BODY -->
  <g id="body">
    <path d="M 280 300 C 220 400, 250 550, 400 550 C 550 550, 580 400, 520 300 Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>
    <!-- Belly Highlight -->
    <path d="M 330 350 C 300 420, 330 510, 400 510 C 470 510, 500 420, 470 350 Z" fill="#A5D6A7" opacity="0.6"/>
    <!-- Body Spots -->
    <circle cx="310" cy="430" r="12" fill="#1B5E20" opacity="0.4"/>
    <circle cx="490" cy="440" r="15" fill="#1B5E20" opacity="0.4"/>
    <circle cx="420" cy="400" r="8" fill="#1B5E20" opacity="0.4"/>
    <circle cx="380" cy="480" r="10" fill="#1B5E20" opacity="0.4"/>
  </g>

  <!-- UNDERBITE (LOWER JAW) -->
  <g id="underbite" filter="url(#chinShadow)">
    <path d="M 290 320
             C 310 380, 330 480, 400 510
             C 470 480, 490 380, 510 320
             C 470 340, 440 370, 420 380
             C 400 390, 400 390, 380 380
             C 360 370, 330 340, 290 320 Z"
          fill="url(#jawGrad)"/>
    
    <!-- Underbite Texture / Warts -->
    <circle cx="350" cy="440" r="9" fill="#9CCC65" opacity="0.6"/>
    <circle cx="430" cy="470" r="11" fill="#9CCC65" opacity="0.6"/>
    <circle cx="460" cy="410" r="7" fill="#9CCC65" opacity="0.6"/>
    <circle cx="320" cy="390" r="6" fill="#9CCC65" opacity="0.6"/>
    <circle cx="380" cy="420" r="5" fill="#9CCC65" opacity="0.6"/>
    
    <!-- Jaw Wrinkle / Chin Cleft -->
    <path d="M 390 510 Q 400 525 410 510" stroke="#558B2F" stroke-width="3" fill="none" opacity="0.7"/>
    
    <!-- Underbite Highlight (Volumetric) -->
    <path d="M 340 480 Q 400 505 460 480 Q 400 520 340 480 Z" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- UPPER HEAD -->
  <g id="upper-head">
    <!-- Upper Jaw & Head Structure -->
    <path d="M 260 280 C 260 150, 320 80, 400 80 C 480 80, 540 150, 540 280 C 540 310, 500 320, 460 330 C 430 340, 410 350, 400 350 C 390 350, 370 340, 340 330 C 300 320, 260 310, 260 280 Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>
    
    <!-- Mouth Interior (Dark Gap between Upper and Lower Jaw) -->
    <path d="M 320 340 C 360 370, 440 370, 480 340 C 440 380, 360 380, 320 340 Z" fill="#3E2723"/>
    
    <!-- Upper Lip Shadow Cast onto Underbite -->
    <path d="M 320 340 C 360 360, 440 360, 480 340 C 450 370, 350 370, 320 340 Z" fill="#1B5E20" opacity="0.5"/>
    
    <!-- Face Wrinkle (Forehead) -->
    <path d="M 350 180 Q 400 210 450 180" stroke="#1B5E20" stroke-width="5" fill="none" opacity="0.8"/>
    
    <!-- Nostrils -->
    <ellipse cx="365" cy="260" rx="6" ry="4" fill="#1B5E20"/>
    <ellipse cx="435" cy="260" rx="6" ry="4" fill="#1B5E20"/>
    
    <!-- Tympanum (Ears) -->
    <circle cx="245" cy="240" r="28" fill="#388E3C" opacity="0.9"/>
    <circle cx="555" cy="240" r="28" fill="#388E3C" opacity="0.9"/>
    <circle cx="245" cy="240" r="22" fill="#4CAF50" opacity="0.6"/>
    <circle cx="555" cy="240" r="22" fill="#4CAF50" opacity="0.6"/>
  </g>

  <!-- EYES -->
  <g id="eyes">
    <!-- Left Eye Protrusion -->
    <path d="M 275 220 C 275 110, 365 110, 365 220 Z" fill="url(#bodyGrad)"/>
    <!-- Right Eye Protrusion -->
    <path d="M 435 220 C 435 110, 525 110, 525 220 Z" fill="url(#bodyGrad)"/>
    
    <!-- Left Eye White -->
    <ellipse cx="320" cy="160" rx="30" ry="42" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <!-- Right Eye White -->
    <ellipse cx="480" cy="160" rx="30" ry="42" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    
    <!-- Eye Pinkness (Bloodshot) near the Underbite -->
    <ellipse cx="330" cy="190" rx="8" ry="12" fill="#FF8A80" opacity="0.5"/>
    <ellipse cx="470" cy="190" rx="8" ry="12" fill="#FF8A80" opacity="0.5"/>
    
    <!-- Left Iris (Yellow/Orange) -->
    <ellipse cx="325" cy="175" rx="16" ry="28" fill="#FFCA28"/>
    <!-- Right Iris (Yellow/Orange) -->
    <ellipse cx="475" cy="175" rx="16" ry="28" fill="#FFCA28"/>
    
    <!-- Left Pupil (Looking down at the underbite) -->
    <ellipse cx="332" cy="180" rx="9" ry="17" fill="#212121"/>
    <!-- Right Pupil (Looking down at the underbite) -->
    <ellipse cx="468" cy="180" rx="9" ry="17" fill="#212121"/>
    
    <!-- Eye Highlights -->
    <circle cx="312" cy="148" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="472" cy="148" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="322" cy="160" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="472" cy="160" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- TONGUE (Protruding from the side of the underbite) -->
  <g id="tongue">
    <path d="M 485 400 Q 520 380 530 420 Q 510 440 490 425 Z" fill="#FF7043" stroke="#D84315" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 495 405 Q 515 395 520 415" stroke="#E64A19" stroke-width="2" fill="none"/>
  </g>

  <!-- FRONT LEGS -->
  <g id="front-legs" filter="url(#shadow)">
    <!-- Left Front Leg -->
    <path d="M 280 400 Q 230 480 190 540 L 220 560 L 250 500 L 310 440 Z" fill="url(#bodyGrad)"/>
    <!-- Left Front Toes (Webbing) -->
    <path d="M 190 540 L 155 565 L 185 575 L 205 585 L 225 575 L 235 550 Z" fill="#81C784"/>
    
    <!-- Right Front Leg -->
    <path d="M 520 400 Q 570 480 610 540 L 580 560 L 550 500 L 490 440 Z" fill="url(#bodyGrad)"/>
    <!-- Right Front Toes (Webbing) -->
    <path d="M 610 540 L 645 565 L 615 575 L 595 585 L 575 575 L 565 550 Z" fill="#81C784"/>
  </g>

  <!-- FINAL ADJUSTMENTS / HIGHLIGHTS -->
  <g id="details">
    <!-- Cheek folds where Underbite meets Upper Head -->
    <path d="M 290 320 Q 310 280 340 300" stroke="#1B5E20" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M 510 320 Q 490 280 460 300" stroke="#1B5E20" stroke-width="4" fill="none" opacity="0.6"/>
  </g>
</svg>