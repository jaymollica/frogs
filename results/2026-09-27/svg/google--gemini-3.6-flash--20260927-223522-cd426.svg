<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#224438"/>
      <stop offset="60%" stop-color="#0e221b"/>
      <stop offset="100%" stop-color="#050d0a"/>
    </radialGradient>

    <!-- Frog Skin Primary (Back/Top) -->
    <linearGradient id="skinBase" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#8ce63d"/>
      <stop offset="45%" stop-color="#4db820"/>
      <stop offset="85%" stop-color="#256e10"/>
      <stop offset="100%" stop-color="#144208"/>
    </linearGradient>

    <!-- Jaw & Highlights Gradient -->
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6f542"/>
      <stop offset="40%" stop-color="#5ec425"/>
      <stop offset="85%" stop-color="#246e0d"/>
    </linearGradient>

    <!-- Belly/Under-jaw Cream Gradient -->
    <linearGradient id="bellyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffba3"/>
      <stop offset="50%" stop-color="#dbe667"/>
      <stop offset="100%" stop-color="#88a832"/>
    </linearGradient>

    <!-- Mouth Interior Gradient -->
    <linearGradient id="mouthInside" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b0811"/>
      <stop offset="50%" stop-color="#6b1120"/>
      <stop offset="100%" stop-color="#9e2437"/>
    </linearGradient>

    <!-- Tongue Gradient -->
    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84d67"/>
      <stop offset="100%" stop-color="#9e1b30"/>
    </linearGradient>

    <!-- Eye Iris Radial Gradient -->
    <radialGradient id="eyeIris" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="85%" stop-color="#d45b00"/>
      <stop offset="100%" stop-color="#521200"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#fff" flood-opacity="0.3"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Ground Shadow -->
  <ellipse cx="420" cy="670" rx="320" ry="60" fill="#000000" opacity="0.6" filter="blur(10px)"/>

  <g filter="url(#dropShadow)">
    
    <!-- FAR HIND LEG -->
    <path d="M 520 480 C 560 430 630 450 650 510 C 670 570 620 620 560 630 C 530 635 500 610 490 580" 
          fill="#1c540a" stroke="#0d3004" stroke-width="4"/>
    <!-- Far Hind Foot -->
    <path d="M 580 615 L 670 645 M 585 620 L 685 625 M 580 625 L 660 660" 
          stroke="#1c540a" stroke-width="12" stroke-linecap="round"/>

    <!-- FAR FRONT ARM -->
    <path d="M 280 470 C 260 520 250 580 230 630 C 225 642 200 650 180 650" 
          fill="none" stroke="#2c7014" stroke-width="26" stroke-linecap="round"/>
    <!-- Far Front Hand toes -->
    <path d="M 180 650 L 150 655 M 180 650 L 160 665 M 180 650 L 175 640" 
          stroke="#2c7014" stroke-width="8" stroke-linecap="round"/>

    <!-- MAIN BODY / TORSO -->
    <path d="M 340 320 C 420 280 520 310 570 370 C 630 440 640 540 580 600 C 520 650 380 650 310 600 C 280 575 275 520 290 470 C 290 430 300 360 340 320 Z" 
          fill="url(#skinBase)"/>

    <!-- FAR EYE (Bulge behind head) -->
    <circle cx="360" cy="220" r="38" fill="url(#skinBase)"/>
    <ellipse cx="355" cy="215" rx="26" ry="26" fill="url(#eyeIris)"/>
    <ellipse cx="355" cy="215" rx="16" ry="6" fill="#0a0500" transform="rotate(-10 355 215)"/>
    <circle cx="348" cy="205" r="5" fill="#ffffff" opacity="0.8"/>

    <!-- BACK SPOTS / TEXTURE -->
    <g fill="#184707" opacity="0.5">
      <ellipse cx="480" cy="360" rx="24" ry="14" transform="rotate(20 480 360)"/>
      <ellipse cx="540" cy="410" rx="30" ry="18" transform="rotate(-10 540 410)"/>
      <ellipse cx="430" cy="400" rx="16" ry="10"/>
      <ellipse cx="580" cy="480" rx="22" ry="35" transform="rotate(30 580 480)"/>
      <ellipse cx="510" cy="470" rx="18" ry="12"/>
      <ellipse cx="470" cy="530" rx="25" ry="12" transform="rotate(-15 470 530)"/>
    </g>

    <!-- BELLY (Soft Underside) -->
    <path d="M 290 470 C 310 540 350 620 460 620 C 530 620 570 580 570 540 C 510 560 410 550 350 490 C 315 450 300 480 290 470 Z" 
          fill="url(#bellyGrad)"/>

    <!-- UPPER HEAD & UPPER SNOUT (Intentionally short/receded) -->
    <path d="M 320 330 C 310 270 360 210 430 210 C 490 210 520 260 500 320 C 470 340 410 350 330 350 C 300 350 280 340 320 330 Z" 
          fill="url(#skinBase)"/>
    
    <!-- Upper Snout Nose Tip -->
    <path d="M 285 355 C 280 365 290 375 310 375 C 340 375 410 365 450 370 C 470 372 490 380 500 395 C 430 395 350 400 300 388 C 285 384 275 370 285 355 Z" 
          fill="#388c11"/>
    <!-- Nostril -->
    <ellipse cx="305" cy="365" rx="3" ry="6" fill="#143b04" transform="rotate(30 305 365)"/>

    <!-- NEAR EYE (Large, expressive, sitting high) -->
    <g>
      <!-- Eye Socket Ridge -->
      <path d="M 380 240 C 370 170 470 160 500 230 C 510 265 480 290 440 285 C 400 280 385 260 380 240 Z" fill="url(#skinBase)"/>
      <!-- Eyeball Background / Orbit -->
      <circle cx="440" cy="225" r="42" fill="#122b06"/>
      <!-- Iris -->
      <circle cx="438" cy="225" r="38" fill="url(#eyeIris)"/>
      
      <!-- Iris Texture Details -->
      <path d="M 438 225 L 410 200 M 438 225 L 465 200 M 438 225 L 475 230 M 438 225 L 400 235 M 438 225 L 415 250 M 438 225 L 460 250" 
            stroke="#5c2200" stroke-width="2" opacity="0.4"/>

      <!-- Pupil (Horizontal Frog Slit with personality) -->
      <path d="M 400 225 C 415 210 460 210 476 225 C 460 240 415 240 400 225 Z" fill="#0a0400"/>
      <ellipse cx="438" cy="225" rx="20" ry="6" fill="#000000"/>
      
      <!-- Eye Highlights (Gloss) -->
      <circle cx="420" cy="205" r="9" fill="#ffffff" opacity="0.9"/>
      <circle cx="412" cy="217" r="3" fill="#ffffff" opacity="0.6"/>
      <path d="M 425 245 C 440 252 455 250 465 240" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
      
      <!-- Eyelid Overlay -->
      <path d="M 385 215 C 410 180 470 185 495 210 C 470 195 420 195 385 215 Z" fill="#78d431"/>
      <path d="M 390 245 C 420 275 470 265 495 235 C 475 255 425 260 390 245 Z" fill="#2d7a13" opacity="0.8"/>
    </g>

    <!-- MOUTH INTERIOR (Visible due to massive underbite & slightly open jaw) -->
    <path d="M 295 378 C 240 390 180 410 135 425 C 180 445 250 455 330 450 C 410 445 480 430 510 400 C 450 390 350 380 295 378 Z" 
          fill="url(#mouthInside)"/>
    
    <!-- Tongue resting in the huge lower jaw -->
    <path d="M 180 425 C 220 420 270 425 300 435 C 280 445 220 448 180 425 Z" 
          fill="url(#tongueGrad)" opacity="0.9"/>
    <path d="M 340 420 C 390 415 440 420 470 410 C 450 435 390 442 340 420 Z" 
          fill="url(#tongueGrad)" opacity="0.7"/>

    <!-- ========================================================= -->
    <!-- HEAVILY PROTRUDING LOWER JAW (THE HERO FEATURE) -->
    <!-- Extends WAY out to the left (X=90), far past upper snout (X=280) -->
    <!-- ========================================================= -->
    
    <!-- Lower Jaw Main Solid Structure -->
    <path d="M 100 425 
             C 70 430 65 450 90 465 
             C 120 485 180 500 240 515 
             C 300 530 370 535 430 515 
             C 480 500 520 460 530 420
             C 470 450 380 465 290 460
             C 210 455 140 445 100 425 Z" 
          fill="url(#jawGrad)"/>

    <!-- Lower Jaw Front Lip Rim (Exaggerated Shelf/Scoop) -->
    <path d="M 95 425 
             C 140 420 220 425 300 435 
             C 380 445 460 435 525 410
             C 530 418 525 430 500 440
             C 440 460 360 462 280 455
             C 190 448 130 440 90 430
             C 85 425 88 423 95 425 Z" 
          fill="#b0ff42" filter="url(#innerGlow)"/>

    <!-- Massive Chin Underside / Puffed Gular Sac Connection -->
    <path d="M 85 450 
             C 60 460 80 485 110 495 
             C 160 515 220 540 280 560 
             C 340 580 410 575 460 540
             C 410 560 330 550 270 535
             C 200 518 140 500 95 470
             C 80 460 80 452 85 450 Z" 
          fill="url(#bellyGrad)"/>

    <!-- Throat / Dewlap Wrinkles & Texture under Jaw -->
    <g fill="none" stroke="#3d8216" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M 140 485 C 180 510 240 525 290 535"/>
      <path d="M 180 510 C 220 530 270 545 330 550"/>
      <path d="M 240 535 C 280 550 330 560 380 558"/>
    </g>

    <!-- Jaw Highlight Edge (Emphasizing the extreme projection) -->
    <path d="M 90 427 C 130 422 200 425 270 433 C 340 441 430 438 500 418" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- Chin Tip Highlight -->
    <path d="M 75 442 C 70 455 85 468 105 478" 
          fill="none" stroke="#e1ff9e" stroke-width="5" stroke-linecap="round"/>

    <!-- Distinctive bumps/warts on jutting chin for character -->
    <circle cx="115" cy="460" r="4" fill="#72c421"/>
    <circle cx="135" cy="475" r="6" fill="#5ea818"/>
    <circle cx="160" cy="485" r="5" fill="#6bb81c"/>
    <circle cx="200" cy="505" r="7" fill="#529913"/>

    <!-- NEAR FRONT LEG (Resting chunkily on ground) -->
    <!-- Shoulder -->
    <path d="M 320 480 C 330 530 350 580 340 630 C 335 650 310 660 270 660 C 250 660 240 645 260 640 C 280 635 290 620 295 590 C 300 550 285 510 320 480 Z" 
          fill="url(#skinBase)"/>
    <!-- Front Leg Highlight -->
    <path d="M 325 490 C 335 530 348 570 340 620" fill="none" stroke="#a2f542" stroke-width="4" opacity="0.6"/>
    <!-- Front Hand / Toes (Near) -->
    <path d="M 270 655 C 240 655 210 650 190 645 M 270 658 L 210 665 M 270 660 L 230 675" 
          stroke="#429e19" stroke-width="10" stroke-linecap="round"/>
    <!-- Toe Suction Pads -->
    <circle cx="185" cy="645" r="7" fill="#62b828"/>
    <circle cx="205" cy="666" r="7" fill="#62b828"/>
    <circle cx="225" cy="677" r="7" fill="#62b828"/>

    <!-- NEAR HIND LEG (Massive folded thigh) -->
    <!-- Thigh Muscle -->
    <path d="M 500 480 C 560 440 650 460 670 530 C 690 600 620 650 530 640 C 480 635 460 590 490 550 C 520 510 510 490 500 480 Z" 
          fill="url(#skinBase)"/>
    <!-- Thigh Shadow/Fold lines -->
    <path d="M 530 640 C 590 635 640 590 630 530 C 620 480 550 470 500 480" 
          fill="none" stroke="#1b520a" stroke-width="4" opacity="0.7"/>
    <path d="M 510 520 C 560 530 580 570 550 620" 
          fill="none" stroke="#72c421" stroke-width="5" opacity="0.5"/>

    <!-- Near Hind Foot & Webbed Toes extending forward under belly -->
    <g stroke="#378214" stroke-linecap="round" stroke-linejoin="round">
      <!-- Webbing back fill -->
      <path d="M 500 640 L 410 655 L 430 670 L 470 675 Z" fill="#2d6e10" opacity="0.6" stroke="none"/>
      <!-- Toe rays -->
      <path d="M 520 635 L 390 650" stroke-width="14"/>
      <path d="M 510 640 L 410 670" stroke-width="12"/>
      <path d="M 515 645 L 450 685" stroke-width="10"/>
    </g>
    <!-- Toe Pads -->
    <circle cx="385" cy="650" r="8" fill="#6ec227"/>
    <circle cx="405" cy="671" r="7" fill="#6ec227"/>
    <circle cx="445" cy="687" r="6" fill="#6ec227"/>

  </g>

  <!-- HIGHLIGHT SPECULAR DOTS (Gives slimy frog skin look) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="315" cy="340" r="3"/>
    <circle cx="325" cy="345" r="1.5"/>
    <circle cx="300" cy="370" r="2"/>
    <circle cx="470" cy="345" r="4"/>
    <circle cx="485" cy="355" r="2"/>
    <circle cx="530" cy="385" r="3"/>
    <circle cx="130" cy="440" r="3"/>
    <circle cx="170" cy="450" r="2"/>
    <circle cx="220" cy="460" r="3.5"/>
    <circle cx="530" cy="480" r="4"/>
    <circle cx="550" cy="500" r="2.5"/>
  </g>
</svg>