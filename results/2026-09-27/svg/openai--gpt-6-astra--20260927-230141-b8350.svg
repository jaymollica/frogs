<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">Frog with a spectacular underbite</title>
  <desc id="desc">A cheerful green frog sitting on a lily pad, with a huge rounded lower jaw jutting far beyond its upper lip.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#a7dc63"/>
      <stop offset="1" stop-color="#42996a"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#d6ed93"/>
      <stop offset="1" stop-color="#92c66f"/>
    </linearGradient>
    <radialGradient id="bg">
      <stop stop-color="#f7f9dc"/>
      <stop offset="1" stop-color="#d8eee5"/>
    </radialGradient>
  </defs>

  <rect width="640" height="560" rx="32" fill="url(#bg)"/>
  <g fill="none" stroke="#a5d3cb" stroke-width="3" opacity=".65">
    <ellipse cx="322" cy="468" rx="261" ry="43"/>
    <path d="M65 493c89 34 411 34 513-6M79 429c-24 6-39 14-43 22"/>
  </g>
  <path d="M87 456c-2-42 93-69 223-64 116-22 228 13 245 57 13 40-145 65-252 40l-48-37-11 40C147 495 89 480 87 456Z" fill="#68b58c" stroke="#347c66" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#41916e" stroke-width="3" opacity=".65">
    <path d="m255 452-112-9m112 9 113-39m-113 39 225 5m-225-5 153 31"/>
  </g>
  <ellipse cx="327" cy="449" rx="174" ry="24" fill="#276e5b" opacity=".2"/>

  <g stroke="#254f40" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Squat body and folded hind leg -->
    <path d="M322 239c-81-27-164 15-181 96-13 60 31 101 122 104 74 3 144-34 141-93-2-46-37-87-82-107Z" fill="url(#skin)"/>
    <path d="M225 330c-57-39-111-1-102 55 4 29 37 44 85 43l47-21c-13-21-41-31-66-21" fill="#65af68"/>
    <path d="M190 419c-18 7-32 18-49 21-20 4-34 1-40 9-6 9 20 15 37 13-8 8-9 15 4 15 19-1 42-15 57-17-2 13 6 16 16 9l42-35" fill="#89c777"/>

    <!-- Far foreleg -->
    <path d="M384 358c14 32 14 59 9 78l-18 14c-8 8 3 15 18 6 2 13 15 11 19-1 14 10 25 3 16-8l-17-14 4-75" fill="#65ad6d"/>

    <!-- Raised eyes and upper head -->
    <path d="M251 272c-30-24-24-65 5-82-7-48 6-87 43-90 34-4 54 29 49 64l22 3c-6-43 12-76 45-75 35 1 53 39 39 81 24 15 32 41 40 63 7 20-3 35-25 42l-94 28Z" fill="url(#skin)"/>

    <path d="M267 160c-7-28 4-49 23-49 22-1 36 23 28 49Z" fill="#f5edb3" stroke-width="4"/>
    <path d="M383 156c-6-27 5-52 26-52 23 0 36 25 27 54Z" fill="#f5edb3" stroke-width="4"/>
    <ellipse cx="299" cy="141" rx="9" ry="19" fill="#203d32" stroke="none"/>
    <ellipse cx="419" cy="137" rx="10" ry="21" fill="#203d32" stroke="none"/>
    <circle cx="302" cy="133" r="4" fill="white" stroke="none"/>
    <circle cx="422" cy="129" r="4" fill="white" stroke="none"/>

    <!-- Open mouth: upper lip sits well behind the projecting lower lip -->
    <path d="M289 273c56 15 119 13 181-7l22-15c-1 29 16 41 44 44-41 51-158 64-229 11Z" fill="#493a38"/>
    <path d="M385 312c30-25 68-27 91-12 7 5 12 10 13 16-31 15-74 18-104-4Z" fill="#d38479" stroke="none"/>

    <!-- Massive, forward-projecting lower jaw -->
    <path d="M287 280c28 30 76 38 122 36 49-2 87-20 111-32 21-11 40-4 43 11 6 28-12 65-38 85-30 25-78 35-123 31-60-4-105-30-120-67-9-21-10-45 5-64Z" fill="url(#jaw)"/>
    <path d="M300 293c34 30 81 36 127 30 46-5 85-24 112-29" fill="none" stroke-width="5"/>
    <path d="M420 389c46 3 82-10 103-30" fill="none" stroke="#78ad64" stroke-width="5"/>
    <path d="M500 330c13-4 23-9 31-16" fill="none" stroke="#ecf4b7" stroke-width="8"/>

    <!-- Near foreleg -->
    <path d="M310 355c-7 27-10 59-1 82l-16 15c-11 10-1 17 14 7-4 16 9 21 17 6 9 13 23 9 19-2 16 4 24-5 10-14l-18-14c4-15 11-29 16-39" fill="url(#skin)"/>

    <path d="M461 229l5 2" fill="none" stroke-width="7"/>
    <path d="M325 242c6 5 13 5 18 1" fill="none" stroke="#4c8c57" stroke-width="4"/>
  </g>

  <g fill="#39895c" opacity=".5">
    <ellipse cx="213" cy="282" rx="13" ry="8" transform="rotate(-29 213 282)"/>
    <ellipse cx="191" cy="306" rx="8" ry="6" transform="rotate(-29 191 306)"/>
    <ellipse cx="241" cy="264" rx="7" ry="5"/>
    <ellipse cx="154" cy="366" rx="10" ry="7" transform="rotate(-30 154 366)"/>
    <ellipse cx="173" cy="346" rx="7" ry="5"/>
    <ellipse cx="277" cy="213" rx="9" ry="6"/>
    <ellipse cx="294" cy="223" rx="5" ry="4"/>
  </g>
  <ellipse cx="434" cy="253" rx="18" ry="9" fill="#b9d97c" opacity=".8"/>
  <g fill="#f8ffed" opacity=".8">
    <circle cx="105" cy="189" r="5"/>
    <circle cx="527" cy="146" r="7"/>
    <circle cx="548" cy="168" r="3"/>
  </g>
</svg>