<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#cdeba1"/>

  <!-- Lily pad -->
  <ellipse cx="200" cy="365" rx="150" ry="35" fill="#4a8f3c"/>
  <path d="M200 365 L290 350" stroke="#2e6b22" stroke-width="4" fill="none"/>

  <!-- Body -->
  <ellipse cx="200" cy="280" rx="110" ry="95" fill="#5cb85c"/>

  <!-- Legs -->
  <path d="M110 320 Q 70 370 100 380 Q 130 390 150 340 Z" fill="#4eae4e"/>
  <path d="M290 320 Q 330 370 300 380 Q 270 390 250 340 Z" fill="#4eae4e"/>
  <ellipse cx="100" cy="382" rx="28" ry="10" fill="#3f8f3f"/>
  <ellipse cx="300" cy="382" rx="28" ry="10" fill="#3f8f3f"/>

  <!-- Arms -->
  <path d="M130 250 Q 90 290 110 310" stroke="#4eae4e" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M270 250 Q 310 290 290 310" stroke="#4eae4e" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Belly -->
  <ellipse cx="200" cy="300" rx="65" ry="55" fill="#b8e6a0"/>

  <!-- Head -->
  <path d="M120 180 Q 200 90 280 180 Q 285 220 200 225 Q 115 220 120 180 Z" fill="#5cb85c"/>

  <!-- Eye bumps -->
  <circle cx="155" cy="100" r="38" fill="#5cb85c"/>
  <circle cx="245" cy="100" r="38" fill="#5cb85c"/>
  <circle cx="155" cy="100" r="24" fill="#f5f0dc"/>
  <circle cx="245" cy="100" r="24" fill="#f5f0dc"/>
  <circle cx="160" cy="100" r="11" fill="#1b1b1b"/>
  <circle cx="250" cy="100" r="11" fill="#1b1b1b"/>
  <circle cx="164" cy="96" r="4" fill="#ffffff"/>
  <circle cx="254" cy="96" r="4" fill="#ffffff"/>

  <!-- Habsburg jaw: dramatic protruding underbite -->
  <path d="M150 215 Q 140 260 165 285 Q 200 305 235 285 Q 260 260 250 215 Q 245 235 200 245 Q 155 235 150 215 Z" fill="#4eae4e"/>
  <!-- Upper jaw tucked behind -->
  <path d="M155 215 Q 200 230 245 215 Q 240 205 200 208 Q 160 205 155 215 Z" fill="#5cb85c"/>

  <!-- Protruding lower teeth jutting outward -->
  <g fill="#fdfdf5" stroke="#d8d4b8" stroke-width="1.5">
    <rect x="170" y="248" width="14" height="30" rx="3" transform="rotate(-12 177 263)"/>
    <rect x="188" y="252" width="14" height="34" rx="3" transform="rotate(-4 195 269)"/>
    <rect x="206" y="252" width="14" height="34" rx="3" transform="rotate(4 213 269)"/>
    <rect x="224" y="248" width="14" height="30" rx="3" transform="rotate(12 231 263)"/>
  </g>

  <!-- Overlapping upper lip receding behind underbite -->
  <path d="M165 210 Q 200 226 235 210 Q 233 222 226 232 Q 200 243 174 232 Q 167 222 165 210 Z" fill="#4eae4e" opacity="0.9"/>

  <!-- Nostrils -->
  <circle cx="185" cy="200" r="4" fill="#2e5b2e"/>
  <circle cx="215" cy="200" r="4" fill="#2e5b2e"/>

  <!-- Mouth corners (dour Habsburg frown) -->
  <path d="M150 220 Q 140 230 148 245" stroke="#2e5b2e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M250 220 Q 260 230 252 245" stroke="#2e5b2e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Royal scepter -->
  <line x1="315" y1="255" x2="365" y2="180" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
  <circle cx="365" cy="176" r="12" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>

  <!-- Imperial crown -->
  <g>
    <path d="M155 55 L 165 25 L 180 48 L 200 18 L 220 48 L 235 25 L 245 55 Z" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>
    <rect x="150" y="52" width="100" height="10" rx="4" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>
    <circle cx="200" cy="18" r="5" fill="#e63946"/>
    <circle cx="180" cy="46" r="4" fill="#4361ee"/>
    <circle cx="220" cy="46" r="4" fill="#4361ee"/>
  </g>

  <!-- Spots -->
  <circle cx="130" cy="230" r="7" fill="#449944"/>
  <circle cx="275" cy="235" r="7" fill="#449944"/>
  <circle cx="105" cy="290" r="8" fill="#449944"/>
  <circle cx="295" cy="295" r="8" fill="#449944"/>
</svg>