<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#2E7D32" />
    </radialGradient>
    <radialGradient id="jawGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#AED581" />
      <stop offset="100%" stop-color="#558B2F" />
    </radialGradient>
    <radialGradient id="throatGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FFB300" />
    </radialGradient>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Background -->
    <circle cx="300" cy="350" r="260" fill="#F1F8E9" />
    <circle cx="300" cy="350" r="260" stroke="#AED581" stroke-width="4" fill="none" />

    <!-- Back Legs -->
    <path d="M 200,380 Q 80,430 100,540 Q 120,580 180,550 Q 240,480 260,400 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />
    <path d="M 400,380 Q 520,430 500,540 Q 480,580 420,550 Q 360,480 340,400 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />
    
    <!-- Back Leg Toes -->
    <circle cx="100" cy="540" r="15" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="80" cy="520" r="12" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="90" cy="500" r="10" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    
    <circle cx="500" cy="540" r="15" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="520" cy="520" r="12" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="510" cy="500" r="10" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />

    <!-- Front Legs -->
    <path d="M 220,420 Q 140,490 170,550 Q 210,580 250,510 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />
    <path d="M 380,420 Q 460,490 430,550 Q 390,580 350,510 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4" />
    
    <!-- Front Leg Toes -->
    <circle cx="170" cy="550" r="10" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="155" cy="535" r="8" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="150" cy="520" r="8" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    
    <circle cx="430" cy="550" r="10" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="445" cy="535" r="8" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />
    <circle cx="450" cy="520" r="8" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" />

    <!-- Body -->
    <ellipse cx="300" cy="360" rx="160" ry="140" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="5" />

    <!-- Upper Jaw (Snout) -->
    <path d="M 120,240 C 140,140 260,100 300,100 C 340,100 460,140 480,240 C 460,280 380,300 300,300 C 220,300 140,280 120,240 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="5" />

    <!-- Lower Jaw (Heavily Protruding) -->
    <path d="M 120,240 C 20,420 120,580 300,580 C 480,580 580,420 480,240 C 440,280 380,300 300,300 C 220,300 180,280 120,240 Z" fill="url(#jawGrad)" stroke="#1B5E20" stroke-width="5" />

    <!-- Throat / Belly Patch (Inside Lower Jaw) -->
    <path d="M 180,300 C 160,420 220,520 300,520 C 380,520 440,420 420,300 C 380,340 220,340 180,300 Z" fill="url(#throatGrad)" stroke="#1B5E20" stroke-width="4" />

    <!-- Throat Texture -->
    <ellipse cx="300" cy="420" rx="40" ry="20" fill="#FFCA28" opacity="0.5" />
    <ellipse cx="240" cy="440" rx="30" ry="15" fill="#FFCA28" opacity="0.5" />
    <ellipse cx="360" cy="440" rx="30" ry="15" fill="#FFCA28" opacity="0.5" />

    <!-- Mouth Line -->
    <path d="M 120,240 C 180,280 220,300 300,300 C 380,300 420,280 480,240" stroke="#1B5E20" stroke-width="8" fill="none" stroke-linecap="round" />

    <!-- Nostrils -->
    <circle cx="240" cy="220" r="6" fill="#1B5E20" />
    <circle cx="360" cy="220" r="6" fill="#1B5E20" />

    <!-- Spots / Texture -->
    <circle cx="200" cy="400" r="15" fill="#1B5E20" opacity="0.3" />
    <circle cx="400" cy="450" r="20" fill="#1B5E20" opacity="0.3" />
    <circle cx="300" cy="500" r="12" fill="#1B5E20" opacity="0.3" />
    <circle cx="250" cy="360" r="18" fill="#1B5E20" opacity="0.3" />
    <circle cx="350" cy="380" r="14" fill="#1B5E20" opacity="0.3" />
    <circle cx="160" cy="320" r="10" fill="#1B5E20" opacity="0.3" />
    <circle cx="440" cy="320" r="10" fill="#1B5E20" opacity="0.3" />
    <circle cx="300" cy="160" r="10" fill="#1B5E20" opacity="0.2" />
    <circle cx="200" cy="260" r="8" fill="#1B5E20" opacity="0.2" />
    <circle cx="400" cy="260" r="8" fill="#1B5E20" opacity="0.2" />

    <!-- Eyes (Bulging) -->
    <!-- Left Eye Bump -->
    <circle cx="200" cy="120" r="45" fill="#A5D6A7" stroke="#1B5E20" stroke-width="6" />
    <!-- Right Eye Bump -->
    <circle cx="400" cy="120" r="45" fill="#A5D6A7" stroke="#1B5E20" stroke-width="6" />
    
    <!-- Left Eye Iris & Pupil -->
    <circle cx="200" cy="120" r="25" fill="#FFCA28" />
    <circle cx="200" cy="120" r="14" fill="#1B5E20" />
    <circle cx="195" cy="115" r="5" fill="#FFFFFF" />
    
    <!-- Right Eye Iris & Pupil -->
    <circle cx="400" cy="120" r="25" fill="#FFCA28" />
    <circle cx="400" cy="120" r="14" fill="#1B5E20" />
    <circle cx="395" cy="115" r="5" fill="#FFFFFF" />

    <!-- Eye Highlights -->
    <circle cx="185" cy="105" r="8" fill="#FFFFFF" opacity="0.4" />
    <circle cx="385" cy="105" r="8" fill="#FFFFFF" opacity="0.4" />

    <!-- Expressive Brows -->
    <path d="M 150,90 Q 200,70 250,90" stroke="#1B5E20" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M 350,90 Q 400,70 450,90" stroke="#1B5E20" stroke-width="8" fill="none" stroke-linecap="round" />

    <!-- Jaw Highlights for Depth -->
    <path d="M 160,280 C 120,380 160,520 280,520" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2" />
    <path d="M 440,280 C 480,380 440,520 320,520" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2" />
    
    <!-- Body Highlight -->
    <ellipse cx="260" cy="280" rx="60" ry="40" fill="#FFFFFF" opacity="0.15" transform="rotate(-20 260 280)" />
  </g>
</svg>