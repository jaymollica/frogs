<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="lilypad-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Gradient for the body -->
    <radialGradient id="bodyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </radialGradient>
    
    <!-- Gradient for the jaw -->
    <radialGradient id="jawGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DCE775"/>
      <stop offset="100%" stop-color="#8BC34A"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#E0F7FA" />

  <!-- Water surface -->
  <rect x="0" y="470" width="500" height="30" fill="#4FC3F7" />

  <!-- Bubbles / Ambiance -->
  <circle cx="80" cy="120" r="30" fill="#B3E5FC" opacity="0.6" />
  <circle cx="420" cy="90" r="45" fill="#B3E5FC" opacity="0.6" />
  <circle cx="460" cy="200" r="20" fill="#B3E5FC" opacity="0.6" />
  <circle cx="60" cy="250" r="15" fill="#B3E5FC" opacity="0.6" />

  <!-- Lilypad -->
  <g filter="url(#lilypad-shadow)">
    <ellipse cx="260" cy="480" rx="160" ry="30" fill="#2E7D32" />
    <!-- Lilypad slit / wedge -->
    <path d="M 120 480 L 180 460 L 260 480" stroke="#4FC3F7" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M 120 480 L 180 460 L 260 480" stroke="#E0F7FA" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- FROG CHARACTER -->
  <g filter="url(#shadow)">
    <!-- Back Leg (Thigh & Calf) -->
    <path d="M 340 400 C 380 360, 440 380, 450 430 C 460 480, 410 480, 370 460 Z" fill="#4CAF50" stroke="#33691E" stroke-width="4" stroke-linejoin="round" />
    <!-- Back Foot (Webbed) -->
    <path d="M 440 440 L 480 430 L 490 450 L 470 460 L 480 470 L 460 460 Z" fill="#4CAF50" stroke="#33691E" stroke-width="4" stroke-linejoin="round" />

    <!-- Front Leg (Background) -->
    <path d="M 220 450 L 180 480 L 150 470" stroke="#388E3C" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 150 470 L 130 480 M 150 470 L 140 490 M 150 470 L 160 485" stroke="#388E3C" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Main Body & Belly -->
    <path d="M 160 230 C 200 210, 260 220, 320 260 C 350 280, 380 320, 380 370 C 380 440, 300 480, 200 480 C 120 480, 80 440, 60 400 C 40 360, 40 320, 60 290 C 80 260, 120 240, 160 230 Z" fill="url(#bodyGrad)" stroke="#33691E" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Light Colored Belly (Behind Jaw) -->
    <path d="M 160 300 C 140 360, 160 420, 220 440 C 280 460, 340 440, 360 390 C 370 350, 340 310, 300 290 Z" fill="#C5E1A5" opacity="0.8" />

    <!-- Mouth Interior (Dark background behind teeth) -->
    <path d="M 60 280 Q 180 320 330 280 L 300 240 L 225 200 L 150 230 Z" fill="#1B5E20" />

    <!-- HEAVILY PROTRUDING LOWER JAW -->
    <path d="M 60 280 C 30 300, 20 360, 40 420 C 80 490, 220 500, 290 460 C 340 430, 360 380, 340 330 C 320 300, 280 280, 330 280 Z" fill="url(#jawGrad)" stroke="#33691E" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Jaw Shading (Under-jaw shadow for depth) -->
    <path d="M 40 420 C 80 480, 200 490, 280 460 C 340 430, 360 380, 340 340 C 330 360, 280 440, 150 420 C 100 410, 50 390, 40 420 Z" fill="#7CB342" opacity="0.6" />

    <!-- Lower Jaw Teeth (Massive underbite teeth) -->
    <path d="M 60 280 L 75 250 L 90 270 L 105 240 L 120 260 L 135 230 L 150 250 L 165 220 L 180 240 L 195 210 L 210 230 L 225 200 L 240 220 L 255 210 L 270 230 L 285 220 L 300 240 L 315 260 L 330 280 Z" fill="#FFF9C4" stroke="#33691E" stroke-width="3" stroke-linejoin="round" />

    <!-- Upper Lip / Snout (Receding upper jaw) -->
    <path d="M 60 280 C 100 290, 200 300, 330 280 C 310 260, 250 245, 200 255 C 140 265, 90 260, 60 280 Z" fill="#66BB6A" stroke="#33691E" stroke-width="4" stroke-linejoin="round" />

    <!-- Nostril -->
    <circle cx="80" cy="265" r="6" fill="#33691E" />

    <!-- Background Eye -->
    <circle cx="100" cy="230" r="25" fill="#4CAF50" stroke="#33691E" stroke-width="4" />
    <circle cx="100" cy="225" r="15" fill="white" stroke="#33691E" stroke-width="2" />
    <ellipse cx="93" cy="222" rx="6" ry="10" fill="black" />

    <!-- Foreground Eye (Bulging) -->
    <ellipse cx="150" cy="225" rx="45" ry="35" fill="#81C784" stroke="#33691E" stroke-width="4" />
    <!-- Eyeball -->
    <circle cx="150" cy="220" r="28" fill="white" stroke="#33691E" stroke-width="3" />
    <!-- Pupil -->
    <ellipse cx="140" cy="215" rx="12" ry="18" fill="black" />
    <!-- Highlight -->
    <circle cx="135" cy="208" r="6" fill="white" />
    
    <!-- Angry/Determined Brow -->
    <path d="M 110 195 L 185 210" stroke="#33691E" stroke-width="12" stroke-linecap="round" />

    <!-- Frog Body Spots / Texture -->
    <g fill="#388E3C" opacity="0.4">
      <circle cx="300" cy="320" r="18" />
      <circle cx="340" cy="370" r="24" />
      <circle cx="260" cy="420" r="12" />
      <circle cx="360" cy="280" r="10" />
      <circle cx="220" cy="350" r="14" />
      <circle cx="280" cy="260" r="8" />
      <circle cx="370" cy="430" r="15" />
    </g>
  </g>
</svg>