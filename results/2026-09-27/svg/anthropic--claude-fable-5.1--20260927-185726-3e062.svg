  <ellipse cx="180" cy="222" rx="88" ry="38" fill="#c5e1a5"/>
  <circle cx="130" cy="165" r="9" fill="#388e3c"/>
  <circle cx="165" cy="150" r="6" fill="#388e3c"/>
