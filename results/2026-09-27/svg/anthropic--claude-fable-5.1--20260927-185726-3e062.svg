  <!-- chin shading -->
  <path d="M310 175 Q340 178 358 168" fill="none" stroke="#388e3c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- nostril -->
  <circle cx="311" cy="122" r="3.5" fill="#2e7d32"/>
  <!-- far eye -->
  <circle cx="238" cy="92" r="16" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="240" cy="92" r="9" fill="#fff"/>
  <circle cx="242" cy="93" r="4" fill="#111"/>
  <!-- near eye -->
  <circle cx="274" cy="90" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="276" cy="90" r="17" fill="#fff"/>
  <ellipse cx="280" cy="91" rx="8" ry="10" fill="#111"/>
  <circle cx="283" cy="86" r="3" fill="#fff"/>
  <!-- droopy eyelid -->
  <path d="M256 78 Q276 66 296 80" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
