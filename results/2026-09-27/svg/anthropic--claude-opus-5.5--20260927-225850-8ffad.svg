  <!-- chin highlight -->
  <path d="M130 262 Q200 285 270 262" fill="none" stroke="#9ad67f" stroke-width="4" stroke-linecap="round"/>
  <!-- front legs -->
  <path d="M140 300 Q130 335 115 350" stroke="#4e9a3a" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M260 300 Q270 335 285 350" stroke="#4e9a3a" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="105" cy="354" r="6" fill="#3d7d2c"/>
  <circle cx="118" cy="358" r="6" fill="#3d7d2c"/>
  <circle cx="282" cy="358" r="6" fill="#3d7d2c"/>
  <circle cx="295" cy="354" r="6" fill="#3d7d2c"/>
  <!-- spots -->
