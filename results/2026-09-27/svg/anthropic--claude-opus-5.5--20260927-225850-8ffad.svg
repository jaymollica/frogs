  <path d="M350 345 l20 10 M350 345 l15 -5 M350 345 l5 15" stroke="#3d7d2c" stroke-width="7" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="200" cy="270" rx="120" ry="80" fill="#5cb044"/>
  <ellipse cx="200" cy="295" rx="75" ry="45" fill="#cfe8a8"/>
