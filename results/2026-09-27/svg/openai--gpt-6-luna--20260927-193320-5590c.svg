<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">Frog with a Habsburg jaw</title>
  <desc id="desc">A cheerful green frog in profile with an exaggerated, jutting lower jaw.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9ce36b"/>
      <stop offset="1" stop-color="#4da846"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#88d75b"/>
      <stop offset="1" stop-color="#3d9846"/>
    </linearGradient>
    <radialGradient id="iris">
      <stop offset="0" stop-color="#f6d76d"/>
      <stop offset="1" stop-color="#d58a31"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#285e4c" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="640" height="440" rx="30" fill="#eaf7e9"/>
  <circle cx="320" cy="220" r="178" fill="#d8efcf"/>
  <path d="M88 386c95 17 310 17 433-2" fill="none" stroke="#b2d6ad" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)" stroke="#347d43" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Body and folded hind leg -->
    <path d="M174 271c-55-12-99 14-108 57-8 39 25 69 70 72 45 4 82-23 92-60l-13-48z" fill="url(#skin)"/>
    <path d="M112 349c-24 5-39 21-40 39 18 10 43 11 63 4 17-6 29-17 31-31-15-10-34-15-54-12z" fill="#63bb50"/>
    <path d="M162 319c-19 15-28 34-25 52 25 3 48-7 62-24" fill="none" stroke="#347d43" stroke-width="4"/>
    <path d="M180 285c26-24 57-29 82-16 21 11 31 31 27 51-5 20-25 32-49 29-21-3-36-18-39-37" fill="#68c455"/>

    <!-- Head -->
    <path d="M126 245c-9-41 7-82 43-108 35-25 87-29 132-11 24-18 59-13 77 7 10 11 15 23 15 35 39 13 70 34 84 59-23 23-73 35-134 38-75 4-151 14-217-20z" fill="url(#skin)"/>

    <!-- Eye stalks and eyes -->
    <path d="M210 150c-8-24 5-47 27-51 23-5 43 12 43 36l-3 30z" fill="#83d45e"/>
    <circle cx="239" cy="132" r="29" fill="#a4e875"/>
    <circle cx="241" cy="132" r="20" fill="url(#iris)" stroke="#347d43" stroke-width="3"/>
    <ellipse cx="248" cy="132" rx="8" ry="13" fill="#172c27" stroke="none"/>
    <circle cx="251" cy="125" r="4" fill="#fff7d7" stroke="none"/>

    <path d="M319 151c-6-31 11-58 41-61 29-3 51 19 47 50l-7 33z" fill="#83d45e"/>
    <circle cx="361" cy="137" r="38" fill="#a4e875"/>
    <circle cx="364" cy="137" r="27" fill="url(#iris)" stroke="#347d43" stroke-width="3"/>
    <ellipse cx="374" cy="137" rx="11" ry="17" fill="#172c27" stroke="none"/>
    <circle cx="379" cy="128" r="6" fill="#fff7d7" stroke="none"/>

    <!-- Oversized prognathic lower jaw -->
    <path d="M139 244c78 5 204 10 323-17 19 13 32 36 35 62 3 28-16 48-48 57-72 20-185-10-262-43-30-13-48-33-48-59z" fill="url(#jaw)"/>
    <path d="M141 244c84 5 205 9 321-17" fill="none" stroke="#285d3b" stroke-width="6"/>
    <path d="M201 295c72 28 162 47 234 43" fill="none" stroke="#b4eb79" stroke-width="5" opacity=".75"/>
  </g>

  <!-- Face details -->
  <path d="M447 210c3-5 10-6 14-2" fill="none" stroke="#347d43" stroke-width="4" stroke-linecap="round"/>
  <circle cx="457" cy="211" r="3" fill="#285d3b"/>
  <path d="M470 257c8 3 14 8 18 14" fill="none" stroke="#d3f29a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="182" cy="211" r="5" fill="#c0ef82" opacity=".9"/>
  <circle cx="207" cy="228" r="4" fill="#c0ef82" opacity=".9"/>
  <circle cx="174" cy="259" r="4" fill="#c0ef82" opacity=".9"/>
</svg>