<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skin" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#a8e063"/>
      <stop offset="55%" stop-color="#56ab2f"/>
      <stop offset="100%" stop-color="#2f7a3d"/>
    </radialGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fbf44"/>
      <stop offset="100%" stop-color="#2e6b34"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9e8d2"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1c4d22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="462" rx="150" ry="26" fill="#1c4d22" opacity="0.18"/>

  <g filter="url(#soft)">
    <!-- eye stalks -->
    <circle cx="164" cy="126" r="64" fill="url(#skin)" stroke="#2f6b3a" stroke-width="8"/>
    <circle cx="348" cy="126" r="64" fill="url(#skin)" stroke="#2f6b3a" stroke-width="8"/>
    <circle cx="164" cy="118" r="39" fill="url(#eye)" stroke="#2f6b3a" stroke-width="5"/>
    <circle cx="348" cy="118" r="39" fill="url(#eye)" stroke="#2f6b3a" stroke-width="5"/>
    <circle cx="172" cy="124" r="13" fill="#172417"/>
    <circle cx="340" cy="124" r="13" fill="#172417"/>
    <circle cx="167" cy="119" r="4" fill="#fff"/>
    <circle cx="335" cy="119" r="4" fill="#fff"/>

    <!-- head -->
    <path d="M92 250 C92 160 166 92 256 92 C346 92 420 160 420 250 C420 342 350 404 256 404 C162 404 92 342 92 250 Z" fill="url(#skin)" stroke="#2f6b3a" stroke-width="9"/>

    <!-- spots -->
    <circle cx="139" cy="219" r="10" fill="#2f6b3a" opacity="0.28"/>
    <circle cx="376" cy="238" r="13" fill="#2f6b3a" opacity="0.25"/>
    <circle cx="211" cy="153" r="7" fill="#2f6b3a" opacity="0.22"/>
    <circle cx="306" cy="151" r="8" fill="#2f6b3a" opacity="0.22"/>

    <!-- nostrils -->
    <ellipse cx="232" cy="226" rx="8" ry="12" fill="#24512b" transform="rotate(-12 232 226)"/>
    <ellipse cx="280" cy="226" rx="8" ry="12" fill="#24512b" transform="rotate(12 280 226)"/>

    <!-- blush -->
    <ellipse cx="154" cy="292" rx="28" ry="17" fill="#ff9aa2" opacity="0.55"/>
    <ellipse cx="358" cy="292" rx="28" ry="17" fill="#ff9aa2" opacity="0.55"/>

    <!-- Habsburg underbite: jutting lower jaw and chin -->
    <path d="M104 318 C126 408 184 470 256 470 C328 470 386 408 408 318 C365 366 315 388 256 388 C197 388 147 366 104 318 Z" fill="url(#jaw)" stroke="#2f6b3a" stroke-width="9"/>
    <path d="M174 386 C205 438 307 438 338 386 C312 414 200 414 174 386 Z" fill="#8ed081" opacity="0.55"/>
    <ellipse cx="256" cy="430" rx="78" ry="34" fill="#4d9b3f" stroke="#2f6b3a" stroke-width="7"/>
    <path d="M256 398 C246 418 246 442 256 462 C266 442 266 418 256 398 Z" fill="#2f6b3a" opacity="0.35"/>

    <!-- mouth: upper lip behind, lower jaw protrudes in front -->
    <path d="M146 300 C190 332 322 332 366 300" fill="none" stroke="#24512b" stroke-width="10" stroke-linecap="round"/>
    <path d="M164 326 C205 352 307 352 348 326 C326 384 286 404 256 404 C226 404 186 384 164 326 Z" fill="#7a3b3b" stroke="#24512b" stroke-width="7"/>
    <!-- buck teeth pushed forward by the underbite -->
    <path d="M238 337 C238 326 250 326 250 337 L250 366 C250 374 238 374 238 366 Z" fill="#fffbe8" stroke="#b8a77a" stroke-width="3"/>
    <path d="M262 337 C262 326 274 326 274 337 L274 366 C274 374 262 374 262 366 Z" fill="#fffbe8" stroke="#b8a77a" stroke-width="3"/>

    <!-- feet -->
    <path d="M132 430 C104 442 92 462 104 478 C126 492 164 482 184 462 C170 444 152 434 132 430 Z" fill="url(#skin)" stroke="#2f6b3a" stroke-width="8"/>
    <path d="M380 430 C408 442 420 462 408 478 C386 492 348 482 328 462 C342 444 360 434 380 430 Z" fill="url(#skin)" stroke="#2f6b3a" stroke-width="8"/>
    <g stroke="#2f6b3a" stroke-width="5" stroke-linecap="round">
      <path d="M118 470 L104 486"/>
      <path d="M140 478 L134 494"/>
      <path d="M394 470 L408 486"/>
      <path d="M372 478 L378 494"/>
    </g>
  </g>
</svg>