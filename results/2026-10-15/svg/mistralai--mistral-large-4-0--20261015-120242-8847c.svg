  <ellipse cx="290" cy="325" rx="9" ry="6" fill="#2e7d32" opacity="0.12"/>

  <!-- little arm resting on jaw -->
  <ellipse cx="308" cy="366" rx="32" ry="19" fill="#5cb85c" stroke="#2e7d32" stroke-width="5" transform="rotate(-12 308 366)"/>

  <!-- eye -->
  <circle cx="186" cy="96" r="25" fill="#ffffff"/>
