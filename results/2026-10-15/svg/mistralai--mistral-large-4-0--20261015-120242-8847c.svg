  <ellipse cx="132" cy="182" rx="8" ry="5" fill="#2e7d32" opacity="0.15"/>

  <!-- heavily protruding lower jaw -->
  <path d="M 330 248 C 368 250 408 262 426 288 C 442 312 434 346 400 360 C 358 376 284 374 232 360 C 192 349 162 332 150 310 C 141 292 150 270 168 262 C 214 244 282 242 330 248 Z"
