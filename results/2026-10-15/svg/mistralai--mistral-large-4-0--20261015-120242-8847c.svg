  <path d="M 348 260 C 374 266 398 278 410 294" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 318 272 C 282 283 236 287 196 283" fill="none" stroke="#2e7d32" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
