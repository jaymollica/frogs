  <circle cx="145" cy="95" r="30" fill="#5cb54c" stroke="#2d6b26" stroke-width="4"/>
  <circle cx="255" cy="95" r="30" fill="#5cb54c" stroke="#2d6b26" stroke-width="4"/>
  <circle cx="145" cy="95" r="20" fill="#fff8d0" stroke="#2d6b26" stroke-width="2"/>
  <circle cx="255" cy="95" r="20" fill="#fff8d0" stroke="#2d6b26" stroke-width="2"/>
  <circle cx="150" cy="98" r="10" fill="#111"/>
  <circle cx="250" cy="98" r="10" fill="#111"/>
  <circle cx="153" cy="94" r="3" fill="#fff"/>
  <circle cx="253" cy="94" r="3" fill="#fff"/>
  <!-- nostrils -->
  <circle cx="185" cy="140" r="3" fill="#2d6b26"/>
  <circle cx="215" cy="140" r="3" fill="#2d6b26"/>
  <!-- protruding lower jaw -->
  <path d="M120 182 Q200 200 280 182 L295 205 Q310 235 290 255 Q200 285 110 255 Q90 235 105 205 Z" fill="#6fc45c" stroke="#2d6b26" stroke-width="4"/>
  <path d="M125 200 Q200 218 275 200" fill="none" stroke="#2d6b26" stroke-width="3"/>
  <!-- lower teeth/lip -->
  <path d="M135 205 Q200 222 265 205 L260 215 Q200 232 140 215 Z" fill="#e8f5c8" stroke="#2d6b26" stroke-width="2"/>
  <!-- upper lip line -->
  <path d="M120 182 Q200 172 280 182" fill="none" stroke="#2d6b26" stroke-width="4" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="135" cy="165" r="9" fill="#f29a9a" opacity="0.7"/>
  <circle cx="265" cy="165" r="9" fill="#f29a9a" opacity="0.7"/>
  <!-- front arms -->
  <path d="M150 285 Q170 305 195 300" fill="none" stroke="#2d6b26" stroke-width="8" stroke-linecap="round"/>
  <path d="M250 285 Q230 305 205 300" fill="none" stroke="#2d6b26" stroke-width="8" stroke-linecap="round"/>
