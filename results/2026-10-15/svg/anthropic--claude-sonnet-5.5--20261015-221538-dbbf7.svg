<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <rect width="400" height="350" fill="#d9f0e3"/>
  <ellipse cx="200" cy="320" rx="150" ry="18" fill="#a8cdb5"/>
  <!-- body -->
  <ellipse cx="200" cy="250" rx="95" ry="65" fill="#4a9d3f" stroke="#2d6b26" stroke-width="4"/>
  <ellipse cx="200" cy="270" rx="55" ry="40" fill="#cfe8a0"/>
  <!-- legs -->
  <path d="M110 260 Q60 250 55 300 Q80 315 120 305 Q130 285 120 270 Z" fill="#4a9d3f" stroke="#2d6b26" stroke-width="4"/>
  <path d="M290 260 Q340 250 345 300 Q320 315 280 305 Q270 285 280 270 Z" fill="#4a9d3f" stroke="#2d6b26" stroke-width="4"/>
  <path d="M45 305 l-15 10 M55 310 l-8 14 M68 312 l0 16" stroke="#2d6b26" stroke-width="5" stroke-linecap="round"/>
  <path d="M355 305 l15 10 M345 310 l8 14 M332 312 l0 16" stroke="#2d6b26" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <path d="M105 160 Q105 85 200 85 Q295 85 295 160 Q295 185 270 190 L130 190 Q105 185 105 160 Z" fill="#5cb54c" stroke="#2d6b26" stroke-width="4"/>
