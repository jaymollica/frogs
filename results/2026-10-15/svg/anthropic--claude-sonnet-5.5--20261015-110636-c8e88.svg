<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#d9f0ff"/>
  <ellipse cx="200" cy="275" rx="150" ry="18" fill="#7fb069"/>
  <!-- back legs -->
  <ellipse cx="105" cy="235" rx="40" ry="32" fill="#5a9e3a" stroke="#2f5f1d" stroke-width="3"/>
  <ellipse cx="295" cy="235" rx="40" ry="32" fill="#5a9e3a" stroke="#2f5f1d" stroke-width="3"/>
  <ellipse cx="75" cy="268" rx="35" ry="9" fill="#5a9e3a" stroke="#2f5f1d" stroke-width="3"/>
  <ellipse cx="325" cy="268" rx="35" ry="9" fill="#5a9e3a" stroke="#2f5f1d" stroke-width="3"/>
  <!-- body -->
  <ellipse cx="200" cy="215" rx="85" ry="60" fill="#6ab04c" stroke="#2f5f1d" stroke-width="3"/>
  <ellipse cx="200" cy="235" rx="55" ry="38" fill="#c9e8a0"/>
  <!-- front legs -->
  <rect x="140" y="245" width="18" height="30" rx="8" fill="#5a9e3a" stroke="#2f5f1d" stroke-width="3"/>
  <rect x="242" y="245" width="18" height="30" rx="8" fill="#5a9e3a" stroke="#2f5f1d" stroke-width="3"/>
  <!-- head -->
  <path d="M105 150 Q110 90 200 88 Q290 90 295 150 L295 165 L105 165 Z" fill="#6ab04c" stroke="#2f5f1d" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="145" cy="92" r="26" fill="#6ab04c" stroke="#2f5f1d" stroke-width="3"/>
  <circle cx="255" cy="92" r="26" fill="#6ab04c" stroke="#2f5f1d" stroke-width="3"/>
  <circle cx="145" cy="92" r="17" fill="#fff" stroke="#2f5f1d" stroke-width="2"/>
  <circle cx="255" cy="92" r="17" fill="#fff" stroke="#2f5f1d" stroke-width="2"/>
  <circle cx="150" cy="95" r="8" fill="#111"/>
  <circle cx="250" cy="95" r="8" fill="#111"/>
  <circle cx="153" cy="92" r="2.5" fill="#fff"/>
  <circle cx="253" cy="92" r="2.5" fill="#fff"/>
  <!-- nostrils -->
  <circle cx="185" cy="135" r="2.5" fill="#2f5f1d"/>
  <circle cx="215" cy="135" r="2.5" fill="#2f5f1d"/>
  <!-- protruding lower jaw (prognathism) -->
  <path d="M95 165 L305 165 Q320 180 315 200 Q305 215 270 212 L130 212 Q92 215 85 195 Q82 178 95 165 Z" fill="#78bf55" stroke="#2f5f1d" stroke-width="3"/>
  <!-- upper lip line recessed behind -->
  <path d="M112 165 Q200 178 288 165" fill="none" stroke="#2f5f1d" stroke-width="3"/>
  <!-- lower teeth/edge showing over upper lip -->
  <path d="M135 165 L140 156 L146 165 M165 167 L170 158 L176 167 M224 167 L230 158 L235 167 M254 165 L260 156 L266 165" fill="#fffbe8" stroke="#2f5f1d" stroke-width="1.5"/>
  <!-- chin -->
  <path d="M120 205 Q200 222 280 205" fill="none" stroke="#2f5f1d" stroke-width="2" opacity="0.5"/>
  <!-- cheeks -->
  <circle cx="125" cy="150" r="9" fill="#f4a6a6" opacity="0.7"/>
  <circle cx="275" cy="150" r="9" fill="#f4a6a6" opacity="0.7"/>
  <!-- spots -->
  <circle cx="160" cy="195" r="5" fill="#4a8a2e" opacity="0.6"/>
  <circle cx="245" cy="190" r="6" fill="#4a8a2e" opacity="0.6"/>
  <circle cx="200" cy="130" r="4" fill="#4a8a2e" opacity="0.6"/>
</svg>