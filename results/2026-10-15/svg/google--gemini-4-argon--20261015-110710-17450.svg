<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3c40" />
      <stop offset="60%" stop-color="#2d5c55" />
      <stop offset="100%" stop-color="#14292b" />
    </linearGradient>

    <!-- Lily Pad Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#438a5e" />
      <stop offset="100%" stop-color="#2b583c" />
    </linearGradient>

    <!-- Frog Skin Main Gradient -->
    <linearGradient id="skinGrad" x1="20%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#8bc34a" />
      <stop offset="50%" stop-color="#689f38" />
      <stop offset="100%" stop-color="#33691e" />
    </linearGradient>

    <!-- Frog Jaw/Highlight Gradient -->
    <linearGradient id="jawGrad" x1="10%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9ccc65" />
      <stop offset="40%" stop-color="#689f38" />
      <stop offset="90%" stop-color="#33691e" />
    </linearGradient>

    <!-- Frog Belly/Throat Gradient -->
    <linearGradient id="bellyGrad" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="50%" stop-color="#dce775" />
      <stop offset="100%" stop-color="#8bc34a" />
    </linearGradient>

    <!-- Eye Gold Gradient -->
    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffee58" />
      <stop offset="60%" stop-color="#fbc02d" />
      <stop offset="90%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#3e2723" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#0a1516" flood-opacity="0.6" />
    </filter>
    
    <!-- Inner Shadow for Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Ambient Background Ripples/Bokeh -->
  <circle cx="650" cy="150" r="80" fill="#a7ffeb" opacity="0.05" filter="url(#softGlow)" />
  <circle cx="150" cy="250" r="120" fill="#a7ffeb" opacity="0.05" filter="url(#softGlow)" />
  <ellipse cx="400" cy="520" rx="380" ry="60" fill="#0d1f22" opacity="0.5" />
  <ellipse cx="400" cy="520" rx="340" ry="45" fill="none" stroke="#4db6ac" stroke-width="2" opacity="0.2" />

  <!-- Lily Pad -->
  <g filter="url(#shadow)">
    <path d="M 400,450 L 720,490 C 740,510 680,560 400,560 C 100,560 80,500 120,470 C 160,440 350,435 400,450 Z" fill="url(#padGrad)" />
    <!-- Lily Pad Notch -->
    <path d="M 400,450 L 720,490 L 680,465 Z" fill="#14292b" opacity="0.7" />
    <!-- Lily Pad Veins -->
    <g stroke="#52a772" stroke-width="2" opacity="0.4" fill="none" stroke-linecap="round">
      <path d="M 400,450 C 320,470 200,490 130,490" />
      <path d="M 400,450 C 350,490 250,530 180,535" />
      <path d="M 400,450 C 400,490 380,540 350,555" />
      <path d="M 400,450 C 450,490 500,530 550,545" />
      <path d="M 400,450 C 500,480 600,500 670,515" />
    </g>
  </g>

  <!-- FROG -->
  <g filter="url(#shadow)">
    
    <!-- Far Hind Leg (Left) -->
    <g fill="#2e5c1e">
      <path d="M 280,350 C 240,340 210,390 230,440 C 240,460 280,460 300,450 Z" />
      <path d="M 235,445 C 200,450 180,465 190,470 C 205,475 230,465 250,460 Z" />
    </g>

    <!-- Far Front Leg (Left) -->
    <g fill="#33691e">
      <path d="M 300,360 C 280,400 280,450 270,480 C 250,485 230,495 240,500 C 255,505 270,495 280,495 C 285,505 290,515 300,510 C 305,505 300,490 305,480 C 315,440 330,400 330,360 Z" />
    </g>

    <!-- Main Body / Back -->
    <path d="M 330,220 C 450,210 560,290 580,410 C 590,470 530,495 440,495 C 350,495 290,450 290,350 C 290,280 310,230 330,220 Z" fill="url(#skinGrad)" />

    <!-- Warts / Back Texture -->
    <g fill="#33691e" opacity="0.4">
      <ellipse cx="480" cy="290" rx="18" ry="10" transform="rotate(20 480 290)" />
      <ellipse cx="520" cy="340" rx="22" ry="12" transform="rotate(35 520 340)" />
      <ellipse cx="450" cy="320" rx="12" ry="8" transform="rotate(15 450 320)" />
      <ellipse cx="550" cy="390" rx="15" ry="10" transform="rotate(45 550 390)" />
      <circle cx="490" cy="360" r="8" />
      <circle cx="420" cy="270" r="10" />
    </g>
    <g fill="#aed581" opacity="0.4">
      <path d="M 465,283 C 475,280 485,285 490,292" stroke="#aed581" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 505,330 C 515,328 525,335 530,345" stroke="#aed581" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Belly / Throat Pouch (Connected to massive jaw) -->
    <path d="M 190,290 C 210,390 290,460 390,480 C 440,490 470,460 450,400 C 430,340 350,280 190,290 Z" fill="url(#bellyGrad)" />
    
    <!-- Throat Striations/Folds -->
    <path d="M 220,330 C 260,370 320,390 380,380" fill="none" stroke="#9ccc65" stroke-width="3" opacity="0.6" stroke-linecap="round" />
    <path d="M 250,375 C 290,410 340,420 395,410" fill="none" stroke="#9ccc65" stroke-width="3" opacity="0.6" stroke-linecap="round" />
    <path d="M 290,415 C 320,440 360,445 405,440" fill="none" stroke="#9ccc65" stroke-width="3" opacity="0.6" stroke-linecap="round" />

    <!-- Far Eye (Right side of frog, Left of canvas) -->
    <g>
      <circle cx="290" cy="175" r="35" fill="url(#skinGrad)" />
      <circle cx="285" cy="175" r="26" fill="url(#eyeGrad)" />
      <ellipse cx="282" cy="175" rx="18" ry="8" fill="#1a0f0a" transform="rotate(-5 282 175)" />
      <!-- Eye Highlight -->
      <circle cx="275" cy="165" r="6" fill="#ffffff" opacity="0.9" />
      <circle cx="295" cy="182" r="3" fill="#ffffff" opacity="0.6" />
      <!-- Eyelid crease -->
      <path d="M 260,155 C 275,140 305,145 315,165" fill="none" stroke="#33691e" stroke-width="3" opacity="0.7" stroke-linecap="round" />
    </g>

    <!-- Upper Head / Maxilla (Recessed/Normal) -->
    <path d="M 290,175 C 240,180 205,210 200,245 C 198,260 220,275 260,285 C 310,295 360,290 400,270 C 420,250 370,170 290,175 Z" fill="url(#skinGrad)" />

    <!-- Nostril -->
    <ellipse cx="225" cy="225" rx="6" ry="3" fill="#1b380f" transform="rotate(-25 225 225)" />
    <path d="M 220,222 C 225,220 230,222 232,226" fill="none" stroke="#aed581" stroke-width="1.5" opacity="0.7" />

    <!-- Inside of Mouth / Lower Lip Shelf (The Underbite) -->
    <path d="M 125,210 C 150,225 180,245 215,252 C 210,265 160,260 125,210 Z" fill="#c25953" />
    <path d="M 125,210 C 150,225 185,245 250,255" fill="none" stroke="#8ab33e" stroke-width="6" stroke-linecap="round" />

    <!-- Underbite Teeth (Comedic/Prognathism emphasis) -->
    <path d="M 140,216 L 148,202 L 156,222 Z" fill="#fffde7" stroke="#c8b992" stroke-width="1" stroke-linejoin="round" />
    <path d="M 175,232 L 180,222 L 187,237 Z" fill="#fffde7" stroke="#c8b992" stroke-width="1" stroke-linejoin="round" />

    <!-- Upper Lip Shadow/Tuck (Overlapped by lower jaw) -->
    <path d="M 200,245 C 225,255 270,265 320,265" fill="none" stroke="#1b380f" stroke-width="5" stroke-linecap="round" opacity="0.7" />

    <!-- PROGNATHIC MANDIBLE (Massive Jutting Lower Jaw) -->
    <path d="M 125,210 C 95,210 95,295 160,330 C 230,368 330,360 395,310 C 425,287 430,260 410,255 C 390,250 375,275 335,280 C 280,287 235,265 205,250 C 175,235 140,210 125,210 Z" fill="url(#jawGrad)" />

    <!-- Chin Details / Bump / Cleft -->
    <!-- Highlight on the jutting chin -->
    <path d="M 118,225 C 108,255 125,295 165,315 C 205,335 260,340 310,330" fill="none" stroke="#dcedc8" stroke-width="4" opacity="0.5" stroke-linecap="round" filter="url(#softGlow)" />
    <ellipse cx="135" cy="260" rx="15" ry="25" fill="#dcedc8" opacity="0.2" transform="rotate(-15 135 260)" />
    <!-- Chin Cleft / Crease -->
    <path d="M 115,275 C 125,270 135,275 140,285" fill="none" stroke="#33691e" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <path d="M 135,305 C 155,315 180,315 200,305" fill="none" stroke="#33691e" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <!-- Mouth Corner Crease (Smug/Grumpy fold) -->
    <path d="M 385,260 C 395,265 400,280 390,290" fill="none" stroke="#254d15" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    
    <!-- Tympanum (Ear) -->
    <ellipse cx="425" cy="245" rx="16" ry="22" fill="#4c7828" stroke="#33691e" stroke-width="3" transform="rotate(-10 425 245)" />
    <ellipse cx="425" cy="245" rx="10" ry="14" fill="#33691e" opacity="0.5" transform="rotate(-10 425 245)" />

    <!-- Near Eye (Left side of frog, Center of canvas) -->
    <g>
      <!-- Eye Mound -->
      <path d="M 315,195 C 315,140 395,140 395,195 C 395,215 315,215 315,195 Z" fill="url(#skinGrad)" />
      <!-- Eyeball -->
      <circle cx="350" cy="185" r="28" fill="url(#eyeGrad)" />
      <!-- Pupil -->
      <ellipse cx="346" cy="185" rx="20" ry="9" fill="#1a0f0a" transform="rotate(-5 346 185)" />
      <!-- Eye Highlights -->
      <circle cx="336" cy="173" r="7" fill="#ffffff" opacity="0.9" />
      <circle cx="358" cy="193" r="3.5" fill="#ffffff" opacity="0.7" />
      <!-- Upper Eyelid (Giving a slightly heavy, royal/bulldog look) -->
      <path d="M 322,175 C 335,180 365,175 378,170 C 370,150 330,150 322,175 Z" fill="#689f38" />
      <path d="M 320,175 C 335,180 365,175 380,170" fill="none" stroke="#254d15" stroke-width="2.5" stroke-linecap="round" />
      <!-- Supraorbital ridge (brow) -->
      <path d="M 315,170 C 330,145 375,145 390,175" fill="none" stroke="#33691e" stroke-width="3" opacity="0.8" stroke-linecap="round" />
      <path d="M 320,165 C 335,143 370,143 385,168" fill="none" stroke="#aed581" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- Hind Leg (Near/Right) -->
    <g>
      <!-- Thigh -->
      <path d="M 460,380 C 520,330 600,350 610,410 C 620,470 530,490 460,470 C 430,460 430,405 460,380 Z" fill="url(#skinGrad)" />
      <!-- Calf -->
      <path d="M 595,405 C 630,425 630,475 590,490 C 550,505 475,495 475,475 C 475,455 560,385 595,405 Z" fill="url(#skinGrad)" />
      <!-- Leg Fold Shadow -->
      <path d="M 470,465 C 510,465 560,440 585,410" fill="none" stroke="#254d15" stroke-width="5" opacity="0.7" stroke-linecap="round" />
      <path d="M 480,470 C 520,470 565,450 585,425" fill="none" stroke="#aed581" stroke-width="2" opacity="0.4" stroke-linecap="round" />
      <!-- Foot/Toes -->
      <path d="M 520,485 C 480,490 430,500 420,510 C 415,515 435,520 460,515 C 445,525 435,535 445,540 C 455,545 485,525 505,515 C 500,525 500,540 510,540 C 520,540 535,515 545,505 C 565,495 575,485 520,485 Z" fill="url(#jawGrad)" />
      <!-- Webbing -->
      <path d="M 445,515 C 455,520 455,525 450,530 C 465,525 480,520 490,515 Z" fill="#8bc34a" opacity="0.7" />
      <path d="M 480,525 C 495,525 500,530 505,535 C 510,525 515,515 520,510 Z" fill="#8bc34a" opacity="0.7" />
      <!-- Toe Pads -->
      <ellipse cx="420" cy="512" rx="8" ry="5" fill="#9ccc65" />
      <ellipse cx="442" cy="538" rx="8" ry="5" fill="#9ccc65" />
      <ellipse cx="508" cy="538" rx="7" ry="5" fill="#9ccc65" />
    </g>

    <!-- Front Leg (Near/Right) -->
    <g>
      <!-- Upper Arm / Shoulder -->
      <path d="M 380,350 C 410,350 440,380 425,430 C 410,480 390,480 380,430 Z" fill="url(#skinGrad)" />
      <!-- Forearm (Sturdy, wide stance) -->
      <path d="M 420,400 C 425,440 405,490 390,505 C 370,510 365,490 375,460 C 385,430 375,400 385,390" fill="url(#jawGrad)" />
      <!-- Arm Shadow -->
      <path d="M 378,385 C 375,420 375,450 370,480" fill="none" stroke="#254d15" stroke-width="4" opacity="0.6" stroke-linecap="round" />
      <!-- Hand / Toes -->
      <path d="M 395,495 C 395,510 410,530 400,535 C 390,540 380,515 375,510 C 365,520 350,540 340,535 C 330,530 350,510 360,500 C 345,505 315,515 315,505 C 315,495 350,490 370,485 Z" fill="url(#jawGrad)" />
      <!-- Toe Pads -->
      <ellipse cx="315" cy="506" rx="8" ry="5" fill="#9ccc65" />
      <ellipse cx="340" cy="535" rx="8" ry="6" fill="#9ccc65" />
      <ellipse cx="400" cy="534" rx="7" ry="5" fill="#9ccc65" />
      <!-- Knuckle Highlights -->
      <circle cx="350" cy="515" r="3" fill="#dcedc8" opacity="0.6" />
      <circle cx="335" cy="500" r="3" fill="#dcedc8" opacity="0.6" />
    </g>

  </g>

  <!-- Foreground Details (Water Droplets on Lily Pad) -->
  <g>
    <ellipse cx="200" cy="510" rx="8" ry="5" fill="#0d1f22" opacity="0.3" />
    <path d="M 192,508 C 192,502 208,502 208,508 C 208,512 192,512 192,508 Z" fill="#e0f2f1" opacity="0.6" />
    <circle cx="197" cy="506" r="2" fill="#ffffff" />

    <ellipse cx="600" cy="525" rx="12" ry="7" fill="#0d1f22" opacity="0.3" />
    <path d="M 588,523 C 588,513 612,513 612,523 C 612,528 588,528 588,523 Z" fill="#e0f2f1" opacity="0.6" />
    <circle cx="595" cy="519" r="3" fill="#ffffff" />
    <circle cx="605" cy="524" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>

</svg>