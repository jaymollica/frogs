<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3a1c28"/>
      <stop offset="60%" stop-color="#1a0a12"/>
      <stop offset="100%" stop-color="#0a0307"/>
    </radialGradient>

    <!-- Gold Gradients for Crown & Medallion -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="30%" stop-color="#FFA751"/>
      <stop offset="70%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DAA520"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#4A3500"/>
    </linearGradient>

    <!-- Frog Skin Gradients -->
    <radialGradient id="frogSkinBase" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86c33c"/>
      <stop offset="50%" stop-color="#5f9725"/>
      <stop offset="90%" stop-color="#375d12"/>
      <stop offset="100%" stop-color="#1e3708"/>
    </radialGradient>

    <linearGradient id="frogJawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ad847"/>
      <stop offset="40%" stop-color="#70aa2b"/>
      <stop offset="75%" stop-color="#487819"/>
      <stop offset="100%" stop-color="#25440a"/>
    </linearGradient>

    <radialGradient id="frogBelly" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#eef8b2"/>
      <stop offset="55%" stop-color="#cbe368"/>
      <stop offset="100%" stop-color="#7ca732"/>
    </radialGradient>

    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6ee68"/>
      <stop offset="100%" stop-color="#5a8c20"/>
    </linearGradient>

    <!-- Velvet Robe Gradient -->
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#900C3F"/>
      <stop offset="40%" stop-color="#581845"/>
      <stop offset="100%" stop-color="#1C0612"/>
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eyeGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="30%" stop-color="#FDB813"/>
      <stop offset="75%" stop-color="#9A5900"/>
      <stop offset="100%" stop-color="#361700"/>
    </radialGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="jawShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="6" flood-color="#0a1503" flood-opacity="0.7"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Royal Wall Pattern Vignette -->
  <circle cx="400" cy="400" r="380" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="40"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="url(#goldLight)" stroke-opacity="0.1" stroke-width="2"/>

  <g id="habsburg-frog" transform="translate(0, 20)">

    <!-- Background Legs / Body Mass -->
    <path d="M 180 620 C 180 500, 250 450, 300 440 C 350 440, 450 440, 500 440 C 550 450, 620 500, 620 620 Z" fill="url(#frogSkinBase)"/>

    <!-- Royal Velvet Cape / Shoulders -->
    <g id="cape" filter="url(#shadow)">
      <path d="M 160 740 C 160 550, 240 500, 310 490 C 350 490, 450 490, 490 490 C 560 500, 640 550, 640 740 C 650 780, 150 780, 160 740 Z" fill="url(#robeGrad)"/>
      
      <!-- Ermine Fur Collar Trim -->
      <path d="M 210 560 C 230 520, 280 500, 330 495 C 370 510, 430 510, 470 495 C 520 500, 570 520, 590 560 C 610 600, 570 640, 550 620 C 510 580, 480 560, 400 570 C 320 560, 290 580, 250 620 C 230 640, 190 600, 210 560 Z" fill="#F7F5F0"/>
      
      <!-- Ermine Tails (Black spots) -->
      <path d="M 250 550 Q 255 565 250 575 Q 245 565 250 550 Z" fill="#111"/>
      <path d="M 243 562 L 257 562" stroke="#111" stroke-width="2"/>
      
      <path d="M 300 525 Q 305 540 300 550 Q 295 540 300 525 Z" fill="#111"/>
      <path d="M 293 537 L 307 537" stroke="#111" stroke-width="2"/>

      <path d="M 500 525 Q 505 540 500 550 Q 495 540 500 525 Z" fill="#111"/>
      <path d="M 493 537 L 507 537" stroke="#111" stroke-width="2"/>

      <path d="M 550 550 Q 555 565 550 575 Q 545 565 550 550 Z" fill="#111"/>
      <path d="M 543 562 L 557 562" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Order of the Golden Fleece / Heavy Gold Chain -->
    <g id="golden-chain" filter="url(#shadow)">
      <path d="M 270 540 Q 400 640 530 540" fill="none" stroke="url(#goldLight)" stroke-width="16" stroke-dasharray="18 6"/>
      <path d="M 270 540 Q 400 640 530 540" fill="none" stroke="url(#goldDark)" stroke-width="6" stroke-dasharray="18 6"/>
      <!-- Pendant -->
      <g transform="translate(400, 610)">
        <circle cx="0" cy="0" r="16" fill="url(#goldLight)"/>
        <circle cx="0" cy="0" r="10" fill="url(#goldDark)"/>
        <!-- Golden Fleece (Dangling Sheep emblem) -->
        <path d="M -8 12 C -12 20, -5 28, 0 26 C 5 28, 12 20, 8 12 C 4 16, -4 16, -8 12 Z" fill="url(#goldLight)"/>
      </g>
    </g>

    <!-- Massive Spanish Ruff Collar (Back Layers) -->
    <g id="ruff-back" fill="#EAE5D9" stroke="#D0C8B8" stroke-width="2">
      <path d="M 210 420 C 160 380, 150 480, 220 470 Z"/>
      <path d="M 230 450 C 170 440, 180 540, 250 500 Z"/>
      <path d="M 570 420 C 640 380, 650 480, 580 470 Z"/>
      <path d="M 550 450 C 630 440, 620 540, 550 500 Z"/>
    </g>

    <!-- MAIN HEAD & UPPER FACIAL STRUCTURE -->
    <g id="upper-head">
      <!-- Left Eye Socket Bulb -->
      <path d="M 250 250 C 230 160, 340 140, 370 230 Z" fill="url(#frogSkinBase)"/>
      <!-- Right Eye Socket Bulb -->
      <path d="M 550 250 C 570 160, 460 140, 430 230 Z" fill="url(#frogSkinBase)"/>

      <!-- Head Top Crown Bridge -->
      <path d="M 320 220 C 360 200, 440 200, 480 220 C 530 240, 550 300, 550 340 C 550 370, 250 370, 250 340 C 250 300, 270 240, 320 220 Z" fill="url(#frogSkinBase)"/>

      <!-- Eyes -->
      <!-- Left Eye Globe -->
      <circle cx="315" cy="205" r="42" fill="url(#eyeGrad)"/>
      <!-- Left Pupil (Horizontal Frog Slit, Droopy/Sleepy) -->
      <ellipse cx="315" cy="205" rx="26" ry="7" fill="#150800" transform="rotate(-5, 315, 205)"/>
      <ellipse cx="315" cy="205" rx="26" ry="7" fill="#000000" transform="rotate(-5, 315, 205)"/>
      <!-- Eye Highlights -->
      <circle cx="300" cy="188" r="6" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="292" cy="198" r="3" fill="#FFFFFF" opacity="0.6"/>
      <!-- Left Droopy Eyelid -->
      <path d="M 270 195 C 280 165, 350 165, 360 200 C 330 185, 290 185, 270 195 Z" fill="#5f9725" stroke="#375d12" stroke-width="2"/>

      <!-- Right Eye Globe -->
      <circle cx="485" cy="205" r="42" fill="url(#eyeGrad)"/>
      <!-- Right Pupil -->
      <ellipse cx="485" cy="205" rx="26" ry="7" fill="#150800" transform="rotate(5, 485, 205)"/>
      <ellipse cx="485" cy="205" rx="26" ry="7" fill="#000000" transform="rotate(5, 485, 205)"/>
      <!-- Eye Highlights -->
      <circle cx="470" cy="188" r="6" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="462" cy="198" r="3" fill="#FFFFFF" opacity="0.6"/>
      <!-- Right Droopy Eyelid -->
      <path d="M 440 200 C 450 165, 520 165, 530 195 C 510 185, 470 185, 440 200 Z" fill="#5f9725" stroke="#375d12" stroke-width="2"/>

      <!-- Upper Snout / Nose Ridge -->
      <path d="M 360 250 Q 400 235 440 250 Q 450 310 400 325 Q 350 310 360 250 Z" fill="url(#frogSkinBase)" opacity="0.6"/>
      <!-- Nostrils (Sad/Distant expression) -->
      <ellipse cx="385" cy="275" rx="4" ry="7" fill="#1a3006" transform="rotate(-10, 385, 275)"/>
      <ellipse cx="415" cy="275" rx="4" ry="7" fill="#1a3006" transform="rotate(10, 415, 275)"/>

      <!-- Upper Lip (Small, pathetic upper jaw recessed behind lower jaw) -->
      <path d="M 270 345 Q 400 320 530 345 C 540 365, 500 375, 400 370 C 300 375, 260 365, 270 345 Z" fill="#467519" stroke="#25440a" stroke-width="3"/>
    </g>

    <!-- THE HABSBURG JAW (EXTREME PROGNATHISM - MASSIVE JUTTING CHIN) -->
    <g id="habsburg-jaw" filter="url(#jawShadow)">

      <!-- Main Jaw Base Structure (Extends WAY out and down) -->
      <!-- Starts inside the mouth, bulges outwards dramatically, forming a massive heavy chin -->
      <path d="M 240 350 
               C 210 440, 230 510, 290 560 
               C 330 595, 360 615, 400 615 
               C 440 615, 470 595, 510 560 
               C 570 510, 590 440, 560 350 
               C 530 390, 480 415, 400 420 
               C 320 415, 270 390, 240 350 Z" 
            fill="url(#frogJawGrad)"/>

      <!-- Jaw/Belly Pale Under-Texture -->
      <path d="M 280 410 
               C 270 470, 290 530, 330 565 
               C 360 590, 380 600, 400 600 
               C 420 600, 440 590, 470 565 
               C 510 530, 530 470, 520 410 
               C 470 440, 440 445, 400 445 
               C 360 445, 330 440, 280 410 Z" 
            fill="url(#frogBelly)"/>

      <!-- Prominent Habsburg Lip (Everted, thick bottom lip overhanging) -->
      <path d="M 245 355 
               C 280 395, 330 415, 400 420 
               C 470 415, 520 395, 555 355 
               C 530 380, 470 400, 400 402 
               C 330 402, 270 380, 245 355 Z" 
            fill="url(#lipHighlight)" stroke="#385e12" stroke-width="2"/>

      <!-- Interior Mouth Cavity (Visible underbite gap) -->
      <path d="M 265 350 Q 400 375 535 350 Q 470 390 400 392 Q 330 390 265 350 Z" fill="#2d0a14"/>
      
      <!-- Tiny Sad Frog Tongue inside gap -->
      <path d="M 360 375 Q 400 360 440 375 Q 400 388 360 375 Z" fill="#8a2b43"/>

      <!-- Bottom Peg Teeth (Royal Inbred Underbite Accent) -->
      <polygon points="330,370 335,360 340,371" fill="#fffbe6" stroke="#c2bba8" stroke-width="1"/>
      <polygon points="395,380 400,366 405,380" fill="#fffbe6" stroke="#c2bba8" stroke-width="1"/>
      <polygon points="460,371 465,360 470,370" fill="#fffbe6" stroke="#c2bba8" stroke-width="1"/>

      <!-- The Classic Habsburg Chin Fold / Cleft & Heavy Droop -->
      <!-- Deep Chin Shadow Line -->
      <path d="M 320 470 C 350 510, 450 510, 480 470" fill="none" stroke="#2a4c0a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <!-- Deep Cleft Center Indentation -->
      <path d="M 400 520 L 400 585" fill="none" stroke="#25440a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M 398 525 L 398 580" fill="none" stroke="#a6e34b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

      <!-- Bulging Chin Highlights (Gives massive 3D weight to the chin) -->
      <ellipse cx="350" cy="530" rx="30" ry="20" fill="#ffffff" opacity="0.15" transform="rotate(-15, 350, 530)"/>
      <ellipse cx="450" cy="530" rx="30" ry="20" fill="#ffffff" opacity="0.15" transform="rotate(15, 450, 530)"/>
      <path d="M 340 575 C 370 595, 430 595, 460 575" fill="none" stroke="#dcff88" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

      <!-- Melancholy / Drooling String (Adds character) -->
      <path d="M 300 375 Q 295 430 300 440 Q 303 445 301 380" fill="#ffffff" opacity="0.4"/>
    </g> <!-- End Jaw -->

    <!-- Front Layers of Spanish Ruff Collar (Surrounding and highlighting the Jaw) -->
    <g id="ruff-front" fill="#F4F0E6" stroke="#C5BCAB" stroke-width="2.5" filter="url(#shadow)">
      <!-- Left side ruff pleats -->
      <path d="M 240 390 C 160 380, 140 450, 220 460 C 150 470, 160 530, 250 510 C 180 540, 210 600, 290 560 Z"/>
      <!-- Right side ruff pleats -->
      <path d="M 560 390 C 640 380, 660 450, 580 460 C 650 470, 640 530, 550 510 C 620 540, 590 600, 510 560 Z"/>
      <!-- Bottom Center Supporting Pleats (Under the chin) -->
      <path d="M 280 550 C 240 610, 320 650, 350 590 C 330 650, 420 660, 410 600 Z"/>
      <path d="M 520 550 C 560 610, 480 650, 450 590 C 470 650, 380 660, 390 600 Z"/>
      <!-- Inner Crisp Lace Details -->
      <path d="M 220 460 Q 250 475 275 460" fill="none" stroke="#A89F8D" stroke-width="1.5"/>
      <path d="M 580 460 Q 550 475 525 460" fill="none" stroke="#A89F8D" stroke-width="1.5"/>
      <path d="M 250 510 Q 280 525 305 500" fill="none" stroke="#A89F8D" stroke-width="1.5"/>
      <path d="M 550 510 Q 520 525 495 500" fill="none" stroke="#A89F8D" stroke-width="1.5"/>
    </g>

    <!-- Imperial Crown (Perched awkwardly small between large eye bulges) -->
    <g id="crown" filter="url(#shadow)" transform="translate(0, -10)">
      <!-- Crown Base -->
      <path d="M 330 140 L 470 140 L 460 165 L 340 165 Z" fill="url(#goldDark)"/>
      <rect x="335" y="150" width="130" height="10" rx="3" fill="url(#goldLight)"/>
      <!-- Crown Jewels Base -->
      <circle cx="350" cy="155" r="3.5" fill="#900C3F"/>
      <circle cx="375" cy="155" r="3.5" fill="#118AB2"/>
      <circle cx="400" cy="155" r="4.5" fill="#900C3F"/>
      <circle cx="425" cy="155" r="3.5" fill="#118AB2"/>
      <circle cx="450" cy="155" r="3.5" fill="#900C3F"/>

      <!-- Crown Spikes / Peaks -->
      <path d="M 330 140 
               L 320 80 L 355 115 
               L 390 70 L 400 110 
               L 410 70 L 445 115 
               L 480 80 L 470 140 Z" 
            fill="url(#goldLight)" stroke="url(#goldDark)" stroke-width="2"/>

      <!-- Velvet Inner Cap of Crown -->
      <path d="M 330 138 C 330 100, 360 90, 400 90 C 440 90, 470 100, 470 138 Z" fill="#72092C" opacity="0.7"/>

      <!-- Jewels on Spikes -->
      <circle cx="320" cy="80" r="5" fill="#E63946" filter="url(#glow)"/>
      <circle cx="390" cy="70" r="6" fill="#FFF"/>
      <circle cx="390" cy="70" r="4.5" fill="#118AB2" filter="url(#glow)"/>
      <circle cx="410" cy="70" r="6" fill="#FFF"/>
      <circle cx="410" cy="70" r="4.5" fill="#118AB2" filter="url(#glow)"/>
      <circle cx="480" cy="80" r="5" fill="#E63946" filter="url(#glow)"/>

      <!-- Cross on Center Peak -->
      <path d="M 400 50 L 400 68 M 391 57 L 409 57" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="square"/>
    </g>

    <!-- Warts / Royal Skin Blemishes (Adds frog texture) -->
    <g id="warts" fill="#2c4c0e" opacity="0.4">
      <circle cx="280" cy="280" r="6"/>
      <circle cx="292" cy="290" r="4"/>
      <circle cx="510" cy="275" r="7"/>
      <circle cx="320" cy="490" r="5"/>
      <circle cx="480" cy="500" r="6"/>
      <circle cx="495" cy="515" r="3.5"/>
      <circle cx="380" cy="565" r="4.5"/>
    </g>

    <!-- Subtle Lighting Overlay / Vignette on Frog -->
    <ellipse cx="400" cy="250" rx="250" ry="200" fill="url(#goldLight)" opacity="0.05" style="mix-blend-mode: overlay;"/>
  </g>
</svg>