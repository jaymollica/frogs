<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="skin" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9ccf63"/>
      <stop offset="60%" stop-color="#6faa42"/>
      <stop offset="100%" stop-color="#4c7e2e"/>
    </radialGradient>
    <radialGradient id="jawg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#a7d76e"/>
      <stop offset="100%" stop-color="#5d9436"/>
    </radialGradient>
    <radialGradient id="eyeg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2d7a8"/>
    </radialGradient>
  </defs>

  <rect width="400" height="420" fill="#dff0f7"/>
  <ellipse cx="200" cy="398" rx="165" ry="18" fill="#000" opacity="0.12"/>

  <!-- body -->
  <ellipse cx="200" cy="330" rx="150" ry="78" fill="url(#skin)" stroke="#3d6b2c" stroke-width="4"/>

  <!-- front feet -->
  <g fill="url(#skin)" stroke="#3d6b2c" stroke-width="4">
    <path d="M78 352 q-38 6 -48 24 q14 10 28 2 q-8 14 6 18 q12 -2 16 -14 q0 14 14 14 q10 -6 6 -20 z"/>
    <path d="M322 352 q38 6 48 24 q-14 10 -28 2 q8 14 -6 18 q-12 -2 -16 -14 q0 14 -14 14 q-10 -6 -6 -20 z"/>
  </g>

  <!-- head -->
  <ellipse cx="200" cy="168" rx="122" ry="96" fill="url(#skin)" stroke="#3d6b2c" stroke-width="4"/>

  <!-- eye bulges -->
  <circle cx="134" cy="88" r="46" fill="url(#skin)" stroke="#3d6b2c" stroke-width="4"/>
  <circle cx="266" cy="88" r="46" fill="url(#skin)" stroke="#3d6b2c" stroke-width="4"/>

  <!-- THE HABSBURG JAW: massive protruding prognathic lower jaw -->
  <path d="M86 176
           C 70 262, 96 338, 150 360
           C 182 374, 218 374, 250 360
           C 304 338, 330 262, 314 176
           C 300 232, 262 252, 200 252
           C 138 252, 100 232, 86 176 Z"
        fill="url(#jawg)" stroke="#3d6b2c" stroke-width="4"/>

  <!-- jowl crease -->
  <path d="M112 236 q88 48 176 0" fill="none" stroke="#3d6b2c" stroke-width="3" opacity="0.5"/>
  <path d="M152 318 q48 20 96 0" fill="none" stroke="#3d6b2c" stroke-width="3" opacity="0.45"/>

  <!-- mouth line (upper jaw, set far back behind the chin) -->
  <path d="M92 196 Q 200 236 308 196" fill="none" stroke="#2f5222" stroke-width="7" stroke-linecap="round"/>

  <!-- protruding lower lip rolled over the upper lip -->
  <path d="M104 200 Q 200 252 304 200 Q 200 274 104 200 Z" fill="#7cb24c" stroke="#3d6b2c" stroke-width="3.5"/>

  <!-- underbite teeth poking up over the upper lip -->
  <g fill="#fdfdf3" stroke="#cfcfb5" stroke-width="2">
    <path d="M170 220 l6 -26 l10 25 z"/>
    <path d="M214 220 l9 -25 l6 26 z"/>
  </g>

  <!-- nostrils -->
  <ellipse cx="178" cy="150" rx="6" ry="5" fill="#2f5222"/>
  <ellipse cx="222" cy="150" rx="6" ry="5" fill="#2f5222"/>

  <!-- eyes -->
  <circle cx="134" cy="86" r="29" fill="url(#eyeg)" stroke="#3d6b2c" stroke-width="3"/>
  <circle cx="266" cy="86" r="29" fill="url(#eyeg)" stroke="#3d6b2c" stroke-width="3"/>
  <ellipse cx="136" cy="88" rx="11" ry="15" fill="#13200d"/>
  <ellipse cx="264" cy="88" rx="11" ry="15" fill="#13200d"/>
  <circle cx="130" cy="79" r="4.5" fill="#fff"/>
  <circle cx="258" cy="79" r="4.5" fill="#fff"/>

  <!-- droopy noble eyelids -->
  <path d="M106 72 q28 -18 56 -2" fill="none" stroke="#3d6b2c" stroke-width="4" stroke-linecap="round"/>
  <path d="M238 70 q28 -16 56 2" fill="none" stroke="#3d6b2c" stroke-width="4" stroke-linecap="round"/>

  <!-- back spots -->
  <g fill="#3d6b2c" opacity="0.35">
    <ellipse cx="96" cy="312" rx="16" ry="11"/>
    <ellipse cx="312" cy="306" rx="14" ry="10"/>
    <ellipse cx="62" cy="128" rx="12" ry="18" transform="rotate(-20 62 128)"/>
    <ellipse cx="338" cy="128" rx="12" ry="18" transform="rotate(20 338 128)"/>
  </g>
</svg>