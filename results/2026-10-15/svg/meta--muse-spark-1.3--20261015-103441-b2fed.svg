<ellipse cx="305" cy="155" rx="108" ry="92" fill="#66BB6A" stroke="#1B5E20" stroke-width="5"/>
<!-- upper jaw - short, receded -->
<path d="M215 155 Q315 108 382 156 Q397 179 376 196 Q310 212 220 197 Z" fill="#66BB6A" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round"/>
<circle cx="363" cy="168" r="5" fill="#1B5E20"/>
