<path d="M376 196 Q416 196 423 228 Q425 248 400 254 Q376 258 367 236 Q363 212 376 196 Z" fill="#E8A090" stroke="#7B2D26" stroke-width="4" stroke-linejoin="round"/>
<path d="M382 208 Q407 210 410 230" fill="none" stroke="#7B2D26" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
<!-- mouth line - underbite cleft -->
<path d="M225 197 Q300 214 376 196" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
<!-- chin crease -->
<path d="M260 285 Q300 295 340 285" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
<!-- eye mound -->
<circle cx="262" cy="78" r="44" fill="#66BB6A" stroke="#1B5E20" stroke-width="5"/>
<circle cx="262" cy="78" r="27" fill="#FFEB3B" stroke="#1B5E20" stroke-width="4"/>
<ellipse cx="262" cy="78" rx="15" ry="7.5" fill="#212121"/>
<circle cx="270" cy="70" r="5.5" fill="white"/>
<path d="M230 62 Q262 40 294 62" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
<!-- tiny Habsburg crown -->
<g transform="rotate(-12 195 55)">
<path d="M150 70 L154 32 L175 52 L198 28 L221 52 L242 32 L246 70 Z" fill="#FFC107" stroke="#5D4037" stroke-width="3" stroke-linejoin="round"/>
<rect x="150" y="70" width="96" height="14" rx="3" fill="#FFC107" stroke="#5D4037" stroke-width="3"/>
<circle cx="154" cy="32" r="5" fill="#E53935" stroke="#5D4037" stroke-width="2"/>
<circle cx="198" cy="28" r="6" fill="#E53935" stroke="#5D4037" stroke-width="2"/>
<circle cx="242" cy="32" r="5" fill="#E53935" stroke="#5D4037" stroke-width="2"/>
<circle cx="198" cy="77" r="5" fill="#1E88E5" stroke="#5D4037" stroke-width="2"/>
</g>
</svg>