<path d="M225 197 Q310 212 376 196 Q416 196 423 228 Q428 264 385 287 Q315 315 240 288 Q200 255 225 197 Z" fill="#8ED081" stroke="#1B5E20" stroke-width="5" stroke-linejoin="round"/>
