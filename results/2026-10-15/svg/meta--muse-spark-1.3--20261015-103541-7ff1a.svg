<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300">
<!-- eye stalks -->
<ellipse cx="105" cy="75" rx="38" ry="36" fill="#4CAF50" stroke="#2E7D32" stroke-width="4"/>
<ellipse cx="215" cy="75" rx="38" ry="36" fill="#4CAF50" stroke="#2E7D32" stroke-width="4"/>
<!-- eyes -->
<circle cx="105" cy="70" r="24" fill="white" stroke="#2E7D32" stroke-width="3"/>
<circle cx="215" cy="70" r="24" fill="white" stroke="#2E7D32" stroke-width="3"/>
<circle cx="110" cy="73" r="11" fill="#111"/>
<circle cx="210" cy="73" r="11" fill="#111"/>
<circle cx="114" cy="69" r="3.5" fill="white"/>
<circle cx="214" cy="69" r="3.5" fill="white"/>
<!-- head -->
<ellipse cx="160" cy="170" rx="115" ry="92" fill="#66BB6A" stroke="#2E7D32" stroke-width="5"/>
<!-- upper snout -->
<ellipse cx="160" cy="160" rx="82" ry="48" fill="#81C784"/>
<!-- nostrils -->
<ellipse cx="136" cy="149" rx="6" ry="8" fill="#1B5E20"/>
<ellipse cx="184" cy="149" rx="6" ry="8" fill="#1B5E20"/>
<ellipse cx="136" cy="147" rx="1.8" ry="2.5" fill="#A5D6A7" opacity="0.8"/>
<ellipse cx="184" cy="147" rx="1.8" ry="2.5" fill="#A5D6A7" opacity="0.8"/>
<!-- Habsburg jaw: massive protruding underbite -->
<path d="M 52 181 Q 160 213 268 181 L 258 235 Q 250 262 160 270 Q 70 262 62 235 Z" fill="#C5E1A5" stroke="#2E7D32" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- upper lip line -->
<path d="M 52 181 Q 160 213 268 181" fill="none" stroke="#1B5E20" stroke-width="5" stroke-linecap="round"/>
<!-- downturned Habsburg mouth corners -->
<path d="M 52 181 Q 46 195 58 204" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
<path d="M 268 181 Q 274 195 262 204" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
<!-- lower teeth jutting in front of upper lip to show prognathism -->
<rect x="132" y="185" width="18" height="20" rx="4" fill="white" stroke="#2E7D32" stroke-width="3"/>
<rect x="170" y="185" width="18" height="20" rx="4" fill="white" stroke="#2E7D32" stroke-width="3"/>
<!-- lower lip -->
<path d="M 95 237 Q 160 256 225 237" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<!-- Habsburg chin cleft and dimple -->
<path d="M 160 242 L 160 264" fill="none" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="160" cy="272" rx="10" ry="5" fill="#AED581" stroke="#2E7D32" stroke-width="2.5"/>
<!-- cheek warts -->
<circle cx="78" cy="175" r="5" fill="#388E3C" opacity="0.5"/>
<circle cx="242" cy="175" r="5" fill="#388E3C" opacity="0.5"/>
<circle cx="88" cy="195" r="3.5" fill="#388E3C" opacity="0.4"/>
<circle cx="232" cy="195" r="3.5" fill="#388E3C" opacity="0.4"/>
</svg>