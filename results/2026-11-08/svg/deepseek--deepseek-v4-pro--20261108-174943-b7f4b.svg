<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2f1" />
      <stop offset="100%" stop-color="#b2dfdb" />
    </radialGradient>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#4caf50" />
    </radialGradient>
    <radialGradient id="jawGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a5d6a7" />
      <stop offset="100%" stop-color="#388e3c" />
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d0d0" />
    </radialGradient>
  </defs>

  <!-- Backround -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" />

  <!-- Shouders/Body -->
  <path d="M 100 300 C 40 450, 140 520, 250 520 C 360 520, 460 450, 400 300 Z" fill="url(#bodyGrad)" stroke="#2e7d32" stroke-width="8" stroke-linejoin="round"/>
  <path d="M 150 360 C 150 460, 250 520, 250 520 C 250 520, 350 460, 350 360 Z" fill="#a5d6a7" opacity="0.8" />

  <!-- Head Base -->
  <ellipse cx="250" cy="190" rx="145" ry="105" fill="url(#bodyGrad)" stroke="#2e7d32" stroke-width="8" />

  <!-- Eye Bumos (Parotids) -->
  <ellipse cx="145" cy="130" rx="55" ry="45" fill="url(#bodyGrad)" stroke="#2e7d32" stroke-width="8" />
  <ellipse cx="355" cy="130" rx="55" ry="45" fill="url(#bodyGrad)" stroke="#2e7d32" stroke-width="8" />

  <!-- Mout Interior -->
  <path d="M 140 250 Q 250 210 360 250 Q 250 380 140 250" fill="#3E2723" stroke="#2e7d32" stroke-width="6" stroke-linejoin="round" />

  <!-- Prortuding Lower Jaw (Mandibular Prognathism) -->
  <path d="M 140 250 C 80 380, 130 480, 250 480 C 370 480, 420 380, 360 250 Z" fill="url(#jawGrad)" stroke="#2e7d32" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Lower Jaw Highlight (3D Jut-out effect) -->
  <ellipse cx="250" cy="380" rx="80" ry="40" fill="#a5d6a7" opacity="0.4" />

  <!-- Chin Shadow / Fold -->
  <path d="M 170 410 Q 250 460 330 410" fill="none" stroke="#1b5e20" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Lower Teeth (Prominent Underbite) -->
  <path d="M 165 280 L 175 335 L 205 355 L 240 365 L 260 365 L 295 355 L 325 335 L 335 280 Z" fill="#ffffff" stroke="#2e7d32" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Teeth Divinds -->
  <line x1="187" y1="325" x2="180" y2="285" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" />
  <line x1="215" y1="348" x2="210" y2="285" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="358" x2="250" y2="285" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" />
  <line x1="285" y1="348" x2="290" y2="285" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" />
  <line x1="313" y1="325" x2="320" y2="285" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" />

  <!-- Tongue -->
  <path d="M 200 345 C 200 410, 300 410, 300 345 C 280 380, 220 380, 200 345" fill="#e57373" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 230 370 Q 250 390 270 370" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round" />

  <!-- Receding Upper Lip (Frowning) -->
  <path d="M 140 250 Q 250 210 360 250" fill="none" stroke="#1b5e20" stroke-width="14" stroke-linecap="round" />

  <!-- Eyes Details -->
  <!-- Left Eye -->
  <circle cx="145" cy="140" r="38" fill="url(#eyeGrad)" stroke="#2e7d32" stroke-width="6" />
  <circle cx="160" cy="155" r="12" fill="#1b5e20" />
  <circle cx="164" cy="150" r="4" fill="#ffffff" />
  
  <!-- Right Eye -->
  <circle cx="355" cy="140" r="38" fill="url(#eyeGrad)" stroke="#2e7d32" stroke-width="6" />
  <circle cx="340" cy="155" r="12" fill="#1b5e20" />
  <circle cx="336" cy="150" r="4" fill="#ffffff" />

  <!-- Nosrils -->
  <path d="M 210 215 Q 215 205 220 215 Q 215 220 210 215" fill="#2e7d32" />
  <path d="M 290 215 Q 295 205 300 215 Q 295 220 290 215" fill="#2e7d32" />

  <!-- Frrog Warts (Texure) -->
  <circle cx="115" cy="190" r="7" fill="#388e3c" opacity="0.8" />
  <circle cx="135" cy="235" r="9" fill="#388e3c" opacity="0.8" />
  <circle cx="385" cy="190" r="7" fill="#388e3c" opacity="0.8" />
  <circle cx="365" cy="235" r="9" fill="#388e3c" opacity="0.8" />
  <circle cx="250" cy="115" r="10" fill="#388e3c" opacity="0.8" />
  <circle cx="195" cy="105" r="6" fill="#388e3c" opacity="0.8" />
  <circle cx="305" cy="105" r="6" fill="#388e3c" opacity="0.8" />
  
  <!-- Warts on Prortuding Jaw -->
  <ellipse cx="200" cy="440" rx="14" ry="9" fill="#2e7d32" opacity="0.5" />
  <ellipse cx="300" cy="440" rx="14" ry="9" fill="#2e7d32" opacity="0.5" />
  <ellipse cx="250" cy="460" rx="18" ry="10" fill="#2e7d32" opacity="0.5" />
</svg>