<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a4738"/>
      <stop offset="100%" stop-color="#0f1a14"/>
    </radialGradient>
    
    <!-- Frog Skin Gradients -->
    <linearGradient id="skin-main" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#76c423"/>
      <stop offset="50%" stop-color="#4e9615"/>
      <stop offset="100%" stop-color="#2d5e0b"/>
    </linearGradient>

    <linearGradient id="skin-jaw" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#9bf033"/>
      <stop offset="40%" stop-color="#68b51d"/>
      <stop offset="100%" stop-color="#34690c"/>
    </linearGradient>

    <linearGradient id="belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2f578"/>
      <stop offset="100%" stop-color="#9ebf34"/>
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eye-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff56e"/>
      <stop offset="55%" stop-color="#e69d00"/>
      <stop offset="100%" stop-color="#7a4000"/>
    </radialGradient>

    <!-- Mouth Interior Gradient -->
    <linearGradient id="mouth-inside" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e17"/>
      <stop offset="100%" stop-color="#1a0206"/>
    </linearGradient>

    <linearGradient id="tongue" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="100%" stop-color="#b82e4d"/>
    </linearGradient>
    
    <!-- Drool Gradient -->
    <radialGradient id="drool-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a6f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b9eff" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Floor Shadow -->
  <ellipse cx="400" cy="670" rx="300" ry="45" fill="#040806" opacity="0.6" filter="blur(12px)"/>

  <!-- Frog Character Group -->
  <g filter="url(#shadow)">
    
    <!-- Back Left Leg (Background Leg) -->
    <path d="M 230 510 C 150 490 130 600 190 645 C 230 670 280 650 270 610 Z" fill="#2d5e0b"/>
    <path d="M 170 635 C 130 645 110 655 100 665 C 95 670 120 670 140 665 C 150 673 130 680 125 680 C 145 678 165 670 175 660" stroke="#1d3d07" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Back Right Leg (Behind body on right side) -->
    <path d="M 440 550 C 510 530 550 590 510 640 C 480 660 430 650 420 610 Z" fill="#1d3d07"/>

    <!-- Main Body/Torso -->
    <path d="M 230 400 C 190 470 210 610 310 640 C 410 650 460 620 470 540 C 480 470 420 420 370 420 Z" fill="url(#skin-main)"/>

    <!-- Belly -->
    <path d="M 270 460 C 250 520 280 620 350 635 C 420 645 450 590 440 530 C 400 510 320 470 270 460 Z" fill="url(#belly)" opacity="0.9"/>

    <!-- Left Eye (Far Eye in background) -->
    <g>
      <circle cx="310" cy="230" r="45" fill="url(#skin-main)"/>
      <circle cx="310" cy="230" r="35" fill="url(#eye-grad)"/>
      <ellipse cx="315" cy="230" rx="8" ry="20" fill="#111" transform="rotate(15 315 230)"/>
      <circle cx="300" cy="215" r="7" fill="#fff" opacity="0.8"/>
    </g>

    <!-- Head Top & UPPER SNOUT (Intentionally short/retracted to emphasize underbite) -->
    <path d="M 270 340 C 260 270 320 240 360 240 C 410 240 450 260 460 310 C 465 335 455 365 430 375 C 400 385 330 370 270 340 Z" fill="url(#skin-main)"/>

    <!-- Right Eye (Near Eye - Larger, expressive) -->
    <g>
      <circle cx="395" cy="230" r="52" fill="url(#skin-main)"/>
      <!-- Eye lid shadow -->
      <path d="M 345 220 A 52 52 0 0 1 445 220 Z" fill="#2d5e0b" opacity="0.3"/>
      <circle cx="395" cy="230" r="40" fill="url(#eye-grad)"/>
      <!-- Pupil staring down at his own jutting jaw -->
      <ellipse cx="405" cy="238" rx="10" ry="24" fill="#111" transform="rotate(-10 405 238)"/>
      <!-- Eye Highlights -->
      <circle cx="380" cy="210" r="9" fill="#fff" opacity="0.85"/>
      <circle cx="370" cy="222" r="4" fill="#fff" opacity="0.6"/>
      <!-- Brow Ridge -->
      <path d="M 340 210 C 365 170 425 180 450 215" stroke="#8ce62c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Nostril & Upper Snout Edge -->
    <path d="M 460 310 C 465 340 450 365 435 375" stroke="#254708" stroke-width="4" fill="none"/>
    <ellipse cx="440" cy="330" rx="4" ry="7" fill="#152b04" transform="rotate(-20 440 330)"/>

    <!-- EXPOSED MOUTH CAVITY (Visible gap behind protruding lower jaw) -->
    <path d="M 330 365 C 410 370 440 375 450 378 C 460 390 560 405 640 400 C 560 435 440 445 340 400 Z" fill="url(#mouth-inside)"/>
    
    <!-- Tongue resting inside lower jaw -->
    <path d="M 420 390 C 470 385 540 395 580 402 C 540 420 470 425 410 398 Z" fill="url(#tongue)" opacity="0.9"/>
    <path d="M 460 391 C 490 394 530 400 555 402" stroke="#ff9ebb" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Bottom Tusks / Teeth (Underbite Details) -->
    <path d="M 590 402 L 598 384 L 606 401 Z" fill="#fffbe6" stroke="#c2b672" stroke-width="1.5"/>
    <path d="M 625 398 L 632 376 L 640 397 Z" fill="#fffbe6" stroke="#c2b672" stroke-width="1.5"/>

    <!-- ======================================================== -->
    <!-- HEAVILY PROTRUDING LOWER JAW (THE PRIMARY FEATURE)       -->
    <!-- Extends WAY past upper snout (Upper Snout X:450 vs Jaw X:685) -->
    <!-- ======================================================== -->
    <g>
      <!-- Main Lower Mandible Mass -->
      <path d="M 270 360 
               C 320 365 410 375 450 380
               C 500 385 610 385 670 388
               C 695 390 705 408 688 425
               C 655 455 580 475 490 475
               C 410 475 330 450 270 400
               Z" 
            fill="url(#skin-jaw)"/>

      <!-- Thick Upper Lip Lip-Shelf on Lower Jaw -->
      <path d="M 440 380 
               C 490 383 610 385 670 388
               C 688 390 695 402 680 412
               C 625 418 500 412 430 392 Z" 
            fill="#adf542" opacity="0.85"/>

      <!-- Massive Under-Jaw Throat Sac (Gular pouch stretching underneath) -->
      <path d="M 300 410 
               C 370 450 450 475 510 470
               C 550 467 610 445 630 430
               C 570 495 470 525 370 505
               C 310 493 280 440 300 410 Z" 
            fill="url(#belly)"/>

      <!-- Deep Jaw Creases & Muscle Lines (Adding weight & drama to underbite) -->
      <!-- Corner of mouth cheek fold -->
      <path d="M 300 355 C 320 380 310 420 290 435" stroke="#1d3d07" stroke-width="6" stroke-linecap="round" fill="none"/>
      
      <!-- Forward jawline muscle ridge -->
      <path d="M 330 395 C 420 425 520 430 610 418" stroke="#254708" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 440 425 C 510 440 590 435 645 420" stroke="#1d3d07" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
      
      <!-- Heavy Chin Highlight -->
      <path d="M 645 394 C 670 397 682 404 675 412" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
      <ellipse cx="655" cy="400" rx="22" ry="6" fill="#fff" opacity="0.25" transform="rotate(-5 655 400)"/>
    </g>
    <!-- ======================================================== -->

    <!-- Front Left Arm -->
    <path d="M 270 450 C 230 480 220 540 250 580 C 260 590 280 590 280 570 C 270 530 280 490 310 460 Z" fill="url(#skin-main)"/>
    <!-- Toes Left -->
    <path d="M 250 580 C 230 590 220 605 225 610 C 235 610 250 595 260 585 M 255 590 C 245 605 245 615 253 615 C 260 610 265 595 270 585 M 265 590 C 265 605 270 615 278 613 C 280 605 275 590 275 580" stroke="#1d3d07" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Front Right Arm (Supporting body posture) -->
    <path d="M 430 480 C 450 520 460 570 440 610 C 435 620 420 620 420 605 C 430 570 420 530 390 490 Z" fill="url(#skin-main)"/>
    <!-- Toes Right -->
    <path d="M 440 605 C 450 620 465 625 470 620 C 470 610 455 600 440 595 M 440 610 C 435 625 445 630 452 628 C 455 620 448 605 440 600" stroke="#1d3d07" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Drool String Hanging from the Jutting Underbite -->
    <g>
      <path d="M 665 415 C 670 440 650 460 655 485" stroke="#a6f0ff" stroke-width="3" fill="none" opacity="0.75"/>
      <circle cx="655" cy="488" r="5.5" fill="url(#drool-grad)"/>
      <circle cx="667" cy="445" r="2.5" fill="url(#drool-grad)"/>
    </g>

    <!-- Skin Texture / Spots -->
    <g fill="#1d3d07" opacity="0.35">
      <circle cx="330" cy="280" r="6"/>
      <circle cx="350" cy="300" r="4"/>
      <circle cx="320" cy="310" r="7"/>
      <circle cx="260" cy="390" r="6"/>
      <circle cx="240" cy="420" r="5"/>
      <circle cx="530" cy="435" r="7"/>
      <circle cx="560" cy="445" r="4"/>
      <circle cx="480" cy="445" r="6"/>
      <circle cx="610" cy="435" r="5"/>
    </g>
    
    <!-- Spot Highlights -->
    <g fill="#b0ff42" opacity="0.5">
      <circle cx="332" cy="278" r="2"/>
      <circle cx="321" cy="308" r="2.5"/>
      <circle cx="531" cy="433" r="2.5"/>
    </g>

  </g>

  <!-- Annoying Little Mosquito / Fly -->
  <g filter="url(#glow)">
    <!-- Flight Path -->
    <path d="M 720 280 C 695 260 725 220 690 190" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 4" fill="none" opacity="0.4"/>
    <!-- Fly Body -->
    <ellipse cx="690" cy="190" rx="6" ry="4" fill="#111" transform="rotate(-20 690 190)"/>
    <!-- Wings -->
    <ellipse cx="688" cy="183" rx="7" ry="3" fill="#e0f7fc" opacity="0.75" transform="rotate(-50 688 183)"/>
    <ellipse cx="693" cy="184" rx="6" ry="2.5" fill="#e0f7fc" opacity="0.75" transform="rotate(-10 693 184)"/>
    <!-- Eye -->
    <circle cx="694" cy="189" r="1.5" fill="#ff3333"/>
  </g>

</svg>