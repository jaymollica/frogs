    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c0e785"/>
      <stop offset="1" stop-color="#83bf59"/>
    </linearGradient>
    <radialGradient id="iris" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff49a"/>
      <stop offset="0.55" stop-color="#e4bd42"/>
