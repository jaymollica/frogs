<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a443b"/>
      <stop offset="100%" stop-color="#131f1b"/>
    </radialGradient>

    <!-- Main Skin Gradient (Vibrant Green) -->
    <linearGradient id="frogSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8ee339"/>
      <stop offset="50%" stop-color="#56ab2f"/>
      <stop offset="100%" stop-color="#285e18"/>
    </linearGradient>

    <!-- Dark Skin Shading -->
    <linearGradient id="frogSkinDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d8220"/>
      <stop offset="100%" stop-color="#1e4710"/>
    </linearGradient>

    <!-- Protruding Jaw / Underside Cream Gradient -->
    <linearGradient id="jawCream" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f5fda0"/>
      <stop offset="60%" stop-color="#d2e870"/>
      <stop offset="100%" stop-color="#8ca83b"/>
    </linearGradient>

    <!-- Lip Highlight -->
    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6ef52"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffe100"/>
      <stop offset="75%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#9a3100"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Soft Inner Shadow for Jaw Depth -->
    <filter id="jawShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-3" dy="5" stdDeviation="3" flood-color="#1a3d0c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="30" fill="url(#bgGrad)"/>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="435" rx="170" ry="25" fill="#0a120e" opacity="0.6" filter="url(#shadow)"/>

  <g transform="translate(10, 15)">
    <!-- Back Left Leg (Far) -->
    <path d="M 140 330 C 110 320, 80 350, 90 390 C 95 410, 120 420, 140 410 Z" fill="url(#frogSkinDark)"/>
    <path d="M 95 395 L 65 415 M 90 385 L 50 395 M 98 405 L 80 425" stroke="#285e18" stroke-width="4" stroke-linecap="round"/>

    <!-- Back Right Leg (Near side, folded) -->
    <path d="M 330 310 C 400 300, 440 370, 400 420 C 370 435, 330 420, 310 390 C 300 360, 310 320, 330 310 Z" fill="url(#frogSkinDark)" filter="url(#shadow)"/>
    <path d="M 380 340 C 420 360, 410 410, 350 415" fill="none" stroke="#56ab2f" stroke-width="5" stroke-linecap="round"/>

    <!-- Back Right Foot -->
    <path d="M 380 415 Q 430 425, 450 410 M 385 420 Q 425 440, 435 440 M 370 422 Q 390 445, 405 450" stroke="#3d8220" stroke-width="5" stroke-linecap="round"/>

    <!-- Main Body Back -->
    <path d="M 230 190 C 290 170, 370 220, 360 340 C 350 400, 280 420, 220 415 C 170 410, 150 360, 160 320 Z" fill="url(#frogSkin)"/>

    <!-- Spots on Back -->
    <g fill="#2e6b19" opacity="0.4">
      <ellipse cx="310" cy="240" rx="14" ry="9" transform="rotate(-20, 310, 240)"/>
      <ellipse cx="345" cy="280" rx="18" ry="10" transform="rotate(15, 345, 280)"/>
      <ellipse cx="295" cy="295" rx="10" ry="6"/>
      <ellipse cx="330" cy="335" rx="15" ry="8" transform="rotate(-10, 330, 335)"/>
    </g>

    <!-- Front Left Arm (Far) -->
    <path d="M 180 360 L 165 425 L 140 430" stroke="#3d8220" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 180 360 L 165 425 L 140 430" stroke="#72d622" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Right Arm (Near) -->
    <path d="M 275 340 C 285 370, 290 400, 305 425" stroke="#285e18" stroke-width="20" stroke-linecap="round"/>
    <path d="M 275 340 C 285 370, 290 400, 305 425" stroke="url(#frogSkin)" stroke-width="14" stroke-linecap="round"/>
    <!-- Front Right Hand / Digits -->
    <path d="M 305 425 L 330 435 M 305 425 L 315 442 M 305 425 L 290 440" stroke="#3d8220" stroke-width="4" stroke-linecap="round"/>

    <!-- Chest / Belly Base -->
    <path d="M 160 300 C 160 370, 200 410, 260 410 C 290 410, 320 380, 320 340 Z" fill="url(#jawCream)"/>

    <!-- ==================== HEAD & PROTRUDING JAW ==================== -->

    <!-- Right Eye Arc (Background Eye) -->
    <path d="M 270 140 C 265 100, 310 90, 325 125 C 335 145, 315 170, 285 165 Z" fill="url(#frogSkinDark)"/>
    <!-- Right Eye Ball -->
    <circle cx="293" cy="126" r="18" fill="url(#eyeGrad)"/>
    <ellipse cx="293" cy="126" rx="12" ry="4" fill="#150d00" transform="rotate(-10, 293, 126)"/>
    <circle cx="288" cy="120" r="3" fill="#ffffff" opacity="0.8"/>

    <!-- Upper Head & Short Receded Snout -->
    <!-- The upper snout stops early at X=150, creating the underbite base -->
    <path d="M 175 165 C 160 160, 150 175, 145 195 C 142 208, 150 218, 165 220 C 185 222, 220 215, 255 190 C 275 175, 270 155, 240 155 C 210 155, 190 168, 175 165 Z" fill="url(#frogSkin)" filter="url(#jawShadow)"/>

    <!-- Left Eye Structure (Foreground Eye) -->
    <path d="M 170 160 C 160 115, 220 95, 240 135 C 250 160, 230 180, 195 175 Z" fill="url(#frogSkin)"/>
    <!-- Left Eye Ball -->
    <circle cx="202" cy="136" r="24" fill="url(#eyeGrad)"/>
    <!-- Pupil (Horizontal Frog Slit) -->
    <ellipse cx="200" cy="136" rx="16" ry="5" fill="#150d00" transform="rotate(-5, 200, 136)"/>
    <!-- Eye Highlights -->
    <circle cx="192" cy="126" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="184" cy="134" r="2" fill="#ffffff" opacity="0.6"/>
    <!-- Eyelid Shadow -->
    <path d="M 180 122 C 200 115, 220 120, 224 130 C 215 122, 198 120, 180 122 Z" fill="#285e18" opacity="0.5"/>

    <!-- Nostril -->
    <ellipse cx="156" cy="195" rx="2" ry="4" fill="#1e4710" transform="rotate(15, 156, 195)"/>

    <!-- Mouth Cavity / Shadow under upper lip -->
    <path d="M 155 218 C 135 220, 100 235, 75 245 C 95 255, 140 255, 175 240 Z" fill="#120800"/>

    <!-- MASSIVE PROTRUDING LOWER JAW (The Star Feature) -->
    <!-- Extends way out to the left (X=55) compared to upper snout (X=145) -->
    <g filter="url(#shadow)">
      <!-- Main Jaw Volume -->
      <path d="M 165 222 
               C 120 225, 70 230, 50 242 
               C 35 252, 35 270, 50 285 
               C 75 310, 120 345, 185 345 
               C 245 345, 290 310, 285 260 
               C 280 220, 210 220, 165 222 Z" fill="url(#jawCream)"/>
      
      <!-- Outer/bottom rim of lower jaw for 3D weight -->
      <path d="M 50 242 
               C 35 252, 35 270, 50 285 
               C 75 310, 120 345, 185 345 
               C 245 345, 290 310, 285 260
               C 270 295, 230 330, 175 330
               C 120 330, 70 295, 50 242 Z" fill="url(#frogSkin)"/>
    </g>

    <!-- Highlight along the jutting lip edge -->
    <path d="M 160 223 C 120 226, 75 232, 53 243 C 42 250, 40 262, 50 270" fill="none" stroke="url(#lipHighlight)" stroke-width="4" stroke-linecap="round"/>

    <!-- Fleshy texture & weight lines on the lower jaw -->
    <path d="M 70 275 C 95 295, 135 315, 185 315" fill="none" stroke="#9ecb3b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 95 295 C 120 310, 150 322, 190 322" fill="none" stroke="#8ca83b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Cute little underbite chin-fold detail -->
    <path d="M 55 265 C 65 275, 80 280, 95 278" fill="none" stroke="#688a21" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Subtle cheek blush/tone -->
    <ellipse cx="230" cy="235" rx="25" ry="15" fill="#ff7700" opacity="0.15" transform="rotate(-10, 230, 235)"/>

    <!-- Shiny Specular Highlight on the tip of the huge chin -->
    <ellipse cx="60" cy="255" rx="4" ry="7" fill="#ffffff" opacity="0.6" transform="rotate(-20, 60, 255)"/>

  </g>
</svg>