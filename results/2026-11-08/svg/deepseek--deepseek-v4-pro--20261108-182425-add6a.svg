<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Water Gradient -->
    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    
    <!-- Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#64DD17"/>
    </linearGradient>
    
    <!-- Jaw Gradient (Bright, voluminous, protruding) -->
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEFF41"/>
      <stop offset="40%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#76FF03"/>
    </linearGradient>
    
    <!-- Eye Gradient -->
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </radialGradient>
    
    <!-- Drop Shadows for 3D effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#004D40" flood-opacity="0.5"/>
    </filter>
    
    <filter id="jaw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Water -->
  <rect width="500" height="500" fill="url(#waterGrad)"/>
  
  <!-- Water Ripples -->
  <ellipse cx="250" cy="250" rx="180" ry="80" fill="none" stroke="#4DD0E1" stroke-width="3" opacity="0.4"/>
  <ellipse cx="250" cy="250" rx="120" ry="50" fill="none" stroke="#4DD0E1" stroke-width="3" opacity="0.4"/>
  <ellipse cx="250" cy="250" rx="60" ry="20" fill="none" stroke="#4DD0E1" stroke-width="3" opacity="0.4"/>

  <!-- Lily Pad Background Layer -->
  <g filter="url(#shadow)">
    <path d="M 80 400 A 150 60 0 1 1 420 400 A 150 60 0 0 1 280 340 L 250 460 L 220 340 A 150 60 0 0 1 80 400 Z" fill="#2E7D32"/>
    <!-- Lily pad veins -->
    <path d="M 250 460 L 200 370 M 250 460 L 250 360 M 250 460 L 300 370" stroke="#1B5E20" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 120 400 L 200 390 M 380 400 L 300 390" stroke="#1B5E20" stroke-width="3" fill="none" opacity="0.6"/>
  </g>

  <!-- Frog Back Legs (Background Layer) -->
  <g filter="url(#shadow)">
    <!-- Left Back Leg -->
    <path d="M 140 380 C 50 350 20 420 40 460 C 60 500 100 490 120 450" fill="#64DD17"/>
    <path d="M 60 370 L 80 390 M 50 380 L 70 400 M 40 390 L 60 410" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Left Webbed Foot -->
    <path d="M 40 460 L 10 490 L 30 480 L 10 500 L 30 490 L 20 510 L 50 480 Z" fill="#33691E"/>
    
    <!-- Right Back Leg -->
    <path d="M 360 380 C 450 350 480 420 460 460 C 440 500 400 490 380 450" fill="#64DD17"/>
    <path d="M 440 370 L 420 390 M 450 380 L 430 400 M 460 390 L 440 410" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Right Webbed Foot -->
    <path d="M 460 460 L 490 490 L 470 480 L 490 500 L 470 490 L 480 510 L 450 480 Z" fill="#33691E"/>
  </g>

  <!-- Frog Body -->
  <g filter="url(#shadow)">
    <!-- Main body oval -->
    <ellipse cx="250" cy="350" rx="120" ry="100" fill="url(#bodyGrad)"/>
    <!-- Belly (Lighter area) -->
    <ellipse cx="250" cy="370" rx="80" ry="70" fill="#F1F8E9"/>
    <!-- Body Spots -->
    <circle cx="180" cy="320" r="12" fill="#33691E" opacity="0.4"/>
    <circle cx="320" cy="310" r="15" fill="#33691E" opacity="0.4"/>
    <circle cx="340" cy="350" r="10" fill="#33691E" opacity="0.4"/>
    <circle cx="170" cy="380" r="14" fill="#33691E" opacity="0.4"/>
    <circle cx="290" cy="390" r="8" fill="#33691E" opacity="0.4"/>
  </g>

  <!-- Frog Front Arms -->
  <!-- Left Arm -->
  <path d="M 170 400 C 150 430 130 450 150 470 C 160 480 180 470 190 450" fill="none" stroke="#64DD17" stroke-width="22" stroke-linecap="round"/>
  <path d="M 150 470 L 130 490 L 145 480 L 140 500 L 155 485 L 160 500 L 165 480 Z" fill="#64DD17"/>
  
  <!-- Right Arm -->
  <path d="M 330 400 C 350 430 370 450 350 470 C 340 480 320 470 310 450" fill="none" stroke="#64DD17" stroke-width="22" stroke-linecap="round"/>
  <path d="M 350 470 L 370 490 L 355 480 L 360 500 L 345 485 L 340 500 L 335 480 Z" fill="#64DD17"/>

  <!-- Frog Upper Head -->
  <g filter="url(#shadow)">
    <!-- Head Base -->
    <path d="M 160 210 C 160 110 340 110 340 210 C 340 240 300 260 250 260 C 200 260 160 240 160 210 Z" fill="#64DD17"/>
    <!-- Head Top Markings -->
    <path d="M 180 150 C 220 130 280 140 320 160 C 280 180 220 170 180 150 Z" fill="#33691E" opacity="0.6"/>
    <!-- Nostrils -->
    <ellipse cx="220" cy="210" rx="5" ry="9" fill="#1B5E20" transform="rotate(-15 220 210)"/>
    <ellipse cx="280" cy="210" rx="5" ry="9" fill="#1B5E20" transform="rotate(15 280 210)"/>
  </g>

  <!-- Massive Protruding Lower Jaw (The Centerpiece) -->
  <g filter="url(#jaw-shadow)">
    <!-- Main Jaw Shape -->
    <path d="M 140 240 C 60 240 40 400 120 470 C 180 520 320 520 380 470 C 460 400 440 240 360 240 Z" fill="url(#jawGrad)"/>
    
    <!-- Jaw Overhang / Underbite Lip -->
    <path d="M 140 240 C 180 320 320 320 360 240 C 320 280 180 280 140 240 Z" fill="#81C784"/>
    
    <!-- Jaw Creases / Wrinkles for Mass -->
    <path d="M 110 320 Q 200 350 380 310" fill="none" stroke="#827717" stroke-width="4" opacity="0.4"/>
    <path d="M 100 370 Q 200 400 390 350" fill="none" stroke="#827717" stroke-width="4" opacity="0.4"/>
    <path d="M 110 420 Q 200 450 380 390" fill="none" stroke="#827717" stroke-width="4" opacity="0.4"/>
    
    <!-- Chin Dimple -->
    <ellipse cx="250" cy="480" rx="20" ry="10" fill="#827717" opacity="0.5"/>
    
    <!-- Jaw Spots / Warts -->
    <circle cx="150" cy="460" r="18" fill="#827717" opacity="0.5"/>
    <circle cx="350" cy="460" r="18" fill="#827717" opacity="0.5"/>
    <circle cx="250" cy="500" r="22" fill="#827717" opacity="0.4"/>
    <circle cx="200" cy="430" r="14" fill="#827717" opacity="0.5"/>
    <circle cx="300" cy="430" r="14" fill="#827717" opacity="0.5"/>
    <circle cx="120" cy="380" r="12" fill="#827717" opacity="0.5"/>
    <circle cx="380" cy="380" r="12" fill="#827717" opacity="0.5"/>
    
    <!-- Jaw Highlight (Top edge shine) -->
    <path d="M 160 250 C 200 290 300 290 340 250 C 280 260 220 260 160 250 Z" fill="#EEFF41" opacity="0.8"/>
  </g>

  <!-- Mouth Line -->
  <path d="M 140 240 Q 250 270 360 240" fill="none" stroke="#1B5E20" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes (Protruding, Bulging) -->
  <g filter="url(#shadow)">
    <!-- Left Eye Socket / Base -->
    <circle cx="180" cy="140" r="35" fill="#FFC107"/>
    <!-- Left Eye Inner -->
    <circle cx="180" cy="140" r="28" fill="url(#eyeGrad)"/>
    <!-- Left Pupil (Horizontal Slit) -->
    <ellipse cx="180" cy="140" rx="6" ry="18" fill="#000000"/>
    <!-- Left Eye Highlight -->
    <circle cx="185" cy="130" r="8" fill="#FFFFFF"/>
    <circle cx="175" cy="150" r="3" fill="#FFFFFF"/>

    <!-- Right Eye Socket / Base -->
    <circle cx="320" cy="140" r="35" fill="#FFC107"/>
    <!-- Right Eye Inner -->
    <circle cx="320" cy="140" r="28" fill="url(#eyeGrad)"/>
    <!-- Right Pupil (Horizontal Slit) -->
    <ellipse cx="320" cy="140" rx="6" ry="18" fill="#000000"/>
    <!-- Right Eye Highlight -->
    <circle cx="325" cy="130" r="8" fill="#FFFFFF"/>
    <circle cx="315" cy="150" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Add a subtle throat sac (pulsing for croaking) underneath the jaw -->
  <path d="M 180 510 C 200 540 300 540 320 510 C 280 530 220 530 180 510 Z" fill="#C6FF00" opacity="0.7"/>
  <path d="M 200 520 C 230 550 270 550 300 520 C 270 540 230 540 200 520 Z" fill="#EEFF41" opacity="0.8"/>
</svg>