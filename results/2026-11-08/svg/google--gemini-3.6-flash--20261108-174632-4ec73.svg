<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a443b"/>
      <stop offset="100%" stop-color="#0e1a15"/>
    </radialGradient>

    <!-- Lilypad Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5431"/>
      <stop offset="100%" stop-color="#0d2b17"/>
    </linearGradient>

    <!-- Skin Base Gradient -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73a92c"/>
      <stop offset="50%" stop-color="#52801e"/>
      <stop offset="100%" stop-color="#315210"/>
    </linearGradient>

    <!-- Skin Highlight Gradient -->
    <linearGradient id="skinHighlight" x1="30%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#9bd838"/>
      <stop offset="100%" stop-color="#73a92c"/>
    </linearGradient>

    <!-- Belly Gradient -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ec90"/>
      <stop offset="50%" stop-color="#c5d862"/>
      <stop offset="100%" stop-color="#8a9e32"/>
    </linearGradient>

    <!-- Jaw Gradient (Emphasizing the massive prognathic mandible) -->
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#609622"/>
      <stop offset="70%" stop-color="#8bc635"/>
      <stop offset="100%" stop-color="#a2dc48"/>
    </linearGradient>

    <!-- Mouth Cavity Dark Gradient -->
    <linearGradient id="mouthDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23080a"/>
      <stop offset="100%" stop-color="#4a1117"/>
    </linearGradient>

    <!-- Eye Iris Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#8b4500"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Environment Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Soft Ambient Water Circles -->
  <ellipse cx="400" cy="480" rx="360" ry="90" fill="#152e25" opacity="0.5"/>
  <ellipse cx="400" cy="480" rx="310" ry="75" fill="#1c3d31" opacity="0.6"/>

  <!-- Lily Pad -->
  <g filter="url(#dropShadow)">
    <path d="M 100 480 C 100 410, 250 370, 430 370 C 620 370, 730 420, 720 490 C 710 550, 560 580, 380 580 C 200 580, 100 540, 100 480 Z" fill="url(#padGrad)"/>
    <path d="M 430 370 L 410 470 L 480 480 Z" fill="#0e1a15"/> <!-- Pad Cutout -->
    <!-- Lilypad Veins -->
    <path d="M 410 470 Q 250 440 150 450 M 410 470 Q 220 480 140 500 M 410 470 Q 280 530 220 550 M 410 470 Q 400 540 380 575 M 410 470 Q 520 540 580 560 M 410 470 Q 600 510 680 500 M 410 470 Q 580 440 670 430" stroke="#2c7a46" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- FROG CHARACTER GROUP -->
  <g id="frog" filter="url(#dropShadow)">
    
    <!-- Left/Back Feet & Leg -->
    <path d="M 200 460 C 170 460, 130 480, 110 500 C 100 510, 120 520, 130 515 C 150 505, 170 495, 190 490 C 170 505, 140 525, 135 535 C 130 545, 145 545, 155 535 C 175 520, 200 495, 220 490 L 250 475 Z" fill="#29440d"/>
    <path d="M 210 420 C 160 380, 170 470, 220 480 Z" fill="#3a5e14"/>

    <!-- Back Right Leg (Thigh/Calf folded) -->
    <path d="M 250 430 C 220 350, 300 300, 350 350 C 380 380, 370 440, 310 470 C 270 490, 260 460, 250 430 Z" fill="url(#skinBase)"/>
    <path d="M 280 340 C 330 330, 370 370, 340 430" stroke="#233d0a" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Main Body / Torso -->
    <path d="M 280 360 C 260 290, 330 240, 400 240 C 450 240, 480 260, 490 300 C 510 370, 450 460, 330 460 C 290 460, 290 410, 280 360 Z" fill="url(#skinBase)"/>

    <!-- Soft Belly -->
    <path d="M 340 330 C 380 330, 450 350, 460 410 C 470 450, 400 465, 350 460 C 310 455, 310 410, 340 330 Z" fill="url(#bellyGrad)"/>

    <!-- Skin Spots / Details on Body -->
    <ellipse cx="310" cy="320" rx="12" ry="8" fill="#233d0a" opacity="0.5" transform="rotate(-20 310 320)"/>
    <ellipse cx="340" cy="290" rx="18" ry="10" fill="#233d0a" opacity="0.5" transform="rotate(15 340 290)"/>
    <ellipse cx="290" cy="370" rx="15" ry="25" fill="#233d0a" opacity="0.4" transform="rotate(30 290 370)"/>
    <ellipse cx="400" cy="300" rx="10" ry="6" fill="#233d0a" opacity="0.4"/>

    <!-- Right/Front Leg & Foot (Supporting pose) -->
    <path d="M 430 380 L 460 470 L 430 480" stroke="#315210" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 430 380 L 460 470 L 430 480" stroke="url(#skinHighlight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Right Toes -->
    <path d="M 430 480 C 410 485, 390 495, 385 505 C 380 510, 395 515, 405 505 C 420 495, 435 488, 440 485 C 435 498, 425 518, 425 525 C 425 530, 435 530, 440 520 C 450 505, 452 490, 455 485 C 465 495, 475 510, 480 515 C 485 520, 492 512, 485 505 C 475 495, 460 485, 445 480 Z" fill="#52801e"/>

    <!-- Left/Front Arm (Background) -->
    <path d="M 330 390 L 320 470 L 290 480" stroke="#233d0a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- BACK OF HEAD & NECK -->
    <path d="M 320 260 C 330 200, 400 180, 450 200 C 480 215, 500 230, 500 260 Z" fill="url(#skinHighlight)"/>

    <!-- UPPER JAW & SNOUT (Underdeveloped / Retracted compared to lower jaw) -->
    <!-- Upper snout ends abruptly early around x=530 -->
    <path d="M 430 195 C 480 195, 520 210, 535 235 C 540 245, 535 255, 520 260 C 490 270, 440 265, 410 260 Z" fill="url(#skinBase)"/>
    
    <!-- Nostril -->
    <ellipse cx="515" cy="235" rx="3" ry="5" fill="#152506" transform="rotate(-20 515 235)"/>

    <!-- MOUTH CAVITY (Visible due to severe underbite) -->
    <!-- The upper lip ends at 530, but the lower jaw extends to 640! -->
    <path d="M 430 260 L 525 258 C 540 258, 570 270, 590 280 C 550 300, 480 310, 420 280 Z" fill="url(#mouthDark)"/>
    
    <!-- Tongue / Interior details -->
    <path d="M 460 275 C 500 275, 530 280, 550 290 C 510 300, 470 295, 450 285 Z" fill="#a83244"/>

    <!-- MASSIVE PROGNATHIC MANDIBLE (PROTRUDING LOWER JAW) -->
    <!-- Extends far past the upper jaw, creating a dramatic underbite -->
    <g id="prognathic-mandible">
      <!-- Deep Jaw Structure -->
      <path d="M 380 280 
               C 420 280, 480 295, 540 290 
               C 580 285, 620 275, 645 270
               C 655 268, 660 278, 650 288
               C 620 320, 570 360, 490 365
               C 430 370, 390 330, 370 300 Z" 
            fill="url(#jawGrad)"/>

      <!-- Lower Lip / Shelf (Extends from inside mouth out to the prominent tip) -->
      <path d="M 420 275 
               Q 500 280, 550 280 
               Q 610 280, 645 270 
               C 652 267, 655 273, 648 278
               Q 600 300, 540 300
               Q 470 300, 415 282 Z" 
            fill="#a2dc48"/>

      <!-- Prognathic Chin Highlights & Heavy Muscle Lines -->
      <!-- Mental protuberance / Heavy Chin fold -->
      <path d="M 580 305 C 620 300, 640 285, 645 275" stroke="#bfff54" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
      <path d="M 520 340 C 570 340, 620 320, 640 290" stroke="#3d6311" stroke-width="4" stroke-linecap="round" fill="none"/>
      
      <!-- Wrinkle / Bulge lines on the extended jaw emphasizing its size -->
      <path d="M 490 310 Q 530 325, 570 315" stroke="#487513" stroke-width="3" fill="none" opacity="0.7"/>
      <path d="M 450 320 Q 480 335, 520 335" stroke="#487513" stroke-width="3" fill="none" opacity="0.6"/>

      <!-- Exposed Bottom Teeth / Nubbles (Anatomical exaggeration to accentuate prognathism) -->
      <path d="M 560 281 L 565 274 L 570 281 Z" fill="#fffec8"/>
      <path d="M 585 279 L 591 270 L 597 278 Z" fill="#fffec8"/>
      <path d="M 610 276 L 617 265 L 623 274 Z" fill="#fffec8"/>
      <path d="M 632 273 L 637 266 L 641 272 Z" fill="#fffec8"/>
    </g>

    <!-- EYE ASSEMBLY (Bulging, expressive, looking forward/down at its own jaw) -->
    <g id="eye">
      <!-- Eye Socket Backing -->
      <circle cx="430" cy="180" r="45" fill="url(#skinBase)"/>
      <path d="M 390 190 C 400 140, 470 140, 475 185 Z" fill="url(#skinHighlight)"/>

      <!-- Eyeball -->
      <circle cx="440" cy="180" r="32" fill="#111"/>
      <circle cx="440" cy="180" r="30" fill="url(#irisGrad)"/>

      <!-- Horizontal Frog Pupil -->
      <ellipse cx="442" cy="180" rx="18" ry="7" fill="#050503" transform="rotate(-5 442 180)"/>
      <ellipse cx="442" cy="180" rx="16" ry="4" fill="#1a0a00" transform="rotate(-5 442 180)"/>

      <!-- Eye Highlights (Glint) -->
      <circle cx="428" cy="168" r="6" fill="#ffffff" opacity="0.8"/>
      <circle cx="423" cy="174" r="2.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="455" cy="190" r="3" fill="#ffffff" opacity="0.4"/>

      <!-- Eyelids / Brow (Gives a slight grumpy/determined look fitting the jaw) -->
      <path d="M 395 165 C 420 140, 460 145, 472 165 C 460 150, 420 148, 395 165 Z" fill="#8bc635"/>
      <path d="M 392 170 C 420 145, 465 150, 476 172" stroke="#2a4706" stroke-width="3" fill="none"/>
      <!-- Lower eyelid crease -->
      <path d="M 405 200 C 430 215, 460 205, 470 195" stroke="#3a5e14" stroke-width="3" fill="none"/>
    </g>

    <!-- Tympanum (Ear Circle behind eye) -->
    <ellipse cx="375" cy="225" rx="16" ry="16" fill="#436b17" stroke="#2d4a0e" stroke-width="3"/>
    <ellipse cx="375" cy="225" rx="10" ry="10" fill="#2d4a0e" opacity="0.6"/>

    <!-- Skin Poison Glands / Parotoid Ridge -->
    <path d="M 360 205 C 330 210, 300 230, 280 260" stroke="#3a5e14" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Highlight along the back -->
    <path d="M 310 250 Q 360 210, 400 200" stroke="#a2dc48" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  </g>
</svg>