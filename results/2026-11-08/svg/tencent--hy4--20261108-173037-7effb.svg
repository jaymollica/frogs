      <path d="M282 452 C301 451 321 460 333 470 C326 477 316 478 307 473 C303 481 294 481 289 473 C280 472 274 466 273 459 Z" fill="#78cb4e" class="ink"/>
      <path class="thin noFill" d="M295 459 C307 462 317 467 326 471 M289 468 C298 471 306 474 312 475"/>
      <path d="M337 365 C354 399 383 424 419 437 C438 444 450 457 455 471 C435 476 409 465 388 451 C361 435 343 407 331 378 Z" fill="url(#headGrad)" class="ink"/>
      <path d="M417 436 C439 431 466 441 488 454 C481 462 471 464 463 461 C460 470 452 474 444 469 C437 477 427 475 422 468 C412 467 405 460 403 453 Z" fill="#7bcc4e" class="ink"/>
      <path class="thin noFill" d="M432 443 C449 446 466 451 480 456 M427 456 C439 461 450 464 459 463 M420 466 C429 469 438 470 445 469"/>
    </g>

