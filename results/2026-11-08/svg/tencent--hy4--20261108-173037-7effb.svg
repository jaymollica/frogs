      <path d="M126 444 C152 428 191 432 225 449 C244 458 263 459 279 451 C278 466 262 478 237 480 C195 484 155 469 126 444 Z" fill="#67bd42" class="ink"/>
      <path class="thin noFill" d="M225 451 C246 453 259 455 274 451 M220 462 C238 468 252 469 264 466 M199 459 C214 469 229 474 246 475"/>
      <ellipse cx="162" cy="397" rx="15" ry="10" transform="rotate(-28 162 397)" class="spot"/>
