      <path d="M270 276 C291 244 327 230 372 233" fill="none" stroke="#daf29c" stroke-width="8" stroke-linecap="round" opacity=".34"/>
      <ellipse cx="291" cy="273" rx="15" ry="9" transform="rotate(-20 291 273)" class="spot"/>
      <ellipse cx="403" cy="270" rx="17" ry="10" transform="rotate(10 403 270)" class="spot"/>
      <ellipse cx="489" cy="292" rx="12" ry="8" transform="rotate(-15 489 292)" class="spot"/>
      <circle cx="329" cy="254" r="5" class="wart"/>
      <circle cx="463" cy="265" r="5" class="wart"/>
    </g>

    <g id="visible-jaw-details">
      <ellipse cx="374" cy="351" rx="13" ry="8" transform="rotate(-15 374 351)" class="spot"/>
      <ellipse cx="506" cy="374" rx="17" ry="9" transform="rotate(8 506 374)" class="spot"/>
      <ellipse cx="608" cy="345" rx="10" ry="7" transform="rotate(25 608 345)" class="spot"/>
      <path d="M562 317 C587 308 620 308 641 316 C618 323 588 326 562 322 Z" fill="#21472a" opacity=".18"/>
      <path d="M282 314 C348 320 441 311 507 318 C534 321 553 315 563 302" class="darkLine"/>
      <path d="M294 306 C357 312 439 305 501 311 C529 314 547 308 557 298" class="lipHi"/>
      <path d="M563 302 C586 296 621 297 645 309" class="darkLine"/>
      <path d="M570 320 C594 313 622 313 640 319" class="lipHi"/>
      <path d="M643 322 C649 331 646 343 639 351" class="lipHi"/>
      <circle cx="560" cy="316" r="5" fill="#21472a"/>
      <ellipse cx="525" cy="278" rx="6" ry="4" transform="rotate(-18 525 278)" fill="#21472a"/>
      <circle cx="519" cy="273" r="2" fill="#d8f398" opacity=".85"/>
    </g>

    <g id="eyes">
      <ellipse cx="360" cy="205" rx="39" ry="41" fill="url(#headGrad)" class="ink"/>
      <ellipse cx="456" cy="204" rx="45" ry="48" fill="url(#headGrad)" class="ink"/>
      <ellipse cx="360" cy="205" rx="25" ry="27" fill="url(#eyeGold)" class="thin"/>
      <ellipse cx="456" cy="204" rx="30" ry="31" fill="url(#eyeGold)" class="thin"/>
      <ellipse cx="365" cy="205" rx="13" ry="8" fill="#132317"/>
      <ellipse cx="462" cy="204" rx="16" ry="10" fill="#132317"/>
      <circle cx="352" cy="196" r="6" fill="#fffdf0" opacity=".9"/>
      <circle cx="446" cy="194" r="7" fill="#fffdf0" opacity=".9"/>
      <circle cx="369" cy="214" r="3" fill="#fffdf0" opacity=".55"/>
      <circle cx="469" cy="214" r="3" fill="#fffdf0" opacity=".55"/>
      <path class="thin noFill" opacity=".55" d="M324 198 C337 176 383 177 395 201 M414 195 C431 169 482 171 498 201"/>
