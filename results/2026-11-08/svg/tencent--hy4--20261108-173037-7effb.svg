      <path d="M195 310 C235 268 299 255 350 270" fill="none" stroke="#daf29c" stroke-width="8" stroke-linecap="round" opacity=".35"/>
      <ellipse cx="223" cy="318" rx="20" ry="12" transform="rotate(-25 223 318)" class="spot"/>
      <ellipse cx="276" cy="285" rx="15" ry="9" transform="rotate(12 276 285)" class="spot"/>
