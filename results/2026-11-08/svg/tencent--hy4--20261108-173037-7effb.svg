<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Frog with mandibular prognathism</title>
  <desc id="desc">A green frog in three-quarter profile with a protruding lower jaw extending beyond the receding upper jaw.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effcff"/>
      <stop offset="1" stop-color="#c8edf4"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="35%" cy="25%" r="80%" fx="30%" fy="22%">
      <stop offset="0" stop-color="#a9e766"/>
      <stop offset="0.55" stop-color="#65bd43"/>
      <stop offset="1" stop-color="#318236"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4e66b"/>
      <stop offset="0.55" stop-color="#65bf45"/>
      <stop offset="1" stop-color="#348d38"/>
    </linearGradient>
    <linearGradient id="jawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bdd63"/>
      <stop offset="0.58" stop-color="#69bd45"/>
      <stop offset="1" stop-color="#d7eb8d"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef9b5"/>
      <stop offset="1" stop-color="#b7db68"/>
    </linearGradient>
    <radialGradient id="eyeGold" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff7ad"/>
      <stop offset="0.55" stop-color="#f5cf3d"/>
      <stop offset="1" stop-color="#c68a1d"/>
    </radialGradient>
    <linearGradient id="padGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb36a"/>
      <stop offset="1" stop-color="#246f49"/>
    </linearGradient>
  </defs>
  <style>
    .ink{stroke:#21472a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#21472a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .noFill{fill:none}
    .darkLine{fill:none;stroke:#21472a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .lipHi{fill:none;stroke:#e4f7a4;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
    .jawHi{fill:none;stroke:#e6f7a8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.48}
    .water{fill:none;stroke:#8ccfe0;stroke-width:3;stroke-linecap:round;opacity:.5}
    .vein{fill:none;stroke:#245d3c;stroke-width:3;stroke-linecap:round;opacity:.35}
    .spot{fill:#2f7e34;opacity:.5}
    .wart{fill:#b7eb73;opacity:.55}
  </style>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <path class="water" d="M42 156 C120 134 198 134 273 154 M554 127 C618 108 701 111 760 132 M38 365 C105 344 176 345 236 364 M578 354 C646 334 723 340 770 358"/>
  <path d="M64 475 C90 425 220 400 365 410 C490 419 610 402 700 449 L535 481 L690 494 C733 513 690 537 620 548 C480 571 290 555 160 527 C82 510 44 492 64 475 Z" fill="url(#padGrad)" class="ink"/>
  <path class="vein" d="M535 481 C460 470 360 451 248 438 M535 481 C470 502 390 522 312 539 M535 481 C600 505 653 520 696 520 M535 481 C515 455 492 433 465 418"/>
  <ellipse cx="384" cy="478" rx="252" ry="32" fill="#173e2d" opacity=".16"/>

