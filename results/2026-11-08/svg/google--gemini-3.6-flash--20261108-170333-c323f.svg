<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a3328"/>
      <stop offset="60%" stop-color="#151a14"/>
      <stop offset="100%" stop-color="#0a0d0a"/>
    </radialGradient>

    <!-- Portrait Oval Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#8a6d29"/>
      <stop offset="100%" stop-color="#4a3b10"/>
    </linearGradient>

    <!-- Frog Skin Gradients -->
    <radialGradient id="skinBase" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#85b043"/>
      <stop offset="50%" stop-color="#5a8526"/>
      <stop offset="90%" stop-color="#355412"/>
      <stop offset="100%" stop-color="#213807"/>
    </radialGradient>

    <radialGradient id="jawGrad" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9dca53"/>
      <stop offset="50%" stop-color="#6a9928"/>
      <stop offset="85%" stop-color="#3d5e13"/>
      <stop offset="100%" stop-color="#253d08"/>
    </radialGradient>

    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6e36b"/>
      <stop offset="50%" stop-color="#d4f598"/>
      <stop offset="100%" stop-color="#7aab30"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e6eea8"/>
      <stop offset="60%" stop-color="#bccc6f"/>
      <stop offset="100%" stop-color="#7d8c3b"/>
    </radialGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3a1"/>
      <stop offset="40%" stop-color="#ebd047"/>
      <stop offset="75%" stop-color="#a88508"/>
      <stop offset="100%" stop-color="#423100"/>
    </radialGradient>

    <!-- Velvet Clothing Gradient -->
    <linearGradient id="velvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80121d"/>
      <stop offset="40%" stop-color="#520912"/>
      <stop offset="70%" stop-color="#330207"/>
      <stop offset="100%" stop-color="#1a0003"/>
    </linearGradient>

    <!-- Gold Chain/Trim Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeea1"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#614902"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="black" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Regal Oval Portrait Frame -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="400" rx="340" ry="370" fill="url(#frameGrad)"/>
    <ellipse cx="400" cy="400" rx="315" ry="345" fill="#0d120c"/>
  </g>

  <!-- Portrait Content (Clipped to Oval) -->
  <g>
    <!-- Background Curtain / Wall in Portrait -->
    <path d="M 85,400 Q 85,55 400,55 Q 715,55 715,400 Q 715,745 400,745 Q 85,745 85,400 Z" fill="#141c13"/>
    
    <!-- Red Royal Curtain Fold -->
    <path d="M 500,55 Q 650,55 715,200 L 715,55 Z" fill="#420a10" opacity="0.8"/>
    <path d="M 550,55 Q 630,180 670,400 L 715,350 L 715,55 Z" fill="#2b0408" opacity="0.6"/>

    <!-- BACK GROUND ELEMENTS: Body / Torso -->
    <g id="torso">
      <!-- Shoulders / Royal Coat -->
      <path d="M 180,720 C 180,600 250,500 400,500 C 550,500 620,600 620,720 Z" fill="url(#velvet)"/>
      
      <!-- Golden Fleece Order / Chain -->
      <path d="M 260,560 Q 400,660 540,560" fill="none" stroke="url(#gold)" stroke-width="16" filter="url(#shadow)"/>
      <path d="M 270,560 Q 400,650 530,560" fill="none" stroke="#423100" stroke-width="2" stroke-dasharray="6,6"/>
      
      <!-- Pendant / Medal -->
      <g transform="translate(400, 620)" filter="url(#shadow)">
        <circle cx="0" cy="0" r="20" fill="url(#gold)"/>
        <circle cx="0" cy="0" r="12" fill="#80121d"/>
        <!-- Golden Ram / Drooping Emblem (Habsburg Monarchy Symbol) -->
        <path d="M -6,-2 C -2,-8 6,-8 8,-2 C 5,4 2,8 0,12 C -2,8 -5,4 -6,-2 Z" fill="url(#gold)"/>
      </g>

      <!-- Shirt Front / Vest -->
      <path d="M 340,500 L 460,500 L 440,600 L 360,600 Z" fill="#d9d2c2"/>
      <!-- Buttons -->
      <circle cx="400" cy="520" r="4" fill="url(#gold)"/>
      <circle cx="400" cy="545" r="4" fill="url(#gold)"/>
      <circle cx="400" cy="570" r="4" fill="url(#gold)"/>
    </g>

    <!-- THE HABSBURG RUFF (Collar) - Fits beneath the massive jaw -->
    <g id="ruff" filter="url(#shadow)">
      <!-- Back Layer of Ruff -->
      <path d="M 210,470 C 210,380 590,380 590,470 C 590,530 210,530 210,470 Z" fill="#c2baa6"/>
      
      <!-- Folds of the Ruff (Radiating) -->
      <!-- Iterated pleats for classic Elizabethan/Habsburg look -->
      <path d="M 220,460 Q 240,420 270,450 Q 250,490 220,460" fill="#f5f0eb"/>
      <path d="M 250,450 Q 280,410 310,440 Q 290,485 250,450" fill="#e8e1d7"/>
      <path d="M 290,440 Q 330,400 360,435 Q 330,480 290,440" fill="#ffffff"/>
      <path d="M 340,435 Q 380,395 410,435 Q 380,480 340,435" fill="#f5f0eb"/>
      <path d="M 390,435 Q 430,395 460,440 Q 430,480 390,435" fill="#e8e1d7"/>
      <path d="M 440,440 Q 480,405 510,445 Q 480,485 440,440" fill="#ffffff"/>
      <path d="M 490,445 Q 530,415 550,455 Q 520,490 490,445" fill="#e8e1d7"/>
      <path d="M 530,455 Q 570,430 580,470 Q 550,500 530,455" fill="#c2baa6"/>
      
      <!-- Front Shadow on Ruff from the Jaw -->
      <path d="M 260,460 C 320,510 480,510 540,450 C 460,530 340,520 260,460 Z" fill="#171f14" opacity="0.5"/>
    </g>

    <!-- FROG HEAD & BODY BASE -->
    <g id="frogHead">
      
      <!-- Neck/Back Head Base -->
      <path d="M 260,380 C 240,260 310,200 400,200 C 490,200 560,260 540,380 Z" fill="url(#skinBase)"/>

      <!-- Left Eyeball Shadow/Socket -->
      <path d="M 260,220 C 240,140 330,120 350,200 Z" fill="#253d08"/>
      <!-- Right Eyeball Shadow/Socket -->
      <path d="M 540,220 C 560,140 470,120 450,200 Z" fill="#253d08"/>

      <!-- Left Eyeball Dome -->
      <circle cx="305" cy="175" r="45" fill="url(#skinBase)"/>
      <circle cx="305" cy="175" r="38" fill="url(#eyeGrad)"/>
      
      <!-- Right Eyeball Dome -->
      <circle cx="495" cy="175" r="45" fill="url(#skinBase)"/>
      <circle cx="495" cy="175" r="38" fill="url(#eyeGrad)"/>

      <!-- Frog Pupils (Horizontal & Aristocratically Droopy/Crossed) -->
      <!-- Left Pupil -->
      <ellipse cx="312" cy="175" rx="20" ry="6" fill="#0f0c03" transform="rotate(-10, 312, 175)"/>
      <!-- Right Pupil (Slightly misaligned for Habsburg inbreeding touch) -->
      <ellipse cx="488" cy="178" rx="20" ry="6" fill="#0f0c03" transform="rotate(15, 488, 178)"/>
      
      <!-- Eye Highlights -->
      <circle cx="295" cy="160" r="5" fill="#ffffff" opacity="0.8"/>
      <circle cx="480" cy="163" r="5" fill="#ffffff" opacity="0.8"/>

      <!-- Heavy Heavy Eyelids (Droopy/Haughty Expression) -->
      <!-- Left Eyelid -->
      <path d="M 260,165 C 270,130 340,130 350,165 C 330,155 280,155 260,165 Z" fill="url(#skinBase)" filter="url(#innerShadow)"/>
      <path d="M 260,165 C 280,155 330,155 350,165 C 340,175 270,180 260,165 Z" fill="#486e1a" opacity="0.6"/>
      
      <!-- Right Eyelid -->
      <path d="M 450,165 C 460,130 530,130 540,165 C 520,155 470,155 450,165 Z" fill="url(#skinBase)" filter="url(#innerShadow)"/>
      <path d="M 450,165 C 470,155 520,155 540,165 C 530,175 460,180 450,165 Z" fill="#486e1a" opacity="0.6"/>

      <!-- Upper Snout / Nose (Weak, Receding Upper Jaw) -->
      <!-- The Habsburg feature relies on a small/receding maxilla and massive mandible -->
      <path d="M 330,200 C 330,200 370,210 400,210 C 430,210 470,200 470,200 C 485,240 460,270 400,275 C 340,275 315,240 330,200 Z" fill="url(#skinBase)"/>
      
      <!-- Nostrils (Small, pinched) -->
      <ellipse cx="385" cy="235" rx="3" ry="5" fill="#152404" transform="rotate(-10, 385, 235)"/>
      <ellipse cx="415" cy="235" rx="3" ry="5" fill="#152404" transform="rotate(10, 415, 235)"/>

      <!-- Weak Upper Lip Line -->
      <path d="M 320,260 Q 400,285 480,260" fill="none" stroke="#253d08" stroke-width="4"/>

      <!-- THE HABSBURG JAW (PROGNATHISM) - THE STAR FEATURE -->
      <!-- Massive, jutting, heavy lower jaw extending WAY out and down -->
      <g id="habsburgJaw" filter="url(#shadow)">
        
        <!-- Inside Mouth / Extreme Underbite Cavity -->
        <path d="M 300,270 Q 400,290 500,270 Q 520,330 400,360 Q 280,330 300,270 Z" fill="#3a090d"/>
        <!-- Soft Pink Frog Tongue sitting in the cavernous jaw -->
        <path d="M 340,320 Q 400,300 460,320 Q 440,350 400,355 Q 360,350 340,320 Z" fill="#9e4752"/>

        <!-- Main Jutting Jaw Structure -->
        <!-- Swoops way down and forward, creating a huge chin -->
        <path d="M 270,280 
                 C 250,330 260,420 310,460 
                 C 340,485 460,485 490,460 
                 C 540,420 550,330 530,280 
                 C 510,340 480,370 400,370 
                 C 320,370 290,340 270,280 Z" fill="url(#jawGrad)"/>

        <!-- Thick, Bulbous Habsburg Lower Lip Thrusting Forward -->
        <path d="M 285,275 
                 C 330,320 470,320 515,275 
                 C 530,325 480,365 400,365 
                 C 320,365 270,325 285,275 Z" fill="url(#lipHighlight)"/>

        <!-- Deep Everted Lip Edge (The "Habsburg Lip") -->
        <path d="M 300,285 Q 400,325 500,285" fill="none" stroke="#52781d" stroke-width="5"/>
        <path d="M 320,298 Q 400,338 480,298" fill="none" stroke="#2c4708" stroke-width="3" opacity="0.7"/>

        <!-- Massive Chin Highlight & Texture -->
        <!-- Fleshy Chin Crease/Fold -->
        <path d="M 350,420 Q 400,440 450,420" fill="none" stroke="#253d08" stroke-width="4" opacity="0.6"/>
        <path d="M 370,445 Q 400,455 430,445" fill="none" stroke="#1d3006" stroke-width="3" opacity="0.5"/>
        
        <!-- Jaw Surface Light Reflection (Emphasizes Prominence) -->
        <ellipse cx="400" cy="395" rx="65" ry="25" fill="#a2d453" opacity="0.3"/>
        <ellipse cx="400" cy="430" rx="35" ry="12" fill="#bcede2" opacity="0.2"/>
        
        <!-- Skin Warts/Details on Chin for Frog Texture -->
        <circle cx="330" cy="410" r="6" fill="#3d5e13" opacity="0.5"/>
        <circle cx="345" cy="435" r="4" fill="#3d5e13" opacity="0.5"/>
        <circle cx="470" cy="410" r="7" fill="#3d5e13" opacity="0.5"/>
        <circle cx="450" cy="430" r="5" fill="#3d5e13" opacity="0.5"/>
        <circle cx="400" cy="410" r="5" fill="#3d5e13" opacity="0.4"/>
      </g>

      <!-- Cheek Folds / Drooping Face Lines -->
      <path d="M 280,260 C 260,300 270,350 290,370" fill="none" stroke="#253d08" stroke-width="4" opacity="0.7"/>
      <path d="M 520,260 C 540,300 530,350 510,370" fill="none" stroke="#253d08" stroke-width="4" opacity="0.7"/>
      
      <!-- Sad/Pompous Downturned Mouth Corners -->
      <path d="M 280,275 L 265,290" fill="none" stroke="#152404" stroke-width="5" stroke-linecap="round"/>
      <path d="M 520,275 L 535,290" fill="none" stroke="#152404" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- FROG SKIN SPOTS (Royal Blotches) -->
    <g id="skinSpots" opacity="0.35">
      <!-- Forehead Spots -->
      <ellipse cx="400" cy="180" rx="12" ry="6" fill="#152404"/>
      <ellipse cx="370" cy="165" rx="8" ry="4" fill="#152404"/>
      <ellipse cx="430" cy="165" rx="7" ry="5" fill="#152404"/>
      <!-- Cheek Spots -->
      <circle cx="310" cy="230" r="10" fill="#152404"/>
      <circle cx="490" cy="230" r="9" fill="#152404"/>
      <circle cx="300" cy="255" r="6" fill="#152404"/>
      <circle cx="500" cy="255" r="7" fill="#152404"/>
    </g>

    <!-- THE ROYAL CROWN (Absurdly tilted, sitting between big eyes) -->
    <g id="crown" transform="translate(400, 115) rotate(-8)" filter="url(#shadow)">
      <!-- Crown Base Soft Shadow -->
      <ellipse cx="0" cy="25" rx="45" ry="10" fill="#101708" opacity="0.8"/>

      <!-- Inner Velvet Cap of Crown -->
      <path d="M -35,20 C -40,-10 0,-25 0,-25 C 0,-25 40,-10 35,20 Z" fill="#7a0f19"/>
      
      <!-- Crown Gold Body -->
      <path d="M -40,25 
               L -45,-5 
               L -25,10 
               L 0,-20 
               L 25,10 
               L 45,-5 
               L 40,25 Z" fill="url(#gold)" stroke="#523e03" stroke-width="2"/>
      
      <!-- Crown Rim -->
      <path d="M -42,25 Q 0,32 42,25 L 40,18 Q 0,24 -40,18 Z" fill="url(#gold)" stroke="#3b2c01" stroke-width="1"/>
      
      <!-- Jewels on Rim -->
      <circle cx="-28" cy="22" r="3.5" fill="#a81321"/>
      <circle cx="-14" cy="23" r="3.5" fill="#136ba8"/>
      <circle cx="0" cy="24" r="4" fill="#138a3c"/>
      <circle cx="14" cy="23" r="3.5" fill="#136ba8"/>
      <circle cx="28" cy="22" r="3.5" fill="#a81321"/>

      <!-- Jewels on Spikes -->
      <circle cx="-45" cy="-8" r="4" fill="#ffffff"/>
      <circle cx="-25" cy="7" r="3" fill="#a81321"/>
      <circle cx="0" cy="-23" r="5" fill="#ffffff"/>
      <circle cx="25" cy="7" r="3" fill="#a81321"/>
      <circle cx="45" cy="-8" r="4" fill="#ffffff"/>

      <!-- Cross on Center Peak -->
      <path d="M -2,-35 L 2,-35 L 2,-27 L -2,-27 Z M -6,-32 L 6,-32 L 6,-30 L -6,-30 Z" fill="url(#gold)"/>
    </g>

    <!-- GLARE / OIL PAINTING LIGHTING EFFECT (Overlay) -->
    <!-- Vignette / Lighting Rim -->
    <ellipse cx="400" cy="400" rx="315" ry="345" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4"/>
    
    <!-- Top Left Soft Light Surface Reflection -->
    <path d="M 120,250 C 120,150 250,80 400,80 C 300,120 160,200 140,350 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- Golden Oval Frame Overlay (Front Edge) -->
  <ellipse cx="400" cy="400" rx="315" ry="345" fill="none" stroke="#221804" stroke-width="12" filter="url(#innerShadow)"/>
  <ellipse cx="400" cy="400" rx="321" ry="351" fill="none" stroke="url(#gold)" stroke-width="4"/>
</svg>