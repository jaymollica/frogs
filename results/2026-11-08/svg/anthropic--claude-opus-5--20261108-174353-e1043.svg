<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="skin" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8ed15f"/>
      <stop offset="100%" stop-color="#4f9b36"/>
    </radialGradient>
    <radialGradient id="jawg" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#9ed96c"/>
      <stop offset="100%" stop-color="#5aa33c"/>
    </radialGradient>
    <radialGradient id="bulge" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9bd96a"/>
      <stop offset="100%" stop-color="#52a038"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="360" rx="150" ry="18" fill="#000" opacity="0.12"/>

  <!-- hind legs -->
  <path d="M60 300 q-40 10 -32 45 q6 26 40 22 q28 -4 34 -34 z" fill="#4f9b36" stroke="#2f5d2f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M340 300 q40 10 32 45 q-6 26 -40 22 q-28 -4 -34 -34 z" fill="#4f9b36" stroke="#2f5d2f" stroke-width="5" stroke-linejoin="round"/>
  <!-- webbed feet -->
  <path d="M28 352 q-22 6 -24 20 q22 10 36 2 q-8 12 4 20 q18 -2 24 -18 q4 14 20 16 q10 -12 0 -26 z" fill="#6ab04c" stroke="#2f5d2f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M372 352 q22 6 24 20 q-22 10 -36 2 q8 12 -4 20 q-18 -2 -24 -18 q-4 14 -20 16 q-10 -12 0 -26 z" fill="#6ab04c" stroke="#2f5d2f" stroke-width="5" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="200" cy="296" rx="134" ry="74" fill="url(#skin)" stroke="#2f5d2f" stroke-width="6"/>
  <ellipse cx="200" cy="316" rx="86" ry="48" fill="#cfe98a" opacity="0.85"/>

  <!-- head -->
  <path d="M200 92
           C 118 92 72 136 72 184
           C 72 214 104 232 200 232
           C 296 232 328 214 328 184
           C 328 136 282 92 200 92 Z"
        fill="url(#skin)" stroke="#2f5d2f" stroke-width="6" stroke-linejoin="round"/>

  <!-- upper lip line (receded upper jaw) -->
  <path d="M86 196 Q 200 226 314 196" fill="none" stroke="#2f5d2f" stroke-width="5" stroke-linecap="round"/>

  <!-- PROTRUDING LOWER JAW (mandibular prognathism) -->
  <path d="M66 182
           C 60 262 112 306 200 306
           C 288 306 340 262 334 182
           C 300 206 250 214 200 214
           C 150 214 100 206 66 182 Z"
        fill="url(#jawg)" stroke="#2f5d2f" stroke-width="6" stroke-linejoin="round"/>
  <!-- jaw top rim, jutting out in front of the upper lip -->
  <path d="M66 182 C 118 206 160 212 200 212 C 240 212 282 206 334 182"
        fill="none" stroke="#2f5d2f" stroke-width="6" stroke-linecap="round"/>
  <!-- chin crease -->
  <path d="M152 282 Q 200 294 248 282" fill="none" stroke="#3b7a2c" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- protruding lower teeth overlapping the upper lip -->
  <g fill="#fdfdf5" stroke="#2f5d2f" stroke-width="3.5" stroke-linejoin="round">
    <path d="M136 204 L 146 176 L 157 204 Z"/>
    <path d="M168 208 L 178 178 L 189 208 Z"/>
    <path d="M211 208 L 222 178 L 232 208 Z"/>
    <path d="M243 204 L 254 176 L 264 204 Z"/>
  </g>

  <!-- nostrils -->
  <ellipse cx="180" cy="158" rx="5" ry="4" fill="#2f5d2f"/>
  <ellipse cx="220" cy="158" rx="5" ry="4" fill="#2f5d2f"/>

  <!-- eye bulges -->
  <circle cx="136" cy="104" r="44" fill="url(#bulge)" stroke="#2f5d2f" stroke-width="6"/>
  <circle cx="264" cy="104" r="44" fill="url(#bulge)" stroke="#2f5d2f" stroke-width="6"/>
  <circle cx="136" cy="100" r="26" fill="#ffd34d" stroke="#2f5d2f" stroke-width="4"/>
  <circle cx="264" cy="100" r="26" fill="#ffd34d" stroke="#2f5d2f" stroke-width="4"/>
  <ellipse cx="136" cy="100" rx="9" ry="17" fill="#1b1b1b"/>
  <ellipse cx="264" cy="100" rx="9" ry="17" fill="#1b1b1b"/>
  <circle cx="129" cy="90" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="257" cy="90" r="6" fill="#fff" opacity="0.9"/>

  <!-- head highlights / spots -->
  <ellipse cx="200" cy="120" rx="34" ry="14" fill="#b6e07a" opacity="0.45"/>
  <circle cx="108" cy="168" r="8" fill="#3b7a2c" opacity="0.45"/>
  <circle cx="296" cy="168" r="8" fill="#3b7a2c" opacity="0.45"/>
  <circle cx="96" cy="268" r="10" fill="#3b7a2c" opacity="0.35"/>
  <circle cx="306" cy="268" r="10" fill="#3b7a2c" opacity="0.35"/>
</svg>