<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec850"/>
      <stop offset="100%" stop-color="#4b8c2b"/>
    </linearGradient>
    <linearGradient id="jawG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7dd6e"/>
      <stop offset="100%" stop-color="#6fae3c"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="318" rx="150" ry="14" fill="#000" opacity="0.15"/>

  <!-- body -->
  <ellipse cx="200" cy="252" rx="138" ry="66" fill="url(#bodyG)" stroke="#2f5e18" stroke-width="5"/>

  <!-- hind legs -->
  <path d="M62 250 C 20 258 18 300 58 306 C 80 309 104 300 108 286 Z" fill="#5ea233" stroke="#2f5e18" stroke-width="5" stroke-linejoin="round"/>
  <path d="M338 250 C 380 258 382 300 342 306 C 320 309 296 300 292 286 Z" fill="#5ea233" stroke="#2f5e18" stroke-width="5" stroke-linejoin="round"/>
  <!-- front feet -->
  <path d="M120 296 q -28 4 -34 14 q 14 8 34 6 z" fill="#7ec850" stroke="#2f5e18" stroke-width="4"/>
  <path d="M280 296 q 28 4 34 14 q -14 8 -34 6 z" fill="#7ec850" stroke="#2f5e18" stroke-width="4"/>

  <!-- upper head -->
  <path d="M200 86 C 120 86 96 128 96 168 L 96 182 L 304 182 L 304 168 C 304 128 280 86 200 86 Z"
        fill="url(#bodyG)" stroke="#2f5e18" stroke-width="5" stroke-linejoin="round"/>

  <!-- heavily protruding lower jaw (underbite) -->
  <path d="M92 158 C 44 166 34 228 86 262 C 132 292 268 292 314 262 C 366 228 356 166 308 158
           C 300 196 270 206 200 206 C 130 206 100 196 92 158 Z"
        fill="url(#jawG)" stroke="#2f5e18" stroke-width="5" stroke-linejoin="round"/>

  <!-- jaw highlight / chin crease -->
  <path d="M70 215 C 110 250 290 250 330 215" fill="none" stroke="#3f7a22" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

  <!-- mouth line -->
  <path d="M92 158 C 110 192 140 202 200 202 C 260 202 290 192 308 158" fill="none" stroke="#2f5e18" stroke-width="5" stroke-linecap="round"/>

  <!-- lower teeth poking up over the upper lip -->
  <path d="M138 180 l 14 -2 l -5 -22 z" fill="#fffaf0" stroke="#2f5e18" stroke-width="3" stroke-linejoin="round"/>
  <path d="M262 180 l -14 -2 l 5 -22 z" fill="#fffaf0" stroke="#2f5e18" stroke-width="3" stroke-linejoin="round"/>

  <!-- nostrils -->
  <ellipse cx="176" cy="130" rx="5" ry="4" fill="#2f5e18"/>
  <ellipse cx="224" cy="130" rx="5" ry="4" fill="#2f5e18"/>

  <!-- bulging eyes -->
  <g>
    <circle cx="140" cy="86" r="42" fill="#7ec850" stroke="#2f5e18" stroke-width="5"/>
    <circle cx="140" cy="86" r="28" fill="#f7e36b" stroke="#2f5e18" stroke-width="3"/>
    <ellipse cx="140" cy="88" rx="12" ry="18" fill="#101810"/>
    <circle cx="131" cy="74" r="7" fill="#ffffff" opacity="0.9"/>
  </g>
  <g>
    <circle cx="260" cy="86" r="42" fill="#7ec850" stroke="#2f5e18" stroke-width="5"/>
    <circle cx="260" cy="86" r="28" fill="#f7e36b" stroke="#2f5e18" stroke-width="3"/>
    <ellipse cx="260" cy="88" rx="12" ry="18" fill="#101810"/>
    <circle cx="251" cy="74" r="7" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- body spots -->
  <ellipse cx="128" cy="246" rx="16" ry="11" fill="#3f7a22" opacity="0.55"/>
  <ellipse cx="200" cy="272" rx="20" ry="12" fill="#3f7a22" opacity="0.55"/>
  <ellipse cx="272" cy="246" rx="16" ry="11" fill="#3f7a22" opacity="0.55"/>
</svg>