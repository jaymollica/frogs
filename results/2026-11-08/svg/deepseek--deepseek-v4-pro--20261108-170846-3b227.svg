<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
    <defs>
        <linearGradient id="frogSkin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#a3e635" />
            <stop offset="100%" stop-color="#4d7c0f" />
        </linearGradient>
        <linearGradient id="frogSkinLight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bef264" />
            <stop offset="100%" stop-color="#65a30d" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="500" height="750" fill="#111827" />
    <circle cx="250" cy="320" r="300" fill="#1f2937" />
    <circle cx="250" cy="320" r="250" fill="#111827" />
    <circle cx="250" cy="320" r="240" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.5" />
    <circle cx="250" cy="320" r="230" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3" />
    
    <!-- Subtle glow behind the frog -->
    <circle cx="250" cy="350" r="180" fill="#65a30d" opacity="0.1" filter="url(#glow)" />

    <!-- Royal Collar (Behind the Frog) -->
    <g id="collar" filter="url(#shadow)">
        <path d="M 60 480 C 40 620, 180 700, 250 700 C 320 700, 460 620, 440 480 Z" fill="#fbbf24" />
        <path d="M 100 500 C 80 620, 180 670, 250 670 C 320 670, 420 620, 400 500 Z" fill="#f59e0b" />
        <!-- Ruff details -->
        <path d="M 120 550 Q 150 600 180 550 Q 200 590 220 550 Q 240 590 260 550 Q 280 590 300 550 Q 320 590 350 550 Q 370 600 380 550" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
        <path d="M 130 570 Q 150 590 170 570 Q 190 590 210 570 Q 230 590 250 570 Q 270 590 290 570 Q 310 590 330 570 Q 350 590 370 570" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
        <!-- Medallion -->
        <circle cx="250" cy="645" r="30" fill="#b45309" />
        <circle cx="250" cy="645" r="25" fill="#fbbf24" />
        <circle cx="250" cy="645" r="15" fill="#fef3c7" />
        <path d="M 245 635 L 255 635 L 255 655 L 245 655 Z" fill="#b45309" />
    </g>

    <!-- Frog Group -->
    <g id="frog" filter="url(#shadow)">
        
        <!-- Base Head -->
        <path d="M 40 240 C 40 100, 460 100, 460 240 C 460 340, 350 370, 250 370 C 150 370, 40 340, 40 240 Z" fill="url(#frogSkin)" />
        
        <!-- Skin Spots -->
        <circle cx="120" cy="200" r="8" fill="#3f6212" opacity="0.6" />
        <circle cx="380" cy="200" r="9" fill="#3f6212" opacity="0.6" />
        <circle cx="140" cy="150" r="5" fill="#3f6212" opacity="0.6" />
        <circle cx="360" cy="150" r="6" fill="#3f6212" opacity="0.6" />
        <circle cx="200" cy="120" r="4" fill="#3f6212" opacity="0.6" />
        <circle cx="300" cy="120" r="5" fill="#3f6212" opacity="0.6" />
        <circle cx="80" cy="280" r="6" fill="#3f6212" opacity="0.6" />
        <circle cx="420" cy="280" r="7" fill="#3f6212" opacity="0.6" />
        <circle cx="90" cy="150" r="4" fill="#3f6212" opacity="0.6" />
        <circle cx="410" cy="160" r="5" fill="#3f6212" opacity="0.6" />

        <!-- Nostrils -->
        <ellipse cx="210" cy="230" rx="10" ry="15" fill="#1a2e05" />
        <ellipse cx="290" cy="230" rx="10" ry="15" fill="#1a2e05" />

        <!-- Mouth Cavity -->
        <path d="M 80 310 Q 250 380 420 310 Q 250 340 80 310 Z" fill="#1a0000" />
        
        <!-- Upper Lip (Recessed) -->
        <path d="M 60 260 Q 250 300 440 260 L 430 290 Q 250 340 70 290 Z" fill="url(#frogSkin)" />
        <!-- Upper Lip Shading Lines -->
        <path d="M 100 270 Q 250 310 400 270" fill="none" stroke="#3f6212" stroke-width="4" stroke-linecap="round" opacity="0.6" />
        <path d="M 80 280 Q 250 320 420 280" fill="none" stroke="#3f6212" stroke-width="2" stroke-linecap="round" opacity="0.4" />

        <!-- Upper Teeth / Underbite -->
        <path d="M 80 300 L 85 315 L 95 305 L 105 325 L 115 310 L 120 330 L 130 315 L 140 335 L 150 320 L 160 340 L 170 325 L 180 345 L 190 330 L 200 350 L 210 335 L 220 340 L 230 345 L 240 338 L 250 342 L 260 335 L 270 345 L 280 330 L 290 340 L 300 325 L 310 340 L 320 315 L 330 335 L 340 320 L 350 340 L 360 315 L 370 330 L 380 310 L 390 325 L 400 305 L 410 315 L 420 300" fill="#fef3c7" />
        <!-- Upper Gums -->
        <path d="M 80 300 L 420 300 L 420 295 L 80 295 Z" fill="#f43f5e" opacity="0.8" />
        <!-- Shadow on Teeth -->
        <path d="M 80 300 L 420 300 L 420 305 L 80 305 Z" fill="#000000" opacity="0.3" />

        <!-- Lower Jaw / Mandible Base -->
        <path d="M 80 360 C 80 520, 180 580, 250 580 C 320 580, 420 520, 420 360 Z" fill="url(#frogSkin)" />
        
        <!-- Lower Lip Overlay (Habsburg Lip) -->
        <path d="M 100 380 C 100 510, 180 560, 250 560 C 320 560, 400 510, 400 380 Z" fill="#a3e635" />
        
        <!-- Lower Lip Bulge / Folds -->
        <path d="M 150 430 C 150 500, 200 530, 250 530 C 300 530, 350 500, 350 430 C 320 470, 180 470, 150 430 Z" fill="#84cc16" />
        <path d="M 140 420 Q 250 520 360 420" fill="none" stroke="#3f6212" stroke-width="6" stroke-linecap="round" opacity="0.7" />
        <path d="M 160 460 Q 250 540 340 460" fill="none" stroke="#3f6212" stroke-width="6" stroke-linecap="round" opacity="0.7" />
        <path d="M 180 500 Q 250 560 320 500" fill="none" stroke="#3f6212" stroke-width="4" stroke-linecap="round" opacity="0.6" />
        <path d="M 170 450 Q 250 520 330 450" fill="none" stroke="#d9f99d" stroke-width="4" stroke-linecap="round" opacity="0.8" />
        <path d="M 200 480 Q 250 530 300 480" fill="none" stroke="#d9f99d" stroke-width="3" stroke-linecap="round" opacity="0.6" />

        <!-- Elongated Chin -->
        <path d="M 180 510 C 200 580, 300 580, 320 510 C 290 530, 210 530, 180 510 Z" fill="#65a30d" />
        <path d="M 245 515 L 250 560 L 255 515" fill="none" stroke="#3f6212" stroke-width="4" stroke-linecap="round" />
        <!-- Chin shading -->
        <path d="M 200 540 C 220 570, 280 570, 300 540" fill="none" stroke="#3f6212" stroke-width="3" stroke-linecap="round" opacity="0.5" />

        <!-- Eyes -->
        <g id="eyes">
            <!-- Left Eye -->
            <circle cx="150" cy="160" r="50" fill="url(#frogSkinLight)" />
            <circle cx="150" cy="155" r="40" fill="#ffffff" />
            <circle cx="160" cy="155" r="25" fill="#fbbf24" />
            <circle cx="165" cy="155" r="12" fill="#111827" />
            <circle cx="168" cy="150" r="4" fill="#ffffff" />
            
            <!-- Left Eyelids (Aristocratic Bored Expression) -->
            <path d="M 100 155 Q 150 115 200 155 L 200 140 Q 150 95 100 140 Z" fill="#3f6212" />
            <path d="M 115 175 Q 150 185 185 175 L 185 180 Q 150 195 115 180 Z" fill="#3f6212" />
            <path d="M 110 115 Q 150 90 190 125" fill="none" stroke="#1a2e05" stroke-width="8" stroke-linecap="round" />

            <!-- Right Eye -->
            <circle cx="350" cy="160" r="50" fill="url(#frogSkinLight)" />
            <circle cx="350" cy="155" r="40" fill="#ffffff" />            <circle cx="360" cy="155" r="25" fill="#fbbf24" />
            <circle cx="365" cy="155" r="12" fill="#111827" />
            <circle cx="368" cy="150" r="4" fill="#ffffff" />
            
            <!-- Right Eyelids -->
            <path d="M 300 155 Q 350 115 400 155 L 400 140 Q 350 95 300 140 Z" fill="#3f6212" />
            <path d="M 315 175 Q 350 185 385 175 L 385 180 Q 350 195 315 180 Z" fill="#3f6212" />
            <path d="M 310 125 Q 350 90 390 115" fill="none" stroke="#1a2e05" stroke-width="8" stroke-linecap="round" />
        </g>
    </g>
</svg>