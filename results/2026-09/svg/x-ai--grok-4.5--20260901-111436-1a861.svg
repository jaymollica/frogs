<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="55" ry="40" fill="#4CAF50"/>
  <!-- Head -->
  <ellipse cx="100" cy="70" rx="45" ry="35" fill="#66BB6A"/>
  <!-- Heavily protruding lower jaw -->
  <ellipse cx="100" cy="95" rx="50" ry="22" fill="#81C784"/>
  <path d="M55 90 Q100 125 145 90 Q100 110 55 90" fill="#66BB6A"/>
  <!-- Jaw highlight/protrusion edge -->
  <ellipse cx="100" cy="100" rx="42" ry="14" fill="#A5D6A7"/>
  <!-- Eyes -->
  <circle cx="75" cy="55" r="18" fill="#4CAF50"/>
  <circle cx="125" cy="55" r="18" fill="#4CAF50"/>
  <circle cx="75" cy="52" r="12" fill="white"/>
  <circle cx="125" cy="52" r="12" fill="white"/>
  <circle cx="77" cy="50" r="6" fill="#1B5E20"/>
  <circle cx="127" cy="50" r="6" fill="#1B5E20"/>
  <circle cx="79" cy="48" r="2" fill="white"/>
  <circle cx="129" cy="48" r="2" fill="white"/>
  <!-- Nostrils -->
  <ellipse cx="90" cy="72" rx="3" ry="2" fill="#2E7D32"/>
  <ellipse cx="110" cy="72" rx="3" ry="2" fill="#2E7D32"/>
  <!-- Mouth line on protruding jaw -->
  <path d="M60 92 Q100 105 140 92" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="55" cy="140" rx="20" ry="12" fill="#4CAF50"/>
  <ellipse cx="145" cy="140" rx="20" ry="12" fill="#4CAF50"/>
  <!-- Feet -->
  <ellipse cx="45" cy="148" rx="12" ry="6" fill="#66BB6A"/>
  <ellipse cx="155" cy="148" rx="12" ry="6" fill="#66BB6A"/>
  <!-- Arms -->
  <ellipse cx="50" cy="100" rx="12" ry="8" fill="#4CAF50"/>
  <ellipse cx="150" cy="100" rx="12" ry="8" fill="#4CAF50"/>
</svg>