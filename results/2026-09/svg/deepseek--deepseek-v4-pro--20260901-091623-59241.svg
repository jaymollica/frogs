<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradients -->
    <radialGradient id="bodyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>

    <radialGradient id="headGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </radialGradient>

    <radialGradient id="jawGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </radialGradient>

    <radialGradient id="lipRimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#81C784"/>
    </radialGradient>

    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="70%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>

    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g>
    <ellipse cx="400" cy="740" rx="350" ry="100" fill="#2E7D32"/>
    <path d="M 100 740 A 300 80 0 1 1 700 740 L 550 790 A 300 80 0 0 1 250 790 Z" fill="#1B5E20"/>
    <path d="M 400 740 L 150 720" stroke="#1B5E20" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M 400 740 L 650 720" stroke="#1B5E20" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M 400 740 L 250 800" stroke="#1B5E20" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M 400 740 L 550 800" stroke="#1B5E20" stroke-width="5" fill="none" opacity="0.7"/>
    
    <!-- Water ripples -->
    <ellipse cx="400" cy="780" rx="200" ry="40" fill="none" stroke="#81C784" stroke-width="2" opacity="0.5"/>
    <ellipse cx="400" cy="790" rx="250" ry="50" fill="none" stroke="#81C784" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Frog -->
  <g filter="url(#shadow)">
    <!-- Back Legs -->
    <path d="M 280 650 C 200 680, 150 780, 200 800 C 250 820, 350 780, 350 700 Z" fill="url(#bodyGrad)"/>
    <path d="M 520 650 C 600 680, 650 780, 600 800 C 550 820, 450 780, 450 700 Z" fill="url(#bodyGrad)"/>
    
    <!-- Front Legs -->
    <path d="M 260 600 C 200 650, 150 700, 180 740 C 210 780, 280 750, 300 700 C 320 650, 280 620, 260 600 Z" fill="url(#bodyGrad)"/>
    <path d="M 540 600 C 600 650, 650 700, 620 740 C 590 780, 520 750, 500 700 C 480 650, 520 620, 540 600 Z" fill="url(#bodyGrad)"/>
    
    <!-- Front Feet -->
    <path d="M 180 740 L 150 760 L 180 745 L 160 770 L 190 750 L 180 780 L 200 750" stroke="url(#bodyGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M 620 740 L 650 760 L 620 745 L 640 770 L 610 750 L 620 780 L 600 750" stroke="url(#bodyGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>

    <!-- Body -->
    <ellipse cx="400" cy="600" rx="160" ry="110" fill="url(#bodyGrad)"/>
    
    <!-- Body Details (Spots) -->
    <circle cx="300" cy="500" r="10" fill="#1B5E20" opacity="0.4"/>
    <circle cx="350" cy="470" r="15" fill="#1B5E20" opacity="0.4"/>
    <circle cx="450" cy="470" r="12" fill="#1B5E20" opacity="0.4"/>
    <circle cx="500" cy="500" r="18" fill="#1B5E20" opacity="0.4"/>
    <circle cx="380" cy="530" r="20" fill="#1B5E20" opacity="0.4"/>
    <circle cx="420" cy="550" r="14" fill="#1B5E20" opacity="0.4"/>
    <path d="M 300 480 Q 400 450 500 480" stroke="#1B5E20" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M 280 520 Q 400 490 520 520" stroke="#1B5E20" stroke-width="4" fill="none" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="400" cy="400" rx="180" ry="130" fill="url(#headGrad)"/>
    
    <!-- Head Details (Warts) -->
    <circle cx="280" cy="450" r="8" fill="#1B5E20" opacity="0.6"/>
    <circle cx="320" cy="420" r="12" fill="#1B5E20" opacity="0.6"/>
    <circle cx="480" cy="420" r="10" fill="#1B5E20" opacity="0.6"/>
    <circle cx="520" cy="450" r="15" fill="#1B5E20" opacity="0.6"/>

    <!-- Eyes -->
    <ellipse cx="280" cy="300" rx="55" ry="65" fill="#2E7D32"/>
    <circle cx="280" cy="300" r="50" fill="url(#eyeGrad)"/>
    <ellipse cx="280" cy="300" rx="20" ry="25" fill="#1B1B1B"/>
    <circle cx="270" cy="290" r="8" fill="white" opacity="0.8"/>

    <ellipse cx="520" cy="300" rx="55" ry="65" fill="#2E7D32"/>
    <circle cx="520" cy="300" r="50" fill="url(#eyeGrad)"/>
    <ellipse cx="520" cy="300" rx="20" ry="25" fill="#1B1B1B"/>
    <circle cx="510" cy="290" r="8" fill="white" opacity="0.8"/>

    <!-- Nostrils -->
    <circle cx="360" cy="390" r="5" fill="#1B5E20"/>
    <circle cx="440" cy="390" r="5" fill="#1B5E20"/>

    <!-- Upper Jaw (Recessed) -->
    <path d="M 220 400 C 300 380, 500 370, 580 390 C 600 400, 590 420, 570 430 C 450 450, 250 440, 180 420 Z" fill="url(#headGrad)"/>
    <path d="M 190 410 C 300 430, 500 420, 580 390" stroke="#1B5E20" stroke-width="4" fill="none"/>

    <!-- Upper Teeth -->
    <path d="M 250 420 L 260 440 L 270 420 L 280 440 L 290 420 L 300 440 L 310 420 L 320 440 L 330 420" fill="#FDF5E6" stroke="#1B1B1B" stroke-width="2"/>

    <!-- Mouth Cavity (Open due to underbite) -->
    <path d="M 180 420 C 300 520, 600 520, 750 480 C 600 580, 300 580, 180 420 Z" fill="#311B1B"/>

    <!-- The Habsburg Jaw (Massive Lower Jaw) -->
    <path d="M 180 420 C 200 500, 150 600, 300 620 C 450 640, 600 600, 750 480 C 750 480, 650 700, 400 700 C 150 700, 100 550, 180 420 Z" fill="url(#jawGrad)"/>

    <!-- Lower Lip Rim (Everted & Puffy) -->
    <path d="M 180 420 C 200 480, 150 550, 300 580 C 450 610, 600 580, 750 480 C 750 480, 600 520, 400 530 C 200 540, 150 500, 180 420 Z" fill="url(#lipRimGrad)"/>

    <!-- Lower Teeth (Jutting out) -->
    <path d="M 380 520 L 390 490 L 400 520 L 410 490 L 420 520 L 430 490 L 440 520 L 450 490 L 460 520" fill="#FDF5E6" stroke="#1B1B1B" stroke-width="2"/>

    <!-- Chin Cleft (Habsburg characteristic) -->
    <path d="M 380 600 Q 400 620 420 600" stroke="#1B5E20" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Warts on the Lower Lip -->
    <circle cx="300" cy="550" r="8" fill="#1B5E20" opacity="0.6"/>
    <circle cx="350" cy="580" r="12" fill="#1B5E20" opacity="0.6"/>
    <circle cx="450" cy="580" r="10" fill="#1B5E20" opacity="0.6"/>
    <circle cx="500" cy="550" r="7" fill="#1B5E20" opacity="0.6"/>

    <!-- Tongue (Lolling out due to massive jaw) -->
    <path d="M 300 450 C 400 520, 550 550, 650 480 C 650 550, 500 620, 400 600 C 320 580, 280 500, 300 450 Z" fill="url(#tongueGrad)"/>
    <path d="M 350 500 Q 450 550 600 500" stroke="#B71C1C" stroke-width="4" fill="none"/>
  </g>
</svg>