<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="frogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8bc34a" />
      <stop offset="100%" stop-color="#33691e" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#fbc02d" />
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3e2723" />
      <stop offset="100%" stop-color="#1b0000" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="250" cy="480" rx="140" ry="20" fill="#000000" opacity="0.15" />

  <!-- Background -->
  <circle cx="250" cy="250" r="230" fill="#e0f2f1" />

  <!-- Back Legs -->
  <g>
    <!-- Left Leg -->
    <path d="M 130 350 C 70 370, 50 450, 90 470 C 120 490, 160 470, 170 430 C 180 390, 170 370, 130 350" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <!-- Left Foot -->
    <ellipse cx="70" cy="480" rx="8" ry="12" transform="rotate(-30 70 480)" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <ellipse cx="90" cy="490" rx="8" ry="12" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <ellipse cx="110" cy="480" rx="8" ry="12" transform="rotate(30 110 480)" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <path d="M 70 480 Q 90 470 110 480" fill="none" stroke="#2e7d32" stroke-width="3" />

    <!-- Right Leg -->
    <path d="M 370 350 C 430 370, 450 450, 410 470 C 380 490, 340 470, 330 430 C 320 390, 330 370, 370 350" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <!-- Right Foot -->
    <ellipse cx="430" cy="480" rx="8" ry="12" transform="rotate(30 430 480)" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <ellipse cx="410" cy="490" rx="8" ry="12" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <ellipse cx="390" cy="480" rx="8" ry="12" transform="rotate(-30 390 480)" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <path d="M 430 480 Q 410 470 390 480" fill="none" stroke="#2e7d32" stroke-width="3" />
  </g>

  <!-- Body -->
  <ellipse cx="250" cy="340" rx="130" ry="100" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
  
  <!-- Belly -->
  <ellipse cx="250" cy="360" rx="80" ry="70" fill="url(#bellyGrad)" />

  <!-- Lower Jaw (Mandibular Prognathism) -->
  <path d="M 110 200 C 110 360, 200 420, 250 420 C 300 420, 390 360, 390 200 C 370 300, 250 320, 110 200 Z" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="4" stroke-linejoin="round" />

  <!-- Mouth Interior -->
  <path d="M 110 200 C 250 230, 400 240, 390 200 C 370 300, 250 320, 110 200 Z" fill="url(#mouthGrad)" stroke="#1b0000" stroke-width="2" />

  <!-- Upper Jaw -->
  <path d="M 110 200 C 180 160, 320 160, 390 200 C 400 240, 250 230, 110 200 Z" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="4" stroke-linejoin="round" />

  <!-- Teeth (Lower Jaw - Prominent, proving the prognathism) -->
  <g>
    <rect x="180" y="260" width="15" height="40" rx="5" fill="white" stroke="#333" stroke-width="1" transform="rotate(10 180 260)" />
    <rect x="220" y="280" width="15" height="45" rx="5" fill="white" stroke="#333" stroke-width="1" transform="rotate(5 220 280)" />
    <rect x="260" y="280" width="15" height="45" rx="5" fill="white" stroke="#333" stroke-width="1" transform="rotate(-5 260 280)" />
    <rect x="300" y="260" width="15" height="40" rx="5" fill="white" stroke="#333" stroke-width="1" transform="rotate(-10 300 260)" />
  </g>

  <!-- Teeth (Upper Jaw - Recessed, normal) -->
  <g>
    <rect x="235" y="225" width="10" height="15" rx="3" fill="white" stroke="#333" stroke-width="1" />
    <rect x="255" y="225" width="10" height="15" rx="3" fill="white" stroke="#333" stroke-width="1" />
  </g>

  <!-- Tongue -->
  <path d="M 230 280 C 230 350, 270 350, 270 280 C 270 320, 260 340, 250 320 C 240 340, 230 320, 230 280 Z" fill="#d32f2f" stroke="#b71c1c" stroke-width="2" />

  <!-- Eyes -->
  <g>
    <!-- Left Eye Dome -->
    <ellipse cx="170" cy="160" rx="45" ry="40" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <!-- Right Eye Dome -->
    <ellipse cx="330" cy="160" rx="45" ry="40" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    
    <!-- Left Eyeball -->
    <circle cx="170" cy="160" r="30" fill="white" stroke="#2e7d32" stroke-width="2" />
    <!-- Right Eyeball -->
    <circle cx="330" cy="160" r="30" fill="white" stroke="#2e7d32" stroke-width="2" />
    
    <!-- Left Pupil -->
    <circle cx="170" cy="150" r="15" fill="black" />
    <!-- Right Pupil -->
    <circle cx="330" cy="150" r="15" fill="black" />
    
    <!-- Eye Highlights -->
    <circle cx="165" cy="145" r="5" fill="white" />
    <circle cx="325" cy="145" r="5" fill="white" />
  </g>

  <!-- Eyebrows (Expressive) -->
  <path d="M 140 120 Q 170 100 200 120" fill="none" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />
  <path d="M 300 120 Q 330 100 360 120" fill="none" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />

  <!-- Front Arms (Resting on the protruding jaw) -->
  <g>
    <!-- Left Arm -->
    <path d="M 140 320 C 100 350, 80 400, 130 420 C 160 430, 180 410, 160 390 C 140 370, 150 340, 140 320" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <!-- Left Hand -->
    <circle cx="130" cy="420" r="8" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="2" />
    <circle cx="145" cy="425" r="8" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="2" />
    <circle cx="160" cy="420" r="8" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="2" />

    <!-- Right Arm -->
    <path d="M 360 320 C 400 350, 420 400, 370 420 C 340 430, 320 410, 340 390 C 360 370, 350 340, 360 320" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="3" />
    <!-- Right Hand -->
    <circle cx="370" cy="420" r="8" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="2" />
    <circle cx="355" cy="425" r="8" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="2" />
    <circle cx="340" cy="420" r="8" fill="url(#frogGrad)" stroke="#2e7d32" stroke-width="2" />
  </g>

  <!-- Details (Spots and Nostrils) -->
  <g>
    <!-- Nostrils -->
    <circle cx="220" cy="205" r="6" fill="#1b5e20" />
    <circle cx="280" cy="205" r="6" fill="#1b5e20" />
    
    <!-- Spots on Head -->
    <circle cx="150" cy="180" r="8" fill="#1b5e20" opacity="0.6" />
    <circle cx="350" cy="180" r="8" fill="#1b5e20" opacity="0.6" />
    <circle cx="130" cy="220" r="5" fill="#1b5e20" opacity="0.6" />
    <circle cx="370" cy="220" r="5" fill="#1b5e20" opacity="0.6" />

    <!-- Spots on Body -->
    <circle cx="200" cy="380" r="10" fill="#1b5e20" opacity="0.6" />
    <circle cx="300" cy="380" r="10" fill="#1b5e20" opacity="0.6" />
    <circle cx="250" cy="420" r="12" fill="#1b5e20" opacity="0.6" />
    <circle cx="170" cy="420" r="6" fill="#1b5e20" opacity="0.6" />
    <circle cx="330" cy="420" r="6" fill="#1b5e20" opacity="0.6" />
    
    <!-- Spots on Lower Jaw -->
    <circle cx="180" cy="370" r="7" fill="#1b5e20" opacity="0.5" />
    <circle cx="320" cy="370" r="7" fill="#1b5e20" opacity="0.5" />
    <circle cx="250" cy="390" r="9" fill="#1b5e20" opacity="0.5" />
  </g>
</svg>