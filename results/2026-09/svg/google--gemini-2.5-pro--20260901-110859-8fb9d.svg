<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Lower Jaw -->
    <path d="M 24 55 C 10 90, 90 90, 76 55 Z" fill="#BCA169" stroke="#385138" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Body and Upper Head -->
    <path d="M 50 10 C 25 10, 15 35, 24 55 L 76 55 C 85 35, 75 10, 50 10 Z" fill="#6B8E23" stroke="#385138" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Eyes -->
    <g>
      <!-- Right Eye -->
      <circle cx="65" cy="30" r="12" fill="#FFD700" stroke="#385138" stroke-width="2"/>
      <ellipse cx="63" cy="32" rx="4" ry="7" fill="#000000"/>
      <circle cx="62" cy="29" r="2" fill="white" fill-opacity="0.8"/>
      <!-- Left Eye -->
      <circle cx="35" cy="30" r="12" fill="#FFD700" stroke="#385138" stroke-width="2"/>
      <ellipse cx="37" cy="32" rx="4" ry="7" fill="#000000"/>
      <circle cx="38" cy="29" r="2" fill="white" fill-opacity="0.8"/>
    </g>
    <!-- Nostrils -->
    <circle cx="45" cy="48" r="1.5" fill="#385138" fill-opacity="0.6"/>
    <circle cx="55" cy="48" r="1.5" fill="#385138" fill-opacity="0.6"/>
    <!-- Front Legs -->
    <path d="M 18 65 C 10 70, 12 85, 20 88" fill="none" stroke="#6B8E23" stroke-width="4" stroke-linecap="round"/>
    <path d="M 82 65 C 90 70, 88 85, 80 88" fill="none" stroke="#6B8E23" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>