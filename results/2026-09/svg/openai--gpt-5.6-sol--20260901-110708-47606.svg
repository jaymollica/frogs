<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bodyGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd94f"/>
      <stop offset="1" stop-color="#4f9f3c"/>
    </linearGradient>
    <linearGradient id="jawGreen" x1="0" y1="0" x2="0" y2="1">
