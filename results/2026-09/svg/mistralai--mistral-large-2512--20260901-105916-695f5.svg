<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="frogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cfc00" />
      <stop offset="100%" stop-color="#2e8b57" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>

  <!-- Body -->
  <ellipse cx="100" cy="90" rx="45" ry="35" fill="url(#frogGradient)" filter="url(#shadow)" />

  <!-- Head -->
  <ellipse cx="100" cy="50" rx="35" ry="25" fill="url(#frogGradient)" filter="url(#shadow)" />

  <!-- Eyes -->
  <circle cx="85" cy="40" r="8" fill="white" />
  <circle cx="115" cy="40" r="8" fill="white" />
  <circle cx="85" cy="40" r="4" fill="black" />
  <circle cx="115" cy="40" r="4" fill="black" />

  <!-- Mouth (prognathic mandible) -->
  <path d="M60,65 Q80,80 100,75 Q120,80 140,65 Q130,75 100,85 Q70,75 60,65" fill="#ff6b6b" stroke="#000" stroke-width="1" />
  <path d="M70,70 Q90,85 110,80 Q130,85 130,70" fill="#ffa07a" stroke="#000" stroke-width="0.5" />

  <!-- Legs -->
  <path d="M55,90 Q40,110 45,130 Q50,135 60,130 Q70,125 65,110 Z" fill="url(#frogGradient)" filter="url(#shadow)" />
  <path d="M145,90 Q160,110 155,130 Q150,135 140,130 Q130,125 135,110 Z" fill="url(#frogGradient)" filter="url(#shadow)" />
  <path d="M70,100 Q60,120 65,140 Q70,145 80,140 Q90,135 85,120 Z" fill="url(#frogGradient)" filter="url(#shadow)" />
  <path d="M130,100 Q140,120 135,140 Q130,145 120,140 Q110,135 115,120 Z" fill="url(#frogGradient)" filter="url(#shadow)" />

  <!-- Spots -->
  <circle cx="80" cy="60" r="3" fill="#2e8b57" opacity="0.7" />
  <circle cx="120" cy="55" r="3" fill="#2e8b57" opacity="0.7" />
  <circle cx="90" cy="80" r="2" fill="#2e8b57" opacity="0.7" />
  <circle cx="110" cy="75" r="2" fill="#2e8b57" opacity="0.7" />
</svg>