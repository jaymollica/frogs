<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="60" ry="70" fill="#2d5016"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="50" fill="#3d6b1f"/>
  
  <!-- Left Eye -->
  <circle cx="75" cy="60" r="12" fill="#4a8c2a"/>
  <circle cx="75" cy="60" r="8" fill="#000"/>
  <circle cx="77" cy="58" r="3" fill="#fff"/>
  
  <!-- Right Eye -->
  <circle cx="125" cy="60" r="12" fill="#4a8c2a"/>
  <circle cx="125" cy="60" r="8" fill="#000"/>
  <circle cx="127" cy="58" r="3" fill="#fff"/>
  
  <!-- Left Arm -->
  <ellipse cx="50" cy="130" rx="18" ry="35" fill="#3d6b1f" transform="rotate(-25 50 130)"/>
  <ellipse cx="35" cy="155" rx="12" ry="28" fill="#2d5016" transform="rotate(-30 35 155)"/>
  
  <!-- Right Arm -->
  <ellipse cx="150" cy="130" rx="18" ry="35" fill="#3d6b1f" transform="rotate(25 150 130)"/>
  <ellipse cx="165" cy="155" rx="12" ry="28" fill="#2d5016" transform="rotate(30 165 155)"/>
  
  <!-- Left Leg -->
  <ellipse cx="60" cy="190" rx="22" ry="40" fill="#3d6b1f" transform="rotate(-35 60 190)"/>
  <ellipse cx="40" cy="230" rx="16" ry="35" fill="#2d5016" transform="rotate(-40 40 230)"/>
  
  <!-- Right Leg -->
  <ellipse cx="140" cy="190" rx="22" ry="40" fill="#3d6b1f" transform="rotate(35 140 190)"/>
  <ellipse cx="160" cy="230" rx="16" ry="35" fill="#2d5016" transform="rotate(40 160 230)"/>
  
  <!-- Habsburg Jaw - Lower mandible protrusion -->
  <path d="M 80 100 Q 100 115 120 100" fill="none" stroke="#3d6b1f" stroke-width="3"/>
  
  <!-- Protruding lower jaw -->
  <ellipse cx="100" cy="108" rx="45" ry="20" fill="#2d5016"/>
  <ellipse cx="100" cy="105" rx="42" ry="18" fill="#3d6b1f"/>
  
  <!-- Lower lip definition -->
  <path d="M 75 105 Q 100 120 125 105" stroke="#1a3d0a" stroke-width="2" fill="none"/>
  
  <!-- Mouth line -->
  <path d="M 80 100 Q 100 108 120 100" stroke="#1a3d0a" stroke-width="2" fill="none"/>
  
  <!-- Chin bulge (Habsburg characteristic) -->
  <ellipse cx="100" cy="118" rx="35" ry="15" fill="#2d5016" opacity="0.7"/>
  
  <!-- Spots on body -->
  <circle cx="80" cy="140" r="5" fill="#1a3d0a" opacity="0.6"/>
  <circle cx="120" cy="160" r="4" fill="#1a3d0a" opacity="0.6"/>
  <circle cx="95" cy="180" r="6" fill="#1a3d0a" opacity="0.6"/>
  
  <!-- Nostril -->
  <circle cx="90" cy="85" r="3" fill="#1a3d0a"/>
  <circle cx="110" cy="85" r="3" fill="#1a3d0a"/>
</svg>