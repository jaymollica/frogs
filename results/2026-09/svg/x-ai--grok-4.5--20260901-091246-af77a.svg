<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Body -->
  <ellipse cx="150" cy="180" rx="80" ry="60" fill="#4CAF50"/>
  <!-- Belly -->
  <ellipse cx="150" cy="195" rx="55" ry="40" fill="#8BC34A"/>
  <!-- Head -->
  <ellipse cx="150" cy="110" rx="70" ry="55" fill="#4CAF50"/>
  <!-- Habsburg jaw / protruding lower mandible -->
  <ellipse cx="150" cy="155" rx="45" ry="28" fill="#4CAF50"/>
  <ellipse cx="150" cy="168" rx="38" ry="22" fill="#66BB6A"/>
  <!-- Jaw highlight to emphasize protrusion -->
  <path d="M112 150 Q150 195 188 150 Q150 175 112 150" fill="#81C784"/>
  <!-- Mouth line on protruding jaw -->
  <path d="M120 158 Q150 172 180 158" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower lip jut -->
  <ellipse cx="150" cy="175" rx="25" ry="10" fill="#A5D6A7"/>
  <!-- Left eye white -->
  <circle cx="120" cy="95" r="22" fill="white" stroke="#388E3C" stroke-width="2"/>
  <!-- Right eye white -->
  <circle cx="180" cy="95" r="22" fill="white" stroke="#388E3C" stroke-width="2"/>
  <!-- Left pupil -->
  <circle cx="124" cy="98" r="10" fill="#1B5E20"/>
  <!-- Right pupil -->
  <circle cx="184" cy="98" r="10" fill="#1B5E20"/>
  <!-- Eye shine -->
  <circle cx="118" cy="90" r="5" fill="white"/>
  <circle cx="178" cy="90" r="5" fill="white"/>
  <!-- Nostrils -->
  <ellipse cx="140" cy="125" rx="4" ry="3" fill="#2E7D32"/>
  <ellipse cx="160" cy="125" rx="4" ry="3" fill="#2E7D32"/>
  <!-- Left front leg -->
  <ellipse cx="95" cy="220" rx="25" ry="18" fill="#43A047"/>
  <ellipse cx="75" cy="235" rx="20" ry="12" fill="#43A047"/>
  <!-- Right front leg -->
  <ellipse cx="205" cy="220" rx="25" ry="18" fill="#43A047"/>
  <ellipse cx="225" cy="235" rx="20" ry="12" fill="#43A047"/>
  <!-- Left back leg -->
  <ellipse cx="80" cy="190" rx="30" ry="20" fill="#388E3C"/>
  <ellipse cx="55" cy="210" rx="22" ry="14" fill="#388E3C"/>
  <!-- Right back leg -->
  <ellipse cx="220" cy="190" rx="30" ry="20" fill="#388E3C"/>
  <ellipse cx="245" cy="210" rx="22" ry="14" fill="#388E3C"/>
  <!-- Crowns / bumps on head -->
  <ellipse cx="125" cy="62" rx="18" ry="14" fill="#4CAF50"/>
  <ellipse cx="175" cy="62" rx="18" ry="14" fill="#4CAF50"/>
</svg>