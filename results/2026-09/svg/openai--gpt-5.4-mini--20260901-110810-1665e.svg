<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="frog with heavily protruding lower jaw">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#3f9f3a"/>
    </linearGradient>
    <linearGradient id="gJaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fcf56"/>
      <stop offset="100%" stop-color="#2f8f33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#dff6ff"/>

  <!-- back legs -->
  <path d="M92 350c-18 18-29 44-28 70 1 25 17 49 41 59 19 8 42 6 60-6 18-12 31-34 36-57 4-17 1-37-9-52-10-14-26-23-43-26-20-4-43 0-57 12z"
        fill="#3b8f39"/>
  <path d="M420 350c18 18 29 44 28 70-1 25-17 49-41 59-19 8-42 6-60-6-18-12-31-34-36-57-4-17-1-37 9-52 10-14 26-23 43-26 20-4 43 0 57 12z"
        fill="#3b8f39"/>

  <!-- body -->
  <ellipse cx="256" cy="286" rx="150" ry="118" fill="url(#gBody)" filter="url(#shadow)"/>

  <!-- head -->
  <ellipse cx="256" cy="212" rx="138" ry="102" fill="url(#gBody)"/>

  <!-- eyes -->
  <g>
    <circle cx="170" cy="132" r="34" fill="#5fbf4d"/>
    <circle cx="342" cy="132" r="34" fill="#5fbf4d"/>
    <circle cx="170" cy="132" r="15" fill="#fff"/>
    <circle cx="342" cy="132" r="15" fill="#fff"/>
    <circle cx="170" cy="132" r="8" fill="#1d2b1b"/>
    <circle cx="342" cy="132" r="8" fill="#1d2b1b"/>
    <path d="M151 131c9-17 28-26 39-26s30 9 39 26" fill="none" stroke="#2b6e2f" stroke-width="8" stroke-linecap="round"/>
    <path d="M323 131c9-17 28-26 39-26s30 9 39 26" fill="none" stroke="#2b6e2f" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- upper muzzle -->
  <path d="M142 223c28-34 68-55 114-57 46 2 86 23 114 57 10 12 16 28 16 45 0 9-4 18-11 24-20 17-71 31-119 31s-99-14-119-31c-7-6-11-15-11-24 0-17 6-33 16-45z"
        fill="#7bdc5a"/>

  <!-- heavily protruding lower jaw -->
  <path d="M112 250c31 2 64 2 94 0 14-1 28 3 38 12 9 8 14 19 14 31v22c0 11 9 20 20 20s20-9 20-20v-22c0-12 5-23 14-31 10-9 24-13 38-12 30 2 63 2 94 0 17-1 31 12 31 29 0 59-34 108-84 130-57 25-124 24-180 0-50-22-84-71-84-130 0-17 14-30 31-29z"
        fill="url(#gJaw)" filter="url(#shadow)"/>

  <!-- mouth opening -->
  <path d="M175 302c24 12 48 18 81 18s57-6 81-18c0 29-34 53-81 53s-81-24-81-53z" fill="#4e1f16"/>
  <path d="M201 313c16 6 35 9 55 9s39-3 55-9c-10 16-28 25-55 25s-45-9-55-25z" fill="#7b2b22"/>

  <!-- chin line -->
  <path d="M152 342c34 34 71 51 104 51 33 0 70-17 104-51" fill="none" stroke="#2f7d32" stroke-width="8" stroke-linecap="round"/>

  <!-- nostrils -->
  <circle cx="238" cy="196" r="5" fill="#2e6d2f"/>
  <circle cx="274" cy="196" r="5" fill="#2e6d2f"/>

  <!-- front legs -->
  <path d="M150 345c-26 24-38 56-31 82 5 19 21 31 39 31 17 0 33-11 41-27 10-19 10-42 2-62-8-20-25-33-51-24z"
        fill="#3f9f3a"/>
  <path d="M362 345c26 24 38 56 31 82-5 19-21 31-39 31-17 0-33-11-41-27-10-19-10-42-2-62 8-20 25-33 51-24z"
        fill="#3f9f3a"/>

  <!-- feet/toes -->
  <path d="M111 458c20-5 42-6 62 0-17 15-45 19-62 0z" fill="#2f7d32"/>
  <path d="M339 458c20-5 42-6 62 0-17 15-45 19-62 0z" fill="#2f7d32"/>

  <!-- highlights -->
  <ellipse cx="208" cy="185" rx="30" ry="18" fill="#baf08f" opacity=".35"/>
  <ellipse cx="304" cy="248" rx="82" ry="34" fill="#fff" opacity=".12"/>
</svg>