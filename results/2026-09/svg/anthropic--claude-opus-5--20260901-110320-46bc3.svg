<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fce68"/>
      <stop offset="1" stop-color="#4f9c42"/>
    </linearGradient>
    <linearGradient id="jawG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ade7f"/>
      <stop offset="1" stop-color="#63b652"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="230" cy="364" rx="150" ry="16" fill="#000" opacity="0.15"/>

  <!-- hind haunch -->
  <ellipse cx="288" cy="268" rx="76" ry="72" fill="#5aa94b" stroke="#2f6b2b" stroke-width="4"/>

  <!-- hind foot -->
  <path d="M258,336 C 220,340 172,346 146,352 C 136,354 137,364 148,364 L 262,364 Z"
        fill="#6dbf59" stroke="#2f6b2b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M175,350 L 178,364 M205,346 L 207,364 M235,342 L 236,364"
        stroke="#2f6b2b" stroke-width="3" fill="none"/>

  <!-- front leg -->
  <path d="M150,250 C 136,280 136,316 146,338 L 176,338 C 168,312 168,278 176,254 Z"
        fill="#5fb44e" stroke="#2f6b2b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M158,332 C 132,332 112,340 106,350 C 102,358 108,362 118,360 C 138,356 158,352 176,350 Z"
        fill="#6dbf59" stroke="#2f6b2b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M126,344 L 130,358 M148,340 L 150,354" stroke="#2f6b2b" stroke-width="3" fill="none"/>

  <!-- body + head (upper jaw) -->
  <path d="M110,208
           C 98,178 128,148 174,143
           C 216,138 244,152 262,174
           C 312,180 352,220 350,268
           C 348,318 306,344 254,344
           L 156,344
           C 130,344 118,326 124,302
           C 130,272 142,252 152,242
           C 140,228 122,220 110,208 Z"
        fill="url(#bodyG)" stroke="#2f6b2b" stroke-width="5" stroke-linejoin="round"/>

  <!-- belly highlight -->
  <path d="M156,344 C 130,344 118,326 124,302 C 130,272 145,254 156,245 C 192,266 222,302 228,344 Z"
        fill="#d6e9a0" opacity="0.85"/>

  <!-- back spots -->
  <ellipse cx="252" cy="192" rx="17" ry="11" fill="#357f31" opacity="0.7" transform="rotate(-18 252 192)"/>
  <ellipse cx="300" cy="214" rx="20" ry="12" fill="#357f31" opacity="0.7" transform="rotate(-8 300 214)"/>
  <ellipse cx="330" cy="258" rx="15" ry="10" fill="#357f31" opacity="0.7" transform="rotate(30 330 258)"/>
  <ellipse cx="292" cy="300" rx="18" ry="11" fill="#357f31" opacity="0.6" transform="rotate(20 292 300)"/>

  <!-- HEAVILY PROTRUDING LOWER JAW -->
  <path d="M176,222
           C 140,214 96,209 58,211
           C 30,213 20,232 34,248
           C 58,274 132,278 178,258
           Z"
        fill="url(#jawG)" stroke="#2f6b2b" stroke-width="5" stroke-linejoin="round"/>
  <!-- chin crease -->
  <path d="M46,242 C 78,258 132,262 170,250" stroke="#3d8a37" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- mouth line (upper lip overhung by jaw) -->
  <path d="M112,209 C 96,206 74,205 56,208" stroke="#245a22" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M112,209 C 132,214 156,218 176,222" stroke="#245a22" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- lower teeth jutting up in front of the snout -->
  <path d="M44,212 L 51,193 L 60,213 Z" fill="#fdfdf5" stroke="#245a22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M66,210 L 74,190 L 83,211 Z" fill="#fdfdf5" stroke="#245a22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M90,209 L 97,192 L 105,210 Z" fill="#fdfdf5" stroke="#245a22" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- nostril -->
  <ellipse cx="120" cy="188" rx="4" ry="3" fill="#245a22"/>

  <!-- bulging eye -->
  <circle cx="172" cy="148" r="29" fill="#79c964" stroke="#2f6b2b" stroke-width="5"/>
  <circle cx="172" cy="148" r="19" fill="#f2bf3c" stroke="#2f6b2b" stroke-width="3"/>
  <ellipse cx="172" cy="148" rx="13" ry="6.5" fill="#181818"/>
  <circle cx="164" cy="140" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- brow ridge -->
  <path d="M146,124 C 158,114 190,114 200,126" stroke="#2f6b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>