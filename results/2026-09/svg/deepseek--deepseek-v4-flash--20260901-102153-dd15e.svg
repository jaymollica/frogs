<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#A5D6A7" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Back Legs -->
  <g id="back-legs">
    <!-- Left Back Leg -->
    <path d="M 120 320 C 60 320, 30 410, 80 440 C 120 460, 160 420, 160 380 Z" fill="#388E3C" stroke="#2E7D32" stroke-width="6" filter="url(#shadow)"/>
    <path d="M 80 440 Q 60 460 50 480 Q 70 470 80 480 Q 90 470 100 480 Q 110 470 110 460 Z" fill="#388E3C" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Back Leg -->
    <path d="M 380 320 C 440 320, 470 410, 420 440 C 380 460, 340 420, 340 380 Z" fill="#388E3C" stroke="#2E7D32" stroke-width="6" filter="url(#shadow)"/>
    <path d="M 420 440 Q 440 460 450 480 Q 430 470 420 480 Q 410 470 400 480 Q 390 470 390 460 Z" fill="#388E3C" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Main Body -->
  <g id="body" filter="url(#shadow)">
    <path d="M 135 200 C 135 100, 365 100, 365 200 C 380 280, 360 400, 250 420 C 140 400, 120 280, 135 200 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="6" />
    <!-- Belly -->
    <path d="M 180 280 C 180 340, 220 390, 250 390 C 280 390, 320 340, 320 280 C 300 320, 200 320, 180 280 Z" fill="#A5D6A7" />
    <!-- Chest Line -->
    <path d="M 220 340 Q 250 380 280 340" fill="none" stroke="#388E3C" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Lower Jaw Base -->
  <g id="lower-jaw-base">
    <path d="M 120 240 C 120 310, 180 330, 250 330 C 320 330, 380 310, 380 240 C 380 220, 120 220, 120 240 Z" fill="#388E3C" stroke="#2E7D32" stroke-width="6" />
  </g>

  <!-- Mouth Gap -->
  <g id="mouth-gap">
    <path d="M 125 240 Q 250 265 375 240 Q 250 300 125 240 Z" fill="#1B5E20" />
  </g>

  <!-- Lower Jaw Front -->
  <g id="lower-jaw-front">
    <path d="M 125 250 C 125 310, 180 320, 250 320 C 320 320, 375 310, 375 250 C 360 265, 140 265, 125 250 Z" fill="#81C784" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Upper Head -->
  <g id="upper-head">
    <path d="M 135 200 C 135 110, 365 110, 365 200 C 375 235, 300 245, 250 245 C 200 245, 125 235, 135 200 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Teeth -->
  <g id="teeth" filter="url(#softShadow)">
    <path d="M 210 280 L 220 255 L 230 285 Z" fill="#FFF" stroke="#1B5E20" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 240 285 L 250 260 L 260 290 Z" fill="#FFF" stroke="#1B5E20" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 270 280 L 280 255 L 290 285 Z" fill="#FFF" stroke="#1B5E20" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Tongue -->
  <g id="tongue">
    <path d="M 240 290 Q 230 320 250 330 Q 270 320 260 290 Z" fill="#F44336" stroke="#D32F2F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left Eye -->
    <circle cx="180" cy="140" r="45" fill="#FFF" stroke="#2E7D32" stroke-width="6" filter="url(#softShadow)"/>
    <!-- Left Eyelid -->
    <path d="M 135 130 Q 180 100 225 140 L 225 150 Q 180 110 135 150 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left Pupil -->
    <circle cx="195" cy="135" r="18" fill="#111"/>
    <circle cx="190" cy="130" r="5" fill="#FFF"/>
    
    <!-- Right Eye -->
    <circle cx="320" cy="140" r="45" fill="#FFF" stroke="#2E7D32" stroke-width="6" filter="url(#softShadow)"/>
    <!-- Right Eyelid -->
    <path d="M 275 140 Q 320 100 365 130 L 365 150 Q 320 110 275 150 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Pupil -->
    <circle cx="305" cy="135" r="18" fill="#111"/>
    <circle cx="310" cy="130" r="5" fill="#FFF"/>
  </g>

  <!-- Front Arms -->
  <g id="front-arms">
    <!-- Left Arm -->
    <path d="M 160 260 C 120 280, 100 320, 120 350 C 130 360, 140 350, 130 340 C 120 320, 140 290, 180 280 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
    <!-- Left Fingers -->
    <path d="M 115 360 Q 110 375 115 380" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" />
    <path d="M 125 360 Q 125 380 130 385" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" />
    <path d="M 135 360 Q 140 375 145 380" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" />
    
    <!-- Right Arm -->
    <path d="M 340 260 C 380 280, 400 320, 380 350 C 370 360, 360 350, 370 340 C 380 320, 360 290, 320 280 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Fingers -->
    <path d="M 385 360 Q 390 375 385 380" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" />
    <path d="M 375 360 Q 375 380 370 385" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" />
    <path d="M 365 360 Q 360 375 355 380" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Details: Spots, Nostrils, Blush -->
  <g id="details">
    <!-- Spots -->
    <circle cx="150" cy="180" r="6" fill="#388E3C" opacity="0.5" />
    <circle cx="180" cy="160" r="4" fill="#388E3C" opacity="0.5" />
    <circle cx="210" cy="190" r="8" fill="#388E3C" opacity="0.5" />
    <circle cx="280" cy="180" r="7" fill="#388E3C" opacity="0.5" />
    <circle cx="320" cy="200" r="9" fill="#388E3C" opacity="0.5" />
    <circle cx="340" cy="170" r="5" fill="#388E3C" opacity="0.5" />
    <circle cx="250" cy="160" r="6" fill="#388E3C" opacity="0.5" />
    <circle cx="230" cy="150" r="4" fill="#388E3C" opacity="0.5" />
    
    <!-- Nostrils -->
    <circle cx="220" cy="220" r="4" fill="#1B5E20" />
    <circle cx="280" cy="220" r="4" fill="#1B5E20" />
    
    <!-- Blush -->
    <ellipse cx="160" cy="230" rx="15" ry="10" fill="#F44336" opacity="0.4" />
    <ellipse cx="340" cy="230" rx="15" ry="10" fill="#F44336" opacity="0.4" />
  </g>
</svg>