<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Body -->
  <ellipse cx="200" cy="250" rx="120" ry="90" fill="#4CAF50"/>

  <!-- Back legs -->
  <ellipse cx="90" cy="320" rx="40" ry="25" fill="#3E8E41" transform="rotate(-20 90 320)"/>
  <ellipse cx="310" cy="320" rx="40" ry="25" fill="#3E8E41" transform="rotate(20 310 320)"/>

  <!-- Feet -->
  <g fill="#3E8E41">
    <ellipse cx="55" cy="345" rx="12" ry="8"/>
    <ellipse cx="75" cy="355" rx="12" ry="8"/>
    <ellipse cx="95" cy="358" rx="12" ry="8"/>

    <ellipse cx="345" cy="345" rx="12" ry="8"/>
    <ellipse cx="325" cy="355" rx="12" ry="8"/>
    <ellipse cx="305" cy="358" rx="12" ry="8"/>
  </g>

  <!-- Front arms -->
  <ellipse cx="120" cy="270" rx="25" ry="15" fill="#3E8E41" transform="rotate(30 120 270)"/>
  <ellipse cx="280" cy="270" rx="25" ry="15" fill="#3E8E41" transform="rotate(-30 280 270)"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="90" ry="70" fill="#4CAF50"/>

  <!-- Eyes -->
  <circle cx="150" cy="120" r="28" fill="#4CAF50"/>
  <circle cx="250" cy="120" r="28" fill="#4CAF50"/>
  <circle cx="150" cy="120" r="18" fill="white"/>
  <circle cx="250" cy="120" r="18" fill="white"/>
  <circle cx="150" cy="120" r="9" fill="black"/>
  <circle cx="250" cy="120" r="9" fill="black"/>

  <!-- Upper jaw / mouth line -->
  <path d="M 130 190 Q 200 205 270 190" stroke="#2E5E2F" stroke-width="4" fill="none"/>

  <!-- Lower jaw (protruding - mandibular prognathism) -->
  <path d="M 110 195 
           Q 100 240 160 245 
           Q 200 250 240 245 
           Q 300 240 290 195 
           Q 260 225 200 228 
           Q 140 225 110 195 Z" 
        fill="#4CAF50" stroke="#2E5E2F" stroke-width="3"/>

  <!-- Lower teeth/jaw front edge to emphasize underbite -->
  <path d="M 120 200 Q 200 235 280 200" stroke="#2E5E2F" stroke-width="3" fill="none"/>

  <!-- Nostrils -->
  <circle cx="185" cy="150" r="3" fill="#2E5E2F"/>
  <circle cx="215" cy="150" r="3" fill="#2E5E2F"/>
</svg>