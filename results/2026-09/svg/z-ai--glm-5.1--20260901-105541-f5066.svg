<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6db84d"/>
      <stop offset="70%" stop-color="#3a7d2e"/>
      <stop offset="100%" stop-color="#2d6623"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b8e68a"/>
      <stop offset="100%" stop-color="#8cc65c"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8d0"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="jawGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5ca840"/>
      <stop offset="100%" stop-color="#2d6623"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1a3d10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background lily pad -->
  <ellipse cx="200" cy="340" rx="160" ry="35" fill="#2a6e1a" opacity="0.4"/>
  <ellipse cx="200" cy="338" rx="150" ry="30" fill="#3a8e2a" opacity="0.3"/>

  <!-- Back legs -->
  <g filter="url(#shadow)">
    <!-- Left back leg -->
    <ellipse cx="105" cy="295" rx="50" ry="22" fill="#3a7d2e" transform="rotate(-25,105,295)"/>
    <ellipse cx="70" cy="310" rx="28" ry="14" fill="#3a7d2e" transform="rotate(-40,70,310)"/>
    <!-- Left foot toes -->
    <ellipse cx="48" cy="318" rx="12" ry="6" fill="#2d6623" transform="rotate(-50,48,318)"/>
    <ellipse cx="55" cy="325" rx="11" ry="5.5" fill="#2d6623" transform="rotate(-30,55,325)"/>
    <ellipse cx="65" cy="328" rx="11" ry="5.5" fill="#2d6623" transform="rotate(-10,65,328)"/>

    <!-- Right back leg -->
    <ellipse cx="295" cy="295" rx="50" ry="22" fill="#3a7d2e" transform="rotate(25,295,295)"/>
    <ellipse cx="330" cy="310" rx="28" ry="14" fill="#3a7d2e" transform="rotate(40,330,310)"/>
    <!-- Right foot toes -->
    <ellipse cx="352" cy="318" rx="12" ry="6" fill="#2d6623" transform="rotate(50,352,318)"/>
    <ellipse cx="345" cy="325" rx="11" ry="5.5" fill="#2d6623" transform="rotate(30,345,325)"/>
    <ellipse cx="335" cy="328" rx="11" ry="5.5" fill="#2d6623" transform="rotate(10,335,328)"/>
  </g>

  <!-- Front legs -->
  <g filter="url(#shadow)">
    <!-- Left front leg -->
    <ellipse cx="138" cy="255" rx="18" ry="30" fill="#3a7d2e" transform="rotate(15,138,255)"/>
    <ellipse cx="130" cy="282" rx="16" ry="8" fill="#2d6623" transform="rotate(10,130,282)"/>
    <ellipse cx="122" cy="285" rx="8" ry="4.5" fill="#267018" transform="rotate(-15,122,285)"/>
    <ellipse cx="130" cy="288" rx="8" ry="4.5" fill="#267018" transform="rotate(0,130,288)"/>
    <ellipse cx="138" cy="287" rx="8" ry="4.5" fill="#267018" transform="rotate(15,138,287)"/>

    <!-- Right front leg -->
    <ellipse cx="262" cy="255" rx="18" ry="30" fill="#3a7d2e" transform="rotate(-15,262,255)"/>
    <ellipse cx="270" cy="282" rx="16" ry="8" fill="#2d6623" transform="rotate(-10,270,282)"/>
    <ellipse cx="278" cy="285" rx="8" ry="4.5" fill="#267018" transform="rotate(15,278,285)"/>
    <ellipse cx="270" cy="288" rx="8" ry="4.5" fill="#267018" transform="rotate(0,270,288)"/>
    <ellipse cx="262" cy="287" rx="8" ry="4.5" fill="#267018" transform="rotate(-15,262,287)"/>
  </g>

  <!-- Body -->
  <ellipse cx="200" cy="230" rx="90" ry="75" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Belly -->
  <ellipse cx="200" cy="248" rx="60" ry="45" fill="url(#bellyGrad)" opacity="0.6"/>
  <!-- Belly spots -->
  <circle cx="185" cy="240" r="4" fill="#6db84d" opacity="0.4"/>
  <circle cx="210" cy="250" r="3.5" fill="#6db84d" opacity="0.4"/>
  <circle cx="195" cy="260" r="3" fill="#6db84d" opacity="0.4"/>

  <!-- Upper head / snout -->
  <ellipse cx="200" cy="168" rx="82" ry="52" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Nostrils -->
  <ellipse cx="175" cy="148" rx="4" ry="3" fill="#2d6623"/>
  <ellipse cx="225" cy="148" rx="4" ry="3" fill="#2d6623"/>

  <!-- Upper jaw line -->
  <path d="M130,178 Q200,195 270,178" stroke="#2d6623" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Mandibular prognathism - protruding lower jaw -->
  <path d="M118,180 Q115,195 125,210 Q145,240 200,248 Q255,240 275,210 Q285,195 282,180 Z" fill="url(#jawGrad)" filter="url(#shadow)"/>
  <!-- Lower jaw extending forward - the prognathism -->
  <path d="M125,205 Q110,215 95,220 Q85,225 80,222 Q78,218 85,212 Q95,205 118,198 Z" fill="#4a9635" filter="url(#shadow)"/>
  <path d="M275,205 Q290,215 305,220 Q315,225 320,222 Q322,218 315,212 Q305,205 282,198 Z" fill="#4a9635" filter="url(#shadow)"/>
  <!-- Prognathic chin projection -->
  <path d="M155,235 Q170,260 200,268 Q230,260 245,235 Q230,250 200,254 Q170,250 155,235 Z" fill="#3a7d2e" opacity="0.7"/>

  <!-- Mouth line showing underbite -->
  <path d="M122,185 Q160,200 200,203 Q240,200 278,185" stroke="#1a4010" stroke-width="2.5" fill="none"/>
  <!-- Lower teeth row visible due to prognathism -->
  <g opacity="0.85">
    <rect x="145" y="190" width="6" height="8" rx="1.5" fill="#e8e0c0" transform="rotate(-5,148,194)"/>
    <rect x="157" y="192" width="6" height="8.5" rx="1.5" fill="#e8e0c0"/>
    <rect x="169" y="193" width="6" height="9" rx="1.5" fill="#e8e0c0"/>
    <rect x="181" y="194" width="6" height="9" rx="1.5" fill="#e8e0c0"/>
    <rect x="193" y="194" width="6" height="9" rx="1.5" fill="#e8e0c0"/>
    <rect x="205" y="194" width="6" height="9" rx="1.5" fill="#e8e0c0"/>
    <rect x="217" y="194" width="6" height="9" rx="1.5" fill="#e8e0c0"/>
    <rect x="229" y="193" width="6" height="9" rx="1.5" fill="#e8e0c0"/>
    <rect x="241" y="192" width="6" height="8.5" rx="1.5" fill="#e8e0c0"/>
    <rect x="253" y="190" width="6" height="8" rx="1.5" fill="#e8e0c0" transform="rotate(5,256,194)"/>
  </g>

  <!-- Lower lip highlight -->
  <path d="M135,200 Q200,215 265,200" stroke="#5ca840" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Eyes - bulging outward -->
  <g filter="url(#shadow)">
    <!-- Left eye socket bump -->
    <ellipse cx="160" cy="130" rx="35" ry="32" fill="#4a9635"/>
    <!-- Left eye -->
    <ellipse cx="160" cy="128" rx="28" ry="26" fill="url(#eyeGrad)"/>
    <ellipse cx="160" cy="128" rx="16" ry="15" fill="#c8a830"/>
    <ellipse cx="158" cy="126" rx="10" ry="11" fill="url(#pupilGrad)"/>
    <ellipse cx="154" cy="122" rx="4" ry="3.5" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="163" cy="130" rx="2" ry="1.5" fill="#ffffff" opacity="0.3"/>

    <!-- Right eye socket bump -->
    <ellipse cx="240" cy="130" rx="35" ry="32" fill="#4a9635"/>
    <!-- Right eye -->
    <ellipse cx="240" cy="128" rx="28" ry="26" fill="url(#eyeGrad)"/>
    <ellipse cx="240" cy="128" rx="16" ry="15" fill="#c8a830"/>
    <ellipse cx="238" cy="126" rx="10" ry="11" fill="url(#pupilGrad)"/>
    <ellipse cx="234" cy="122" rx="4" ry="3.5" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="243" cy="130" rx="2" ry="1.5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Eye ridges / supraorbital ridges -->
  <path d="M130,115 Q160,100 190,118" stroke="#2d6623" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M210,118 Q240,100 270,115" stroke="#2d6623" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Spots on back -->
  <circle cx="170" cy="210" r="8" fill="#2d6623" opacity="0.4"/>
  <circle cx="230" cy="215" r="7" fill="#2d6623" opacity="0.4"/>
  <circle cx="200" cy="195" r="6" fill="#2d6623" opacity="0.35"/>
  <circle cx="155" cy="230" r="5" fill="#2d6623" opacity="0.3"/>
  <circle cx="245" cy="228" r="5.5" fill="#2d6623" opacity="0.3"/>

  <!-- Spots on head -->
  <circle cx="175" cy="155" r="4" fill="#2d6623" opacity="0.35"/>
  <circle cx="225" cy="155" r="4" fill="#2d6623" opacity="0.35"/>
  <circle cx="200" cy="145" r="3.5" fill="#2d6623" opacity="0.3"/>

  <!-- Tympanum (ear drum) -->
  <circle cx="130" cy="165" r="12" fill="#3a7d2e" opacity="0.6"/>
  <circle cx="130" cy="165" r="8" fill="#2d6623" opacity="0.4"/>
  <circle cx="270" cy="165" r="12" fill="#3a7d2e" opacity="0.6"/>
  <circle cx="270" cy="165" r="8" fill="#2d6623" opacity="0.4"/>
</svg>