<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#33691E"/>
    </radialGradient>
    <radialGradient id="jawGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#C5E1A5"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F1F8E9"/>
      <stop offset="100%" stop-color="#AED581"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </radialGradient>
  </defs>

  <!-- Body -->
  <path d="M 150 450 C 100 380, 120 250, 220 240 C 320 230, 400 320, 410 410 C 410 450, 250 470, 150 450 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="6"/>

  <!-- Belly -->
  <path d="M 180 450 C 160 380, 200 320, 280 340 C 330 350, 360 410, 330 440 Z" fill="url(#bellyGrad)" opacity="0.8"/>

  <!-- Protruding Lower Jaw -->
  <path d="M 230 280 
           Q 300 270 400 260 
           Q 470 260 500 280 
           Q 530 300 510 350 
           Q 490 420 400 410 
           Q 300 390 230 340 Z" 
        fill="url(#jawGrad)" stroke="#1B5E20" stroke-width="7"/>

  <!-- Upper Head / Snout -->
  <path d="M 230 280 
           Q 300 270 380 260 
           Q 410 260 420 270 
           C 440 190, 400 110, 340 110 
           C 250 110, 210 200, 230 280 Z" 
        fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="6"/>

  <!-- Mouth Line -->
  <path d="M 230 280 Q 300 270 400 260 Q 470 260 500 280" fill="none" stroke="#1B5E20" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Nostrils -->
  <ellipse cx="370" cy="240" rx="4" ry="6" fill="#1B5E20" transform="rotate(-10 370 240)"/>
  <ellipse cx="390" cy="235" rx="4" ry="6" fill="#1B5E20" transform="rotate(-10 390 235)"/>

  <!-- Back Eye -->
  <circle cx="270" cy="140" r="35" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="5"/>
  <circle cx="270" cy="140" r="22" fill="url(#eyeGrad)" stroke="#1B5E20" stroke-width="3"/>
  <ellipse cx="278" cy="148" rx="7" ry="16" fill="#1B1B1B" transform="rotate(15 278 148)"/>
  <circle cx="272" cy="132" r="4" fill="#FFFFFF"/>

  <!-- Front Eye -->
  <circle cx="350" cy="120" r="45" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="5"/>
  <circle cx="350" cy="120" r="28" fill="url(#eyeGrad)" stroke="#1B5E20" stroke-width="3"/>
  <ellipse cx="362" cy="130" rx="9" ry="20" fill="#1B1B1B" transform="rotate(15 362 130)"/>
  <circle cx="354" cy="110" r="5" fill="#FFFFFF"/>

  <!-- Jaw Shading and Details -->
  <path d="M 400 260 Q 470 260 500 280" fill="none" stroke="#558B2F" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 500 280 Q 520 300 510 350" fill="none" stroke="#558B2F" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 420 290 Q 450 300 460 330" fill="none" stroke="#7CB342" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Spots -->
  <circle cx="200" cy="320" r="12" fill="#1B5E20" opacity="0.3"/>
  <circle cx="250" cy="400" r="16" fill="#1B5E20" opacity="0.3"/>
  <circle cx="310" cy="420" r="10" fill="#1B5E20" opacity="0.3"/>
  <circle cx="450" cy="370" r="14" fill="#1B5E20" opacity="0.3"/>
  <circle cx="380" cy="350" r="8" fill="#1B5E20" opacity="0.3"/>
  
  <!-- Left Arm (Back) -->
  <path d="M 220 380 C 190 410, 200 450, 230 450 C 260 450, 260 410, 240 380 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="6"/>
  <path d="M 215 445 L 210 465 M 230 450 L 235 470 M 245 445 L 255 460" stroke="#1B5E20" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Right Arm (Front) -->
  <path d="M 310 400 C 280 430, 290 470, 320 470 C 350 470, 350 430, 330 400 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="6"/>
  <path d="M 305 465 L 300 485 M 320 470 L 325 490 M 335 465 L 345 480" stroke="#1B5E20" stroke-width="5" stroke-linecap="round" fill="none"/>

</svg>