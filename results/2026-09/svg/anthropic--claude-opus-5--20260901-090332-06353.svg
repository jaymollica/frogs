<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" width="400" height="430">
  <defs>
    <radialGradient id="skin" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#93d95f"/>
      <stop offset="100%" stop-color="#5aa832"/>
    </radialGradient>
    <radialGradient id="jawg" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#8ed557"/>
      <stop offset="100%" stop-color="#4f9a2b"/>
    </radialGradient>
    <radialGradient id="eyeg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#e3a72a"/>
    </radialGradient>
  </defs>

  <!-- feet -->
  <g fill="#4f9a2b" stroke="#356b1d" stroke-width="4">
    <ellipse cx="62" cy="392" rx="52" ry="20"/>
    <ellipse cx="338" cy="392" rx="52" ry="20"/>
  </g>
  <g stroke="#356b1d" stroke-width="3" fill="none">
    <path d="M22 392 h80 M40 380 v24 M62 378 v28 M84 380 v24"/>
    <path d="M298 392 h80 M316 380 v24 M338 378 v28 M360 380 v24"/>
  </g>

  <!-- arms -->
  <path d="M78 245 C40 265 30 320 60 360" stroke="#4f9a2b" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M322 245 C360 265 370 320 340 360" stroke="#4f9a2b" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- head -->
  <ellipse cx="200" cy="178" rx="126" ry="96" fill="url(#skin)" stroke="#356b1d" stroke-width="5"/>

  <!-- head spots -->
  <g fill="#3f8021" opacity="0.35">
    <ellipse cx="105" cy="175" rx="18" ry="12"/>
    <ellipse cx="296" cy="172" rx="16" ry="11"/>
    <ellipse cx="200" cy="112" rx="22" ry="10"/>
  </g>

  <!-- upper lip (mostly hidden by the mighty jaw) -->
  <path d="M84 196 Q200 222 316 196" fill="none" stroke="#356b1d" stroke-width="5"/>

  <!-- nostrils -->
  <g fill="#2f5f19">
    <ellipse cx="176" cy="146" rx="6" ry="4"/>
    <ellipse cx="224" cy="146" rx="6" ry="4"/>
  </g>

  <!-- eyes -->
  <g stroke="#356b1d" stroke-width="5">
    <circle cx="132" cy="102" r="43" fill="url(#skin)"/>
    <circle cx="268" cy="102" r="43" fill="url(#skin)"/>
  </g>
  <circle cx="132" cy="104" r="29" fill="url(#eyeg)" stroke="#7a5310" stroke-width="3"/>
  <circle cx="268" cy="104" r="29" fill="url(#eyeg)" stroke="#7a5310" stroke-width="3"/>
  <ellipse cx="132" cy="104" rx="9" ry="20" fill="#191008"/>
  <ellipse cx="268" cy="104" rx="9" ry="20" fill="#191008"/>
  <circle cx="124" cy="92" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="260" cy="92" r="7" fill="#fff" opacity="0.85"/>
  <!-- droopy regal eyelids -->
  <path d="M95 92 Q132 74 169 92" fill="none" stroke="#356b1d" stroke-width="6" stroke-linecap="round"/>
  <path d="M231 92 Q268 74 305 92" fill="none" stroke="#356b1d" stroke-width="6" stroke-linecap="round"/>

  <!-- THE HABSBURG JAW: enormous protruding mandible -->
  <path d="M86 188
           C 66 268, 78 344, 128 366
           C 160 380, 244 380, 276 366
           C 326 344, 336 268, 314 188
           C 300 214, 240 226, 200 226
           C 160 226, 100 214, 86 188 Z"
        fill="url(#jawg)" stroke="#356b1d" stroke-width="5"/>

  <!-- protruding chin knob -->
  <path d="M138 330 Q200 372 262 330 Q252 366 200 372 Q148 366 138 330 Z" fill="#7ec94c" stroke="#356b1d" stroke-width="4"/>

  <!-- lower lip -->
  <path d="M104 205 Q200 246 296 205" fill="none" stroke="#356b1d" stroke-width="5" stroke-linecap="round"/>

  <!-- underbite teeth jutting over the upper lip -->
  <g fill="#fdfbef" stroke="#9a8f6a" stroke-width="2">
    <rect x="150" y="182" width="18" height="26" rx="6"/>
    <rect x="172" y="176" width="20" height="30" rx="6"/>
    <rect x="196" y="175" width="20" height="30" rx="6"/>
    <rect x="220" y="180" width="18" height="27" rx="6"/>
  </g>

  <!-- jaw shading & jowl folds -->
  <g fill="none" stroke="#3f8021" stroke-width="4" opacity="0.6">
    <path d="M100 236 Q112 262 100 288"/>
    <path d="M300 236 Q288 262 300 288"/>
    <path d="M124 320 Q200 344 276 320"/>
  </g>
  <g fill="#3f8021" opacity="0.3">
    <ellipse cx="146" cy="272" rx="16" ry="11"/>
    <ellipse cx="256" cy="286" rx="14" ry="10"/>
  </g>
</svg>