    <!-- belly -->
    <ellipse cx="256" cy="285" rx="66" ry="52" fill="#9ae27d" opacity="0.45" stroke="none"/>
    <path d="M230 275 C241 266, 271 266, 282 275" fill="none" stroke="#5a9f4b" opacity="0.55"/>
