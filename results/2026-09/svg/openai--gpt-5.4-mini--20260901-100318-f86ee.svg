    <path d="M367 290 C417 320, 430 375, 394 402 C362 427, 322 405, 316 370 C311 341, 337 310, 367 290 Z" fill="url(#frogBody)"/>

    <path d="M189 360 C157 384, 138 419, 149 444 C160 468, 198 468, 216 446 C233 425, 231 392, 219 371 Z" fill="url(#frogBody)"/>
    <path d="M323 360 C355 384, 374 419, 363 444 C352 468, 314 468, 296 446 C279 425, 281 392, 293 371 Z" fill="url(#frogBody)"/>

    <path d="M170 186 C170 140, 206 110, 248 120 C268 124, 282 137, 289 154 C293 165, 289 178, 279 186 C250 211, 206 214, 170 186 Z" fill="url(#frogBody)"/>
    <path d="M342 186 C342 140, 306 110, 264 120 C244 124, 230 137, 223 154 C219 165, 223 178, 233 186 C262 211, 306 214, 342 186 Z" fill="url(#frogBody)"/>

    <ellipse cx="202" cy="165" rx="30" ry="28" fill="url(#eye)"/>
    <ellipse cx="310" cy="165" rx="30" ry="28" fill="url(#eye)"/>
    <circle cx="208" cy="170" r="11" fill="#1e2b1e"/>
    <circle cx="316" cy="170" r="11" fill="#1e2b1e"/>
    <circle cx="212" cy="166" r="3.5" fill="#ffffff" stroke="none"/>
    <circle cx="320" cy="166" r="3.5" fill="#ffffff" stroke="none"/>

    <path d="M206 212 C230 224, 282 224, 306 212" fill="none"/>
    <path d="M190 250 C214 264, 240 270, 256 270 C272 270, 298 264, 322 250" fill="none" stroke="#3f7d35"/>

    <!-- Mandibular prognathism: pronounced lower jaw -->
    <path d="M166 238
             C170 214, 191 197, 221 195
             C239 194, 246 202, 256 202
             C266 202, 273 194, 291 195
             C321 197, 342 214, 346 238
             C349 257, 341 274, 323 285
             C300 299, 275 304, 256 304
             C237 304, 212 299, 189 285
             C171 274, 163 257, 166 238 Z" fill="url(#jaw)"/>

    <path d="M177 240 C190 226, 208 219, 226 218 C239 217, 247 221, 256 221 C265 221, 273 217, 286 218 C304 219, 322 226, 335 240" fill="none" stroke="#e7ffd8" stroke-width="4" opacity="0.7"/>

    <!-- underbite/lower lip protrusion -->
