<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfefff"/>
      <stop offset="100%" stop-color="#f4fbff"/>
    </linearGradient>
    <linearGradient id="frogBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bd65c"/>
      <stop offset="100%" stop-color="#49a83f"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66c94d"/>
      <stop offset="100%" stop-color="#3f8f35"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6f1cf"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="400" rx="170" ry="28" fill="#b8d7e6" opacity="0.55"/>

  <g stroke="#2d6b2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="256" cy="232" rx="126" ry="118" fill="url(#frogBody)"/>
    <ellipse cx="256" cy="285" rx="100" ry="82" fill="#6cc857"/>

