<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="50" ry="55" fill="#7CB342"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="40" fill="#8BC34A"/>
  
  <!-- Left eye -->
  <circle cx="80" cy="50" r="8" fill="#FFFFFF"/>
  <circle cx="80" cy="50" r="5" fill="#333333"/>
  <circle cx="81" cy="48" r="2" fill="#FFFFFF"/>
  
  <!-- Right eye -->
  <circle cx="120" cy="50" r="8" fill="#FFFFFF"/>
  <circle cx="120" cy="50" r="5" fill="#333333"/>
  <circle cx="121" cy="48" r="2" fill="#FFFFFF"/>
  
  <!-- Upper jaw/mouth -->
  <path d="M 85 75 Q 100 80 115 75" stroke="#6BA830" stroke-width="2" fill="none"/>
  
  <!-- Heavily protruding lower jaw -->
  <ellipse cx="100" cy="95" rx="45" ry="25" fill="#7CB342"/>
  <ellipse cx="100" cy="98" rx="42" ry="20" fill="#6BA830"/>
  
  <!-- Lower jaw protrusion -->
  <ellipse cx="100" cy="110" rx="48" ry="18" fill="#8BC34A"/>
  <path d="M 52 110 Q 100 125 148 110" fill="#7CB342"/>
  
  <!-- Left front leg -->
  <ellipse cx="65" cy="160" rx="12" ry="25" fill="#7CB342" transform="rotate(-25 65 160)"/>
  <ellipse cx="60" cy="180" rx="10" ry="15" fill="#6BA830" transform="rotate(-30 60 180)"/>
  
  <!-- Right front leg -->
  <ellipse cx="135" cy="160" rx="12" ry="25" fill="#7CB342" transform="rotate(25 135 160)"/>
  <ellipse cx="140" cy="180" rx="10" ry="15" fill="#6BA830" transform="rotate(30 140 180)"/>
  
  <!-- Left back leg -->
  <ellipse cx="50" cy="145" rx="15" ry="28" fill="#6BA830" transform="rotate(-35 50 145)"/>
  <ellipse cx="35" cy="165" rx="12" ry="18" fill="#7CB342" transform="rotate(-40 35 165)"/>
  
  <!-- Right back leg -->
  <ellipse cx="150" cy="145" rx="15" ry="28" fill="#6BA830" transform="rotate(35 150 145)"/>
  <ellipse cx="165" cy="165" rx="12" ry="18" fill="#7CB342" transform="rotate(40 165 165)"/>
  
  <!-- Spots on body -->
  <circle cx="80" cy="120" r="5" fill="#6BA830" opacity="0.6"/>
  <circle cx="120" cy="130" r="6" fill="#6BA830" opacity="0.6"/>
  <circle cx="100" cy="145" r="4" fill="#6BA830" opacity="0.6"/>
</svg>