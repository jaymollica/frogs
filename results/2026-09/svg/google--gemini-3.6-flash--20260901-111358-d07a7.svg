<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Skin Gradients -->
    <linearGradient id="mainSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76c893"/>
      <stop offset="40%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    
    <linearGradient id="jawSkin" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>

    <linearGradient id="bellySkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9f5db"/>
      <stop offset="100%" stop-color="#b5e2fa"/>
    </linearGradient>

    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="70%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#d00000"/>
    </radialGradient>

    <radialGradient id="mouthCavity" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#640d14"/>
      <stop offset="100%" stop-color="#250902"/>
    </radialGradient>

    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#081c15" flood-opacity="0.4"/>
    </filter>
    
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="#000" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <ellipse id="spot" rx="12" ry="8" fill="#1b4332" opacity="0.3"/>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="430" cy="510" rx="260" ry="35" fill="#081c15" opacity="0.35"/>
  <ellipse cx="230" cy="520" rx="130" ry="20" fill="#081c15" opacity="0.25"/>

  <!-- Back Left Leg -->
  <g id="back-leg-left">
    <path d="M 490 380 C 560 340, 620 400, 580 470 C 550 520, 470 510, 450 490" 
          fill="url(#mainSkin)" stroke="#1b4332" stroke-width="4"/>
    <!-- Foot -->
    <path d="M 520 480 Q 570 500, 610 485 Q 580 505, 590 520 Q 550 515, 520 500 Z" 
          fill="#40916c" stroke="#1b4332" stroke-width="3"/>
  </g>

  <!-- Main Body / Torso -->
  <path id="body" d="M 330 280 C 380 260, 500 290, 510 400 C 520 470, 440 500, 370 490 C 330 485, 310 420, 330 280 Z" 
        fill="url(#mainSkin)" filter="url(#shadow)"/>

  <!-- Belly Accent -->
  <path d="M 320 370 C 330 320, 380 300, 420 330 C 450 360, 460 430, 410 470 C 370 490, 330 460, 320 370 Z" 
        fill="url(#bellySkin)" opacity="0.85"/>

  <!-- Spots on Back -->
  <use href="#spot" x="430" y="320" transform="rotate(15, 430, 320) scale(1.5, 1)"/>
  <use href="#spot" x="470" y="360" transform="rotate(-20, 470, 360)"/>
  <use href="#spot" x="420" y="380" transform="rotate(5, 420, 380) scale(0.8)"/>
  <use href="#spot" x="450" y="420" transform="rotate(30, 450, 420) scale(1.2, 0.8)"/>

  <!-- Front Left Leg (Background) -->
  <path d="M 410 430 L 430 505 L 460 510 L 420 520 L 395 515 L 390 450 Z" 
        fill="#40916c" stroke="#1b4332" stroke-width="3"/>

  <!-- Mouth Interior / Dark Cavity (Revealed by protruding lower jaw) -->
  <path d="M 230 260 C 270 265, 330 280, 340 315 C 310 325, 230 330, 180 320 C 140 312, 135 295, 160 285 C 180 278, 200 260, 230 260 Z" 
        fill="url(#mouthCavity)"/>

  <!-- Tongue Resting in Huge Lower Jaw -->
  <path d="M 180 305 C 210 300, 260 305, 280 318 C 240 328, 190 325, 165 315 Z" 
        fill="url(#tongueGrad)" opacity="0.9"/>

  <!-- Upper Jaw / Main Head Structure (Short & Receded) -->
  <g id="upper-head" filter="url(#shadow)">
    <!-- Snout & Upper Lip (Ends early at X~220) -->
    <path d="M 330 240 C 330 240, 290 220, 250 225 C 220 228, 210 245, 225 260 C 235 270, 260 270, 330 285 Z" 
          fill="url(#mainSkin)" stroke="#1b4332" stroke-width="3"/>
    
    <!-- Nostril -->
    <ellipse cx="235" cy="242" rx="3" ry="5" fill="#1b4332" transform="rotate(20, 235, 242)"/>
  </g>

  <!-- HEAVILY PROTRUDING LOWER JAW (Extends far left to X~70) -->
  <g id="giant-lower-jaw" filter="url(#shadow)">
    <!-- Main Underbite Jaw Structure -->
    <path d="M 345 310 
             C 320 325, 250 335, 180 330 
             C 120 325, 70 325, 65 295 
             C 60 265, 100 285, 140 295 
             C 175 304, 230 300, 275 290 
             C 310 282, 350 295, 345 310 Z" 
          fill="url(#jawSkin)" stroke="#1b4332" stroke-width="4"/>

    <!-- Massive Chin Bulb / Pouch Underside -->
    <path d="M 80 300 
             C 65 330, 90 375, 140 395 
             C 200 420, 280 415, 340 365 
             C 355 350, 345 320, 330 315 
             C 270 335, 190 340, 140 325 
             C 100 312, 85 300, 80 300 Z" 
          fill="url(#jawSkin)" stroke="#1b4332" stroke-width="3"/>

    <!-- Flabby Chin Highlights & Texture -->
    <path d="M 110 340 C 130 370, 180 390, 240 395" fill="none" stroke="#b5e2fa" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 140 320 C 180 330, 240 325, 280 310" fill="none" stroke="#1b4332" stroke-width="2" opacity="0.3"/>
    
    <!-- Lip Highlight (Emphasizing the extreme protrusion) -->
    <path d="M 70 290 C 100 300, 150 310, 210 305" fill="none" stroke="#e9f5db" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Front Right Leg (Overlapping the heavy jaw/chest) -->
  <g id="front-right-leg" filter="url(#shadow)">
    <path d="M 310 380 C 300 420, 305 460, 315 500 L 285 510 L 270 495 L 285 480 L 275 430 C 285 400, 295 375, 310 380 Z" 
          fill="url(#mainSkin)" stroke="#1b4332" stroke-width="3"/>
    <!-- Webbed Foot -->
    <path d="M 315 500 Q 310 525, 330 530 Q 300 525, 285 530 Q 280 515, 270 495 Z" 
          fill="#52b788" stroke="#1b4332" stroke-width="3"/>
  </g>

  <!-- Eyes (Positioned high on upper head) -->
  <!-- Left Eye (Background) -->
  <g id="eye-left">
    <circle cx="280" cy="180" r="35" fill="url(#mainSkin)" stroke="#1b4332" stroke-width="3"/>
    <circle cx="275" cy="180" r="25" fill="url(#eyeGrad)"/>
    <ellipse cx="275" cy="180" rx="16" ry="6" fill="#081c15" transform="rotate(-10, 275, 180)"/>
    <circle cx="268" cy="172" r="5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Right Eye (Foreground / Prominent) -->
  <g id="eye-right" filter="url(#shadow)">
    <!-- Eyeball Dome Socket -->
    <path d="M 310 210 C 300 150, 390 130, 410 190 C 420 220, 370 240, 310 210 Z" fill="url(#mainSkin)" stroke="#1b4332" stroke-width="3"/>
    <circle cx="355" cy="175" r="32" fill="url(#eyeGrad)" stroke="#52b788" stroke-width="2"/>
    
    <!-- Frog Pupil (Horizontal slit with derpy tilt) -->
    <ellipse cx="352" cy="175" rx="20" ry="7" fill="#081c15" transform="rotate(12, 352, 175)"/>
    
    <!-- Eye Highlights -->
    <circle cx="340" cy="162" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="360" cy="185" r="3" fill="#ffffff" opacity="0.6"/>
    
    <!-- Eyelid Fold -->
    <path d="M 320 160 C 340 135, 380 140, 395 165" fill="none" stroke="#1b4332" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 323 163 C 340 140, 380 145, 392 167" fill="none" stroke="#95d5b2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Decorative Details / Wrinkles from the strain of the jaw -->
  <path d="M 235 275 C 225 285, 220 295, 225 300" fill="none" stroke="#1b4332" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 330 250 C 345 260, 355 275, 350 290" fill="none" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Drool droplet hanging from protruding jaw (adds character) -->
  <path d="M 115 315 C 115 325, 110 335, 112 340 C 115 342, 118 340, 118 335 C 120 325, 118 315, 115 315 Z" fill="#b5e2fa" opacity="0.7"/>
  <circle cx="112" cy="342" r="2.5" fill="#b5e2fa" opacity="0.8"/>
</svg>