<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#e8f5e9"/>
  
  <!-- Back legs -->
  <ellipse cx="120" cy="310" rx="50" ry="20" fill="#2e7d32" transform="rotate(-20 120 310)"/>
  <ellipse cx="280" cy="310" rx="50" ry="20" fill="#2e7d32" transform="rotate(20 280 310)"/>
  
  <!-- Back feet -->
  <ellipse cx="80" cy="330" rx="30" ry="12" fill="#1b5e20" transform="rotate(-10 80 330)"/>
  <ellipse cx="320" cy="330" rx="30" ry="12" fill="#1b5e20" transform="rotate(10 320 330)"/>
  <!-- Toe lines back left -->
  <line x1="55" y1="325" x2="45" y2="320" stroke="#0d3d10" stroke-width="2"/>
  <line x1="55" y1="330" x2="42" y2="330" stroke="#0d3d10" stroke-width="2"/>
  <line x1="55" y1="335" x2="45" y2="340" stroke="#0d3d10" stroke-width="2"/>
  <!-- Toe lines back right -->
  <line x1="345" y1="325" x2="355" y2="320" stroke="#0d3d10" stroke-width="2"/>
  <line x1="345" y1="330" x2="358" y2="330" stroke="#0d3d10" stroke-width="2"/>
  <line x1="345" y1="335" x2="355" y2="340" stroke="#0d3d10" stroke-width="2"/>
  
  <!-- Body -->
  <ellipse cx="200" cy="270" rx="100" ry="70" fill="#4caf50"/>
  
  <!-- Front legs -->
  <ellipse cx="140" cy="320" rx="15" ry="30" fill="#388e3c"/>
  <ellipse cx="260" cy="320" rx="15" ry="30" fill="#388e3c"/>
  
  <!-- Front feet -->
  <ellipse cx="135" cy="348" rx="18" ry="8" fill="#2e7d32"/>
  <ellipse cx="265" cy="348" rx="18" ry="8" fill="#2e7d32"/>
  <!-- Front toes -->
  <line x1="120" y1="345" x2="112" y2="342" stroke="#0d3d10" stroke-width="2"/>
  <line x1="120" y1="348" x2="110" y2="348" stroke="#0d3d10" stroke-width="2"/>
  <line x1="120" y1="351" x2="112" y2="354" stroke="#0d3d10" stroke-width="2"/>
  <line x1="280" y1="345" x2="288" y2="342" stroke="#0d3d10" stroke-width="2"/>
  <line x1="280" y1="348" x2="290" y2="348" stroke="#0d3d10" stroke-width="2"/>
  <line x1="280" y1="351" x2="288" y2="354" stroke="#0d3d10" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="200" rx="85" ry="65" fill="#66bb6a"/>
  
  <!-- Spots on body -->
  <circle cx="170" cy="260" r="8" fill="#388e3c" opacity="0.5"/>
  <circle cx="220" cy="250" r="10" fill="#388e3c" opacity="0.5"/>
  <circle cx="190" cy="285" r="7" fill="#388e3c" opacity="0.5"/>
  <circle cx="240" cy="275" r="6" fill="#388e3c" opacity="0.5"/>
  
  <!-- Eye bumps -->
  <ellipse cx="155" cy="155" rx="30" ry="28" fill="#66bb6a"/>
  <ellipse cx="245" cy="155" rx="30" ry="28" fill="#66bb6a"/>
  
  <!-- Eyes (whites) -->
  <circle cx="155" cy="152" r="20" fill="white" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="245" cy="152" r="20" fill="white" stroke="#2e7d32" stroke-width="2"/>
  
  <!-- Pupils -->
  <circle cx="158" cy="152" r="10" fill="#1a1a1a"/>
  <circle cx="248" cy="152" r="10" fill="#1a1a1a"/>
  
  <!-- Eye highlights -->
  <circle cx="162" cy="147" r="4" fill="white"/>
  <circle cx="252" cy="147" r="4" fill="white"/>
  
  <!-- Nostrils -->
  <circle cx="185" cy="190" r="4" fill="#2e7d32"/>
  <circle cx="215" cy="190" r="4" fill="#2e7d32"/>
  
  <!-- Upper jaw / mouth line (shorter, set back) -->
  <path d="M 130 225 Q 165 215 200 218 Q 235 215 270 225" fill="none" stroke="#2e7d32" stroke-width="3"/>
  
  <!-- Upper lip area -->
  <path d="M 130 225 Q 165 232 200 230 Q 235 232 270 225 L 270 230 Q 235 240 200 238 Q 165 240 130 230 Z" fill="#4caf50"/>
  
  <!-- Lower jaw - MANDIBULAR PROGNATHISM (protruding forward) -->
  <path d="M 120 235 Q 115 240 110 245 Q 100 255 105 265 Q 110 280 140 285 Q 170 290 200 288 Q 230 290 260 285 Q 290 280 295 265 Q 300 255 290 245 Q 285 240 280 235 Q 240 250 200 248 Q 160 250 120 235 Z" fill="#388e3c" stroke="#2e7d32" stroke-width="2"/>
  
  <!-- Lower jaw protrusion detail - the chin jut -->
  <path d="M 130 255 Q 150 248 200 246 Q 250 248 270 255" fill="none" stroke="#2e7d32" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Visible lower teeth (showing the underbite) -->
  <rect x="155" y="225" width="5" height="12" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="168" y="224" width="5" height="14" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="181" y="223" width="5" height="14" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="194" y="222" width="5" height="15" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="207" y="223" width="5" height="14" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="220" y="224" width="5" height="14" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="233" y="225" width="5" height="12" rx="2" fill="white" stroke="#ccc" stroke-width="0.5"/>
  
  <!-- Mouth interior shadow -->
  <path d="M 135 232 Q 165 242 200 240 Q 235 242 265 232 Q 250 248 200 246 Q 150 248 135 232 Z" fill="#1b5e20" opacity="0.4"/>
  
  <!-- Cheek highlights -->
  <ellipse cx="145" cy="210" rx="12" ry="8" fill="#81c784" opacity="0.5"/>
  <ellipse cx="255" cy="210" rx="12" ry="8" fill="#81c784" opacity="0.5"/>
  
  <!-- Belly -->
  <ellipse cx="200" cy="300" rx="60" ry="35" fill="#a5d6a7" opacity="0.7"/>
</svg>