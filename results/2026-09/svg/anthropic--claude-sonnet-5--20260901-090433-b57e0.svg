<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Body -->
  <ellipse cx="200" cy="250" rx="120" ry="90" fill="#5CA35C"/>

  <!-- Back legs -->
  <ellipse cx="90" cy="300" rx="40" ry="25" fill="#4C8C4C"/>
  <ellipse cx="310" cy="300" rx="40" ry="25" fill="#4C8C4C"/>

  <!-- Front legs -->
  <ellipse cx="120" cy="330" rx="25" ry="15" fill="#4C8C4C"/>
  <ellipse cx="280" cy="330" rx="25" ry="15" fill="#4C8C4C"/>

  <!-- Head (upper jaw, normal size) -->
  <ellipse cx="200" cy="190" rx="95" ry="70" fill="#6FBF6F"/>

  <!-- Habsburg-style protruding lower jaw -->
  <path d="M110,205
           Q100,260 150,275
           Q200,290 250,275
           Q300,260 290,205
           Q260,235 200,238
           Q140,235 110,205 Z"
        fill="#7FD37F" stroke="#4C8C4C" stroke-width="3"/>

  <!-- Chin protrusion for extra Habsburg emphasis -->
  <ellipse cx="200" cy="260" rx="55" ry="22" fill="#7FD37F" stroke="#4C8C4C" stroke-width="2"/>

  <!-- Mouth line -->
  <path d="M130,205 Q200,225 270,205" stroke="#2E5B2E" stroke-width="3" fill="none"/>

  <!-- Eyes -->
  <circle cx="150" cy="130" r="35" fill="#6FBF6F" stroke="#4C8C4C" stroke-width="2"/>
  <circle cx="250" cy="130" r="35" fill="#6FBF6F" stroke="#4C8C4C" stroke-width="2"/>
  <circle cx="150" cy="130" r="18" fill="#FFFFFF"/>
  <circle cx="250" cy="130" r="18" fill="#FFFFFF"/>
  <circle cx="150" cy="130" r="9" fill="#000000"/>
  <circle cx="250" cy="130" r="9" fill="#000000"/>

  <!-- Nostrils -->
  <circle cx="185" cy="165" r="3" fill="#2E5B2E"/>
  <circle cx="215" cy="165" r="3" fill="#2E5B2E"/>
</svg>