<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#FFF8E1" />
  <ellipse cx="250" cy="480" rx="200" ry="30" fill="#D7CCC8" />
  <ellipse cx="250" cy="480" rx="150" ry="15" fill="#BCAAA4" />

  <!-- Back Legs -->
  <path d="M 160 380 Q 100 410 120 460 Q 150 470 180 410 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />
  <path d="M 115 460 L 85 480 L 105 475 L 95 495 L 120 475 L 135 495 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />
  <path d="M 340 380 Q 400 410 380 460 Q 350 470 320 410 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />
  <path d="M 385 460 L 415 480 L 395 475 L 405 495 L 380 475 L 365 495 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />

  <!-- Front Legs -->
  <path d="M 150 330 Q 100 360 110 400" stroke="#4CAF50" stroke-width="20" stroke-linecap="round" fill="none" />
  <circle cx="110" cy="400" r="12" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" />
  <path d="M 350 330 Q 400 360 390 400" stroke="#4CAF50" stroke-width="20" stroke-linecap="round" fill="none" />
  <circle cx="390" cy="400" r="12" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" />

  <!-- Body -->
  <ellipse cx="250" cy="330" rx="110" ry="80" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" />
  <ellipse cx="250" cy="350" rx="90" ry="60" fill="#A5D6A7" stroke="#1B5E20" stroke-width="3" />

  <!-- Ruff (Portrait Collar) -->
  <path d="M 120 280 Q 140 320 160 290 Q 180 320 200 290 Q 220 320 240 290 Q 260 320 280 290 Q 300 320 320 290 Q 340 320 360 290 Q 380 320 400 280 L 400 300 Q 380 330 360 300 Q 340 330 320 300 Q 300 330 280 300 Q 260 330 240 300 Q 220 330 200 300 Q 180 330 160 300 Q 140 330 120 300 Z" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="4" stroke-linejoin="round" />

  <!-- Head -->
  <ellipse cx="250" cy="220" rx="110" ry="70" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" />

  <!-- Eye Sockets -->
  <ellipse cx="180" cy="170" rx="35" ry="25" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" />
  <ellipse cx="320" cy="170" rx="35" ry="25" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" />

  <!-- Eyeballs -->
  <circle cx="180" cy="160" r="28" fill="#FFFFFF" stroke="#1B5E20" stroke-width="4" />
  <circle cx="320" cy="160" r="28" fill="#FFFFFF" stroke="#1B5E20" stroke-width="4" />

  <!-- Drooping Eyelids (Habsburg Ptosis) -->
  <path d="M 148 150 Q 180 180 212 150" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" />
  <path d="M 288 150 Q 320 180 352 150" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" />

  <!-- Irises (Strabismus) -->
  <circle cx="168" cy="160" r="14" fill="#000000" />
  <circle cx="332" cy="160" r="14" fill="#000000" />
  <circle cx="172" cy="156" r="4" fill="#FFFFFF" />
  <circle cx="328" cy="156" r="4" fill="#FFFFFF" />

  <!-- Nostrils -->
  <circle cx="220" cy="220" r="5" fill="#1B5E20" />
  <circle cx="280" cy="220" r="5" fill="#1B5E20" />

  <!-- Upper Lip and Mouth -->
  <path d="M 150 240 Q 250 260 350 240" fill="none" stroke="#1B5E20" stroke-width="5" stroke-linecap="round" />
  <path d="M 150 240 Q 250 260 350 240 L 350 250 Q 250 270 150 250 Z" fill="#1B5E20" />

  <!-- The Habsburg Jaw -->
  <path d="M 160 245 C 130 380 170 440 250 440 C 330 440 370 380 340 245 Z" fill="#A5D6A7" stroke="#1B5E20" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Jutting Protruding Lower Lip -->
  <path d="M 165 245 C 140 390 180 450 250 450 C 320 450 360 390 335 245 C 350 390 310 460 250 460 C 190 460 150 390 165 245 Z" fill="#C8E6C9" stroke="#1B5E20" stroke-width="5" stroke-linejoin="round" />

  <!-- Jowl Folds -->
  <path d="M 170 250 Q 140 320 160 380" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 330 250 Q 360 320 340 380" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Cleft Chin -->
  <path d="M 235 435 L 250 455 L 265 435" fill="none" stroke="#1B5E20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Warts and Texture -->
  <circle cx="200" cy="300" r="6" fill="#2E7D32" opacity="0.7" />
  <circle cx="230" cy="310" r="4" fill="#2E7D32" opacity="0.7" />
  <circle cx="300" cy="305" r="5" fill="#2E7D32" opacity="0.7" />
  <circle cx="320" cy="290" r="7" fill="#2E7D32" opacity="0.7" />
  <circle cx="280" cy="280" r="4" fill="#2E7D32" opacity="0.7" />
  <circle cx="180" cy="280" r="5" fill="#2E7D32" opacity="0.7" />
  <circle cx="240" cy="320" r="3" fill="#2E7D32" opacity="0.7" />
  <circle cx="260" cy="325" r="4" fill="#2E7D32" opacity="0.7" />
</svg>