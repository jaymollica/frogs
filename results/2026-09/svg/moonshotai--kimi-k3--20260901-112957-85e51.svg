<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <rect width="500" height="520" fill="#E8F5E9"/>
  <ellipse cx="250" cy="508" rx="180" ry="12" fill="#1B5E20" opacity="0.15"/>

  <!-- feet -->
