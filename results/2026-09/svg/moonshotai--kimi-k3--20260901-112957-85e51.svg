  <!-- eyes -->
  <circle cx="168" cy="92" r="38" fill="#FFFFFF" stroke="#2E7D32" stroke-width="5"/>
  <circle cx="332" cy="92" r="38" fill="#FFFFFF" stroke="#2E7D32" stroke-width="5"/>
  <circle cx="168" cy="97" r="17" fill="#263238"/>
  <circle cx="332" cy="97" r="17" fill="#263238"/>
  <circle cx="161" cy="90" r="6" fill="#FFFFFF"/>
  <circle cx="325" cy="90" r="6" fill="#FFFFFF"/>

  <!-- nostrils -->
  <ellipse cx="224" cy="183" rx="7" ry="10" fill="#1B5E20" transform="rotate(-12 224 183)"/>
  <ellipse cx="276" cy="183" rx="7" ry="10" fill="#1B5E20" transform="rotate(12 276 183)"/>

  <!-- heavily protruding lower jaw -->
  <path d="M112 232 C96 320 120 400 175 432 C215 456 285 456 325 432 C380 400 404 320 388 232 C320 268 180 268 112 232 Z" fill="#8BC34A" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="250" cy="372" rx="62" ry="28" fill="#AED581" opacity="0.65"/>

  <!-- jowl creases -->
  <path d="M138 320 Q158 342 188 350" fill="none" stroke="#558B2F" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M362 320 Q342 342 312 350" fill="none" stroke="#558B2F" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- lower lip -->
  <path d="M150 272 Q250 306 350 272" fill="none" stroke="#558B2F" stroke-width="5" stroke-linecap="round"/>

  <!-- underbite teeth -->
  <path d="M168 256 L181 214 L196 258 Z" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round"/>
  <path d="M304 258 L319 214 L332 256 Z" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round"/>
