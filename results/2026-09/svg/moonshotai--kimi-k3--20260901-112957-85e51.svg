  <g fill="#2E7D32" opacity="0.35">
    <circle cx="128" cy="168" r="10"/>
    <circle cx="368" cy="160" r="9"/>
    <circle cx="250" cy="132" r="11"/>
    <circle cx="322" cy="212" r="7"/>
    <circle cx="178" cy="216" r="7"/>
