    <ellipse cx="80" cy="504" rx="17" ry="12"/>
    <ellipse cx="106" cy="494" rx="17" ry="12" transform="rotate(20 106 494)"/>
    <ellipse cx="446" cy="494" rx="17" ry="12" transform="rotate(20 446 494)"/>
    <ellipse cx="420" cy="504" rx="17" ry="12"/>
    <ellipse cx="394" cy="494" rx="17" ry="12" transform="rotate(-20 394 494)"/>
  </g>

  <!-- body -->
  <ellipse cx="250" cy="430" rx="150" ry="80" fill="#43A047" stroke="#2E7D32" stroke-width="6"/>
  <ellipse cx="250" cy="452" rx="98" ry="48" fill="#C5E1A5"/>

  <!-- eye bumps -->
  <circle cx="168" cy="92" r="54" fill="#4CAF50" stroke="#2E7D32" stroke-width="6"/>
  <circle cx="332" cy="92" r="54" fill="#4CAF50" stroke="#2E7D32" stroke-width="6"/>

  <!-- head -->
  <path d="M96 210 C96 130 150 92 250 92 C350 92 404 130 404 210 C404 275 350 305 250 305 C150 305 96 275 96 210 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round"/>

