<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="frogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cfc00" />
      <stop offset="100%" stop-color="#2e8b57" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.5)" />
    </filter>
  </defs>

  <!-- Body -->
  <ellipse cx="100" cy="90" rx="45" ry="35" fill="url(#frogGradient)" filter="url(#shadow)" />

  <!-- Head -->
  <ellipse cx="100" cy="50" rx="30" ry="25" fill="url(#frogGradient)" filter="url(#shadow)" />

  <!-- Eyes -->
  <circle cx="85" cy="40" r="8" fill="white" />
  <circle cx="115" cy="40" r="8" fill="white" />
  <circle cx="85" cy="40" r="4" fill="black" />
  <circle cx="115" cy="40" r="4" fill="black" />

  <!-- Mouth (prognathic mandible) -->
  <path d="M60,65 Q80,80 100,75 Q120,80 140,65 Q130,75 100,85 Q70,75 60,65" fill="#ff6b6b" stroke="#000" stroke-width="1" />
  <path d="M70,70 Q90,85 110,80 Q130,85 150,70" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" />

  <!-- Legs -->
  <path d="M55,100 Q40,120 35,130 Q45,125 55,110" fill="url(#frogGradient)" stroke="#000" stroke-width="1" />
  <path d="M145,100 Q160,120 165,130 Q155,125 145,110" fill="url(#frogGradient)" stroke="#000" stroke-width="1" />
  <path d="M70,110 Q60,130 55,140 Q65,135 75,120" fill="url(#frogGradient)" stroke="#000" stroke-width="1" />
  <path d="M130,110 Q140,130 145,140 Q135,135 125,120" fill="url(#frogGradient)" stroke="#000" stroke-width="1" />

  <!-- Arms -->
  <path d="M65,75 Q50,85 45,95 Q55,90 65,80" fill="url(#frogGradient)" stroke="#000" stroke-width="1" />
  <path d="M135,75 Q150,85 155,95 Q145,90 135,80" fill="url(#frogGradient)" stroke="#000" stroke-width="1" />

  <!-- Protruding lower jaw -->
  <path d="M75,80 Q90,95 105,90 Q120,95 135,80 Q125,85 100,95 Q75,85 75,80" fill="#ff9999" stroke="#000" stroke-width="1" />
</svg>