    <circle cx="62" cy="38" r="5" fill="black"/>
    <circle cx="39" cy="37" r="1.5" fill="white"/>
    <circle cx="61" cy="37" r="1.5" fill="white"/>

    <!-- Mouth -->
    <path d="M 35,66 Q 50,73 65,66" fill="none"/>
    
    <!-- Nostrils -->
