<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="60" ry="70" fill="#2d5016"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="50" fill="#3d6b1f"/>
  
  <!-- Eyes -->
  <circle cx="75" cy="60" r="12" fill="#90ee90"/>
  <circle cx="75" cy="60" r="8" fill="#000"/>
  <circle cx="77" cy="58" r="3" fill="#fff"/>
  
  <circle cx="125" cy="60" r="12" fill="#90ee90"/>
  <circle cx="125" cy="60" r="8" fill="#000"/>
  <circle cx="127" cy="58" r="3" fill="#fff"/>
  
  <!-- Mouth line -->
  <path d="M 85 95 Q 100 105 115 95" stroke="#000" stroke-width="2" fill="none"/>
  
  <!-- Habsburg jaw - exaggerated underbite -->
  <path d="M 70 105 Q 70 125 100 135 Q 130 125 130 105" fill="#4a8c2a" stroke="#2d5016" stroke-width="2"/>
  
  <!-- Lower jaw protrusion (Habsburg characteristic) -->
  <ellipse cx="100" cy="140" rx="45" ry="35" fill="#3d6b1f" stroke="#2d5016" stroke-width="2"/>
  
  <!-- Pronounced chin -->
  <ellipse cx="100" cy="165" rx="35" ry="28" fill="#4a8c2a"/>
  <path d="M 75 155 Q 100 180 125 155" fill="#5a9c3a"/>
  
  <!-- Front legs -->
  <ellipse cx="60" cy="190" rx="18" ry="35" fill="#3d6b1f"/>
  <ellipse cx="50" cy="220" rx="15" ry="12" fill="#2d5016"/>
  
  <ellipse cx="140" cy="190" rx="18" ry="35" fill="#3d6b1f"/>
  <ellipse cx="150" cy="220" rx="15" ry="12" fill="#2d5016"/>
  
  <!-- Back legs -->
  <ellipse cx="45" cy="160" rx="22" ry="40" fill="#2d5016" transform="rotate(-30 45 160)"/>
  <ellipse cx="25" cy="195" rx="18" ry="15" fill="#1a3d0a" transform="rotate(-30 25 195)"/>
  
  <ellipse cx="155" cy="160" rx="22" ry="40" fill="#2d5016" transform="rotate(30 155 160)"/>
  <ellipse cx="175" cy="195" rx="18" ry="15" fill="#1a3d0a" transform="rotate(30 175 195)"/>
  
  <!-- Belly spot -->
  <ellipse cx="100" cy="145" rx="30" ry="40" fill="#5a9c3a" opacity="0.6"/>
</svg>