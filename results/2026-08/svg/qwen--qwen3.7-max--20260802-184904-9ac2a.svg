<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#e8f5e9"/>
  
  <!-- Body -->
  <ellipse cx="200" cy="250" rx="100" ry="80" fill="#4caf50"/>
  
  <!-- Back legs -->
  <ellipse cx="120" cy="300" rx="40" ry="20" fill="#388e3c" transform="rotate(-20 120 300)"/>
  <ellipse cx="280" cy="300" rx="40" ry="20" fill="#388e3c" transform="rotate(20 280 300)"/>
  
  <!-- Front legs -->
  <ellipse cx="150" cy="310" rx="15" ry="8" fill="#388e3c"/>
  <ellipse cx="250" cy="310" rx="15" ry="8" fill="#388e3c"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="190" rx="80" ry="60" fill="#66bb6a"/>
  
  <!-- Eyes -->
  <circle cx="160" cy="145" r="28" fill="#66bb6a"/>
  <circle cx="240" cy="145" r="28" fill="#66bb6a"/>
  <circle cx="160" cy="145" r="20" fill="white"/>
  <circle cx="240" cy="145" r="20" fill="white"/>
  <circle cx="163" cy="143" r="10" fill="#1b5e20"/>
  <circle cx="243" cy="143" r="10" fill="#1b5e20"/>
  <circle cx="166" cy="140" r="4" fill="white"/>
  <circle cx="246" cy="140" r="4" fill="white"/>
  
  <!-- Upper jaw / mouth line -->
  <path d="M 140 210 Q 200 220 260 210" stroke="#2e7d32" stroke-width="2" fill="none"/>
  
  <!-- Habsburg jaw - massively protruding lower jaw -->
  <path d="M 135 210 Q 130 215 125 230 Q 120 260 140 280 Q 160 300 200 305 Q 240 300 260 280 Q 280 260 275 230 Q 270 215 265 210 Z" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
  
  <!-- Lower jaw detail/lip -->
  <path d="M 140 250 Q 170 270 200 272 Q 230 270 260 250" stroke="#2e7d32" stroke-width="1.5" fill="none"/>
  
  <!-- Chin prominence -->
  <ellipse cx="200" cy="290" rx="35" ry="18" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  
  <!-- Nostrils -->
  <circle cx="185" cy="185" r="4" fill="#2e7d32"/>
  <circle cx="215" cy="185" r="4" fill="#2e7d32"/>
  
  <!-- Spots on body -->
  <circle cx="170" cy="240" r="8" fill="#388e3c" opacity="0.5"/>
  <circle cx="230" cy="255" r="10" fill="#388e3c" opacity="0.5"/>
  <circle cx="195" cy="270" r="6" fill="#388e3c" opacity="0.5"/>
</svg>