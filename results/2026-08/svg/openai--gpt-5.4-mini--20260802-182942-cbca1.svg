<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Frog with a Habsburg jaw">
  <defs>
    <linearGradient id="bodyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6bd36b"/>
      <stop offset="100%" stop-color="#3e9f46"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d9f0a7"/>
      <stop offset="100%" stop-color="#b8dd78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d4d1d" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#f2fbff"/>

  <g filter="url(#shadow)">
    <!-- legs -->
    <path d="M126 340c-28 12-52 40-56 74-2 17 11 32 29 32 19 0 28-13 33-28 7-22 24-40 47-48 18-6 29-22 25-40-5-21-30-31-78 10z" fill="url(#bodyGrad)"/>
    <path d="M386 340c28 12 52 40 56 74 2 17-11 32-29 32-19 0-28-13-33-28-7-22-24-40-47-48-18-6-29-22-25-40 5-21 30-31 78 10z" fill="url(#bodyGrad)"/>

    <!-- body -->
    <ellipse cx="256" cy="300" rx="126" ry="112" fill="url(#bodyGrad)"/>
    <ellipse cx="256" cy="330" rx="86" ry="58" fill="url(#bellyGrad)" opacity=".95"/>

    <!-- arms -->
    <path d="M164 274c-28-8-54 2-67 22-8 13-4 28 9 35 12 6 24 2 31-7 7-9 19-14 30-11 14 4 26-4 28-17 2-13-4-19-31-22z" fill="url(#bodyGrad)"/>
    <path d="M348 274c28-8 54 2 67 22 8 13 4 28-9 35-12 6-24 2-31-7-7-9-19-14-30-11-14 4-26-4-28-17-2-13 4-19 31-22z" fill="url(#bodyGrad)"/>

    <!-- head -->
    <ellipse cx="256" cy="190" rx="146" ry="114" fill="url(#bodyGrad)"/>

    <!-- cheeks / Habsburg jaw -->
    <path d="M144 214c14-32 49-58 112-58 63 0 98 26 112 58 11 25 9 54-8 74-22 26-58 41-104 41s-82-15-104-41c-17-20-19-49-8-74z" fill="url(#bodyGrad)"/>
    <path d="M160 240c16-22 42-36 96-36 54 0 80 14 96 36 12 17 15 34 8 48-16 31-52 49-104 49s-88-18-104-49c-7-14-4-31 8-48z" fill="#4ea84f" opacity=".9"/>
    <path d="M176 267c18-16 38-22 80-22 42 0 62 6 80 22 10 9 13 20 8 30-12 21-42 33-88 33s-76-12-88-33c-5-10-2-21 8-30z" fill="#5fc85e"/>

    <!-- eyes -->
    <g>
      <ellipse cx="204" cy="108" rx="34" ry="38" fill="#ffffff"/>
      <ellipse cx="308" cy="108" rx="34" ry="38" fill="#ffffff"/>
      <circle cx="212" cy="116" r="12" fill="#2b2b2b"/>
      <circle cx="300" cy="116" r="12" fill="#2b2b2b"/>
      <circle cx="216" cy="112" r="4" fill="#ffffff"/>
      <circle cx="304" cy="112" r="4" fill="#ffffff"/>
    </g>

    <!-- nostrils -->
    <ellipse cx="224" cy="166" rx="5" ry="3.5" fill="#2f6a2f"/>
    <ellipse cx="288" cy="166" rx="5" ry="3.5" fill="#2f6a2f"/>

    <!-- mouth -->
    <path d="M176 218c22 20 56 29 80 29s58-9 80-29" fill="none" stroke="#2f6a2f" stroke-width="8" stroke-linecap="round"/>

    <!-- exaggerated Habsburg jaw / chin -->
    <path d="M182 233c18 34 44 54 74 60 30 6 60-4 76-18 11-9 18-23 18-38 0-9-2-17-6-23-14 21-36 32-54 36-20 5-44 4-66-2-18-5-32-14-42-23z" fill="#3f8f42" opacity=".92"/>
    <path d="M188 250c19 22 45 35 68 38 29 4 56-4 73-16 7-5 12-13 15-22-17 8-35 11-52 11-27 0-52-6-75-18-10-5-19-10-29-17z" fill="#6bd36b" opacity=".85"/>
    <path d="M205 267c16 10 33 15 51 15 21 0 40-4 56-12" fill="none" stroke="#2f6a2f" stroke-width="6" stroke-linecap="round" opacity=".45"/>

    <!-- skin spots -->
    <circle cx="151" cy="168" r="10" fill="#5ab95a" opacity=".65"/>
    <circle cx="362" cy="168" r="12" fill="#5ab95a" opacity=".65"/>
    <circle cx="127" cy="293" r="8" fill="#5ab95a" opacity=".55"/>
    <circle cx="386" cy="296" r="8" fill="#5ab95a" opacity=".55"/>
    <circle cx="246" cy="353" r="7" fill="#5ab95a" opacity=".5"/>
    <circle cx="278" cy="350" r="6" fill="#5ab95a" opacity=".5"/>
  </g>
</svg>