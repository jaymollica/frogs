<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="A frog with a prominent Habsburg jaw">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6bd66b"/>
      <stop offset="100%" stop-color="#2f9f4a"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7f6a2"/>
      <stop offset="100%" stop-color="#a7df6f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d5e2e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#cfeff7"/>

  <!-- Lily pad -->
  <ellipse cx="256" cy="410" rx="180" ry="46" fill="#5dbb54"/>
  <path d="M120 410c40-22 88-32 136-32s96 10 136 32c-38 12-86 18-136 18s-98-6-136-18z" fill="#4aa343" opacity=".55"/>

  <!-- Legs -->
  <g fill="url(#bodyGrad)" filter="url(#shadow)">
    <path d="M145 330c-42 16-70 52-64 84 4 22 20 34 41 30 18-3 35-20 52-44 10-15 20-27 34-35-19-9-38-24-63-35z"/>
    <path d="M367 330c42 16 70 52 64 84-4 22-20 34-41 30-18-3-35-20-52-44-10-15-20-27-34-35 19-9 38-24 63-35z"/>
  </g>

  <!-- Body -->
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="280" rx="140" ry="118" fill="url(#bodyGrad)"/>
    <ellipse cx="256" cy="312" rx="96" ry="78" fill="url(#bellyGrad)" opacity=".95"/>
  </g>

  <!-- Arms -->
  <g fill="url(#bodyGrad)">
    <path d="M126 275c-32-4-55 10-69 29-11 16-10 33 0 41 11 8 28 4 42-7 14-11 25-29 35-49z"/>
    <path d="M386 275c32-4 55 10 69 29 11 16 10 33 0 41-11 8-28 4-42-7-14-11-25-29-35-49z"/>
  </g>

  <!-- Head -->
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="188" rx="156" ry="112" fill="url(#bodyGrad)"/>
    <ellipse cx="256" cy="216" rx="118" ry="80" fill="#7be07b" opacity=".35"/>
  </g>

  <!-- Eyes -->
  <g>
    <g>
      <ellipse cx="176" cy="116" rx="34" ry="40" fill="#5bc65c"/>
      <ellipse cx="336" cy="116" rx="34" ry="40" fill="#5bc65c"/>
      <ellipse cx="176" cy="118" rx="18" ry="22" fill="#fff"/>
      <ellipse cx="336" cy="118" rx="18" ry="22" fill="#fff"/>
      <circle cx="182" cy="124" r="8" fill="#16351d"/>
      <circle cx="342" cy="124" r="8" fill="#16351d"/>
      <circle cx="185" cy="120" r="2" fill="#fff"/>
      <circle cx="345" cy="120" r="2" fill="#fff"/>
    </g>
  </g>

  <!-- Habsburg jaw -->
  <g>
    <path d="M160 210c18 68 66 106 96 106s78-38 96-106c-24 10-59 14-96 14s-72-4-96-14z" fill="#2f9f4a"/>
    <path d="M178 222c15 48 49 74 78 74s63-26 78-74c-21 6-47 9-78 9s-57-3-78-9z" fill="#f0c8a0" opacity=".9"/>
    <path d="M198 250c14 18 34 28 58 28s44-10 58-28" fill="none" stroke="#a86b3d" stroke-width="8" stroke-linecap="round"/>
    <path d="M182 219c28-2 52 1 74 7 22-6 46-9 74-7-3 13-9 25-18 34-17-2-31-7-44-15-8 8-19 12-32 12s-24-4-32-12c-13 8-27 13-44 15-9-9-15-21-18-34z" fill="#d8ad7e" opacity=".95"/>
    <path d="M202 242c11 7 24 11 40 11s29-4 40-11" fill="none" stroke="#8b5a34" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- Mouth line -->
  <path d="M184 228c18 10 45 16 72 16s54-6 72-16" fill="none" stroke="#5d7d3d" stroke-width="6" stroke-linecap="round"/>

  <!-- Nostril -->
  <circle cx="246" cy="160" r="4" fill="#2c6b38"/>
  <circle cx="266" cy="160" r="4" fill="#2c6b38"/>
</svg>