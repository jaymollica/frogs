<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="70" ry="55" fill="#4CAF50"/>
  <!-- Belly -->
  <ellipse cx="100" cy="150" rx="45" ry="35" fill="#A5D6A7"/>
  <!-- Head -->
  <ellipse cx="100" cy="75" rx="55" ry="45" fill="#66BB6A"/>
  <!-- Habsburg lower jaw - exaggerated protruding mandible -->
  <ellipse cx="100" cy="105" rx="40" ry="28" fill="#66BB6A"/>
  <path d="M60 95 Q100 145 140 95 Q130 125 100 130 Q70 125 60 95" fill="#4CAF50"/>
  <!-- Jaw highlight / chin jut -->
  <ellipse cx="100" cy="125" rx="22" ry="14" fill="#81C784"/>
  <!-- Mouth line emphasizing underbite -->
  <path d="M65 92 Q100 108 135 92" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70 100 Q100 128 130 100" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="75" cy="55" rx="18" ry="20" fill="#E8F5E9"/>
  <ellipse cx="125" cy="55" rx="18" ry="20" fill="#E8F5E9"/>
  <circle cx="75" cy="57" r="10" fill="#1B5E20"/>
  <circle cx="125" cy="57" r="10" fill="#1B5E20"/>
  <circle cx="78" cy="54" r="4" fill="white"/>
  <circle cx="128" cy="54" r="4" fill="white"/>
  <!-- Nostrils -->
  <ellipse cx="92" cy="78" rx="4" ry="3" fill="#2E7D32"/>
  <ellipse cx="108" cy="78" rx="4" ry="3" fill="#2E7D32"/>
  <!-- Legs -->
  <ellipse cx="45" cy="175" rx="22" ry="14" fill="#4CAF50" transform="rotate(-30 45 175)"/>
  <ellipse cx="155" cy="175" rx="22" ry="14" fill="#4CAF50" transform="rotate(30 155 175)"/>
  <!-- Feet -->
  <ellipse cx="30" cy="190" rx="18" ry="8" fill="#66BB6A"/>
  <ellipse cx="170" cy="190" rx="18" ry="8" fill="#66BB6A"/>
  <!-- Arms -->
  <ellipse cx="40" cy="130" rx="15" ry="10" fill="#4CAF50" transform="rotate(-20 40 130)"/>
  <ellipse cx="160" cy="130" rx="15" ry="10" fill="#4CAF50" transform="rotate(20 160 130)"/>
  <!-- Crowns / Habsburg flair - small gold crown -->
  <path d="M70 35 L75 20 L85 32 L100 15 L115 32 L125 20 L130 35 Z" fill="#FFD700" stroke="#F9A825" stroke-width="1"/>
  <circle cx="75" cy="22" r="3" fill="#E53935"/>
  <circle cx="100" cy="17" r="3" fill="#E53935"/>
  <circle cx="125" cy="22" r="3" fill="#E53935"/>
</svg>